# OpenAPI 3.1 `webhooks` - one entry per DOMAIN_EVENT (FRD 21.2, src/modules/admin/shared.tsx).
# Refs are relative to docs/api/. Subscriptions are managed via /integrations/webhooks (tag Admin).

DocumentCreated:
  post:
    tags: [Webhooks]
    summary: A document was created (Draft)
    operationId: webhookDocumentCreated
    description: "Delivered for every `x-events: [DocumentCreated]` operation. Verify `X-Elixir-Signature` before trusting the body; respond 2xx within 10 s."
    parameters:
      - { name: X-Elixir-Event, in: header, required: true, schema: { type: string, const: DocumentCreated } }
      - { name: X-Elixir-Delivery, in: header, required: true, schema: { type: string, example: whd_9c1e } }
      - { name: X-Elixir-Signature, in: header, required: true, schema: { type: string, example: 't=1789290724,v1=5d41402abc4b2a76b9719d911017c592e3b0c44298fc1c149afbf4c8996fb924' } }
      - $ref: './components/parameters.yaml#/CorrelationId'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: './components/schemas/webhooks.yaml#/WebhookEnvelope' }
          examples:
            documentCreated: { summary: "A document was created (Draft)", value: {"id": "evt_01j8k6", "event": "DocumentCreated", "occurredAt": "2026-09-13T09:12:04Z", "tenantId": "ten_acme", "companyId": "co_acme", "branchId": "br_ho", "correlationId": "corr_9f1c2e7a", "actor": {"userId": "usr_priya", "name": "Priya Sharma"}, "data": {"collection": "salesInvoices", "docType": "Sales Invoice", "docId": "inv_01j8k3", "docNumber": "DRAFT-INV-42", "status": "Draft", "link": "/v1/sales/invoices/inv_01j8k3"}} }
    responses:
      '200':
        description: Acknowledged (any 2xx)
        content:
          application/json:
            schema: { $ref: './components/schemas/webhooks.yaml#/WebhookAck' }
            examples:
              ok: { summary: Received, value: { received: true } }

