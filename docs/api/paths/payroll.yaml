      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: Inputs
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/payroll.yaml#/PayrollInput' } }
            examples:
              september: { summary: Draft + approved, value: { data: [{ id: pin_0901, companyId: co_acme, period: '2026-09', employeeId: emp_priya, employeeName: Priya Sharma, workingDays: 30, lopDays: 0, overtimeHours: 0, overtimeAmount: 0, reimbursements: 4200, reimbursementClaimIds: [exp_00031], bonus: 0, arrears: 0, loanEmi: 0, otherDeductions: 0, status: Approved, approvedBy: Rahul Mehta, approvedAt: '2026-09-28T10:00:00Z', createdAt: '2026-09-25T09:00:00Z', updatedAt: '2026-09-28T10:00:00Z', version: 3 }, { id: pin_0912, companyId: co_acme, period: '2026-09', employeeId: emp_anil, employeeName: Anil Kumar, workingDays: 30, lopDays: 2, overtimeHours: 6, overtimeAmount: 2400, reimbursements: 0, reimbursementClaimIds: [], bonus: 0, arrears: 0, loanEmi: 5000, loanId: ln_0004, otherDeductions: 0, status: Draft, createdAt: '2026-09-25T09:00:00Z', updatedAt: '2026-09-26T09:00:00Z', version: 2 }], meta: { nextCursor: null, limit: 25, total: 24, counts: { Draft: 1, Approved: 23, Locked: 0 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
