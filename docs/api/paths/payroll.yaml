          schema: { $ref: '../components/schemas/payroll.yaml#/PayrollRunCreate' }
          examples:
            regular: { summary: Regular monthly, value: { period: '2026-09' } }
            offCycle: { summary: Off-cycle bonus, value: { period: '2026-10', type: Off-cycle, label: Diwali bonus, employeeIds: [emp_priya, emp_anil] } }
    responses:
      '201':
        description: Draft run
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/payroll.yaml#/PayrollRun' }
            examples:
              draft: { summary: Draft, value: { id: pr_0007, companyId: co_acme, number: PR/2026-27/00007, period: '2026-10', fy: '2026-27', type: Regular, status: Draft, employeeCount: 0, lines: [], totals: { basic: 0, hra: 0, special: 0, otherEarnings: 0, overtime: 0, reimbursements: 0, bonus: 0, arrears: 0, gross: 0, pf: 0, esi: 0, pt: 0, tds: 0, loan: 0, otherDeductions: 0, deductions: 0, net: 0, employerPf: 0, employerEsi: 0, employerTotal: 0 }, createdAt: '2026-10-25T09:00:00Z', updatedAt: '2026-10-25T09:00:00Z', version: 1 } }
