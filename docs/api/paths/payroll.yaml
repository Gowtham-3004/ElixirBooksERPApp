# Payroll (tag: Payroll). src/modules/payroll/actions.ts (createRun/calculateRun/finalizeRun/postRun/reverseRun/bankFile), calc.ts, posting.ts.

/payroll/employees:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Payroll]
    summary: Payroll employees (masked identifiers)
    description: "Tabs → Active · No structure (`hasStructure=false`) · Exited. Query examples — `?department=Finance` · `?q=priya`."
    operationId: listPayrollEmployees
    x-permission: payroll.employee.view
    x-frd: [FR-PAY-001]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: department, in: query, schema: { type: string } }
      - { name: hasStructure, in: query, schema: { type: boolean } }
    responses:
      '200':
        description: Employees
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/payroll.yaml#/PayrollEmployee' } }
            examples:
              firstPage: { summary: Two employees, value: { data: [{ $ref: '#/components/examples/PayrollEmployeePriya/value' }, { id: emp_anil, code: E-0012, name: Anil Kumar, department: Warehouse, designation: Store Executive, branchId: br_ho, joinDate: '2026-06-01', status: Active, pf: true, esi: true, pt: true, taxRegime: New, panMasked: 'AKLPK••••J', uanMasked: '1001••••••88', esiNumberMasked: '3100••••••0012', bankMasked: 'SBI ••••7781', ctc: 336000 }], meta: { nextCursor: null, limit: 25, total: 24, counts: { Active: 24, 'No structure': 1, Exited: 3 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/payroll/employees/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Payroll]
    summary: Payroll profile of an employee
    operationId: getPayrollEmployee
    x-permission: payroll.employee.view
    responses:
      '200':
        description: Employee
        content:
          application/json:
            schema: { $ref: '../components/schemas/payroll.yaml#/PayrollEmployee' }
            examples:
              priya: { $ref: '../components/examples/payroll.yaml#/PayrollEmployeePriya' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Payroll]
    summary: Update payroll fields (statutory flags, PAN/UAN, bank)
    description: Changing regime / PF / ESI / PT also updates the active salary structure. Audited as sensitive.
    operationId: updatePayrollEmployee
    x-permission: payroll.employee.edit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/payroll.yaml#/PayrollEmployeePatch'
              - $ref: '../components/schemas/common.yaml#/ExpectedVersion'
          examples:
            regime: { summary: Switch to Old regime, value: { expectedVersion: 4, taxRegime: Old } }
            statutory: { summary: PAN + UAN + bank, value: { expectedVersion: 4, pan: BNZPS1234K, uan: '100112345642', bankDetail: { bankName: HDFC Bank, accountNumber: '50100012340042', ifsc: HDFC0000123, accountName: Priya Sharma } } }
            esiOff: { summary: ESI no longer applicable (gross > ceiling), value: { expectedVersion: 4, esi: false } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/payroll.yaml#/PayrollEmployee' }
            examples:
              updated: { $ref: '../components/examples/payroll.yaml#/PayrollEmployeePriya' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/payroll/employees/{id}/reveal:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Payroll]
    summary: Reveal unmasked PAN / UAN / bank (audited)
    operationId: revealPayrollEmployee
    x-permission: payroll.payslip.view
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5 }, fields: { type: array, items: { type: string, enum: [pan, uan, esiNumber, bankDetail] } } } }
          examples:
            bank: { summary: Bank for salary file, value: { reason: Verifying bank file rejection, fields: [bankDetail] } }
    responses:
      '200':
        description: Revealed
        content:
          application/json:
            schema: { $ref: '../components/schemas/payroll.yaml#/PayrollEmployeeRevealed' }
            examples:
              bank: { summary: Bank only, value: { bankDetail: { bankName: HDFC Bank, accountNumber: '50100012340042', ifsc: HDFC0000123, accountName: Priya Sharma } } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

# ── salary structures ─────────────────────────────────────────────────────

/payroll/salary-structures:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Payroll]
    summary: Salary structures (effective-dated versions)
    operationId: listSalaryStructures
    x-permission: payroll.employee.view
    x-frd: [FR-PAY-002]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/EmployeeId'
      - $ref: '../components/parameters.yaml#/Status'
    responses:
      '200':
        description: Structures
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/payroll.yaml#/SalaryStructure' } }
            examples:
              firstPage: { summary: Active structures, value: { data: [{ $ref: '#/components/examples/SalaryStructurePriya/value' }], meta: { nextCursor: null, limit: 25, total: 23, counts: { Active: 23, Superseded: 9, Draft: 0 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Payroll]
    summary: Create a structure version (supersedes the active one from `effectiveFrom`)
    operationId: createSalaryStructure
    x-permission: payroll.structure.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/payroll.yaml#/SalaryStructureCreate' }
          examples:
            components: { summary: Explicit components, value: { employeeId: emp_priya, effectiveFrom: '2026-10-01', components: [{ code: BASIC, name: Basic, type: Earning, basis: Amount, value: 55000 }, { code: HRA, name: HRA, type: Earning, basis: PctOfBasic, value: 50 }, { code: SPL, name: Special allowance, type: Earning, basis: Amount, value: 38000 }], pf: true, esi: false, pt: true, taxRegime: New, notes: Annual revision 10% } }
            fromCtc: { summary: Standard split from annual CTC, value: { employeeId: emp_anil, effectiveFrom: '2026-10-01', components: [{ code: BASIC, name: Basic, type: Earning, basis: Amount, value: 14000 }, { code: HRA, name: HRA, type: Earning, basis: PctOfBasic, value: 40 }, { code: SPL, name: Special allowance, type: Earning, basis: Amount, value: 8400 }], pf: true, esi: true, pt: true, taxRegime: New } }
    responses:
      '201':
        description: Created (Active)
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/payroll.yaml#/SalaryStructure' }
            examples:
              created: { $ref: '../components/examples/payroll.yaml#/SalaryStructurePriya' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Business rule
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              lockedPeriod: { summary: Effective date inside a posted payroll period, value: { code: INVALID_STATE, message: Payroll for 2026-09 is already posted — effective date must be 2026-10-01 or later, field: effectiveFrom, correlationId: corr_9f1c2e7a } }
              noBasic: { summary: Basic missing, value: { code: VALIDATION, message: A BASIC earning component is required, field: components, correlationId: corr_9f1c2e7a } }

