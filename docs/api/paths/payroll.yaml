              schedule: { summary: "12 EMIs, one recovered", value: { data: [{ period: '2026-10', emi: 5000, principal: 5000, interest: 0, balance: 55000, status: Recovered, runId: pr_0007 }, { period: '2026-11', emi: 5000, principal: 5000, interest: 0, balance: 50000, status: Pending }, { period: '2026-12', emi: 5000, principal: 5000, interest: 0, balance: 45000, status: Pending }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
