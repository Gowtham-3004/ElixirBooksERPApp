      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  put:
    tags: [Payroll]
    summary: Bulk-save inputs for a period (Draft rows only)
    operationId: savePayrollInputs
    x-permission: payroll.input.edit
    parameters:
      - { name: period, in: query, required: true, schema: { type: string }, example: '2026-09' }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/payroll.yaml#/PayrollInputsBulkPut' }
          examples:
            attendance: { summary: LOP + overtime, value: { rows: [{ employeeId: emp_anil, lopDays: 2, overtimeHours: 6, overtimeAmount: 2400 }, { employeeId: emp_priya, reimbursementClaimIds: [exp_00031] }] } }
            skipEmi: { summary: Skip a loan EMI this month, value: { rows: [{ employeeId: emp_anil, loanEmi: 0 }] } }
    responses:
      '200':
        description: Saved rows
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/payroll.yaml#/PayrollInput' } }, skipped: { type: array, items: { type: object, properties: { employeeId: { type: string }, reason: { type: string } } } } } }
            examples:
              saved: { summary: "One saved, one locked", value: { data: [{ id: pin_0912, companyId: co_acme, period: '2026-09', employeeId: emp_anil, employeeName: Anil Kumar, workingDays: 30, lopDays: 2, overtimeHours: 6, overtimeAmount: 2400, reimbursements: 0, reimbursementClaimIds: [], bonus: 0, arrears: 0, loanEmi: 5000, loanId: ln_0004, otherDeductions: 0, status: Draft, createdAt: '2026-09-25T09:00:00Z', updatedAt: '2026-09-26T09:00:00Z', version: 3 }], skipped: [{ employeeId: emp_priya, reason: Locked by run PR/2026-27/00006 }] } }
