      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── statutory ─────────────────────────────────────────────────────────────

/payroll/statutory:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Payroll]
    summary: PF / ESI / PT / salary-TDS filings for a period
    operationId: listPayrollStatutory
    x-permission: payroll.run.view
    parameters:
      - { name: period, in: query, required: true, schema: { type: string }, example: '2026-09' }
    responses:
      '200':
        description: Filings
        content:
          application/json:
            schema: { type: object, required: [period, data], properties: { period: { type: string }, data: { type: array, items: { $ref: '../components/schemas/payroll.yaml#/StatutoryFiling' } } } }
            examples:
              september: { summary: September, value: { period: '2026-09', data: [{ key: 'PF:2026-09', kind: PF, label: PF ECR September 2026, period: '2026-09', employee: 43200, employer: 43200, total: 86400, employees: 24, dueDate: '2026-10-15', status: Pending }, { key: 'ESI:2026-09', kind: ESI, label: ESI September 2026, period: '2026-09', employee: 1350, employer: 5850, total: 7200, employees: 6, dueDate: '2026-10-15', status: Pending }, { key: 'PT:2026-09', kind: PT, label: Professional tax September 2026, period: '2026-09', employee: 4800, employer: 0, total: 4800, employees: 24, dueDate: '2026-10-31', status: Pending }, { key: 'TDS:2026-09', kind: TDS, label: Salary TDS (192) September 2026, period: '2026-09', employee: 98000, employer: 0, total: 98000, employees: 11, dueDate: '2026-10-07', status: Filed, filedAt: '2026-10-05T10:00:00Z', reference: '0510123456789099' }] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/payroll/statutory/{kind}/mark-filed:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - { name: kind, in: path, required: true, schema: { type: string, enum: [pf, esi, pt, tds] } }
  post:
    tags: [Payroll]
    summary: Mark a filing done (TRRN / challan reference)
    operationId: markPayrollStatutoryFiled
    x-permission: payroll.run.submit
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [period, reference], properties: { period: { type: string }, reference: { type: string }, filedAt: { type: string, format: date-time } } }
          examples:
            pf: { summary: PF TRRN, value: { period: '2026-09', reference: TRRN2026100012345, filedAt: '2026-10-12T11:00:00Z' } }
    responses:
      '200':
        description: Filed
        content:
          application/json:
            schema: { $ref: '../components/schemas/payroll.yaml#/StatutoryFiling' }
            examples:
              filed: { summary: Filed, value: { key: 'PF:2026-09', kind: PF, label: PF ECR September 2026, period: '2026-09', employee: 43200, employer: 43200, total: 86400, employees: 24, dueDate: '2026-10-15', status: Filed, filedAt: '2026-10-12T11:00:00Z', reference: TRRN2026100012345 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/payroll/statutory/{kind}/download:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - { name: kind, in: path, required: true, schema: { type: string, enum: [pf, esi, pt, tds] } }
  get:
    tags: [Payroll]
    summary: Download the filing file (ECR text / ESI CSV / PT CSV / 24Q CSV) — audited as sensitive
    operationId: downloadPayrollStatutory
    x-permission: payroll.run.export
    parameters:
      - { name: period, in: query, required: true, schema: { type: string }, example: '2026-09' }
    responses:
      '200':
        description: File
        headers:
          Content-Disposition: { $ref: '../components/headers.yaml#/ContentDisposition' }
        content:
          text/plain:
            schema: { type: string }
            examples:
              ecr: { summary: PF ECR (excerpt), value: "100112345642#~#PRIYA SHARMA#~#110000#~#15000#~#15000#~#15000#~#1800#~#1250#~#550#~#0#~#0\n" }
          text/csv:
            schema: { type: string }
            examples:
              esi: { summary: ESI CSV (excerpt), value: "ipNumber,name,days,wages,employeeContribution,employerContribution\n3100000000012,Anil Kumar,28,28000,210,910\n" }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

# ── settings ──────────────────────────────────────────────────────────────

/payroll/settings:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Payroll]
    summary: Payroll settings (statutory rates, ceilings, PT slabs, rounding)
    operationId: getPayrollSettings
    x-permission: payroll.run.view
    responses:
      '200':
        description: Settings
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/PayrollSettings' }
            examples:
              current: { summary: Defaults, value: { pfEmployeePct: 12, pfEmployerPct: 12, pfWageCeiling: 15000, esiEmployeePct: 0.75, esiEmployerPct: 3.25, esiWageCeiling: 21000, ptSlabs: [{ upTo: 7500, amount: 0 }, { upTo: 10000, amount: 175 }, { upTo: 999999999, amount: 200 }], payrollDay: 1, rounding: Nearest, workingDaysPerMonth: 30 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  put:
    tags: [Payroll]
    summary: Update payroll settings
    operationId: updatePayrollSettings
    x-permission: payroll.settings.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/admin.yaml#/PayrollSettings' }
          examples:
            ptSlabs: { summary: Karnataka PT slabs, value: { ptSlabs: [{ upTo: 25000, amount: 0 }, { upTo: 999999999, amount: 200 }] } }
            rounding: { summary: "Round down, pay on 28th", value: { rounding: Down, payrollDay: 28 } }
    responses:
      '200':
        description: Saved
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/PayrollSettings' }
            examples:
              saved: { summary: Saved, value: { pfEmployeePct: 12, pfEmployerPct: 12, pfWageCeiling: 15000, esiEmployeePct: 0.75, esiEmployerPct: 3.25, esiWageCeiling: 21000, ptSlabs: [{ upTo: 25000, amount: 0 }, { upTo: 999999999, amount: 200 }], payrollDay: 1, rounding: Nearest, workingDaysPerMonth: 30 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
