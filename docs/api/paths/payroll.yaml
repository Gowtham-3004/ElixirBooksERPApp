    operationId: closeLoan
    x-permission: payroll.loan.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            settled: { summary: Settled by cheque, value: { reason: Balance settled by cheque on exit } }
