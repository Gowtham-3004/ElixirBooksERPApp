/payroll/inputs:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Payroll]
    summary: Attendance / variable inputs for a period (ensures a row per payroll employee)
    operationId: listPayrollInputs
    x-permission: payroll.run.view
    x-frd: [FR-PAY-003]
    parameters:
      - { name: period, in: query, required: true, schema: { type: string }, example: '2026-09' }
