                    - { id: ntf_2f8c, companyId: co_acme, at: '2026-09-13T08:40:00Z', userId: usr_rahul, type: export, title: Export ready — Sales invoices (CSV), body: 1240 rows · expires in 24 h, link: '#/admin/jobs?tab=exports', read: false, channel: in-app, createdAt: '2026-09-13T08:40:00Z', updatedAt: '2026-09-13T08:40:00Z', version: 1 }
                  unread: 2
                  meta: { nextCursor: eyJhdCI6IjIwMjYtMDktMTNUMDg6NDA6MDBaIn0, limit: 25, total: 31 }
                  scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' }
              lastPage:
                summary: Last page
                value:
                  data:
                    - { id: ntf_1a00, companyId: co_acme, at: '2026-08-02T10:00:00Z', userId: usr_rahul, type: system, title: Welcome to Elixir Books, read: true, channel: in-app, createdAt: '2026-08-02T10:00:00Z', updatedAt: '2026-08-02T10:00:00Z', version: 1 }
