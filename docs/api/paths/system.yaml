              read: { summary: Now read, value: { id: ntf_2f8d, companyId: co_acme, at: '2026-09-13T09:12:04Z', userId: usr_rahul, type: approval, title: Approval needed — INV/2026-27/00042, link: '#/approvals?id=apr_6c1d', read: true, channel: in-app, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:15:00Z', version: 2 } }
