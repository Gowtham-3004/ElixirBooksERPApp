/documents/{collection}/{id}/pdf:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Collection'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [System]
    summary: Render a document PDF
    description: Renders with the document template (tax invoice, quotation, order confirmation, delivery challan, credit note, receipt voucher, PO, payment voucher, payslip …). Every render is audited as `<doc>.pdf_generated` with the template version. Drafts render with a **DRAFT** watermark.
    operationId: renderDocumentPdf
    x-permission: '*.*.view'
    x-frd: [FR-DOC-005]
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: '../components/schemas/system.yaml#/PdfRequest' }
          examples:
            default: { summary: Company default template, value: {} }
            duplicateCopy: { summary: Duplicate copy with a specific template, value: { templateId: tpl_taxinv_v3, copy: Duplicate } }
    responses:
      '200':
        description: PDF bytes
        headers:
          Content-Disposition: { $ref: '../components/headers.yaml#/ContentDisposition' }
        content:
          application/pdf:
            schema: { type: string, format: binary }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/documents/{collection}/{id}/email:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Collection'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [System]
    summary: E-mail a document (PDF attached)
    description: "Queues the e-mail at the gateway, writes an `IntegrationLog{provider: Email, action: SendDocument}` and a notification. Quotations move to `Sent`; purchase orders record `emailedAt`."
    operationId: emailDocument
    x-permission: '*.*.view'
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/EmailRequest' }
          examples:
            default: { $ref: '../components/examples/common.yaml#/EmailDefault' }
            withCc: { $ref: '../components/examples/common.yaml#/EmailWithCc' }
    responses:
      '202':
        description: Queued
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/EmailResult' }
            examples:
              queued: { $ref: '../components/examples/common.yaml#/EmailResult' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '502': { $ref: '../components/responses.yaml#/ProviderError' }
