# ── attachments ──────────────────────────────────────────────────────────

/attachments:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [System]
    summary: Upload an attachment
    description: |
      Multipart upload bound to a document (`objectType` + `objectId`). Max 25 MB per file. Executables
      (`.exe .bat .sh .js .msi .cmd`) are stored as `scanState: Blocked` and cannot be downloaded; other files
      are `Scanning` until the antivirus pass completes, then `Clean`. Attachments on posted documents are allowed;
      statutory attachments cannot be replaced or removed.
    operationId: uploadAttachment
    x-permission: '*.*.edit'
    x-frd: [FR-DOC-006]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [objectType, objectId, file]
            properties:
              objectType: { type: string, example: Sales Invoice }
              objectId: { type: string, example: inv_01j8k3 }
              file: { type: string, format: binary }
              note: { type: string }
          examples:
            pdf: { summary: Customer PO as PDF, value: { objectType: Sales Invoice, objectId: inv_01j8k3, file: '(binary PO-ARL-2291.pdf)' } }
            image: { summary: Delivery proof photo, value: { objectType: Delivery, objectId: dlv_00340, file: '(binary delivery-proof.jpg)', note: Signed by security at gate 2 } }
            blockedType: { summary: Executable — accepted but blocked, value: { objectType: Vendor Invoice, objectId: vinv_00019, file: '(binary setup.exe)' } }
    responses:
      '201':
        description: Stored (scan pending or blocked)
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/Attachment' }
            examples:
              scanning: { $ref: '../components/examples/common.yaml#/AttachmentScanning' }
              blocked:
                summary: Executable quarantined
                value: { id: att_3d00, companyId: co_acme, objectType: Vendor Invoice, objectId: vinv_00019, name: setup.exe, size: 3145728, mime: application/x-msdownload, scanState: Blocked, statutory: false, uploadedBy: Priya Sharma, at: '2026-09-13T09:12:04Z', fileVersion: 1, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '413': { $ref: '../components/responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/attachments/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [System]
    summary: Get attachment metadata
    operationId: getAttachment
    x-permission: '*.*.view'
    responses:
      '200':
        description: Attachment
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/Attachment' }
            examples:
              clean: { $ref: '../components/examples/common.yaml#/AttachmentClean' }
              statutory: { $ref: '../components/examples/common.yaml#/AttachmentStatutory' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  delete:
    tags: [System]
    summary: Remove an attachment
    description: Not allowed for statutory attachments (`409 INVALID_STATE`).
    operationId: deleteAttachment
    x-permission: '*.*.edit'
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/attachments/{id}/content:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [System]
    summary: Download attachment content
    description: Streams the file. `Scanning` files return `409 INVALID_STATE`; `Blocked` files return `422 SCAN_BLOCKED`.
    operationId: downloadAttachment
    x-permission: '*.*.view'
    responses:
      '200':
        description: File bytes
        headers:
          Content-Disposition: { $ref: '../components/headers.yaml#/ContentDisposition' }
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/attachments/{id}/versions:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [System]
    summary: Replace with a new file version
    description: Uploads a replacement; `fileVersion` increments and the previous bytes stay retrievable for audit.
    operationId: replaceAttachment
    x-permission: '*.*.edit'
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }
              note: { type: string }
          examples:
            replace: { summary: Corrected PO copy, value: { file: '(binary PO-ARL-2291-v2.pdf)', note: Customer sent a corrected PO with the right ship-to } }
    responses:
      '200':
        description: New version stored
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/Attachment' }
            examples:
              v2: { summary: Version 2, value: { id: att_3c9e, companyId: co_acme, objectType: Sales Invoice, objectId: inv_01j8k3, name: PO-ARL-2291-v2.pdf, size: 190112, mime: application/pdf, scanState: Scanning, statutory: false, uploadedBy: Priya Sharma, at: '2026-09-13T10:02:00Z', fileVersion: 2, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T10:02:00Z', version: 3 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '413': { $ref: '../components/responses.yaml#/PayloadTooLarge' }

