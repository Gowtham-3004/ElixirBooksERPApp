/notifications/{id}/read:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [System]
    summary: Mark a notification read
    operationId: markNotificationRead
