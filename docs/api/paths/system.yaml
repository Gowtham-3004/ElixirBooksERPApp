# System / cross-cutting endpoints (tag: System).
# Generic document sub-resources apply to every document collection so per-module files don't repeat them.

/health:
  get:
    tags: [System]
    summary: Service health
    operationId: getHealth
    security: []
    x-company-scoped: false
    responses:
      '200':
        description: Health status
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/Health' }
            examples:
              ok: { summary: All good, value: { status: ok, version: 1.0.0, time: '2026-09-13T09:12:04Z', checks: { database: ok, queue: ok, irp: ok, ewb: ok } } }
              degraded: { summary: Provider degraded, value: { status: degraded, version: 1.0.0, time: '2026-09-13T09:12:04Z', checks: { database: ok, queue: ok, irp: degraded, ewb: ok } } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/enums:
  get:
    tags: [System]
    summary: Enum catalogue (all status lists)
    description: Every status/enum list used by the contract, keyed by schema name, plus `documentCollections`, `workflowDocTypes`, `domainEvents`, `permissionMatrix` and `apiScopes`. Cacheable (ETag).
    operationId: getEnums
    x-company-scoped: false
    responses:
      '200':
        description: Catalogue
        headers:
          ETag: { $ref: '../components/headers.yaml#/ETag' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/EnumCatalog' }
            examples:
              catalogue:
                summary: Excerpt
                value:
                  DocStatus: [Draft, Submitted, Approved, Returned, Rejected, Posted, Settled, Reversed, Cancelled, Closed]
                  SalesInvoiceStatus: [Draft, Submitted, Approved, Returned, Rejected, Posted, Settled, Reversed, Cancelled]
                  PurchaseOrderStatus: [Draft, Submitted, Approved, Returned, Rejected, Partially Received, Received, Closed, Short Closed, Cancelled]
                  PeriodStatus: [Future, Open, Soft Closed, Locked, Reopened]
                  documentCollections: [quotations, salesOrders, deliveries, salesInvoices, creditNotes, receipts, purchaseOrders, grns, vendorInvoices, payments, journals]
                  workflowDocTypes: [Sales Invoice, Credit Note, Purchase Order, Vendor Invoice, Payment Batch, Journal, Period Reopen]
                  domainEvents: [DocumentCreated, DocumentPosted, JournalPosted, StockMoved, PaymentCompleted, PeriodLocked]
                  apiScopes: [sales.*, sales.invoice.view, purchase.*, reports.*, webhooks.manage]
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/search:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [System]
    summary: Global search (⌘K)
    description: |
      Searches 18 collections (sales invoices, quotations, orders, deliveries, credit notes, receipts, POs, GRNs,
      vendor invoices, payments, journals, customers, suppliers, items, employees, assets, projects, production orders)
      by number, party, reference, code, GSTIN and e-mail, plus the navigation menu. Results are filtered by the
      caller's permissions and data scope.

      Query examples: `?q=arlene` · `?q=INV/2026-27/00042` · `?q=steel&types=items,purchaseOrders&limit=5`
    operationId: globalSearch
    x-permission: '*.*.view'
    parameters:
      - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 }, example: arlene }
      - { name: types, in: query, description: Comma-separated collection names to restrict the search., schema: { type: string }, style: form, explode: false, example: 'customers,salesInvoices' }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    responses:
      '200':
        description: Ranked results
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/SearchResponse' }
            examples:
              hits:
                summary: Matches across collections
                value:
                  q: arlene
                  results:
                    - { collection: customers, id: cust_arlene, title: Arlene Traders, subtitle: 'C-0101 · 27AAPFU0939F1ZV · Active', status: Active, link: '#/masters/customers/cust_arlene', score: 0.98 }
                    - { collection: salesInvoices, id: inv_01j8k3, title: INV/2026-27/00042, subtitle: 'Arlene Traders · ₹1,18,000 · Posted', status: Posted, link: '#/sales/invoices/inv_01j8k3', score: 0.81 }
                    - { collection: receipts, id: rcp_00210, title: RCP/2026-27/00210, subtitle: 'Arlene Traders · ₹50,000 · Posted', status: Posted, link: '#/sales/receipts/rcp_00210', score: 0.77 }
                  menu:
                    - { label: 'Sales › Collections', link: '#/sales/collections?customer=cust_arlene' }
                  truncated: false
              noHits:
                summary: Nothing matched
                value: { q: zzzz, results: [], menu: [], truncated: false }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/notifications:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [System]
    summary: List my notifications
    description: Newest first. Query examples — unread only `?read=false` · by type `?type=approval` · page 2 `?cursor=…`.
    operationId: listNotifications
    x-permission: '*.*.view'
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - { name: read, in: query, schema: { type: boolean } }
      - { name: type, in: query, schema: { type: string, enum: [approval, integration, import, export, due, system, security] } }
    responses:
      '200':
        description: Notifications
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
