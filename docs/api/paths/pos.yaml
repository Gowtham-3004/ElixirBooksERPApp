    description: Query examples — `?shiftId=shift_0091` · `?terminalId=term_and_t1&dateFrom=2026-09-13` · `?q=BILL/AND-T1/0042` · `?onCredit=true`.
    operationId: listPosBills
    x-permission: pos.bill.view
    x-frd: [FR-POS-003]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: shiftId, in: query, schema: { type: string } }
      - { name: terminalId, in: query, schema: { type: string } }
      - { name: onCredit, in: query, schema: { type: boolean } }
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
    responses:
      '200':
        description: Bills
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/pos.yaml#/PosBill' } }
            examples:
              firstPage: { summary: Bills of a shift, value: { data: [{ $ref: '#/components/examples/PosBillCash/value' }], meta: { nextCursor: null, limit: 25, total: 12 }, scope: { companyId: co_acme, branchId: br_andheri, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [POS]
    summary: Checkout (create + post a bill in one call)
    description: |
      Idempotent on `Idempotency-Key` (use the cart id) — a retry after a network drop returns the original bill with `201` and `Idempotent-Replayed: true`.
      Stock leaves the terminal's warehouse, the sale + tax journal posts to POS clearing, and a Credit tender opens an AR item for the customer.
      Tenders must sum to ≥ total (change is returned in `change`).
    operationId: posCheckout
    x-permission: pos.bill.create
    x-idempotent: true
    x-events: [DocumentPosted, StockMoved, JournalPosted, InvoicePosted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/pos.yaml#/PosCheckoutRequest' }
          examples:
            cash: { summary: Cash with change, value: { shiftId: shift_0091, lines: [{ itemId: item_chai, qty: 2 }, { itemId: item_biscuit, qty: 1 }], tenders: [{ type: Cash, amount: 500 }] } }
            card: { summary: Card, value: { shiftId: shift_0091, lines: [{ itemId: item_jacket, qty: 1 }], tenders: [{ type: Card, amount: 2499, reference: AUTH-77A12, last4: '4412' }] } }
            upi: { summary: UPI, value: { shiftId: shift_0091, lines: [{ itemId: item_jacket, qty: 1 }], tenders: [{ type: UPI, amount: 2499, reference: UPI-9182736455 }] } }
            split: { summary: Split cash + card, value: { shiftId: shift_0091, lines: [{ itemId: item_jacket, qty: 1 }, { itemId: item_belt, qty: 1 }], tenders: [{ type: Cash, amount: 1000 }, { type: Card, amount: 2298, reference: AUTH-77A13, last4: '4412' }] } }
            credit: { summary: On credit (named customer), value: { shiftId: shift_0091, customerId: cust_arlene, lines: [{ itemId: item_jacket, qty: 3 }], tenders: [{ type: Credit, amount: 7497 }] } }
            heldCart: { summary: Check out a held cart with a discount override, value: { shiftId: shift_0091, heldCartId: hc_1, lines: [{ itemId: item_jacket, qty: 1, discountPct: 10 }], tenders: [{ type: Cash, amount: 2300 }] } }
    responses:
      '201':
        description: Bill posted
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
          Idempotent-Replayed: { $ref: '../components/headers.yaml#/IdempotentReplayed' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/pos.yaml#/PosBill' }
            examples:
              cash: { summary: Cash bill, value: { document: { $ref: '#/components/examples/PosBillCash/value' }, outcome: posted, journal: { id: jnl_bill_42, companyId: co_acme, number: JV/2026-27/00341, date: '2026-09-13', period: '2026-09', fy: '2026-27', branchId: br_andheri, currency: INR, rate: 1, status: Posted, type: Auto, sourceType: POS Bill, sourceId: bill_0042, sourceNumber: BILL/AND-T1/0042, narration: POS bill BILL/AND-T1/0042, lines: [{ id: j1, accountId: acc_1150, accountCode: '1150', accountName: POS clearing, dr: 430, cr: 0, drBase: 430, crBase: 0, dimensions: {} }, { id: j2, accountId: acc_4010, accountCode: '4010', accountName: Retail sales, dr: 0, cr: 409.52, drBase: 0, crBase: 409.52, dimensions: {} }, { id: j3, accountId: acc_2310, accountCode: '2310', accountName: CGST payable, dr: 0, cr: 10.24, drBase: 0, crBase: 10.24, dimensions: {} }, { id: j4, accountId: acc_2320, accountCode: '2320', accountName: SGST payable, dr: 0, cr: 10.24, drBase: 0, crBase: 10.24, dimensions: {} }], totalDr: 430, totalCr: 430, postedAt: '2026-09-13T12:01:00Z', postedBy: Meena Joshi, correlationId: corr_bill42, createdAt: '2026-09-13T12:01:00Z', updatedAt: '2026-09-13T12:01:00Z', version: 1 }, stockMovements: [{ id: sm_100, companyId: co_acme, date: '2026-09-13', itemId: item_chai, itemCode: CHAI-250, itemName: Masala Chai 250g, warehouseId: wh_andheri, qty: -2, uom: NOS, baseQty: -2, batch: CH-2609, rate: 90, value: -180, type: POS Sale, sourceType: POS Bill, sourceId: bill_0042, sourceNumber: BILL/AND-T1/0042, journalId: jnl_bill_42, balanceAfter: 198, createdAt: '2026-09-13T12:01:00Z', updatedAt: '2026-09-13T12:01:00Z', version: 1 }], warnings: [] } }
              credit: { summary: Credit bill (open item created), value: { document: { $ref: '#/components/examples/PosBillCredit/value' }, outcome: posted, openItems: [{ id: oi_bill_43, companyId: co_acme, partyType: Customer, partyId: cust_arlene, partyName: Arlene Fashions, docType: POS Bill, docId: bill_0043, docNumber: BILL/AND-T1/0043, date: '2026-09-13', dueDate: '2026-10-13', currency: INR, rate: 1, amount: 7497, baseAmount: 7497, settled: 0, balance: 7497, baseBalance: 7497, status: Open, settlements: [], createdAt: '2026-09-13T12:20:00Z', updatedAt: '2026-09-13T12:20:00Z', version: 1 }], warnings: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Business rule
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              shortTender: { summary: Tenders below total, value: { code: VALIDATION, message: Tendered ₹400 is less than bill total ₹430, field: tenders, correlationId: corr_9f1c2e7a } }
              creditNotAllowed: { summary: Credit disabled / walk-in, value: { code: PARTY_BLOCKED, message: Credit tender requires a named customer with credit enabled, field: customerId, correlationId: corr_9f1c2e7a } }
              creditBlock: { summary: Customer over credit limit, value: { code: CREDIT_BLOCK, message: "Arlene Fashions would exceed credit limit ₹5,00,000 (exposure ₹4,98,900 + ₹7,497)", details: { limit: 500000, exposure: 498900, documentAmount: 7497 }, correlationId: corr_9f1c2e7a } }
              negativeStock: { summary: No stock at the terminal warehouse, value: { code: NEGATIVE_STOCK, message: Blue jacket M — available 0 in Andheri Store, details: { itemId: item_jacket, warehouseId: wh_andheri, available: 0, requested: 1 }, correlationId: corr_9f1c2e7a } }
              shiftClosed: { summary: Shift not open, value: { code: INVALID_STATE, message: Shift SH/AND-T1/0090 is Closed, correlationId: corr_9f1c2e7a } }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

