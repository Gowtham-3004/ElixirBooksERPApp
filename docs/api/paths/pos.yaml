# POS (tag: POS). src/modules/pos/actions.ts.

/pos/terminals:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [POS]
    summary: List terminals
    operationId: listPosTerminals
    x-permission: pos.terminal.view
    x-frd: [FR-POS-001]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/BranchFilter'
    responses:
      '200':
        description: Terminals
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/pos.yaml#/PosTerminal' } }
            examples:
              firstPage: { summary: Two tills, value: { data: [{ id: term_and_t1, companyId: co_acme, code: AND-T1, name: Andheri till 1, branchId: br_andheri, warehouseId: wh_andheri, cashAccountId: acc_1300, location: Ground floor, status: Active, openShiftId: shift_0091, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-13T09:00:00Z', version: 3 }, { id: term_and_t2, companyId: co_acme, code: AND-T2, name: Andheri till 2, branchId: br_andheri, warehouseId: wh_andheri, cashAccountId: acc_1300, location: First floor, status: Inactive, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-08-01T09:00:00Z', version: 2 }], meta: { nextCursor: null, limit: 25, total: 2 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [POS]
    summary: Create a terminal
    operationId: createPosTerminal
    x-permission: pos.terminal.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/pos.yaml#/PosTerminalInput'
              - { required: [code, name, branchId, warehouseId] }
          examples:
            full: { summary: New till, value: { code: AND-T2, name: Andheri till 2, branchId: br_andheri, warehouseId: wh_andheri, cashAccountId: acc_1300, location: First floor } }
    responses:
      '201':
        description: Created
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/pos.yaml#/PosTerminal' }
            examples:
              created: { summary: Created, value: { id: term_and_t2, companyId: co_acme, code: AND-T2, name: Andheri till 2, branchId: br_andheri, warehouseId: wh_andheri, cashAccountId: acc_1300, location: First floor, status: Active, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/pos/terminals/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [POS]
    summary: Get a terminal
    operationId: getPosTerminal
    x-permission: pos.terminal.view
    responses:
      '200':
        description: Terminal
        content:
          application/json:
            schema: { $ref: '../components/schemas/pos.yaml#/PosTerminal' }
            examples:
              active: { summary: Active with open shift, value: { id: term_and_t1, companyId: co_acme, code: AND-T1, name: Andheri till 1, branchId: br_andheri, warehouseId: wh_andheri, cashAccountId: acc_1300, location: Ground floor, status: Active, openShiftId: shift_0091, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-13T09:00:00Z', version: 3 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [POS]
    summary: Update a terminal (status, defaults)
    operationId: updatePosTerminal
    x-permission: pos.terminal.edit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/pos.yaml#/PosTerminalInput'
              - { type: object, properties: { status: { type: string, enum: [Active, Inactive] } } }
              - $ref: '../components/schemas/common.yaml#/ExpectedVersion'
          examples:
            deactivate: { summary: Deactivate (no open shift), value: { expectedVersion: 3, status: Inactive } }
            move: { summary: Change warehouse, value: { expectedVersion: 3, warehouseId: wh_andheri2, location: Basement } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/pos.yaml#/PosTerminal' }
            examples:
              updated: { summary: Updated, value: { id: term_and_t2, companyId: co_acme, code: AND-T2, name: Andheri till 2, branchId: br_andheri, warehouseId: wh_andheri, cashAccountId: acc_1300, location: First floor, status: Inactive, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 4 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
  delete:
    tags: [POS]
    summary: Delete a terminal (no shifts recorded)
    operationId: deletePosTerminal
    x-permission: pos.terminal.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── shifts ────────────────────────────────────────────────────────────────

/pos/shifts:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [POS]
    summary: List shifts
    description: Tabs → Open · Pending approval · Closed · All. Query examples — `?terminalId=term_and_t1` · `?cashierId=usr_meena` · `?dateFrom=2026-09-01`.
    operationId: listPosShifts
    x-permission: pos.shift.view
    x-frd: [FR-POS-002]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: terminalId, in: query, schema: { type: string } }
      - { name: cashierId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
    responses:
      '200':
        description: Shifts
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/pos.yaml#/PosShift' } }
            examples:
              firstPage: { summary: Open and closed, value: { data: [{ id: shift_0091, companyId: co_acme, number: SH/AND-T1/0091, terminalId: term_and_t1, terminalName: Andheri till 1, cashierId: usr_meena, cashierName: Meena Joshi, branchId: br_andheri, openedAt: '2026-09-13T09:00:00Z', openingFloat: 5000, status: Open, bills: 12, sales: 18650, refunds: 0, createdAt: '2026-09-13T09:00:00Z', updatedAt: '2026-09-13T12:00:00Z', version: 13 }, { id: shift_0090, companyId: co_acme, number: SH/AND-T1/0090, terminalId: term_and_t1, terminalName: Andheri till 1, cashierId: usr_meena, cashierName: Meena Joshi, branchId: br_andheri, openedAt: '2026-09-12T09:00:00Z', closedAt: '2026-09-12T20:05:00Z', openingFloat: 5000, status: Closed, expected: { Cash: 23150, Card: 41200, UPI: 18900 }, counted: { Cash: 23100, Card: 41200, UPI: 18900 }, variance: { Cash: -50, Card: 0, UPI: 0 }, varianceTotal: -50, bills: 64, sales: 83250, refunds: 1200, journalId: jnl_sh_90, journalNumber: JV/2026-27/00340, closedBy: Meena Joshi, createdAt: '2026-09-12T09:00:00Z', updatedAt: '2026-09-12T20:05:00Z', version: 66 }], meta: { nextCursor: null, limit: 25, total: 2, counts: { Open: 1, 'Pending approval': 0, Closed: 90, All: 91 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [POS]
    summary: Open a shift
    description: "One open shift per terminal — a second open → `409 INVALID_STATE`. Opening float is posted Dr Till cash / Cr Main cash."
    operationId: openPosShift
    x-permission: pos.shift.open
    x-events: [JournalPosted]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/pos.yaml#/OpenShiftRequest' }
          examples:
            self: { summary: Cashier opens own shift, value: { terminalId: term_and_t1, openingFloat: 5000 } }
            manager: { summary: Manager opens for a cashier, value: { terminalId: term_and_t1, openingFloat: 5000, cashierId: usr_meena } }
    responses:
      '201':
        description: Shift opened
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/pos.yaml#/PosShift' }
            examples:
              opened: { summary: Open, value: { id: shift_0091, companyId: co_acme, number: SH/AND-T1/0091, terminalId: term_and_t1, terminalName: Andheri till 1, cashierId: usr_meena, cashierName: Meena Joshi, branchId: br_andheri, openedAt: '2026-09-13T09:00:00Z', openingFloat: 5000, status: Open, bills: 0, sales: 0, refunds: 0, createdAt: '2026-09-13T09:00:00Z', updatedAt: '2026-09-13T09:00:00Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

/pos/shifts/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [POS]
    summary: Get a shift (Z-report figures)
    operationId: getPosShift
    x-permission: pos.shift.view
    responses:
      '200':
        description: Shift
        content:
          application/json:
            schema: { $ref: '../components/schemas/pos.yaml#/PosShift' }
            examples:
              open: { summary: Open, value: { id: shift_0091, companyId: co_acme, number: SH/AND-T1/0091, terminalId: term_and_t1, terminalName: Andheri till 1, cashierId: usr_meena, cashierName: Meena Joshi, branchId: br_andheri, openedAt: '2026-09-13T09:00:00Z', openingFloat: 5000, status: Open, expected: { Cash: 9650, Card: 6000, UPI: 3000 }, bills: 12, sales: 18650, refunds: 0, createdAt: '2026-09-13T09:00:00Z', updatedAt: '2026-09-13T12:00:00Z', version: 13 } }
              pendingApproval: { summary: Closed with variance over tolerance, value: { id: shift_0089, companyId: co_acme, number: SH/AND-T1/0089, terminalId: term_and_t1, terminalName: Andheri till 1, cashierId: usr_meena, cashierName: Meena Joshi, branchId: br_andheri, openedAt: '2026-09-11T09:00:00Z', closedAt: '2026-09-11T20:10:00Z', openingFloat: 5000, status: Pending Approval, expected: { Cash: 23150, Card: 41200, UPI: 18900 }, counted: { Cash: 22800, Card: 41200, UPI: 18900 }, variance: { Cash: -350, Card: 0, UPI: 0 }, varianceTotal: -350, bills: 61, sales: 81400, refunds: 600, approvalId: apr_sh_89, closeNotes: ₹350 short — customer disputed change on bill 0038, closedBy: Meena Joshi, createdAt: '2026-09-11T09:00:00Z', updatedAt: '2026-09-11T20:10:00Z', version: 64 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/pos/shifts/{id}/close:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [POS]
    summary: Close a shift (count tenders)
    description: "Variance within `posVarianceTolerance` → Closed and the day's sales/tenders journal posts. Variance over tolerance → Pending Approval ('POS Shift Variance' workflow); nothing posts until approved."
    operationId: closePosShift
    x-permission: pos.shift.close
    x-idempotent: true
    x-workflow-doc-type: POS Shift Variance
    x-events: [JournalPosted, DocumentSubmitted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/pos.yaml#/CloseShiftRequest' }
          examples:
            exact: { summary: Counts match, value: { counted: { Cash: 23150, Card: 41200, UPI: 18900 } } }
            smallVariance: { summary: Within tolerance, value: { counted: { Cash: 23100, Card: 41200, UPI: 18900 }, closeNotes: ₹50 short } }
            overTolerance: { summary: Over tolerance (needs approval), value: { counted: { Cash: 22800, Card: 41200, UPI: 18900 }, closeNotes: ₹350 short — customer disputed change on bill 0038 } }
    responses:
      '200':
        description: Outcome
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/pos.yaml#/PosShift' }
                    outcome: { type: string, enum: [closed, routed-for-approval] }
            examples:
              closed: { summary: outcome = closed (journal posted), value: { document: { id: shift_0090, companyId: co_acme, number: SH/AND-T1/0090, terminalId: term_and_t1, terminalName: Andheri till 1, cashierId: usr_meena, cashierName: Meena Joshi, branchId: br_andheri, openedAt: '2026-09-12T09:00:00Z', closedAt: '2026-09-12T20:05:00Z', openingFloat: 5000, status: Closed, expected: { Cash: 23150, Card: 41200, UPI: 18900 }, counted: { Cash: 23100, Card: 41200, UPI: 18900 }, variance: { Cash: -50, Card: 0, UPI: 0 }, varianceTotal: -50, bills: 64, sales: 83250, refunds: 1200, journalId: jnl_sh_90, journalNumber: JV/2026-27/00340, closedBy: Meena Joshi, createdAt: '2026-09-12T09:00:00Z', updatedAt: '2026-09-12T20:05:00Z', version: 66 }, outcome: closed, journal: { id: jnl_sh_90, companyId: co_acme, number: JV/2026-27/00340, date: '2026-09-12', period: '2026-09', fy: '2026-27', branchId: br_andheri, currency: INR, rate: 1, status: Posted, type: Auto, sourceType: POS Shift, sourceId: shift_0090, sourceNumber: SH/AND-T1/0090, narration: POS shift SH/AND-T1/0090 — tender settlement, lines: [{ id: j1, accountId: acc_1300, accountCode: '1300', accountName: Cash in hand, dr: 18100, cr: 0, drBase: 18100, crBase: 0, dimensions: {} }, { id: j2, accountId: acc_1310, accountCode: '1310', accountName: Card / UPI clearing, dr: 60100, cr: 0, drBase: 60100, crBase: 0, dimensions: {} }, { id: j3, accountId: acc_5900, accountCode: '5900', accountName: Cash short / over, dr: 50, cr: 0, drBase: 50, crBase: 0, dimensions: {} }, { id: j4, accountId: acc_1150, accountCode: '1150', accountName: POS clearing, dr: 0, cr: 78250, drBase: 0, crBase: 78250, dimensions: {} }], totalDr: 78250, totalCr: 78250, postedAt: '2026-09-12T20:05:00Z', postedBy: Meena Joshi, correlationId: corr_sh90, createdAt: '2026-09-12T20:05:00Z', updatedAt: '2026-09-12T20:05:00Z', version: 1 }, warnings: ['Cash short by ₹50 — posted to Cash short/over'] } }
              routed: { summary: outcome = routed-for-approval, value: { document: { id: shift_0089, companyId: co_acme, number: SH/AND-T1/0089, terminalId: term_and_t1, terminalName: Andheri till 1, cashierId: usr_meena, cashierName: Meena Joshi, branchId: br_andheri, openedAt: '2026-09-11T09:00:00Z', closedAt: '2026-09-11T20:10:00Z', openingFloat: 5000, status: Pending Approval, expected: { Cash: 23150, Card: 41200, UPI: 18900 }, counted: { Cash: 22800, Card: 41200, UPI: 18900 }, variance: { Cash: -350, Card: 0, UPI: 0 }, varianceTotal: -350, bills: 61, sales: 81400, refunds: 600, approvalId: apr_sh_89, closeNotes: ₹350 short — customer disputed change on bill 0038, closedBy: Meena Joshi, createdAt: '2026-09-11T09:00:00Z', updatedAt: '2026-09-11T20:10:00Z', version: 64 }, outcome: routed-for-approval, approval: { id: apr_sh_89, companyId: co_acme, docType: POS Shift Variance, collection: posShifts, docId: shift_0089, docNumber: SH/AND-T1/0089, amount: 350, currency: INR, branchId: br_andheri, requesterId: usr_meena, requesterName: Meena Joshi, steps: [{ order: 1, name: Store manager, approverType: Role, approverRef: role_storemgr, approverLabel: Store Manager, status: Pending, commentRequired: true }], currentStep: 0, status: Pending, submittedAt: '2026-09-11T20:10:00Z', history: [], createdAt: '2026-09-11T20:10:00Z', updatedAt: '2026-09-11T20:10:00Z', version: 1 }, warnings: ['Variance ₹350 exceeds tolerance ₹100'] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

/pos/shifts/{id}/approve-variance:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [POS]
    summary: Approve / reject a Pending Approval shift close
    description: "Approve → Closed, journal posts with the variance to Cash short/over. Reject → shift returns to Open for a recount."
    operationId: approvePosShiftVariance
    x-permission: pos.shift.approve
    x-idempotent: true
    x-events: [DocumentApproved, DocumentRejected, JournalPosted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [decision, comment], properties: { decision: { type: string, enum: [Approved, Rejected] }, comment: { type: string, minLength: 1 } } }
          examples:
            approve: { summary: Approve, value: { decision: Approved, comment: Verified CCTV — change dispute genuine } }
            reject: { summary: Reject (recount), value: { decision: Rejected, comment: Recount the drawer with the supervisor } }
    responses:
      '200':
        description: Decided
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/pos.yaml#/PosShift' }
                    outcome: { type: string, enum: [closed, reopened] }
            examples:
              approved: { summary: Approved → Closed, value: { document: { id: shift_0089, companyId: co_acme, number: SH/AND-T1/0089, terminalId: term_and_t1, terminalName: Andheri till 1, cashierId: usr_meena, cashierName: Meena Joshi, branchId: br_andheri, openedAt: '2026-09-11T09:00:00Z', closedAt: '2026-09-11T20:10:00Z', openingFloat: 5000, status: Closed, varianceTotal: -350, bills: 61, sales: 81400, refunds: 600, journalId: jnl_sh_89, journalNumber: JV/2026-27/00339, approvalId: apr_sh_89, closedBy: Meena Joshi, createdAt: '2026-09-11T09:00:00Z', updatedAt: '2026-09-12T08:30:00Z', version: 65 }, outcome: closed, warnings: [] } }
              rejected: { summary: Rejected → Open, value: { document: { id: shift_0089, companyId: co_acme, number: SH/AND-T1/0089, terminalId: term_and_t1, terminalName: Andheri till 1, cashierId: usr_meena, cashierName: Meena Joshi, branchId: br_andheri, openedAt: '2026-09-11T09:00:00Z', openingFloat: 5000, status: Open, bills: 61, sales: 81400, refunds: 600, createdAt: '2026-09-11T09:00:00Z', updatedAt: '2026-09-12T08:30:00Z', version: 65 }, outcome: reopened, warnings: ['Shift reopened for recount'] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

# ── held carts ────────────────────────────────────────────────────────────

/pos/held-carts:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [POS]
    summary: List held carts for a shift
    operationId: listPosHeldCarts
    x-permission: pos.bill.view
    parameters:
      - { name: shiftId, in: query, required: true, schema: { type: string } }
    responses:
      '200':
        description: Held carts
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/pos.yaml#/PosHeldCart' } } } }
            examples:
