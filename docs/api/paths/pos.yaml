              routed: { summary: outcome = routed-for-approval (no receipt), value: { document: { id: ret_0008, companyId: co_acme, number: RET/AND-T1/0008, docType: POS Return, date: '2026-09-13', branchId: br_andheri, status: Submitted, currency: INR, rate: 1, partyType: Customer, partyId: cust_walkin, partyName: Walk-in, shiftId: shift_0091, terminalId: term_and_t1, cashierName: Meena Joshi, reasonCode: RET-OTH, reasonText: Gift return — no receipt, noReceipt: true, refund: { type: Cash, amount: 799 }, approvalRequired: true, approvalId: apr_ret_8, lines: [], totals: { subtotal: 677.12, discount: 0, taxable: 677.12, tax: 121.88, components: { CGST: 60.94, SGST: 60.94 }, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 799, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 799 }, createdAt: '2026-09-13T12:45:00Z', updatedAt: '2026-09-13T12:45:00Z', version: 1 }, outcome: routed-for-approval, warnings: ['No-receipt return needs store manager approval'] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
