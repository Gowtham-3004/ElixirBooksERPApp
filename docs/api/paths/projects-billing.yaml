# Projects & contracts — part 2 (tag: Projects). Timesheets, billable expenses, milestones, usage, billing runs, retainers, revenue recognition, profitability, settings.

# ── timesheets ────────────────────────────────────────────────────────────

/projects/timesheets:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Projects]
    summary: Weekly timesheets
    description: "Tabs → Mine (`mine=true`) · Awaiting approval · Approved (unbilled) · Invoiced · All. Query examples — `?employeeId=emp_neha` · `?projectId=prj_erp` · `?weekStart=2026-09-07`."
    operationId: listTimesheets
    x-permission: projects.timesheet.view
    x-frd: [FR-SRV-003]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: mine, in: query, schema: { type: boolean } }
      - $ref: '../components/parameters.yaml#/EmployeeId'
      - $ref: '../components/parameters.yaml#/ProjectId'
      - { name: weekStart, in: query, schema: { type: string, format: date } }
    responses:
      '200':
        description: Timesheets
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/projects.yaml#/Timesheet' } }
            examples:
              firstPage: { summary: Timesheets, value: { data: [{ $ref: '#/components/examples/TimesheetApproved/value' }], meta: { nextCursor: null, limit: 25, total: 1, counts: { Mine: 2, 'Awaiting approval': 3, Approved: 5, Invoiced: 40, All: 52 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Projects]
    summary: Create a timesheet (Draft)
    operationId: createTimesheet
    x-permission: projects.timesheet.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/projects.yaml#/TimesheetCreate' }
          examples:
            week: { summary: "One project, one task", value: { weekStart: '2026-09-07', rows: [{ projectId: prj_erp, task: Requirement workshops, hours: [8, 8, 6, 8, 4, 0, 0], billable: true, serviceId: svc_cons }] } }
            mixed: { summary: Billable + internal rows, value: { weekStart: '2026-09-07', rows: [{ projectId: prj_erp, task: Build — GL module, hours: [6, 6, 6, 6, 6, 0, 0], billable: true }, { projectId: prj_internal, task: Training, hours: [2, 2, 2, 2, 2, 0, 0], billable: false, notes: Internal enablement }] } }
    responses:
      '201':
        description: Draft
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Timesheet' }
            examples:
              draft: { summary: Draft, value: { id: ts_0218, companyId: co_acme, number: TS/2026-27/00218, docType: Timesheet, employeeId: emp_neha, employeeName: Neha Rao, weekStart: '2026-09-07', rows: [{ id: tr_1, projectId: prj_erp, task: Requirement workshops, hours: [8, 8, 6, 8, 4, 0, 0], billable: true, serviceId: svc_cons }], totalHours: 34, billableHours: 34, status: Draft, branchId: br_ho, source: Web, value: 204000, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Duplicate week
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              duplicate: { summary: Week already exists, value: { code: DUPLICATE, message: A timesheet for the week of 7 Sep already exists (TS/2026-27/00218), details: { timesheetId: ts_0218 }, correlationId: corr_9f1c2e7a } }
      '422':
        description: Validation (validateTimesheet)
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              dayLimit: { summary: More than 24 h in a day, value: { code: VALIDATION, message: 'Tue: 26 hours across rows exceeds 24', field: 'rows[1].hours[1]', correlationId: corr_9f1c2e7a } }
              inactiveProject: { summary: Project not active, value: { code: VALIDATION, message: Project PRJ-OLD is Completed — pick an active project, field: 'rows[0].projectId', correlationId: corr_9f1c2e7a } }

/projects/timesheets/import:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Projects]
    summary: Import timesheets from CSV (dry-run → commit)
    operationId: importTimesheets
    x-permission: projects.timesheet.create
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary, description: "employeeCode, weekStart, projectCode, task, mon..sun, billable" }
              dryRun: { type: boolean, default: true }
              submit: { type: boolean, default: false, description: Submit imported sheets immediately. }
          examples:
            dryRun: { summary: Validate, value: { dryRun: true } }
            commit: { summary: Import and submit, value: { dryRun: false, submit: true } }
    responses:
      '200':
        description: Dry-run
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/ImportJob' }
            examples:
              dryRun: { $ref: '../components/examples/masters.yaml#/ImportDryRun' }
      '201':
        description: Committed
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/ImportJob' }
            examples:
              committed: { $ref: '../components/examples/masters.yaml#/ImportCommitted' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '413': { $ref: '../components/responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/projects/timesheets/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Projects]
    summary: Get a timesheet
    operationId: getTimesheet
    x-permission: projects.timesheet.view
    responses:
      '200':
        description: Timesheet
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Timesheet' }
            examples:
              approved: { $ref: '../components/examples/projects.yaml#/TimesheetApproved' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Projects]
    summary: Edit a Draft / Returned / Rejected timesheet
    operationId: updateTimesheet
    x-permission: projects.timesheet.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/projects.yaml#/TimesheetPatch' }
          examples:
            rows: { summary: Replace rows, value: { expectedVersion: 1, rows: [{ id: tr_1, projectId: prj_erp, task: Requirement workshops, hours: [8, 8, 8, 8, 8, 0, 0], billable: true }] } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Timesheet' }
            examples:
              updated: { summary: Updated, value: { id: ts_0218, companyId: co_acme, number: TS/2026-27/00218, docType: Timesheet, employeeId: emp_neha, employeeName: Neha Rao, weekStart: '2026-09-07', rows: [{ id: tr_1, projectId: prj_erp, task: Requirement workshops, hours: [8, 8, 8, 8, 8, 0, 0], billable: true }], totalHours: 40, billableHours: 40, status: Draft, branchId: br_ho, source: Web, value: 240000, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T10:00:00Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
  delete:
    tags: [Projects]
    summary: Delete a Draft timesheet
    operationId: deleteTimesheet
    x-permission: projects.timesheet.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/projects/timesheets/{id}/submit:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Projects]
    summary: Submit ('Timesheet' workflow; auto-approves when `prjTimesheetApproval` is off)
    operationId: submitTimesheet
    x-permission: projects.timesheet.submit
    x-idempotent: true
    x-workflow-doc-type: Timesheet
    x-events: [DocumentSubmitted, DocumentApproved]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Outcome
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/projects.yaml#/Timesheet' }
                    outcome: { type: string, enum: [routed-for-approval, approved] }
            examples:
              routed: { summary: outcome = routed-for-approval, value: { document: { id: ts_0218, companyId: co_acme, number: TS/2026-27/00218, docType: Timesheet, employeeId: emp_neha, employeeName: Neha Rao, weekStart: '2026-09-07', rows: [], totalHours: 34, billableHours: 34, status: Submitted, branchId: br_ho, approvalId: apr_ts_218, submittedAt: '2026-09-13T09:30:00Z', submittedBy: Neha Rao, source: Web, value: 204000, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:30:00Z', version: 2 }, outcome: routed-for-approval, approval: { id: apr_ts_218, companyId: co_acme, docType: Timesheet, collection: timesheets, docId: ts_0218, docNumber: TS/2026-27/00218, amount: 204000, currency: INR, branchId: br_ho, requesterId: usr_neha, requesterName: Neha Rao, steps: [{ order: 1, name: Project manager, approverType: User, approverRef: usr_priya, approverLabel: Priya Sharma, status: Pending, commentRequired: false }], currentStep: 0, status: Pending, submittedAt: '2026-09-13T09:30:00Z', history: [], createdAt: '2026-09-13T09:30:00Z', updatedAt: '2026-09-13T09:30:00Z', version: 1 }, warnings: [] } }
              approved: { summary: outcome = approved (approval disabled), value: { document: { $ref: '#/components/examples/TimesheetApproved/value' }, outcome: approved, warnings: [] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/projects/timesheets/{id}/act:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Projects]
    summary: Approve / reject / return / recall
    operationId: actOnTimesheet
    x-permission: projects.timesheet.approve
    x-events: [DocumentApproved, DocumentRejected]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/projects.yaml#/TimesheetAction' }
          examples:
            approve: { summary: Approve, value: { action: Approve } }
            reject: { summary: Reject, value: { action: Reject, comment: Friday hours belong to PRJ-INT } }
            return: { summary: Return for changes, value: { action: Return, comment: Add task notes } }
            recall: { summary: Recall (requester), value: { action: Recall } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Timesheet' }
            examples:
              approved: { $ref: '../components/examples/projects.yaml#/TimesheetApproved' }
              rejected: { summary: Rejected, value: { id: ts_0218, companyId: co_acme, number: TS/2026-27/00218, docType: Timesheet, employeeId: emp_neha, employeeName: Neha Rao, weekStart: '2026-09-07', rows: [], totalHours: 34, billableHours: 34, status: Rejected, branchId: br_ho, approvalId: apr_ts_218, rejectedAt: '2026-09-13T11:00:00Z', rejectionReason: Friday hours belong to PRJ-INT, source: Web, value: 204000, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T11:00:00Z', version: 3 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: No pending request
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              none: { summary: Nothing pending, value: { code: INVALID_STATE, message: No pending approval request for this timesheet, correlationId: corr_9f1c2e7a } }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/projects/timesheets/{id}/bill-now:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Projects]
    summary: Bill an Approved timesheet immediately (single-contract billing run)
    operationId: billTimesheetNow
    x-permission: projects.billing.run
    x-idempotent: true
    x-events: [DocumentCreated]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema: { type: object, properties: { date: { type: string, format: date }, applyRetainer: { type: boolean, default: true } } }
          examples:
            today: { summary: Invoice dated today, value: { date: '2026-09-13' } }
    responses:
      '201':
        description: Draft invoice created
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/BillingRun' }
            examples:
              run: { $ref: '../components/examples/projects.yaml#/BillingRunSep' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

# ── billable expenses ─────────────────────────────────────────────────────

/projects/billable-expenses:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Projects]
    summary: Approved claim lines and their billable status
    description: "Tabs → Unflagged (`flagged=false`) · Ready · Invoiced · Excluded."
    operationId: listBillableExpenses
    x-permission: projects.billing.view
    x-frd: [FR-SRV-003]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - { name: flagged, in: query, schema: { type: boolean } }
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/ProjectId'
    responses:
      '200':
        description: Lines
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/projects.yaml#/ClaimLineView' } }
            examples:
              rows: { summary: "One flagged, one not", value: { data: [{ claimId: exp_00031, claimNumber: EXP/2026-27/00031, lineId: el_1, employeeId: emp_priya, employeeName: Priya Sharma, date: '2026-09-10', description: Cab to client site, amount: 850, projectDim: dim_prj_erp, projectId: prj_erp, claimStatus: Approved, billable: { id: be_11, companyId: co_acme, claimId: exp_00031, claimNumber: EXP/2026-27/00031, lineId: el_1, employeeId: emp_priya, employeeName: Priya Sharma, projectId: prj_erp, contractId: ctr_0012, date: '2026-09-10', description: Cab to client site, amount: 850, markupPct: 10, billAmount: 935, status: Ready, createdAt: '2026-09-13T11:00:00Z', updatedAt: '2026-09-13T11:00:00Z', version: 1 } }, { claimId: exp_00031, claimNumber: EXP/2026-27/00031, lineId: el_2, employeeId: emp_priya, employeeName: Priya Sharma, date: '2026-09-10', description: Hotel 1 night, amount: 4200, projectDim: dim_prj_erp, projectId: prj_erp, claimStatus: Approved }], meta: { nextCursor: null, limit: 25, total: 2, counts: { Unflagged: 1, Ready: 1, Invoiced: 12, Excluded: 2 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/projects/billable-expenses/mark-billable:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Projects]
    summary: Flag a claim line as billable to a project (with markup)
    operationId: markExpenseBillable
    x-permission: projects.billing.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/projects.yaml#/MarkBillableRequest' }
          examples:
            markup: { summary: Default markup, value: { claimId: exp_00031, lineId: el_2, projectId: prj_erp } }
            atCost: { summary: At cost, value: { claimId: exp_00031, lineId: el_2, projectId: prj_erp, markupPct: 0 } }
    responses:
      '201':
        description: Flagged
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/BillableExpense' }
            examples:
              ready: { summary: Ready to bill, value: { id: be_12, companyId: co_acme, claimId: exp_00031, claimNumber: EXP/2026-27/00031, lineId: el_2, employeeId: emp_priya, employeeName: Priya Sharma, projectId: prj_erp, contractId: ctr_0012, date: '2026-09-10', description: Hotel 1 night, amount: 4200, markupPct: 10, billAmount: 4620, status: Ready, createdAt: '2026-09-13T11:05:00Z', updatedAt: '2026-09-13T11:05:00Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Already invoiced
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              invoiced: { summary: Invoiced, value: { code: INVALID_STATE, message: This expense is already invoiced, details: { invoiceNumber: INV/2026-27/00050 }, correlationId: corr_9f1c2e7a } }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/projects/billable-expenses/{id}/exclude:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Projects]
    summary: Exclude from billing
    operationId: excludeBillableExpense
    x-permission: projects.billing.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            reason: { summary: Reason, value: { reason: Covered by fixed fee } }
    responses:
      '200':
        description: Excluded
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/BillableExpense' }
            examples:
              excluded: { summary: Excluded, value: { id: be_12, companyId: co_acme, claimId: exp_00031, claimNumber: EXP/2026-27/00031, lineId: el_2, employeeId: emp_priya, employeeName: Priya Sharma, projectId: prj_erp, contractId: ctr_0012, date: '2026-09-10', description: Hotel 1 night, amount: 4200, markupPct: 10, billAmount: 4620, status: Excluded, createdAt: '2026-09-13T11:05:00Z', updatedAt: '2026-09-13T11:20:00Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── milestones ────────────────────────────────────────────────────────────

/projects/milestones:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Projects]
    summary: Milestones & instalments across contracts
    description: Tabs → Pending · Achieved (unbilled) · Invoiced · Overdue (`overdue=true`).
    operationId: listMilestones
    x-permission: projects.billing.view
    x-frd: [FR-SRV-004]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: contractId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/ProjectId'
      - { name: overdue, in: query, schema: { type: boolean } }
    responses:
      '200':
        description: Milestones
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/projects.yaml#/Milestone' } }
            examples:
              firstPage: { summary: Milestones, value: { data: [{ $ref: '#/components/examples/MilestoneAchieved/value' }, { id: ms_2, companyId: co_acme, contractId: ctr_0015, contractNumber: CTR/2026-27/00015, projectId: prj_erp, kind: Milestone, order: 2, name: Build complete, amount: 500000, due: '2026-11-30', status: Pending, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }], meta: { nextCursor: null, limit: 25, total: 2, counts: { Pending: 5, Achieved: 1, Invoiced: 3, Overdue: 0 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
