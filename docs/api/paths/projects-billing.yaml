# ── revenue recognition ───────────────────────────────────────────────────

/projects/revenue/schedule:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Projects]
    summary: Revenue schedule for a contract (posted + projected period positions)
    operationId: getRevenueSchedule
    x-permission: projects.billing.view
    x-frd: [FR-SRV-006]
    parameters:
      - { name: contractId, in: query, required: true, schema: { type: string }, example: ctr_0012 }
      - { name: upto, in: query, schema: { type: string }, description: Last period to project (default = current)., example: '2027-03' }
    responses:
      '200':
        description: Schedule
        content:
          application/json:
            schema: { type: object, required: [contractId, contractNumber, method, revenueMethod, nextPeriodToRun, data], properties: { contractId: { type: string }, contractNumber: { type: string }, method: { $ref: '../components/schemas/projects.yaml#/BillingMethod' }, revenueMethod: { $ref: '../components/schemas/projects.yaml#/RevenueMethod' }, nextPeriodToRun: { type: string }, data: { type: array, items: { $ref: '../components/schemas/projects.yaml#/PeriodPosition' } } } }
            examples:
              percentComplete: { summary: "Fixed price, % complete", value: { contractId: ctr_0012, contractNumber: CTR/2026-27/00012, method: Fixed price, revenueMethod: Percent complete, nextPeriodToRun: '2026-10', data: [{ period: '2026-09', billed: 720000, recognized: 840000, cumBilled: 720000, cumRecognized: 840000, unbilled: 120000, deferred: 0, adjustment: 120000, adjustmentType: Accrual, basis: '35% complete of 2,400,000', posted: { $ref: '#/components/examples/RevenueScheduleSep/value' } }, { period: '2026-10', billed: 0, recognized: 240000, cumBilled: 720000, cumRecognized: 1080000, unbilled: 360000, deferred: 0, adjustment: 360000, adjustmentType: Accrual, basis: Projected (straight-line to end) }] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/projects/revenue/runs:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Projects]
    summary: Posted recognition rows
    operationId: listRevenueRuns
    x-permission: projects.billing.view
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - { name: period, in: query, schema: { type: string } }
      - { name: contractId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/Status'
    responses:
      '200':
        description: Rows
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/projects.yaml#/RevenueSchedule' } }
            examples:
              firstPage: { summary: Rows, value: { data: [{ $ref: '#/components/examples/RevenueScheduleSep/value' }], meta: { nextCursor: null, limit: 25, total: 14 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Projects]
    summary: Run recognition for a period (accrual → unbilled revenue; deferral → deferred revenue; auto-reversal next period)
    description: Idempotent per contract × period. Periods must run in order; the previous period's adjustment is reversed on the first day of this period.
    operationId: runRevenueRecognition
    x-permission: projects.revenue.run
    x-frd: [FR-SRV-006]
    x-idempotent: true
    x-events: [JournalPosted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/projects.yaml#/RevenueRunRequest' }
          examples:
            all: { summary: All active contracts, value: { period: '2026-09' } }
            one: { summary: One contract, value: { period: '2026-09', contractIds: [ctr_0012] } }
    responses:
      '200':
        description: Result (rows + per-contract errors)
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/RevenueRunResult' }
            examples:
              mixed: { summary: "One posted, one error", value: { period: '2026-09', rows: [{ $ref: '#/components/examples/RevenueScheduleSep/value' }], errors: [{ contractId: ctr_0015, contractNumber: CTR/2026-27/00015, message: Contract CTR/2026-27/00015 is Approved — only active contracts recognise revenue }] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Out of order
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              order: { summary: Later period already run, value: { code: INVALID_STATE, message: 2026-10 is already recognised for CTR/2026-27/00012 — periods must run in order, correlationId: corr_9f1c2e7a } }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

/projects/revenue/runs/{id}/reverse:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Projects]
    summary: Reverse a recognition row (latest period first)
    operationId: reverseRevenueRecognition
    x-permission: projects.revenue.run
    x-idempotent: true
    x-events: [JournalReversed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            reason: { summary: Reason, value: { reason: Progress % was overstated } }
    responses:
      '200':
        description: Reversed
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/RevenueSchedule' }
            examples:
              reversed: { summary: Reversed, value: { id: rs_0012_0909, companyId: co_acme, contractId: ctr_0012, contractNumber: CTR/2026-27/00012, projectId: prj_erp, customerId: cust_arlene, period: '2026-09', method: Fixed price, billed: 720000, recognized: 840000, cumBilled: 720000, cumRecognized: 840000, unbilled: 120000, deferred: 0, reversed: 0, journalId: jnl_rev_1, journalNumber: JV/2026-27/00414, adjustmentType: Accrual, adjustment: 120000, status: Reversed, runAt: '2026-09-30T18:00:00Z', runBy: Priya Sharma, idempotencyKey: 'rev:ctr_0012:2026-09', reversedById: jnl_rev_1r, reversalReason: Progress % was overstated, createdAt: '2026-09-30T18:00:00Z', updatedAt: '2026-10-02T09:00:00Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: State conflict
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              order: { summary: Reverse later period first, value: { code: INVALID_STATE, message: Reverse 2026-10 first — schedules unwind in reverse order, correlationId: corr_9f1c2e7a } }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

