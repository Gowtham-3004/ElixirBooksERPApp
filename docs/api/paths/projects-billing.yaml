      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/projects/retainers/{id}/allocate:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Projects]
    summary: Allocate to a posted invoice (settles the receivable)
    operationId: allocateRetainer
    x-permission: projects.retainer.record
    x-idempotent: true
    x-events: [ReceiptAllocated, JournalPosted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/projects.yaml#/RetainerAllocateRequest' }
          examples:
            full: { summary: Cover an invoice fully, value: { invoiceId: inv_01j8k3, amount: 118000, date: '2026-09-16' } }
            partial: { summary: Partial, value: { invoiceId: inv_01j8k7, amount: 200000 } }
    responses:
      '200':
        description: Allocated
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Retainer' }
            examples:
              allocated: { summary: Allocated, value: { id: ret_0004, companyId: co_acme, number: RET/2026-27/00004, customerId: cust_arlene, customerName: Arlene Traders, contractId: ctr_0012, amount: 500000, currency: INR, rate: 1, baseAmount: 500000, receivedDate: '2026-09-15', bankAccountId: acc_1310, reference: NEFT26091500334, journalId: jnl_ret_4, journalNumber: JV/2026-27/00411, openItemId: oi_ret_4, allocations: [{ id: ra_1, invoiceId: inv_01j8k3, invoiceNumber: INV/2026-27/00042, amount: 118000, date: '2026-09-16', journalId: jnl_ret_4a, journalNumber: JV/2026-27/00412, status: Settled }], allocated: 118000, remaining: 382000, status: Open, branchId: br_ho, createdAt: '2026-09-15T10:00:00Z', updatedAt: '2026-09-16T10:00:00Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: State conflict
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              notPosted: { summary: Invoice not posted, value: { code: INVALID_STATE, message: Invoice INV/2026-27/00051 is Draft — allocations settle posted invoices only, correlationId: corr_9f1c2e7a } }
      '422':
        description: Over-allocation
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              remaining: { summary: Exceeds remaining, value: { code: OVER_ALLOCATION, message: "Only ₹3,82,000.00 remains on RET/2026-27/00004", field: amount, correlationId: corr_9f1c2e7a } }
              outstanding: { summary: Exceeds invoice outstanding, value: { code: OVER_ALLOCATION, message: "Invoice outstanding is ₹1,18,000.00", field: amount, correlationId: corr_9f1c2e7a } }
              customer: { summary: Different customer, value: { code: VALIDATION, message: Invoice belongs to a different customer, field: invoiceId, correlationId: corr_9f1c2e7a } }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

/projects/retainers/{id}/reverse:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Projects]
    summary: Reverse a retainer with no settled allocations
    operationId: reverseRetainer
    x-permission: projects.retainer.record
    x-idempotent: true
    x-events: [JournalReversed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            reason: { summary: Reason, value: { reason: Payment bounced } }
    responses:
      '200':
        description: Reversed
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Retainer' }
            examples:
              reversed: { summary: Reversed, value: { id: ret_0005, companyId: co_acme, number: RET/2026-27/00005, customerId: cust_ustech, customerName: US Tech Inc, amount: 5000, currency: USD, rate: 84, baseAmount: 420000, receivedDate: '2026-09-15', bankAccountId: acc_1320, reference: SWIFT-77812, journalId: jnl_ret_5, journalNumber: JV/2026-27/00413, allocations: [], allocated: 0, remaining: 0, status: Reversed, branchId: br_ho, reversedById: jnl_ret_5r, reversalReason: Payment bounced, createdAt: '2026-09-15T10:00:00Z', updatedAt: '2026-09-18T10:00:00Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Settled allocations
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              settled: { summary: Has settled allocations, value: { code: INVALID_STATE, message: Retainer has settled allocations — reverse those invoices first, correlationId: corr_9f1c2e7a } }
