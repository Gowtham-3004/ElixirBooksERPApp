            examples:
              queued: { summary: Queued, value: { notification: { integrationLogId: ilog_email_91, status: Queued, to: [accounts@arlenetraders.in], sentAt: '2026-09-13T09:12:04Z' }, activity: { id: act_11, companyId: co_acme, type: Reminder, subject: Payment reminder sent (e-mail) — 1 overdue invoice, customerId: cust_arlene, customerName: Arlene Traders, status: Done, doneAt: '2026-09-13T09:12:04Z', ownerId: usr_priya, ownerName: Priya Sharma, channel: email, overdue: false, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } } }
