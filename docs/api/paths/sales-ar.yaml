/sales/collections/{customerId}/reminder:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - { name: customerId, in: path, required: true, schema: { type: string }, example: cust_arlene }
  post:
    tags: [Sales]
    summary: Send a payment reminder (e-mail / SMS) and log the activity
    operationId: sendCollectionReminder
    x-permission: sales.invoice.view
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: '../components/schemas/sales.yaml#/ReminderRequest' }
          examples:
            email: { summary: E-mail all overdue, value: { channel: email } }
            smsSpecific: { summary: SMS for one invoice, value: { channel: sms, invoiceIds: [inv_00031], message: 'Reminder: INV/2026-27/00031 ₹50,000 was due on 4 Sep.' } }
    responses:
      '202':
        description: Queued + activity logged
        content:
          application/json:
            schema:
              type: object
              required: [notification, activity]
              properties:
                notification: { $ref: '../components/schemas/common.yaml#/EmailResult' }
