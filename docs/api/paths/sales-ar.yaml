                  stockMovements: [{ id: sm_20, companyId: co_acme, date: '2026-09-13', itemId: item_chai, itemCode: TEA-CHAI, itemName: Masala Chai 250g, warehouseId: wh_main, qty: -200, uom: NOS, baseQty: -200, rate: 90, value: -18000, type: Delivery, sourceType: Sales Invoice, sourceId: inv_01j8k7, sourceNumber: INV/2026-27/00045, journalId: jnl_01j8k9, balanceAfter: 800, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }]
