/sales/invoices/{id}/reverse:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Sales]
    summary: Reverse a posted invoice (linked reversal document)
    description: |
      Blocked when receipts/credits are allocated, a posted credit note exists, or the IRN is older than 24 h
      (`409 INVALID_STATE` with the reason). Cancels IRN / e-Way bill when present, reverses the sales and COGS journals,
      restores stock, settles the open item, rolls back source quantities and creates a **negative-line reversal invoice**
      (`reversalOfId`). The original goes `Reversed` (`reversedById`). Reversal date must be in an open period.
    operationId: reverseSalesInvoice
    x-permission: sales.invoice.reverse
    x-idempotent: true
    x-events: [DocumentReversed, JournalReversed, StockReversed, StatutorySubmissionCancelled]
    x-frd: [FR-SAL-035]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            reason: { $ref: '../components/examples/common.yaml#/ReasonReverse' }
            dated: { $ref: '../components/examples/common.yaml#/ReasonReverseDated' }
    responses:
      '200':
        description: Reversed — returns the reversal document plus the original
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  required: [original]
                  properties:
                    document: { $ref: '../components/schemas/sales.yaml#/SalesInvoice', description: The reversal invoice (negative lines). }
                    original: { $ref: '../components/schemas/sales.yaml#/SalesInvoice' }
            examples:
              reversed:
                summary: Reversal document created, original marked Reversed
                value:
                  document: { id: inv_01j9x1, companyId: co_acme, number: INV/2026-27/00051, docType: Sales Invoice, date: '2026-09-13', branchId: br_ho, status: Posted, currency: INR, rate: 1, partyType: Customer, partyId: cust_arlene, partyName: Arlene Traders, reversalOfId: inv_01j8k3, reversalReason: Customer returned the full consignment on 12 Sep (RMA-118), lines: [{ id: ln_r1, itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, hsn: '7214', qty: -1000, uom: KG, rate: 58, discountPct: 0, discountAmt: 0, taxable: -58000, taxRateId: tax_gst18, taxRate: 18, taxAmt: -10440, taxComponents: { CGST: -5220, SGST: -5220 }, amount: -68440, warehouseId: wh_main, batch: B-2409-07 }], totals: { subtotal: -100000, discount: 0, taxable: -100000, tax: -15480, components: { CGST: -7740, SGST: -7740 }, breakup: [], charges: 0, tds: 0, roundOff: 0, total: -115480, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: -115480 }, journalId: jnl_01j9x2, journalNumber: JV/2026-27/00330, postedAt: '2026-09-13T11:00:00Z', postedBy: Rahul Mehta, statutory: { eInvoiceStatus: Not Applicable, ewbStatus: Not Applicable }, idempotencyKey: 'inv:inv_01j8k3:reverse', createdAt: '2026-09-13T11:00:00Z', updatedAt: '2026-09-13T11:00:00Z', version: 1 }
                  original: { $ref: '#/components/examples/SalesInvoiceReversed/value' }
                  outcome: reversed
