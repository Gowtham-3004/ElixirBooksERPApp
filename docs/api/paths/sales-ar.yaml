# Sales part 2 (tag: Sales): invoices, credit notes, returns, receipts, AR ageing / collections / statements, settings.
# src/modules/sales/actions.ts, ar/*

# ── sales invoices ────────────────────────────────────────────────────────

/sales/invoices:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Sales]
    summary: List sales invoices
    description: "Tabs → All · Draft (`status=Draft,Returned,Rejected`) · Awaiting approval (`status=Submitted,Approved`) · Posted (`status=Posted,Settled`) · Overdue (`overdue=true`) · Cancelled (`status=Cancelled,Reversed`). Search keys: number, party name, reference, GSTIN. Query examples — `?status=Posted&partyId=cust_arlene` · `?overdue=true` · `?eInvoiceStatus=Pending` · `?dateFrom=2026-09-01&dateTo=2026-09-30&amountMin=100000` · `?view=mine`."
    operationId: listSalesInvoices
    x-permission: sales.invoice.view
    x-frd: [FR-SAL-030]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: overdue, in: query, schema: { type: boolean } }
      - { name: eInvoiceStatus, in: query, schema: { type: string, enum: [Not Applicable, Pending, Queued, Submitted, Accepted, Rejected, Cancelled, Failed] } }
      - { name: view, in: query, schema: { type: string, enum: [all, mine, shared] }, description: Saved view — mine = created by me; shared = my branch. }
      - $ref: '../components/parameters.yaml#/PartyId'
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
      - $ref: '../components/parameters.yaml#/AmountMin'
      - $ref: '../components/parameters.yaml#/AmountMax'
      - $ref: '../components/parameters.yaml#/BranchFilter'
      - $ref: '../components/parameters.yaml#/UpdatedSince'
    responses:
      '200':
        description: Invoices
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/sales.yaml#/SalesInvoice' } }
                    totals: { type: object, properties: { total: { type: number }, due: { type: number } } }
            examples:
              firstPage:
                summary: Posted tab, page 1
                value:
                  data:
                    - { id: inv_01j8k3, companyId: co_acme, number: INV/2026-27/00042, docType: Sales Invoice, date: '2026-09-13', dueDate: '2026-10-13', branchId: br_ho, status: Posted, currency: INR, rate: 1, partyType: Customer, partyId: cust_arlene, partyName: Arlene Traders, reference: PO-ARL-2291, lines: [], totals: { subtotal: 100000, discount: 0, taxable: 100000, tax: 15480, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 115480, paid: 0, credited: 0, writtenOff: 0, due: 115480, baseTotal: 115480 }, statutory: { eInvoiceStatus: Accepted, ewbStatus: Pending }, overdueDays: 0, createdAt: '2026-09-12T15:02:00Z', updatedAt: '2026-09-13T09:12:10Z', version: 7 }
                    - { id: inv_00031, companyId: co_acme, number: INV/2026-27/00031, docType: Sales Invoice, date: '2026-08-05', dueDate: '2026-09-04', branchId: br_ho, status: Posted, currency: INR, rate: 1, partyType: Customer, partyId: cust_arlene, partyName: Arlene Traders, lines: [], totals: { subtotal: 42373, discount: 0, taxable: 42373, tax: 7627, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 50000, paid: 0, credited: 0, writtenOff: 0, due: 50000, baseTotal: 50000 }, statutory: { eInvoiceStatus: Accepted, ewbStatus: Not Applicable }, overdueDays: 9, createdAt: '2026-08-05T10:00:00Z', updatedAt: '2026-08-05T10:05:00Z', version: 4 }
                  totals: { total: 165480, due: 165480 }
                  meta: { nextCursor: eyJkIjoiMjAyNi0wOC0wNSIsImlkIjoiaW52XzAwMDMxIn0, limit: 25, total: 120, sort: 'date:desc', counts: { All: 142, Draft: 6, 'Awaiting approval': 3, Posted: 120, Overdue: 11, Cancelled: 2 } }
                  scope: { companyId: co_acme, companyName: Acme Trading Pvt Ltd, branchId: br_ho, period: '2026-09', fy: '2026-27', currency: INR, asOf: '2026-09-13T09:12:04Z' }
              lastPage:
                summary: Last page
                value:
                  data:
                    - { id: inv_00001, companyId: co_acme, number: INV/2026-27/00001, docType: Sales Invoice, date: '2026-04-02', dueDate: '2026-05-02', branchId: br_ho, status: Settled, currency: INR, rate: 1, partyType: Customer, partyId: cust_rajesh, partyName: Rajesh Enterprises, lines: [], totals: { subtotal: 20000, discount: 0, taxable: 20000, tax: 3600, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 23600, paid: 23600, credited: 0, writtenOff: 0, due: 0, baseTotal: 23600 }, overdueDays: 0, createdAt: '2026-04-02T10:00:00Z', updatedAt: '2026-04-20T10:00:00Z', version: 5 }
                  totals: { total: 23600, due: 0 }
                  meta: { nextCursor: null, limit: 25, total: 120, sort: 'date:desc' }
                  scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Sales]
    summary: Create a sales invoice (Draft)
    description: |
      Party snapshot, price resolution, tax context (intra/inter-state, treatment, RCM) and totals are computed server-side.
      Sources: **direct** (no source; moves stock on post when `directInvoiceStock`), **from order** (`sourceType: Sales Order`),
      **from delivery** (`sourceType: Delivery` — no stock movement on post, delivery marked invoiced). Duplicate customer
      `reference` warns or blocks per `salesDuplicateRefRule`.
    operationId: createSalesInvoice
    x-permission: sales.invoice.create
    x-events: [DocumentCreated]
    x-frd: [FR-SAL-031, FR-SAL-032]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/sales.yaml#/SalesInvoiceCreate' }
          examples:
            direct: { summary: Direct invoice (stock moves on post), value: { partyId: cust_arlene, date: '2026-09-13', reference: PO-ARL-2291, lines: [{ itemId: item_stl4, qty: 1000, rate: 58, taxRateId: tax_gst18, warehouseId: wh_main, batch: B-2409-07 }, { itemId: item_crate, qty: 100, rate: 420, overrideReason: Negotiated annual contract, taxRateId: tax_gst12, warehouseId: wh_main }] } }
            fromOrder: { summary: From a sales order (source lines), value: { partyId: cust_arlene, date: '2026-09-13', sourceType: Sales Order, sourceId: so_00087, lines: [{ itemId: item_stl4, qty: 1000, rate: 58, taxRateId: tax_gst18, warehouseId: wh_main, sourceDocId: so_00087, sourceLineId: ln_so_1 }, { itemId: item_crate, qty: 100, rate: 420, taxRateId: tax_gst12, warehouseId: wh_main, sourceDocId: so_00087, sourceLineId: ln_so_2 }] } }
            fromDeliveries: { summary: Consolidating two deliveries, value: { partyId: cust_arlene, date: '2026-09-13', sourceType: Delivery, sourceId: dlv_00340, deliveryIds: [dlv_00341], lines: [{ itemId: item_crate, qty: 100, rate: 420, taxRateId: tax_gst12, sourceDocId: dlv_00340, sourceLineId: ln_d1 }, { itemId: item_crate, qty: 20, rate: 420, taxRateId: tax_gst12, sourceDocId: dlv_00341, sourceLineId: ln_d2 }] } }
            foreignCurrency: { summary: USD export (zero-rated), value: { partyId: cust_ustech, date: '2026-09-13', currency: USD, priceListId: pl_usd, reference: USTI-PO-3310, lines: [{ itemId: item_stl4, qty: 5000, rate: 0.72, taxRateId: tax_export, warehouseId: wh_main, batch: B-2409-07 }] } }
            serviceWithTds: { summary: Service invoice with customer TDS and charges, value: { partyId: cust_globaltech, date: '2026-09-13', tdsSectionId: tds_194j, roundTotal: true, lines: [{ itemId: item_consult, qty: 40, rate: 2500, taxRateId: tax_gst18, dimensions: { Department: dim_dept_consult } }], charges: [{ name: Travel reimbursement, amount: 8000, taxRateId: tax_gst18, accountId: acc_4010 }] } }
            interStateHeaderDiscount: { summary: Inter-state (IGST) with header discount, value: { partyId: cust_globaltech, date: '2026-09-13', placeOfSupplyCode: '29', headerDiscountPct: 2, lines: [{ itemId: item_chai, qty: 500, rate: 150, taxRateId: tax_gst5, warehouseId: wh_main }] } }
    responses:
      '201':
        description: Draft invoice (totals computed, number pending)
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/SalesInvoice' }
            examples:
              draft: { $ref: '../components/examples/sales.yaml#/SalesInvoiceDraft' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Duplicate reference (rule = block), idempotency conflict, or source already fully invoiced
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              duplicateReference: { summary: Reference already used (block rule), value: { code: DUPLICATE_REFERENCE, message: 'Reference "PO-ARL-2291" already used on INV/2026-27/00042', field: reference, details: { existingId: inv_01j8k3 }, correlationId: corr_9f1c2e7a } }
              sourceExhausted: { summary: Order line already fully invoiced, value: { code: INVALID_STATE, message: 'SO/2026-27/00087 line 1: 1000 of 1000 already invoiced', field: 'lines[0].qty', correlationId: corr_9f1c2e7a } }
              partyBlocked: { summary: Customer blocked, value: { code: PARTY_BLOCKED, message: Kiran Enterprises is blocked for new business, field: partyId, correlationId: corr_9f1c2e7a } }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/sales/invoices/bulk:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Sales]
    summary: Bulk submit / cancel drafts
    operationId: bulkSalesInvoices
    x-permission: sales.invoice.submit
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/BulkRequest' }
          examples:
            submit: { summary: Submit selected drafts, value: { ids: [inv_01j8k3, inv_01j8k7, inv_01j8k9], action: submit } }
            cancel: { summary: Cancel selected drafts, value: { ids: [inv_01j9a0], action: cancel, reason: Created in error during migration } }
    responses:
      '200':
        description: Per-id results
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/BulkResult' }
            examples:
              allSucceeded: { summary: All submitted, value: { requested: 2, succeeded: 2, failed: 0, results: [{ id: inv_01j8k3, ok: true, status: Submitted }, { id: inv_01j8k7, ok: true, status: Posted }] } }
              partialFailure: { $ref: '../components/examples/common.yaml#/BulkPartialFailure' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/sales/invoices/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Sales]
    summary: Get a sales invoice
    description: '`expand=journal,openItems,approval,attachments,receipts,creditNotes` embeds related objects.'
    operationId: getSalesInvoice
    x-permission: sales.invoice.view
    parameters:
      - $ref: '../components/parameters.yaml#/Expand'
    responses:
      '200':
        description: Invoice
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/SalesInvoice' }
            examples:
              draft: { $ref: '../components/examples/sales.yaml#/SalesInvoiceDraft' }
              posted: { $ref: '../components/examples/sales.yaml#/SalesInvoicePosted' }
              usdExport: { $ref: '../components/examples/sales.yaml#/SalesInvoiceUsd' }
              reversed: { $ref: '../components/examples/sales.yaml#/SalesInvoiceReversed' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Sales]
    summary: Edit a Draft / Returned / Rejected invoice (autosave)
    description: Approved invoices whose `materialChangeFields` change go back to Draft and need re-submission. Posted invoices are immutable (`409 INVALID_STATE`).
    operationId: updateSalesInvoice
    x-permission: sales.invoice.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/sales.yaml#/SalesInvoicePatch' }
          examples:
            fieldsOnly: { summary: Reference + due date, value: { expectedVersion: 1, reference: PO-ARL-2291-A, dueDate: '2026-10-20' } }
            replaceLines: { summary: Replace lines, value: { expectedVersion: 1, lines: [{ id: ln_1, itemId: item_stl4, qty: 1200, rate: 58, taxRateId: tax_gst18, warehouseId: wh_main, batch: B-2409-07 }] } }
            addTds: { summary: Add customer TDS section, value: { expectedVersion: 1, tdsSectionId: tds_194c } }
    responses:
      '200':
        description: Updated (totals recomputed)
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/SalesInvoice' }
            examples:
              updated: { $ref: '../components/examples/sales.yaml#/SalesInvoiceDraft' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
  delete:
    tags: [Sales]
    summary: Delete a Draft invoice
    operationId: deleteSalesInvoice
    x-permission: sales.invoice.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/sales/invoices/{id}/submit:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Sales]
    summary: Submit for approval — or post directly when no rule applies
    description: |
      Validates, checks the period, runs the credit check (`Block` → `422 CREDIT_BLOCK`; `Override` → exception flag on the
      approval) and the duplicate-reference rule, then resolves the `Sales Invoice` workflow:
      - rule matched → `outcome: routed-for-approval`, invoice `Submitted`, `approval` returned;
      - no rule → `outcome: posted`, identical effects to `POST …/post` (number, journal, stock, open item, statutory pending).
    operationId: submitSalesInvoice
    x-permission: sales.invoice.submit
    x-idempotent: true
    x-workflow-doc-type: Sales Invoice
    x-events: [DocumentSubmitted, DocumentPosted, InvoicePosted, JournalPosted, StockMoved]
    x-frd: [FR-SAL-033, FR-WFL-001]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Outcome
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/InvoiceSubmitResult' }
            examples:
              routedForApproval:
                summary: outcome = routed-for-approval (rule WF-SI-100K matched)
                value:
                  outcome: routed-for-approval
                  invoice: { id: inv_01j8k3, companyId: co_acme, number: DRAFT-8821, docType: Sales Invoice, date: '2026-09-13', dueDate: '2026-10-13', branchId: br_ho, status: Submitted, currency: INR, rate: 1, partyType: Customer, partyId: cust_arlene, partyName: Arlene Traders, lines: [], totals: { subtotal: 100000, discount: 0, taxable: 100000, tax: 15480, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 115480, paid: 0, credited: 0, writtenOff: 0, due: 115480, baseTotal: 115480 }, submittedAt: '2026-09-12T15:10:00Z', submittedBy: Priya Sharma, approvalId: apr_6c1d, createdAt: '2026-09-12T15:02:00Z', updatedAt: '2026-09-12T15:10:00Z', version: 3 }
                  creditCheck: { ok: true, mode: Warn, exposure: 245000, limit: 500000, at: '2026-09-12T15:10:00Z' }
                  approval: { id: apr_6c1d, companyId: co_acme, docType: Sales Invoice, collection: salesInvoices, docId: inv_01j8k3, docNumber: DRAFT-8821, amount: 115480, currency: INR, branchId: br_ho, requesterId: usr_priya, requesterName: Priya Sharma, ruleId: wf_si_100k, ruleName: Sales invoices above ₹1 lakh, ruleVersion: 2, steps: [{ order: 1, name: Finance review, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, status: Pending, commentRequired: false, dueAt: '2026-09-13T15:10:00Z' }], currentStep: 0, status: Pending, submittedAt: '2026-09-12T15:10:00Z', history: [{ at: '2026-09-12T15:10:00Z', by: Priya Sharma, action: Submitted }], summary: 'Arlene Traders · ₹1,15,480', createdAt: '2026-09-12T15:10:00Z', updatedAt: '2026-09-12T15:10:00Z', version: 1 }
                  warnings: []
              postedDirectly:
                summary: outcome = posted (no rule) — journal + stock + open item
                value:
                  outcome: posted
                  invoice: { id: inv_01j8k7, companyId: co_acme, number: INV/2026-27/00045, docType: Sales Invoice, date: '2026-09-13', dueDate: '2026-10-13', branchId: br_ho, status: Posted, currency: INR, rate: 1, partyType: Customer, partyId: cust_vimal, partyName: Vimal Stores, lines: [], totals: { subtotal: 30000, discount: 0, taxable: 30000, tax: 1500, components: { CGST: 750, SGST: 750 }, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 31500, paid: 0, credited: 0, writtenOff: 0, due: 31500, baseTotal: 31500 }, journalId: jnl_01j8k8, journalNumber: JV/2026-27/00314, openItemId: oi_11, postedAt: '2026-09-13T09:12:04Z', postedBy: Priya Sharma, statutory: { eInvoiceStatus: Pending, ewbStatus: Not Applicable }, createdAt: '2026-09-13T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 3 }
                  creditCheck: { ok: true, mode: Warn, exposure: 31500, limit: 200000, at: '2026-09-13T09:12:04Z' }
                  journals:
                    - { id: jnl_01j8k8, companyId: co_acme, number: JV/2026-27/00314, date: '2026-09-13', period: '2026-09', fy: '2026-27', branchId: br_ho, currency: INR, rate: 1, status: Posted, type: Auto, sourceType: Sales Invoice, sourceId: inv_01j8k7, sourceNumber: INV/2026-27/00045, narration: Sales invoice INV/2026-27/00045 · Vimal Stores, lines: [{ id: j1, accountId: acc_1100, accountCode: '1100', accountName: Accounts Receivable, dr: 31500, cr: 0, drBase: 31500, crBase: 0, partyType: Customer, partyId: cust_vimal, partyName: Vimal Stores, dimensions: {} }, { id: j2, accountId: acc_4000, accountCode: '4000', accountName: Sales, dr: 0, cr: 30000, drBase: 0, crBase: 30000, dimensions: {} }, { id: j3, accountId: acc_2300, accountCode: '2300', accountName: GST Output CGST, dr: 0, cr: 750, drBase: 0, crBase: 750, dimensions: {}, taxComponent: CGST }, { id: j4, accountId: acc_2301, accountCode: '2301', accountName: GST Output SGST, dr: 0, cr: 750, drBase: 0, crBase: 750, dimensions: {}, taxComponent: SGST }], totalDr: 31500, totalCr: 31500, idempotencyKey: 'inv:inv_01j8k7:post', postedAt: '2026-09-13T09:12:04Z', postedBy: Priya Sharma, correlationId: corr_k7, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }
