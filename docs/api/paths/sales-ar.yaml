                    - { id: jnl_01j9x2, companyId: co_acme, number: JV/2026-27/00330, date: '2026-09-13', period: '2026-09', fy: '2026-27', branchId: br_ho, currency: INR, rate: 1, status: Posted, type: Reversal, sourceType: Sales Invoice, sourceId: inv_01j8k3, sourceNumber: INV/2026-27/00042, narration: Reversal of JV/2026-27/00311, lines: [], totalDr: 115480, totalCr: 115480, reversalOfId: jnl_01j8k4, reversalReason: Customer returned the full consignment on 12 Sep (RMA-118), postedAt: '2026-09-13T11:00:00Z', postedBy: Rahul Mehta, correlationId: corr_9f1c2e7a, createdAt: '2026-09-13T11:00:00Z', updatedAt: '2026-09-13T11:00:00Z', version: 1 }
