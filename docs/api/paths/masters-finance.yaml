/tax-rates/calculate:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Masters]
    summary: Try-it tax calculator
    description: Runs `engine.computeLineTax` with the tax context of the party / branch / place of supply (intra vs inter-state, treatment, reverse charge, inclusive pricing) and explains the result.
    operationId: calculateTax
    x-permission: taxation.returns.view
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/masters.yaml#/TaxCalcRequest' }
          examples:
