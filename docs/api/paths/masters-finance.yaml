      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Masters]
    summary: Create a tax rate
    description: Components must sum to `rate` (`422`). Output/input accounts must be Tax control accounts.
    operationId: createTaxRate
    x-permission: taxation.returns.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/masters.yaml#/TaxRateInput'
              - { required: [code, name, rate, components, type, treatment, effectiveFrom] }
