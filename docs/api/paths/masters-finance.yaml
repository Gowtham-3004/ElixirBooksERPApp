# Masters part 2 (tag: Masters): chart of accounts, dimensions, tax rates, TDS sections, currencies, exchange rates,
# simple masters (payment terms, UOMs, HSN, reason codes, salespersons), reference data, imports.

# ── chart of accounts ─────────────────────────────────────────────────────

/accounts:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Masters]
    summary: List accounts (chart of accounts)
    description: "Tabs → All · Assets · Liabilities · Equity · Income · Expenses (`type`) · Control (`isControl=true`) · Inactive. Query examples — `?type=Expense&groupId=grp_opex` · `?controlType=Bank` · `?postingAllowed=true` · `?q=receivable`."
    operationId: listAccounts
    x-permission: masters.accounts.view
    x-frd: [FR-ACC-001]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: type, in: query, schema: { type: string, enum: [Asset, Liability, Equity, Income, Expense] } }
      - { name: groupId, in: query, schema: { type: string } }
      - { name: isControl, in: query, schema: { type: boolean } }
      - { name: controlType, in: query, schema: { type: string, enum: [AR, AP, Bank, Cash, Inventory, Tax, Employee, FixedAsset, WIP] } }
      - { name: postingAllowed, in: query, schema: { type: boolean } }
      - { name: withBalances, in: query, schema: { type: boolean, default: true } }
    responses:
      '200':
        description: Accounts
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/masters.yaml#/Account' } }
                    groups: { type: array, items: { $ref: '../components/schemas/masters.yaml#/AccountGroup' } }
            examples:
              firstPage: { summary: Excerpt with groups, value: { data: [{ id: acc_1100, companyId: co_acme, code: '1100', name: Accounts Receivable, groupId: grp_ca, groupName: Current assets, type: Asset, normalBalance: Dr, isControl: true, controlType: AR, postingAllowed: true, currencyBehaviour: Any, requiredDimensions: [], prohibitedDimensions: [], status: Active, balance: 1264000, hasPostings: true, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }, { id: acc_1310, companyId: co_acme, code: '1310', name: HDFC Bank — Current, groupId: grp_ca, groupName: Current assets, type: Asset, normalBalance: Dr, isControl: true, controlType: Bank, postingAllowed: true, currencyBehaviour: Base, requiredDimensions: [], prohibitedDimensions: [], status: Active, isBank: true, bankDetails: { bankName: HDFC Bank, accountNumber: '50200012344412', ifsc: HDFC0000240, branch: Nariman Point, currency: INR }, balance: 3120400, hasPostings: true, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }], groups: [{ id: grp_ca, companyId: co_acme, code: CA, name: Current assets, type: Asset, order: 10, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }], meta: { nextCursor: null, limit: 25, total: 62, counts: { All: 62, Assets: 18, Liabilities: 14, Equity: 3, Income: 6, Expenses: 21, Control: 12, Inactive: 2 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Masters]
    summary: Create an account
    description: Duplicate rule on `code`. Header (non-posting) accounts set `postingAllowed=false`. Control accounts require `controlType`.
    operationId: createAccount
    x-permission: masters.accounts.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/masters.yaml#/AccountInput'
              - { required: [code, name, type, normalBalance] }
          examples:
            expense: { summary: Expense with required dimension, value: { code: '5540', name: Software subscriptions, groupId: grp_opex, type: Expense, normalBalance: Dr, isControl: false, postingAllowed: true, currencyBehaviour: Base, requiredDimensions: [Department] } }
            bank: { summary: Bank account (control), value: { code: '1330', name: Axis Bank — Current, groupId: grp_ca, type: Asset, normalBalance: Dr, isControl: true, controlType: Bank, postingAllowed: true, currencyBehaviour: Base, isBank: true, bankDetails: { bankName: Axis Bank, accountNumber: '917020012345678', ifsc: UTIB0000012, branch: Fort, currency: INR }, openingBalance: 0 } }
            usdBank: { summary: USD (fixed-currency) EEFC account, value: { code: '1340', name: HDFC EEFC USD, groupId: grp_ca, type: Asset, normalBalance: Dr, isControl: true, controlType: Bank, postingAllowed: true, currencyBehaviour: Fixed, fixedCurrency: USD, isBank: true } }
            header: { summary: Header (no posting), value: { code: '5000-H', name: Cost of sales (header), groupId: grp_cogs, type: Expense, normalBalance: Dr, isControl: false, postingAllowed: false } }
    responses:
      '201':
        description: Account
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Account' }
            examples:
              created: { $ref: '../components/examples/masters.yaml#/AccountTravel' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/accounts/bulk:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Masters]
    summary: Bulk activate / deactivate accounts
    operationId: bulkAccounts
    x-permission: masters.accounts.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/BulkRequest' }
          examples:
            deactivate: { summary: Deactivate unused accounts, value: { ids: [acc_5590, acc_4100], action: deactivate } }
    responses:
      '200':
        description: Per-id results
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/BulkResult' }
            examples:
              allSucceeded: { $ref: '../components/examples/common.yaml#/BulkAllSucceeded' }
              partialFailure: { summary: Control account refused, value: { requested: 2, succeeded: 1, failed: 1, results: [{ id: acc_5590, ok: true, status: Inactive }, { id: acc_1100, ok: false, code: INVALID_STATE, message: Control accounts referenced in defaults cannot be deactivated }] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/accounts/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Masters]
    summary: Get an account
    operationId: getAccount
    x-permission: masters.accounts.view
    responses:
      '200':
        description: Account
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Account' }
            examples:
              control: { $ref: '../components/examples/masters.yaml#/AccountAR' }
              expense: { $ref: '../components/examples/masters.yaml#/AccountTravel' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Masters]
    summary: Update an account
    description: '`type`, `normalBalance`, `controlType` and `currencyBehaviour` are locked once postings exist (`409 INVALID_STATE`); `openingBalance` is locked once opening balances are posted.'
    operationId: updateAccount
    x-permission: masters.accounts.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/masters.yaml#/AccountPatch' }
          examples:
            dimensions: { summary: Require a dimension, value: { expectedVersion: 2, requiredDimensions: [Department, CostCentre] } }
            rename: { summary: Rename + regroup, value: { expectedVersion: 2, name: Travel & conveyance, groupId: grp_opex } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Account' }
            examples:
              updated: { $ref: '../components/examples/masters.yaml#/AccountTravel' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
  delete:
    tags: [Masters]
    summary: Delete an account (no postings, not a default/control)
    operationId: deleteAccount
    x-permission: masters.accounts.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/accounts/{id}/status:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Masters]
    summary: Activate / deactivate an account
    operationId: setAccountStatus
    x-permission: masters.accounts.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [status], properties: { status: { $ref: '../components/schemas/masters.yaml#/MasterStatus' } } }
          examples:
            deactivate: { summary: Deactivate, value: { status: Inactive } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Account' }
            examples:
              updated: { $ref: '../components/examples/masters.yaml#/AccountTravel' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/accounts/{id}/ledger:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Masters]
    summary: Account ledger (opening, movements, closing)
    operationId: getAccountLedger
    x-permission: accounting.ledger.view
    parameters:
      - $ref: '../components/parameters.yaml#/ReportFrom'
      - $ref: '../components/parameters.yaml#/ReportTo'
      - $ref: '../components/parameters.yaml#/BranchFilter'
      - $ref: '../components/parameters.yaml#/DimensionType'
      - $ref: '../components/parameters.yaml#/DimensionId'
    responses:
      '200':
        description: Ledger
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/LedgerResponse' }
            examples:
              ledger: { summary: AR ledger for Sep, value: { accountId: acc_1100, accountCode: '1100', accountName: Accounts Receivable, from: '2026-09-01', to: '2026-09-30', opening: 1196000, closing: 1264000, totalDebit: 118000, totalCredit: 50000, rows: [{ date: '2026-09-02', journalId: jnl_00298, journalNumber: JV/2026-27/00298, sourceType: Receipt, sourceId: rcp_00201, sourceNumber: RCP/2026-27/00201, narration: Receipt from Arlene Traders, partyName: Arlene Traders, dimensions: {}, debit: 0, credit: 50000, balance: 1146000 }, { date: '2026-09-13', journalId: jnl_01j8k4, journalNumber: JV/2026-27/00311, sourceType: Sales Invoice, sourceId: inv_01j8k3, sourceNumber: INV/2026-27/00042, narration: Sales invoice INV/2026-27/00042, partyName: Arlene Traders, dimensions: {}, debit: 118000, credit: 0, balance: 1264000 }], scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { summary: No movements, value: { accountId: acc_4100, accountCode: '4100', accountName: Other income, from: '2026-09-01', to: '2026-09-30', opening: 0, closing: 0, totalDebit: 0, totalCredit: 0, rows: [], scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/account-groups:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Masters]
    summary: List account groups (tree)
    operationId: listAccountGroups
    x-permission: masters.accounts.view
    responses:
      '200':
        description: Groups
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/masters.yaml#/AccountGroup' } } } }
            examples:
              tree: { summary: Excerpt, value: { data: [{ id: grp_assets, companyId: co_acme, code: A, name: Assets, type: Asset, order: 1, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }, { id: grp_ca, companyId: co_acme, code: CA, name: Current assets, parentId: grp_assets, type: Asset, order: 10, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }, { id: grp_opex, companyId: co_acme, code: OPEX, name: Operating expenses, type: Expense, order: 50, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Masters]
    summary: Create an account group
    operationId: createAccountGroup
    x-permission: masters.accounts.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/masters.yaml#/AccountGroupInput'
              - { required: [code, name, type] }
