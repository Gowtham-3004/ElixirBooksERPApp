    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Masters]
    summary: List exchange rates
    description: Tabs → All · Pending approval · Approved · Rejected. Query examples — `?base=USD&quote=INR` · `?type=Closing` · `?effectiveFrom=2026-09-01&effectiveTo=2026-09-30` · `?status=Pending`.
    operationId: listExchangeRates
    x-permission: masters.accounts.view
    x-frd: [FR-FX-001, FR-FX-002]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - { name: base, in: query, schema: { type: string } }
      - { name: quote, in: query, schema: { type: string } }
      - { name: type, in: query, schema: { type: string, enum: [Spot, Closing, Average, Manual, Historical, Imported] } }
      - { name: status, in: query, schema: { type: string, enum: [Pending, Approved, Rejected] } }
      - { name: effectiveFrom, in: query, schema: { type: string, format: date } }
      - { name: effectiveTo, in: query, schema: { type: string, format: date } }
    responses:
      '200':
        description: Rates
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/masters.yaml#/ExchangeRate' } }
            examples:
              firstPage: { summary: Approved + pending, value: { data: [{ id: fx_usd_inr_20260912, companyId: co_acme, base: USD, quote: INR, rate: 83.42, direction: Multiply, type: Closing, effectiveAt: '2026-09-12', source: RBI reference rate, status: Approved, approvedBy: system, createdAt: '2026-09-12T18:00:00Z', updatedAt: '2026-09-12T18:00:00Z', version: 1 }, { id: fx_usd_inr_manual_1, companyId: co_acme, base: USD, quote: INR, rate: 83.9, direction: Multiply, type: Manual, effectiveAt: '2026-09-13', source: Bank deal slip 4471, reason: Forward contract rate for the Sep shipment, status: Pending, approvalId: apr_fx_1, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }], meta: { nextCursor: null, limit: 25, total: 2, counts: { All: 210, 'Pending approval': 1, Approved: 208, Rejected: 1 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Masters]
    summary: Add a rate
    description: Manual and Imported rates are inserted `Pending` and routed through the `Exchange Rate` workflow; provider rates (Spot / Closing / Average) are Approved on insert. One rate per pair + type + date.
    operationId: createExchangeRate
    x-permission: masters.accounts.create
    x-workflow-doc-type: Exchange Rate
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/masters.yaml#/ExchangeRateInput' }
          examples:
