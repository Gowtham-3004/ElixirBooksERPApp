            exempt: { summary: Exempt, value: { code: EXEMPT, name: Exempt supply, rate: 0, components: [], type: GST, treatment: Exempt, effectiveFrom: '2017-07-01' } }
            vat: { summary: UAE VAT 5%, value: { code: VAT5, name: VAT 5%, rate: 5, components: [{ name: VAT, rate: 5 }], type: VAT, treatment: Taxable, effectiveFrom: '2018-01-01' } }
