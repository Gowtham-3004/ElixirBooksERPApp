      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── dimensions ────────────────────────────────────────────────────────────

/dimensions:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Masters]
    summary: List dimensions
    description: Query examples — `?type=Department` · `?status=Active` · `?parentId=dim_dept_sales`.
    operationId: listDimensions
    x-permission: masters.accounts.view
    parameters:
      - $ref: '../components/parameters.yaml#/DimensionType'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: parentId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/Q'
    responses:
      '200':
        description: Dimensions
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/masters.yaml#/Dimension' } } } }
            examples:
              departments: { summary: Departments, value: { data: [{ id: dim_dept_sales, companyId: co_acme, type: Department, code: SALES, name: Sales, status: Active, color: '#0ea5e9', createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }, { id: dim_dept_fin, companyId: co_acme, type: Department, code: FIN, name: Finance, status: Active, color: '#16a34a', createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }] } }
              none: { summary: None, value: { data: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Masters]
    summary: Create a dimension value
    operationId: createDimension
    x-permission: masters.accounts.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/masters.yaml#/DimensionInput'
              - { required: [type, code, name] }
          examples:
            department: { summary: Department, value: { type: Department, code: MKT, name: Marketing, color: '#f59e0b' } }
            costCentreChild: { summary: Cost centre under a parent, value: { type: CostCentre, code: CC-MUM-SALES, name: Mumbai sales, parentId: dim_cc_mum } }
    responses:
      '201':
        description: Dimension
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Dimension' }
            examples:
              created: { summary: Created, value: { id: dim_dept_mkt, companyId: co_acme, type: Department, code: MKT, name: Marketing, status: Active, color: '#f59e0b', createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/dimensions/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Masters]
    summary: Get a dimension
    operationId: getDimension
    x-permission: masters.accounts.view
    responses:
      '200':
        description: Dimension
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Dimension' }
            examples:
              dept: { summary: Department, value: { id: dim_dept_sales, companyId: co_acme, type: Department, code: SALES, name: Sales, status: Active, color: '#0ea5e9', createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Masters]
    summary: Update a dimension (rename / parent / colour / status)
    operationId: updateDimension
    x-permission: masters.accounts.edit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/masters.yaml#/DimensionInput'
              - $ref: '../components/schemas/common.yaml#/ExpectedVersion'
              - { properties: { status: { $ref: '../components/schemas/masters.yaml#/MasterStatus' } } }
          examples:
            rename: { summary: Rename, value: { expectedVersion: 1, name: Sales & Marketing } }
            deactivate: { summary: Deactivate, value: { expectedVersion: 1, status: Inactive } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Dimension' }
            examples:
              updated: { summary: Updated, value: { id: dim_dept_sales, companyId: co_acme, type: Department, code: SALES, name: Sales & Marketing, status: Active, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
  delete:
    tags: [Masters]
    summary: Delete an unused dimension value
    operationId: deleteDimension
    x-permission: masters.accounts.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── tax rates ─────────────────────────────────────────────────────────────

/tax-rates:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Masters]
    summary: List tax rates
    operationId: listTaxRates
    x-permission: taxation.returns.view
    parameters:
      - $ref: '../components/parameters.yaml#/Status'
      - { name: type, in: query, schema: { type: string, enum: [GST, VAT, None] } }
