            interState: { summary: Inter-state → IGST, value: { taxRateId: tax_gst18, qty: 10, rate: 1000, partyType: Customer, partyId: cust_globaltech, placeOfSupplyCode: '29' } }
            inclusive: { summary: Tax-inclusive retail price, value: { taxRateId: tax_gst12, qty: 1, rate: 1120, taxInclusive: true } }
            export: { summary: Overseas customer → zero-rated, value: { taxRateId: tax_gst18, qty: 100, rate: 60, partyType: Customer, partyId: cust_ustech } }
    responses:
      '200':
        description: Calculation
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/TaxCalcResult' }
            examples:
              intraState: { summary: CGST + SGST, value: { taxable: 9500, taxRate: 18, taxAmt: 1710, taxComponents: { CGST: 855, SGST: 855 }, amount: 11210, reverseCharge: false, explanation: ['Intra-state (27 → 27): CGST 9% + SGST 9%', 'Customer is Registered — taxable', 'Discount 5% applied before tax'] } }
              interState: { summary: IGST, value: { taxable: 10000, taxRate: 18, taxAmt: 1800, taxComponents: { IGST: 1800 }, amount: 11800, reverseCharge: false, explanation: ['Inter-state (27 → 29): IGST 18%'] } }
              inclusive: { summary: Backed out of inclusive price, value: { taxable: 1000, taxRate: 12, taxAmt: 120, taxComponents: { CGST: 60, SGST: 60 }, amount: 1120, reverseCharge: false, explanation: ['Tax-inclusive: 1120 ÷ 1.12 = 1000 taxable'] } }
              zeroRated: { summary: Export zero-rated, value: { taxable: 6000, taxRate: 0, taxAmt: 0, taxComponents: {}, amount: 6000, reverseCharge: false, explanation: ['Customer treatment Overseas — zero-rated export (LUT)'] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/tax-rates/{id}:
