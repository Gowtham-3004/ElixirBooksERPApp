/import-templates/{entity}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - { name: entity, in: path, required: true, schema: { type: string, enum: [customers, suppliers, items, accounts, price-list-entries, exchange-rates, opening-balances, timesheets, usage-records, bank-statements, budgets] }, example: customers }
  get:
    tags: [Masters]
    summary: Import template (columns, validation, sample CSV)
    operationId: getImportTemplate
    x-permission: masters.customers.view
    x-frd: [FR-IMP-001]
    responses:
      '200':
        description: Template
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/ImportTemplate' }
            examples:
              customers: { summary: Customers, value: { entity: customers, columns: [{ field: code, label: Code, required: false, type: string }, { field: name, label: Name, required: true, type: string }, { field: gstin, label: GSTIN, required: false, type: string }, { field: taxTreatment, label: Tax treatment, required: false, type: string, allowed: [Registered, Unregistered, Composition, SEZ, Export, Overseas, Deemed Export] }, { field: state, label: State, required: false, type: string }, { field: creditLimit, label: Credit limit, required: false, type: number }], duplicateKeys: [gstin], sample: "code,name,gstin,taxTreatment,state,creditLimit\nC-0101,Arlene Traders,27AAPFU0939F1ZV,Registered,Maharashtra,500000" } }
              items: { summary: Items, value: { entity: items, columns: [{ field: code, label: SKU / code, required: true, type: string }, { field: name, label: Name, required: true, type: string }, { field: type, label: Type, required: false, allowed: [Goods, Service, Consumable, Asset, Raw Material, Finished Good, Semi-Finished] }, { field: uom, label: Base UOM, required: true }, { field: hsn, label: HSN / SAC, required: false }, { field: taxRate, label: Tax rate code, required: false }, { field: salesPrice, label: Sales price, required: false, type: number }], duplicateKeys: [code], sample: "code,name,type,uom,hsn,taxRate,salesPrice\nSTL-4,Steel Rod 4mm,Raw Material,KG,7214,GST18,62" } }
          text/csv:
            schema: { type: string }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/imports:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Masters]
    summary: Import log
    operationId: listImports
    x-permission: masters.customers.view
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - { name: entity, in: query, schema: { type: string } }
      - { name: status, in: query, schema: { type: string, enum: [Dry-run, Committed, Failed, Cancelled] } }
    responses:
      '200':
        description: Imports
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/system.yaml#/ImportJob' } }
            examples:
              firstPage: { summary: Recent imports, value: { data: [{ id: imp_7c1a, companyId: co_acme, entity: customers, fileName: customers-sep.csv, fingerprint: 'sha256:9f8e2b', rows: 120, valid: 117, errors: 2, duplicates: 1, status: Committed, errorRows: [], summary: { created: 110, updated: 7, skipped: 3 }, committedAt: '2026-09-13T09:20:00Z', by: Priya Sharma, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:20:00Z', version: 2 }], meta: { nextCursor: null, limit: 25, total: 6 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Masters]
    summary: Upload a CSV and dry-run it
    description: |
      Multipart upload → parse → apply `mapping` (CSV column → field) → validate every row (required, format, references,
      duplicates against existing data and within the file) → returns an `ImportJob` in `Dry-run` with per-row errors.
      Nothing is written until `POST /imports/{id}/commit`. The same file (fingerprint) cannot be committed twice (`409 DUPLICATE`).
      `entity=bank-statements` additionally takes `bankAccountId` and `formatId`; `price-list-entries` takes `priceListId`.
    operationId: createImport
    x-permission: masters.customers.create
    x-idempotent: true
    x-frd: [FR-IMP-001]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [entity, file]
            properties:
              entity: { type: string, enum: [customers, suppliers, items, accounts, price-list-entries, exchange-rates, opening-balances, timesheets, usage-records, bank-statements, budgets] }
              file: { type: string, format: binary }
              mapping: { type: string, description: JSON object of CSV column → field; auto-detected from the header when omitted., example: '{"Customer Name":"name","GSTIN":"gstin"}' }
              updateExisting: { type: boolean, default: false, description: Update records matched by duplicate key instead of skipping them. }
              priceListId: { type: string }
              bankAccountId: { type: string }
              formatId: { type: string }
          examples:
            customers: { summary: Customers with explicit mapping, value: { entity: customers, file: '(binary customers-sep.csv)', mapping: '{"Customer Name":"name","GSTIN":"gstin","State":"state","Credit Limit":"creditLimit"}', updateExisting: 'true' } }
            items: { summary: Items (auto mapping), value: { entity: items, file: '(binary items.csv)' } }
            priceEntries: { summary: Price-list entries into a list, value: { entity: price-list-entries, file: '(binary wholesale-2026.csv)', priceListId: pl_wholesale } }
            bankStatement: { summary: Bank statement with saved format, value: { entity: bank-statements, file: '(binary hdfc-sep.csv)', bankAccountId: acc_1310, formatId: fmt_hdfc_csv } }
    responses:
      '201':
        description: Dry-run result
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/ImportJob' }
            examples:
              withErrors: { $ref: '../components/examples/masters.yaml#/ImportDryRun' }
              clean: { summary: All rows valid, value: { id: imp_7c1b, companyId: co_acme, entity: items, fileName: items.csv, fingerprint: 'sha256:c3d4', rows: 18, valid: 18, errors: 0, duplicates: 0, status: Dry-run, mapping: { code: code, name: name, type: type, uom: uom }, errorRows: [], by: Priya Sharma, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '413': { $ref: '../components/responses.yaml#/PayloadTooLarge' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/imports/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Masters]
    summary: Get an import job
    operationId: getImport
    x-permission: masters.customers.view
    responses:
      '200':
        description: Import job
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/ImportJob' }
            examples:
              dryRun: { $ref: '../components/examples/masters.yaml#/ImportDryRun' }
              committed: { $ref: '../components/examples/masters.yaml#/ImportCommitted' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  delete:
    tags: [Masters]
    summary: Cancel a dry-run
    operationId: cancelImport
    x-permission: masters.customers.create
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/imports/{id}/commit:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Masters]
    summary: Commit the valid rows of a dry-run
    description: Writes valid rows in one transaction (error rows are skipped, duplicates skipped or updated per `updateExisting`), audits the import and marks the job `Committed`. More than 2 000 rows → `202` background job.
    operationId: commitImport
    x-permission: masters.customers.create
    x-idempotent: true
    x-events: [DocumentCreated]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema: { type: object, properties: { skipErrorRows: { type: boolean, default: true }, updateExisting: { type: boolean } } }
          examples:
            default: { summary: Commit valid rows, value: {} }
            updateDuplicates: { summary: Update matched records, value: { updateExisting: true } }
    responses:
      '200':
        description: Committed (synchronous)
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/ImportJob' }
            examples:
              committed: { $ref: '../components/examples/masters.yaml#/ImportCommitted' }
      '202': { $ref: '../components/responses.yaml#/Accepted' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/imports/{id}/errors:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Masters]
    summary: Error rows (JSON or CSV download)
    operationId: getImportErrors
    x-permission: masters.customers.view
    parameters:
      - $ref: '../components/parameters.yaml#/Format'
    responses:
      '200':
        description: Errors
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/system.yaml#/ImportErrorRow' } } } }
            examples:
              rows: { summary: Three rows, value: { data: [{ row: 14, field: gstin, code: FORMAT, message: GSTIN must be 15 characters }, { row: 58, field: state, code: UNKNOWN, message: Unknown Indian state name }, { row: 77, field: gstin, code: DUPLICATE, message: Matches existing customer C-0101 Arlene Traders }] } }
              none: { summary: No errors, value: { data: [] } }
          text/csv:
            schema: { type: string }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
