              created: { summary: Created, value: { id: grp_opex_it, companyId: co_acme, code: OPEX-IT, name: IT & software, parentId: grp_opex, type: Expense, order: 55, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/account-groups/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  patch:
    tags: [Masters]
    summary: Update an account group
    operationId: updateAccountGroup
    x-permission: masters.accounts.edit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/masters.yaml#/AccountGroupInput'
              - $ref: '../components/schemas/common.yaml#/ExpectedVersion'
          examples:
            rename: { summary: Rename / reorder, value: { expectedVersion: 1, name: "IT, software & cloud", order: 56 } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/AccountGroup' }
            examples:
              updated: { summary: Updated, value: { id: grp_opex_it, companyId: co_acme, code: OPEX-IT, name: "IT, software & cloud", parentId: grp_opex, type: Expense, order: 56, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:15:00Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
