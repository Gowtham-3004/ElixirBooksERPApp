/purchase/grns:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Purchase]
    summary: List goods receipts
    description: "Tabs → All · Draft · Posted · With rejections (`withRejections=true`) · Reversed. Query examples — `?poId=po_00118` · `?warehouseId=wh_main` · `?qcStatus=Pending`."
    operationId: listGrns
    x-permission: purchase.grn.view
    x-frd: [FR-PUR-020]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: qcStatus, in: query, schema: { type: string, enum: [Pending, Accepted, Partial Accept, Rejected] } }
      - { name: withRejections, in: query, schema: { type: boolean } }
      - { name: poId, in: query, schema: { type: string } }
      - { name: invoiced, in: query, schema: { type: boolean } }
      - $ref: '../components/parameters.yaml#/PartyId'
      - $ref: '../components/parameters.yaml#/WarehouseId'
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
    responses:
      '200':
        description: GRNs
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/purchase.yaml#/Grn' } }
            examples:
              firstPage: { summary: GRNs, value: { data: [{ $ref: '#/components/examples/GrnPosted/value' }], meta: { nextCursor: null, limit: 25, total: 1, counts: { All: 80, Draft: 1, Posted: 76, 'With rejections': 6, Reversed: 3 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Purchase]
    summary: Create a GRN (against a PO or direct)
    description: Over-receipt beyond `overReceiptTolerancePct` → `422`. Batch/serial/expiry required per item tracking. `heldQty` keeps quantity in quarantine until a quality inspection completes.
    operationId: createGrn
    x-permission: purchase.grn.create
    x-events: [DocumentCreated]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/purchase.yaml#/GrnCreate' }
          examples:
            fromPoWithQc: { summary: Against PO with QC rejection, value: { date: '2026-09-12', poId: po_00118, warehouseId: wh_main, supplierChallan: DC-BS-4471, vehicleNo: GJ05AB9876, receivedBy: Suresh Patel, lines: [{ poLineId: ln_po_1, itemId: item_stl4, receivedQty: 3000, acceptedQty: 2950, rejectedQty: 50, disposition: Return to supplier, qcNote: 50 KG rusted, batch: B-2609-11, bin: A-01 }] } }
            direct: { summary: Direct receipt (no PO), value: { date: '2026-09-13', partyId: sup_kiranag, warehouseId: wh_andheri, supplierChallan: KA-118, lines: [{ itemId: item_chai, receivedQty: 500, rate: 88, taxRateId: tax_gst5, batch: CH-2609 }] } }
            serialHold: { summary: Serial-tracked with QC hold, value: { date: '2026-09-13', poId: po_00123, warehouseId: wh_main, lines: [{ poLineId: ln_po_20, itemId: item_frame, receivedQty: 10, acceptedQty: 0, rejectedQty: 0, heldQty: 10, serials: [SN-00201, SN-00202, SN-00203, SN-00204, SN-00205, SN-00206, SN-00207, SN-00208, SN-00209, SN-00210] }] } }
    responses:
      '201':
        description: Draft GRN
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/Grn' }
            examples:
              draft: { summary: Draft, value: { id: grn_00077, companyId: co_acme, number: DRAFT-GRN-77, docType: GRN, date: '2026-09-12', branchId: br_surat, status: Draft, qcStatus: Partial Accept, currency: INR, rate: 1, partyType: Supplier, partyId: sup_bharatsteel, partyName: Bharat Steel Industries, poId: po_00118, poNumber: PO/SRT/0118/26-27, warehouseId: wh_main, supplierChallan: DC-BS-4471, lines: [], totals: { subtotal: 141600, discount: 0, taxable: 141600, tax: 25488, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 167088, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 167088 }, createdAt: '2026-09-12T10:30:00Z', updatedAt: '2026-09-12T10:30:00Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Over-receipt / tracking rules
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              overReceipt: { summary: Beyond tolerance, value: { code: VALIDATION, message: 'Steel Rod 4mm: receiving 2500 exceeds pending 2000 + 5% tolerance', field: 'lines[0].receivedQty', correlationId: corr_9f1c2e7a } }
              batchRequired: { summary: Batch missing, value: { code: BATCH_REQUIRED, message: Steel Rod 4mm is batch-tracked — batch number required, field: 'lines[0].batch', correlationId: corr_9f1c2e7a } }
