# ── purchase orders ───────────────────────────────────────────────────────

/purchase/orders:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Purchase]
    summary: List purchase orders
    description: "Tabs → All · Draft · Awaiting approval (`status=Submitted`) · Approved · Partially received · Closed · Cancelled. Query examples — `?partyId=sup_bharatsteel` · `?status=Approved,Partially Received` · `?expectedDateTo=2026-09-20` · `?amountMin=100000`."
    operationId: listPurchaseOrders
    x-permission: purchase.order.view
    x-frd: [FR-PUR-010]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/PartyId'
      - { name: expectedDateTo, in: query, schema: { type: string, format: date } }
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
      - $ref: '../components/parameters.yaml#/AmountMin'
      - $ref: '../components/parameters.yaml#/AmountMax'
      - $ref: '../components/parameters.yaml#/BranchFilter'
      - $ref: '../components/parameters.yaml#/UpdatedSince'
    responses:
      '200':
        description: Purchase orders
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/purchase.yaml#/PurchaseOrder' } }
            examples:
              firstPage: { summary: Open POs, value: { data: [{ $ref: '#/components/examples/PurchaseOrderApproved/value' }], meta: { nextCursor: null, limit: 25, total: 1, counts: { All: 96, Draft: 3, 'Awaiting approval': 2, Approved: 8, 'Partially received': 4, Closed: 75, Cancelled: 4 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Purchase]
    summary: Create a purchase order (Draft)
    description: Purchase prices resolve from the supplier price list; tax context uses the supplier state (IGST for inter-state). Supplier must be Active (`409 PARTY_BLOCKED` otherwise).
    operationId: createPurchaseOrder
    x-permission: purchase.order.create
    x-events: [DocumentCreated]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/purchase.yaml#/PurchaseOrderCreate' }
          examples:
            goods: { summary: Stock purchase with expected dates, value: { partyId: sup_bharatsteel, date: '2026-09-13', expectedDate: '2026-09-25', warehouseId: wh_main, lines: [{ itemId: item_stl4, qty: 5000, rate: 48, taxRateId: tax_gst18, expectedDate: '2026-09-25' }, { itemId: item_stl6, qty: 2000, rate: 51, taxRateId: tax_gst18, expectedDate: '2026-09-30' }] } }
            service: { summary: Service PO (no stock), value: { partyId: sup_consult, date: '2026-09-13', lines: [{ itemId: item_consult, qty: 40, rate: 2000, taxRateId: tax_gst18, accountId: acc_5530, dimensions: { Department: dim_dept_fin } }] } }
            import: { summary: Import in USD, value: { partyId: sup_shenzhen, date: '2026-09-13', currency: USD, expectedDate: '2026-10-20', lines: [{ itemId: item_electrode, qty: 10000, rate: 0.35, taxRateId: tax_gst0 }], charges: [{ name: Sea freight, amount: 800, accountId: acc_5030 }], terms: FOB Shenzhen; 30% advance } }
            withCharges: { summary: With freight charge line and notes, value: { partyId: sup_globalpack, date: '2026-09-13', expectedDate: '2026-09-18', lines: [{ itemId: item_box, qty: 1000, rate: 25, taxRateId: tax_gst18 }], charges: [{ name: Freight, amount: 1500, taxRateId: tax_gst18, accountId: acc_5030 }], notes: Deliver before 10 am } }
    responses:
      '201':
        description: Draft PO
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/PurchaseOrder' }
            examples:
              draft: { summary: Draft, value: { id: po_00121, companyId: co_acme, number: DRAFT-PO-121, docType: Purchase Order, date: '2026-09-13', branchId: br_ho, status: Draft, currency: INR, rate: 1, partyType: Supplier, partyId: sup_bharatsteel, partyName: Bharat Steel Industries, expectedDate: '2026-09-25', warehouseId: wh_main, lines: [{ id: ln_po_1, itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, hsn: '7214', qty: 5000, uom: KG, rate: 48, discountPct: 0, discountAmt: 0, taxable: 240000, taxRateId: tax_gst18, taxRate: 18, taxAmt: 43200, taxComponents: { CGST: 21600, SGST: 21600 }, amount: 283200, warehouseId: wh_main, expectedDate: '2026-09-25', pendingQty: 5000 }], totals: { subtotal: 240000, discount: 0, taxable: 240000, tax: 43200, components: { CGST: 21600, SGST: 21600 }, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 283200, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 283200 }, amendments: [], fulfilment: { ordered: 5000, received: 0, accepted: 0, rejected: 0, invoiced: 0, returned: 0, pending: 5000 }, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
