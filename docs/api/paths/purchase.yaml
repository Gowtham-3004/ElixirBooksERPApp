# Purchase part 1 (tag: Purchase): requisitions, RFQs & quotes, purchase orders, GRNs. src/modules/purchase/actions.ts

# ── requisitions ──────────────────────────────────────────────────────────

/purchase/requisitions:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Purchase]
    summary: List requisitions
    description: "Tabs → All · Draft · Pending approval (`status=Submitted`) · Approved · Converted · Rejected. Query examples — `?requesterId=emp_005` · `?needByTo=2026-09-30` · `?status=Approved`."
    operationId: listRequisitions
    x-permission: purchase.requisition.view
    x-frd: [FR-PUR-001]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: requesterId, in: query, schema: { type: string } }
      - { name: needByTo, in: query, schema: { type: string, format: date } }
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
    responses:
      '200':
        description: Requisitions
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/purchase.yaml#/Requisition' } }
            examples:
              firstPage: { summary: Requisitions, value: { data: [{ $ref: '#/components/examples/RequisitionApproved/value' }], meta: { nextCursor: null, limit: 25, total: 1, counts: { All: 31, Draft: 2, 'Pending approval': 1, Approved: 4, Converted: 22, Rejected: 2 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Purchase]
    summary: Create a requisition (Draft)
    operationId: createRequisition
    x-permission: purchase.requisition.create
    x-events: [DocumentCreated]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/purchase.yaml#/RequisitionCreate' }
          examples:
            stock: { summary: Stock replenishment, value: { date: '2026-09-13', needByDate: '2026-09-30', purpose: Q3 raw material top-up, department: dim_dept_ops, lines: [{ itemId: item_stl4, qty: 5000, rate: 48, purpose: Replenish Surat stock }] } }
            service: { summary: Service / free-text line, value: { date: '2026-09-13', needByDate: '2026-10-05', purpose: AMC for compressors, lines: [{ itemName: Compressor AMC 2026-27, qty: 1, uom: YR, rate: 60000, accountId: acc_5210 }] } }
    responses:
      '201':
        description: Draft requisition
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/Requisition' }
            examples:
              draft: { summary: Draft, value: { id: req_00032, companyId: co_acme, number: DRAFT-PR-32, docType: Requisition, date: '2026-09-13', branchId: br_surat, status: Draft, currency: INR, rate: 1, partyType: None, requesterId: emp_005, requesterName: Suresh Patel, department: dim_dept_ops, needByDate: '2026-09-30', purpose: Q3 raw material top-up, lines: [{ id: ln_pr_1, itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, qty: 5000, uom: KG, rate: 48, discountPct: 0, discountAmt: 0, taxable: 240000, taxRate: 0, taxAmt: 0, taxComponents: {}, amount: 240000, purpose: Replenish Surat stock }], totals: { subtotal: 240000, discount: 0, taxable: 240000, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 240000, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 240000 }, estimatedTotal: 240000, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/purchase/requisitions/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Purchase]
    summary: Get a requisition
    operationId: getRequisition
    x-permission: purchase.requisition.view
    responses:
      '200':
        description: Requisition
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/Requisition' }
            examples:
              approved: { $ref: '../components/examples/purchase.yaml#/RequisitionApproved' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Purchase]
    summary: Edit a Draft / Returned requisition
    operationId: updateRequisition
    x-permission: purchase.requisition.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/purchase.yaml#/RequisitionPatch' }
          examples:
            needBy: { summary: Change need-by date, value: { expectedVersion: 1, needByDate: '2026-10-05' } }
            lines: { summary: Replace lines, value: { expectedVersion: 1, lines: [{ itemId: item_stl4, qty: 6000, rate: 48 }, { itemId: item_stl6, qty: 2000, rate: 51 }] } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/Requisition' }
            examples:
              updated: { $ref: '../components/examples/purchase.yaml#/RequisitionApproved' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
  delete:
    tags: [Purchase]
    summary: Delete a Draft requisition
    operationId: deleteRequisition
    x-permission: purchase.requisition.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/purchase/requisitions/{id}/submit:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Purchase]
    summary: Submit (workflow or auto-approve)
    operationId: submitRequisition
    x-permission: purchase.requisition.submit
    x-idempotent: true
    x-workflow-doc-type: Requisition
    x-events: [DocumentSubmitted, DocumentApproved]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Outcome
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/purchase.yaml#/Requisition' }
            examples:
              routed: { summary: outcome = routed-for-approval, value: { document: { id: req_00032, companyId: co_acme, number: PR/2026-27/00032, docType: Requisition, date: '2026-09-13', branchId: br_surat, status: Submitted, currency: INR, rate: 1, partyType: None, requesterName: Suresh Patel, needByDate: '2026-09-30', lines: [], totals: { subtotal: 240000, discount: 0, taxable: 240000, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 240000, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 240000 }, approvalId: apr_pr_32, submittedAt: '2026-09-13T09:12:04Z', createdAt: '2026-09-13T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 2 }, outcome: routed-for-approval, approval: { id: apr_pr_32, companyId: co_acme, docType: Requisition, collection: requisitions, docId: req_00032, docNumber: PR/2026-27/00032, amount: 240000, currency: INR, branchId: br_surat, requesterId: usr_suresh, requesterName: Suresh Patel, steps: [{ order: 1, name: Purchase manager, approverType: Role, approverRef: role_purchmgr, approverLabel: Purchase Manager, status: Pending, commentRequired: false }], currentStep: 0, status: Pending, submittedAt: '2026-09-13T09:12:04Z', history: [], createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }, warnings: [] } }
              approved: { summary: outcome = approved (no rule), value: { document: { $ref: '#/components/examples/RequisitionApproved/value' }, outcome: approved, warnings: [] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/purchase/requisitions/{id}/decide:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Purchase]
    summary: Approve / reject directly (shortcut for the approval action)
    operationId: decideRequisition
    x-permission: purchase.requisition.approve
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/purchase.yaml#/RequisitionDecision' }
          examples:
            approve: { summary: Approve, value: { decision: Approved, comment: Within Q3 budget } }
            reject: { summary: Reject, value: { decision: Rejected, comment: Stock on hand covers Q3 — resubmit in Oct } }
    responses:
      '200':
        description: Decided
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/Requisition' }
            examples:
              approved: { $ref: '../components/examples/purchase.yaml#/RequisitionApproved' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/purchase/requisitions/{id}/cancel:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Purchase]
    summary: Cancel (not when Converted)
    operationId: cancelRequisition
    x-permission: purchase.requisition.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            cancel: { summary: Cancel, value: { reason: Requirement covered by existing PO/SRT/0118 } }
    responses:
      '200':
        description: Cancelled
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/Requisition' }
            examples:
              cancelled: { summary: Cancelled, value: { id: req_00032, companyId: co_acme, number: PR/2026-27/00032, docType: Requisition, date: '2026-09-13', branchId: br_surat, status: Cancelled, currency: INR, rate: 1, partyType: None, requesterName: Suresh Patel, needByDate: '2026-09-30', lines: [], totals: { subtotal: 0, discount: 0, taxable: 0, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 0, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 0 }, cancelReason: Requirement covered by existing PO/SRT/0118, createdAt: '2026-09-13T09:00:00Z', updatedAt: '2026-09-13T10:00:00Z', version: 3 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/purchase/requisitions/{id}/convert-to-po:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Purchase]
    summary: Convert an Approved requisition into a Draft PO
    operationId: convertRequisitionToPo
    x-permission: purchase.order.create
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [supplierId], properties: { supplierId: { type: string }, expectedDate: { type: string, format: date }, warehouseId: { type: string } } }
          examples:
            supplier: { summary: Choose supplier, value: { supplierId: sup_bharatsteel, expectedDate: '2026-09-25' } }
    responses:
      '201':
        description: Draft PO
        content:
          application/json:
            schema:
              type: object
              required: [requisition, order]
              properties:
                requisition: { $ref: '../components/schemas/purchase.yaml#/Requisition' }
                order: { $ref: '../components/schemas/purchase.yaml#/PurchaseOrder' }
            examples:
              converted: { summary: Converted, value: { requisition: { id: req_00031, companyId: co_acme, number: PR/2026-27/00031, docType: Requisition, date: '2026-09-10', branchId: br_surat, status: Converted, currency: INR, rate: 1, partyType: None, requesterName: Suresh Patel, needByDate: '2026-09-30', lines: [], totals: { subtotal: 240000, discount: 0, taxable: 240000, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 240000, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 240000 }, convertedToId: po_00118, convertedToNumber: DRAFT-PO-118, createdAt: '2026-09-10T09:00:00Z', updatedAt: '2026-09-11T09:00:00Z', version: 4 }, order: { id: po_00118, companyId: co_acme, number: DRAFT-PO-118, docType: Purchase Order, date: '2026-09-11', branchId: br_surat, status: Draft, currency: INR, rate: 1, partyType: Supplier, partyId: sup_bharatsteel, partyName: Bharat Steel Industries, expectedDate: '2026-09-25', requisitionId: req_00031, requisitionNumber: PR/2026-27/00031, lines: [], totals: { subtotal: 240000, discount: 0, taxable: 240000, tax: 43200, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 283200, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 283200 }, amendments: [], createdAt: '2026-09-11T09:00:00Z', updatedAt: '2026-09-11T09:00:00Z', version: 1 } } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── RFQs ──────────────────────────────────────────────────────────────────

/purchase/rfqs:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Purchase]
    summary: List RFQs
    description: Tabs → All · Draft · Sent · Quoted · Awarded.
    operationId: listRfqs
    x-permission: purchase.requisition.view
    x-frd: [FR-PUR-002]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/SupplierId'
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
    responses:
      '200':
        description: RFQs
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/purchase.yaml#/Rfq' } }
            examples:
              firstPage: { summary: RFQs, value: { data: [{ id: rfq_00008, companyId: co_acme, number: RFQ/2026-27/00008, docType: RFQ, date: '2026-09-05', dueDate: '2026-09-10', branchId: br_ho, status: Quoted, currency: INR, rate: 1, partyType: None, supplierIds: [sup_bharatsteel, sup_national], sentAt: '2026-09-05T11:00:00Z', requisitionId: req_00031, requisitionNumber: PR/2026-27/00031, lines: [], totals: { subtotal: 0, discount: 0, taxable: 0, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 0, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 0 }, quoteCount: 2, createdAt: '2026-09-05T10:00:00Z', updatedAt: '2026-09-09T10:00:00Z', version: 4 }], meta: { nextCursor: null, limit: 25, total: 1, counts: { All: 8, Draft: 1, Sent: 1, Quoted: 2, Awarded: 4 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
