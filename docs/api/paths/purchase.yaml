      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Purchase]
    summary: Create an RFQ (Draft)
    operationId: createRfq
    x-permission: purchase.requisition.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/purchase.yaml#/RfqCreate' }
          examples:
            fromRequisition: { summary: From an approved requisition, value: { date: '2026-09-13', dueDate: '2026-09-18', requisitionId: req_00031, supplierIds: [sup_bharatsteel, sup_national], lines: [{ itemId: item_stl4, qty: 5000 }] } }
            adHoc: { summary: "Ad-hoc, three suppliers", value: { date: '2026-09-13', dueDate: '2026-09-20', supplierIds: [sup_globalpack, sup_shree, sup_kiranag], lines: [{ itemId: item_box, qty: 10000 }, { itemId: item_crate, qty: 500 }], notes: Delivery to Surat; quote freight separately } }
    responses:
      '201':
        description: Draft RFQ
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/Rfq' }
            examples:
              draft: { summary: Draft, value: { id: rfq_00009, companyId: co_acme, number: DRAFT-RFQ-9, docType: RFQ, date: '2026-09-13', dueDate: '2026-09-18', branchId: br_ho, status: Draft, currency: INR, rate: 1, partyType: None, supplierIds: [sup_bharatsteel, sup_national], requisitionId: req_00031, requisitionNumber: PR/2026-27/00031, lines: [{ id: ln_rfq_1, itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, qty: 5000, uom: KG, rate: 0, discountPct: 0, discountAmt: 0, taxable: 0, taxRate: 0, taxAmt: 0, taxComponents: {}, amount: 0 }], totals: { subtotal: 0, discount: 0, taxable: 0, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 0, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 0 }, quoteCount: 0, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/purchase/rfqs/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Purchase]
    summary: Get an RFQ
    operationId: getRfq
    x-permission: purchase.requisition.view
    responses:
