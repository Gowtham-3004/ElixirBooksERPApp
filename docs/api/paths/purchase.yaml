/purchase/rfqs/{id}/send:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Purchase]
    summary: Send the RFQ to the suppliers (Draft → Sent)
    operationId: sendRfq
    x-permission: purchase.requisition.submit
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
