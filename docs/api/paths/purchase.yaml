            examples:
              sent: { summary: Sent to 2 suppliers, value: { document: { id: rfq_00009, companyId: co_acme, number: RFQ/2026-27/00009, docType: RFQ, date: '2026-09-13', dueDate: '2026-09-18', branchId: br_ho, status: Sent, currency: INR, rate: 1, partyType: None, supplierIds: [sup_bharatsteel, sup_national], sentAt: '2026-09-13T09:12:04Z', lines: [], totals: { subtotal: 0, discount: 0, taxable: 0, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 0, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 0 }, quoteCount: 0, createdAt: '2026-09-13T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 2 }, emails: [{ integrationLogId: ilog_email_r1, status: Queued, to: [sales@bharatsteel.example], sentAt: '2026-09-13T09:12:04Z' }, { integrationLogId: ilog_email_r2, status: Queued, to: [quotes@national.example], sentAt: '2026-09-13T09:12:04Z' }] } }
