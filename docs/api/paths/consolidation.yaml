# ── group intercompany view ───────────────────────────────────────────────

/reports/consolidation/intercompany:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Reports]
    summary: Intercompany documents across the tenant + due-to / due-from balances
    operationId: listGroupIntercompany
    x-permission: reports.cfo.view
    x-frd: [FR-CNS-005, FR-ORG-012]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - { name: matchStatus, in: query, schema: { type: string, enum: [Unmatched, Matched, Difference] } }
      - $ref: '../components/parameters.yaml#/AsOf'
    responses:
      '200':
        description: Documents + balances
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/accounting.yaml#/IntercompanyDoc' } }
                    dues: { type: array, items: { $ref: '../components/schemas/reports.yaml#/DueBalance' } }
            examples:
              rows: { summary: Docs + dues, value: { data: [{ $ref: '#/components/examples/IntercompanyInvoice/value' }], dues: [{ companyId: co_acme, companyName: Acme Industries, counterpartyId: co_gulf, counterpartyName: Acme Gulf FZE, receivable: 416000, payable: 0, currency: INR, receivableAccountId: acc_1170, payableAccountId: acc_2170 }, { companyId: co_gulf, companyName: Acme Gulf FZE, counterpartyId: co_acme, counterpartyName: Acme Industries, receivable: 0, payable: 18350, currency: AED, receivableAccountId: acc_gulf_ic_recv, payableAccountId: acc_gulf_ic_pay }], meta: { nextCursor: null, limit: 25, total: 7 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Reports]
    summary: Record an intercompany transaction from the group view (two balanced journals, one per company)
    operationId: postGroupIntercompany
    x-permission: reports.cfo.post
    x-idempotent: true
    x-events: [JournalPosted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/reports.yaml#/IcPostRequest' }
          examples:
            invoice: { summary: Invoice both sides, value: { type: Invoice, fromCompanyId: co_acme, toCompanyId: co_gulf, amount: 5000, currency: USD, date: '2026-09-13', reference: IC-INV-0017, narration: Shared-services fee Q2, postCounterparty: true } }
            payment: { summary: Settlement, value: { type: Payment, fromCompanyId: co_gulf, toCompanyId: co_acme, amount: 5000, currency: USD, date: '2026-09-30', reference: IC-PAY-0009, postCounterparty: true } }
    responses:
      '201':
        description: Document
        content:
          application/json:
            schema: { $ref: '../components/schemas/accounting.yaml#/IntercompanyDoc' }
            examples:
              matched: { $ref: '../components/examples/accounting.yaml#/IntercompanyInvoice' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Business rule
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              sameCompany: { summary: Same company both sides, value: { code: SAME_COMPANY, message: From and to must be different legal companies (FR-ORG-011), field: toCompanyId, correlationId: corr_9f1c2e7a } }
              accounts: { summary: IC accounts not configured, value: { code: INVALID_ACCOUNT, message: Acme Gulf FZE has no intercompany receivable/payable accounts, correlationId: corr_9f1c2e7a } }
              rate: { summary: Rate missing, value: { code: RATE_MISSING, message: No USD→AED rate on 2026-09-13, field: currency, correlationId: corr_9f1c2e7a } }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

/reports/consolidation/intercompany/{id}/match:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
