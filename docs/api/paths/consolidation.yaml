      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Final
        content:
          application/json:
            schema: { $ref: '../components/schemas/reports.yaml#/ConsolidationRun' }
            examples:
              final: { summary: Final, value: { id: cr_2609_1, companyId: co_acme, groupId: grp_acme, number: CR/2026-09/01, period: '2026-09', from: '2026-09-01', to: '2026-09-30', plBasis: YTD, currency: INR, accountingStandard: Ind AS, status: Final, runVersion: 1, companies: [], translatedLines: [], cta: -18400, ctaByCompany: { co_gulf: -18400 }, adjustments: [cj_0003], eliminations: [], totals: { CA: 61200000, FA: 18400000, CL: 24100000, EQ: 41000000, REV: 52300000, COGS: 30100000, OPEX: 13800000 }, createdBy: Priya Sharma, translatedAt: '2026-10-02T09:00:00Z', finalizedAt: '2026-10-05T10:00:00Z', finalizedBy: Rahul Mehta, booksAtTranslate: [{ companyId: co_acme, journals: 412, totalDr: 184300000, totalCr: 184300000, lastPostedAt: '2026-09-30T18:00:00Z', at: '2026-10-02T09:00:00Z' }], booksAtFinal: [{ companyId: co_acme, journals: 412, totalDr: 184300000, totalCr: 184300000, lastPostedAt: '2026-09-30T18:00:00Z', at: '2026-10-05T10:00:00Z' }], log: [{ at: '2026-10-02T09:00:00Z', by: Priya Sharma, action: translated }, { at: '2026-10-05T10:00:00Z', by: Rahul Mehta, action: finalized }], createdAt: '2026-10-02T09:00:00Z', updatedAt: '2026-10-05T10:00:00Z', version: 6 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: State conflict
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              notTranslated: { summary: Not translated, value: { code: INVALID_STATE, message: Only translated runs can be finalized (status Draft), correlationId: corr_9f1c2e7a } }
              booksChanged: { summary: Books changed since translation, value: { code: BOOKS_CHANGED, message: Legal books of Acme Gulf FZE changed since translation — re-translate before finalizing, details: { companies: [co_gulf] }, correlationId: corr_9f1c2e7a } }
      '422':
        description: Pending items
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              eliminations: { summary: Proposed eliminations, value: { code: PENDING_ELIMINATIONS, message: Accept or reject every proposed elimination before finalizing, details: { pending: [el_1] }, correlationId: corr_9f1c2e7a } }
              adjustments: { summary: Adjustments awaiting approval, value: { code: PENDING_APPROVAL, message: Consolidation adjustments are still awaiting approval, details: { journals: [CJ/2026-27/00004] }, correlationId: corr_9f1c2e7a } }

