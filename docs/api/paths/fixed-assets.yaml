    summary: Posted vendor-invoice lines not yet capitalised
    operationId: listCapitalizableLines
    x-permission: fixed-assets.asset.view
    parameters:
      - { name: capitalOnly, in: query, schema: { type: boolean, default: false } }
    responses:
      '200':
        description: Lines
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/fixed-assets.yaml#/CapitalizableLine' } } } }
            examples:
              lines: { summary: Two candidates, value: { data: [{ docId: vi_00204, docNumber: VI/2026-27/00204, docDate: '2026-09-08', supplierId: sup_precision, supplierName: Precision Tools Ltd, lineId: ln_vi_204_1, itemId: item_lathe, itemName: CNC lathe LX-200, accountId: acc_1650, qty: 1, amount: 1850000, capital: true }, { docId: vi_00206, docNumber: VI/2026-27/00206, docDate: '2026-09-09', supplierId: sup_office, supplierName: Office Mart, lineId: ln_vi_206_3, itemName: Stationery, accountId: acc_5450, qty: 10, amount: 4200, capital: false }] } }
              none: { summary: None, value: { data: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/fixed-assets/assets/capitalize:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Fixed Assets]
    summary: Capitalise an asset (manual, or from a vendor-invoice line)
    operationId: capitalizeAsset
    x-permission: fixed-assets.asset.create
    x-frd: [FR-AST-002]
    x-idempotent: true
    x-events: [DocumentCreated, JournalPosted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/fixed-assets.yaml#/CapitalizeRequest' }
          examples:
            fromVendorInvoice: { summary: From a posted vendor-invoice line (CWIP → PPE), value: { name: CNC lathe LX-200, categoryId: cat_pm, location: Pune plant — Bay 3, branchId: br_pune, custodianId: emp_suresh, acquisitionDate: '2026-09-08', capitalizationDate: '2026-09-10', inServiceDate: '2026-09-12', cost: 1850000, residual: 92500, serialNo: LX200-2026-0417, warrantyUntil: '2028-09-08', sourceType: Vendor Invoice, sourceId: vi_00204, lineId: ln_vi_204_1, postJournal: true } }
            manual: { summary: Manual (credit bank), value: { name: MacBook Pro 16 — Design, categoryId: cat_it, location: HO — Design, branchId: br_ho, custodianId: emp_neha, acquisitionDate: '2026-09-13', capitalizationDate: '2026-09-13', inServiceDate: '2026-09-13', cost: 245000, residual: 0, usefulLifeYears: 3, method: SLM, ratePct: 33.33, creditAccountId: acc_1310, dimensions: { Department: dim_design }, postJournal: true } }
            noJournal: { summary: Opening asset (books already carry it), value: { name: Office building — Andheri, categoryId: cat_bld, location: Andheri, branchId: br_andheri, acquisitionDate: '2019-06-01', capitalizationDate: '2019-06-01', inServiceDate: '2019-06-01', cost: 42000000, residual: 4200000, postJournal: false, notes: Opening accumulated set via opening balances } }
    responses:
      '201':
        description: Asset created (Active)
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/fixed-assets.yaml#/Asset' }
            examples:
              withJournal: { summary: Journal posted, value: { document: { $ref: '#/components/examples/AssetLathe/value' }, outcome: posted, journal: { id: jnl_fa_31, companyId: co_acme, number: JV/2026-27/00406, date: '2026-09-10', period: '2026-09', fy: '2026-27', branchId: br_pune, currency: INR, rate: 1, status: Posted, type: Auto, sourceType: Asset, sourceId: fa_0031, sourceNumber: FA/2026-27/00031, narration: Capitalisation FA/2026-27/00031 CNC lathe LX-200 from VI/2026-27/00204, lines: [{ id: j1, accountId: acc_1610, accountCode: '1610', accountName: Plant & machinery, dr: 1850000, cr: 0, drBase: 1850000, crBase: 0, dimensions: { Branch: br_pune } }, { id: j2, accountId: acc_1650, accountCode: '1650', accountName: Capital work in progress, dr: 0, cr: 1850000, drBase: 0, crBase: 1850000, dimensions: { Branch: br_pune } }], totalDr: 1850000, totalCr: 1850000, postedAt: '2026-09-13T09:12:04Z', postedBy: Priya Sharma, correlationId: corr_fa31, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }, warnings: [] } }
              noJournal: { summary: Registered only, value: { document: { $ref: '#/components/examples/AssetLathe/value' }, outcome: created, warnings: ['No journal posted — ensure the asset account already carries the cost'] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Conflict
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              lineUsed: { summary: Line already capitalised, value: { code: DUPLICATE, message: 'VI/2026-27/00204 line 1 is already capitalised as FA/2026-27/00031', details: { assetId: fa_0031 }, correlationId: corr_9f1c2e7a } }
      '422':
        description: Validation
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              residual: { summary: Residual ≥ cost, value: { code: VALIDATION, message: Residual value must be below cost, field: residual, correlationId: corr_9f1c2e7a } }
              category: { summary: No category, value: { code: VALIDATION, message: Choose an asset category, field: categoryId, correlationId: corr_9f1c2e7a } }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

