# ── depreciation runs ─────────────────────────────────────────────────────

/fixed-assets/depreciation-runs:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Fixed Assets]
    summary: Depreciation runs
    operationId: listDepreciationRuns
    x-permission: fixed-assets.depreciation.view
    x-frd: [FR-AST-003]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/FiscalYear'
    responses:
      '200':
        description: Runs
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/fixed-assets.yaml#/DepreciationRun' } }
            examples:
              firstPage: { summary: Runs, value: { data: [{ $ref: '#/components/examples/DepreciationRunSep/value' }], meta: { nextCursor: null, limit: 25, total: 6, counts: { Posted: 6, Reversed: 0, Draft: 0 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Fixed Assets]
    summary: Run depreciation for a period (dryRun previews; otherwise posts)
    description: One run per period; reverse the existing run before re-running (`409 DUPLICATE_PERIOD`). Journal — Dr depreciation expense (by asset dimensions) / Cr accumulated depreciation per category.
    operationId: createDepreciationRun
    x-permission: fixed-assets.depreciation.post
    x-idempotent: true
    x-events: [JournalPosted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/fixed-assets.yaml#/DepreciationRunRequest' }
          examples:
            preview: { summary: Preview, value: { period: '2026-10', dryRun: true } }
            post: { summary: Post, value: { period: '2026-10' } }
    responses:
      '200':
        description: Preview (dryRun)
        content:
          application/json:
            schema: { $ref: '../components/schemas/fixed-assets.yaml#/DepreciationRun' }
            examples:
              preview: { summary: Preview, value: { id: preview, companyId: co_acme, number: DEP/2026-27/00007, period: '2026-10', fy: '2026-27', status: Draft, lines: [{ assetId: fa_0031, assetNumber: FA/2026-27/00031, assetName: CNC lathe LX-200, categoryName: Plant & machinery, method: WDV, ratePct: 15, openingNbv: 1835630, depreciation: 23385, closingNbv: 1812245, daysInService: 31, daysInPeriod: 31, dimensions: { Branch: br_pune }, depreciationAccountId: acc_5700, accumulatedAccountId: acc_1690 }], total: 188900, assetCount: 31, createdAt: '2026-10-31T09:00:00Z', updatedAt: '2026-10-31T09:00:00Z', version: 0 } }
      '201':
        description: Posted
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/fixed-assets.yaml#/DepreciationRun' }
            examples:
              posted: { summary: Posted, value: { document: { $ref: '#/components/examples/DepreciationRunSep/value' }, outcome: posted, journal: { id: jnl_dep_6, companyId: co_acme, number: JV/2026-27/00407, date: '2026-09-30', period: '2026-09', fy: '2026-27', branchId: br_ho, currency: INR, rate: 1, status: Posted, type: Auto, sourceType: Depreciation Run, sourceId: dep_0006, sourceNumber: DEP/2026-27/00006, narration: Depreciation September 2026 — 31 assets, lines: [{ id: j1, accountId: acc_5700, accountCode: '5700', accountName: Depreciation, dr: 184320, cr: 0, drBase: 184320, crBase: 0, dimensions: {} }, { id: j2, accountId: acc_1690, accountCode: '1690', accountName: Accumulated depreciation — P&M, dr: 0, cr: 121300, drBase: 0, crBase: 121300, dimensions: {} }, { id: j3, accountId: acc_1691, accountCode: '1691', accountName: Accumulated depreciation — IT, dr: 0, cr: 63020, drBase: 0, crBase: 63020, dimensions: {} }], totalDr: 184320, totalCr: 184320, postedAt: '2026-09-30T18:00:00Z', postedBy: Priya Sharma, correlationId: corr_dep6, createdAt: '2026-09-30T18:00:00Z', updatedAt: '2026-09-30T18:00:00Z', version: 1 }, warnings: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409':
        description: Already posted
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              duplicate: { summary: Period already run, value: { code: DUPLICATE_PERIOD, message: Depreciation for 2026-09 is already posted (DEP/2026-27/00006) — reverse it before re-running, details: { runId: dep_0006 }, correlationId: corr_9f1c2e7a } }
      '422':
        description: Nothing to depreciate
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              empty: { summary: Empty, value: { code: EMPTY, message: Nothing to depreciate in this period, correlationId: corr_9f1c2e7a } }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

/fixed-assets/depreciation-runs/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Fixed Assets]
    summary: Get a run (with lines)
    operationId: getDepreciationRun
    x-permission: fixed-assets.depreciation.view
    responses:
      '200':
        description: Run
        content:
          application/json:
            schema: { $ref: '../components/schemas/fixed-assets.yaml#/DepreciationRun' }
            examples:
              posted: { $ref: '../components/examples/fixed-assets.yaml#/DepreciationRunSep' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/fixed-assets/depreciation-runs/{id}/reverse:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Fixed Assets]
    summary: Reverse a run (latest first)
    operationId: reverseDepreciationRun
    x-permission: fixed-assets.depreciation.reverse
    x-idempotent: true
    x-events: [JournalReversed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            reason: { summary: Reason, value: { reason: Lathe was capitalised with the wrong in-service date } }
    responses:
      '200':
        description: Reversed
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/fixed-assets.yaml#/DepreciationRun' }
            examples:
              reversed: { summary: Reversed, value: { document: { id: dep_0006, companyId: co_acme, number: DEP/2026-27/00006, period: '2026-09', fy: '2026-27', status: Reversed, lines: [], total: 184320, assetCount: 31, journalId: jnl_dep_6, journalNumber: JV/2026-27/00407, reversedById: jnl_dep_6r, reversalReason: Lathe was capitalised with the wrong in-service date, postedAt: '2026-09-30T18:00:00Z', postedBy: Priya Sharma, createdAt: '2026-09-30T18:00:00Z', updatedAt: '2026-10-02T09:00:00Z', version: 2 }, outcome: reversed, warnings: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: State conflict
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              notPosted: { summary: Not posted, value: { code: INVALID_STATE, message: Only posted runs can be reversed, correlationId: corr_9f1c2e7a } }
              order: { summary: Later run exists, value: { code: ORDER, message: Reverse DEP/2026-27/00007 (2026-10) first — runs must be reversed in reverse order, details: { laterRunId: dep_0007 }, correlationId: corr_9f1c2e7a } }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

