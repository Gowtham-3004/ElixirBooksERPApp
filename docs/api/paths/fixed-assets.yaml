# Fixed assets (tag: Fixed Assets). src/modules/fixed-assets/actions.ts (capitalize, computeRun, postDepreciation, reverseDepreciation, transferAsset, revalueAsset, disposeAsset).

/fixed-assets/categories:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Fixed Assets]
    summary: Asset categories
    operationId: listAssetCategories
    x-permission: fixed-assets.asset.view
    x-frd: [FR-AST-001]
    parameters:
      - $ref: '../components/parameters.yaml#/IncludeInactive'
    responses:
      '200':
        description: Categories
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/fixed-assets.yaml#/AssetCategory' } } } }
            examples:
              list: { summary: Categories, value: { data: [{ id: cat_pm, companyId: co_acme, code: PM, name: Plant & machinery, method: WDV, ratePct: 15, usefulLifeYears: 15, assetAccountId: acc_1610, depreciationAccountId: acc_5700, accumulatedAccountId: acc_1690, status: Active, assetCount: 12, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }, { id: cat_it, companyId: co_acme, code: IT, name: Computers & laptops, method: SLM, ratePct: 33.33, usefulLifeYears: 3, assetAccountId: acc_1620, depreciationAccountId: acc_5700, accumulatedAccountId: acc_1691, status: Active, assetCount: 16, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Fixed Assets]
    summary: Create a category
    operationId: createAssetCategory
    x-permission: fixed-assets.asset.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/fixed-assets.yaml#/AssetCategoryCreate' }
          examples:
            vehicles: { summary: Vehicles (WDV 30%), value: { code: VH, name: Vehicles, method: WDV, ratePct: 30, usefulLifeYears: 8, assetAccountId: acc_1630, depreciationAccountId: acc_5700, accumulatedAccountId: acc_1692 } }
    responses:
      '201':
        description: Created
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/fixed-assets.yaml#/AssetCategory' }
            examples:
              created: { summary: Created, value: { id: cat_vh, companyId: co_acme, code: VH, name: Vehicles, method: WDV, ratePct: 30, usefulLifeYears: 8, assetAccountId: acc_1630, depreciationAccountId: acc_5700, accumulatedAccountId: acc_1692, status: Active, assetCount: 0, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/fixed-assets/categories/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Fixed Assets]
    summary: Get a category
    operationId: getAssetCategory
    x-permission: fixed-assets.asset.view
    responses:
      '200':
        description: Category
        content:
          application/json:
            schema: { $ref: '../components/schemas/fixed-assets.yaml#/AssetCategory' }
            examples:
              pm: { summary: Plant & machinery, value: { id: cat_pm, companyId: co_acme, code: PM, name: Plant & machinery, method: WDV, ratePct: 15, usefulLifeYears: 15, assetAccountId: acc_1610, depreciationAccountId: acc_5700, accumulatedAccountId: acc_1690, status: Active, assetCount: 12, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 } }
