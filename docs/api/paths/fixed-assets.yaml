      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Fixed Assets]
    summary: Update a category (rate changes apply to future runs only)
    operationId: updateAssetCategory
    x-permission: fixed-assets.asset.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/fixed-assets.yaml#/AssetCategoryPatch' }
          examples:
            rate: { summary: New rate, value: { expectedVersion: 1, ratePct: 18 } }
            deactivate: { summary: Deactivate, value: { expectedVersion: 1, status: Inactive } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/fixed-assets.yaml#/AssetCategory' }
            examples:
              updated: { summary: Updated, value: { id: cat_pm, companyId: co_acme, code: PM, name: Plant & machinery, method: WDV, ratePct: 18, usefulLifeYears: 15, assetAccountId: acc_1610, depreciationAccountId: acc_5700, accumulatedAccountId: acc_1690, status: Active, assetCount: 12, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
  delete:
    tags: [Fixed Assets]
    summary: Delete an unused category
    operationId: deleteAssetCategory
    x-permission: fixed-assets.asset.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── assets ────────────────────────────────────────────────────────────────

/fixed-assets/assets:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Fixed Assets]
    summary: Asset register
    description: "Tabs → All · Active · Fully depreciated · Disposed · Draft/New. Query examples — `?categoryId=cat_pm` · `?branchId=br_pune` · `?custodianId=emp_suresh` · `?q=lathe`."
    operationId: listAssets
    x-permission: fixed-assets.asset.view
    x-frd: [FR-AST-002]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: categoryId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/BranchFilter'
      - { name: custodianId, in: query, schema: { type: string } }
    responses:
      '200':
        description: Assets
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/fixed-assets.yaml#/Asset' } }
                    totals: { type: object, properties: { cost: { type: number }, accumulated: { type: number }, nbv: { type: number } } }
            examples:
              firstPage: { summary: Assets, value: { data: [{ $ref: '#/components/examples/AssetLathe/value' }], totals: { cost: 12400000, accumulated: 3180000, nbv: 9220000 }, meta: { nextCursor: null, limit: 25, total: 31, counts: { All: 31, Active: 27, 'Fully depreciated': 2, Disposed: 1, 'Draft/New': 1 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/fixed-assets/assets/capitalizable-lines:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
