/production/orders/{id}/release:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Production]
    summary: Release (checks component availability; routes through 'Production Order' workflow when a rule matches)
    operationId: releaseProductionOrder
    x-permission: production.order.submit
    x-frd: [FR-MFG-008]
    x-idempotent: true
    x-workflow-doc-type: Production Order
    x-events: [DocumentSubmitted, DocumentApproved]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: '../components/schemas/production.yaml#/ReleaseRequest' }
          examples:
            default: { summary: Normal, value: {} }
            acknowledge: { summary: Release despite shortfall, value: { acknowledgeShortfall: true } }
    responses:
      '200':
        description: Outcome
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/production.yaml#/ProductionOrder' }
                    outcome: { type: string, enum: [released, routed-for-approval] }
                    availability: { type: array, items: { $ref: '../components/schemas/production.yaml#/AvailabilityLine' } }
            examples:
              released: { summary: outcome = released, value: { document: { $ref: '#/components/examples/ProductionOrderInProgress/value' }, outcome: released, availability: [{ componentId: oc_1, itemName: Steel Rod 4mm, required: 612, available: 2682, shortfall: 0, uom: KG, warehouse: RM Store }], warnings: [] } }
              routed: { summary: outcome = routed-for-approval (value over rule threshold), value: { document: { $ref: '#/components/examples/ProductionOrderDraft/value' }, outcome: routed-for-approval, approval: { id: apr_mo_41, companyId: co_acme, docType: Production Order, collection: productionOrders, docId: mo_0041, docNumber: PO-MFG/2026-27/00041, amount: 119000, currency: INR, branchId: br_ho, requesterId: usr_suresh, requesterName: Suresh Patel, steps: [{ order: 1, name: Plant head, approverType: Role, approverRef: role_plant, approverLabel: Plant Head, status: Pending, commentRequired: false }], currentStep: 0, status: Pending, submittedAt: '2026-09-13T09:30:00Z', history: [], createdAt: '2026-09-13T09:30:00Z', updatedAt: '2026-09-13T09:30:00Z', version: 1 }, warnings: [] } }
              acknowledged: { summary: Released with acknowledged shortfall, value: { document: { $ref: '#/components/examples/ProductionOrderInProgress/value' }, outcome: released, availability: [{ componentId: oc_2, itemName: Welding electrode, required: 300, available: 120, shortfall: 180, uom: NOS, warehouse: RM Store }], warnings: ['Component shortfall acknowledged: Welding electrode short 180 NOS'] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Shortfall
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              shortfall: { summary: Components short, value: { code: SHORTFALL, message: 'Component shortfall: Welding electrode 180 NOS', details: { lines: [{ componentId: oc_2, itemName: Welding electrode, required: 300, available: 120, shortfall: 180, uom: NOS, warehouse: RM Store }] }, correlationId: corr_9f1c2e7a } }

