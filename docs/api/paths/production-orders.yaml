            fullIssue: { summary: Issue all planned components, value: { orderId: mo_0041, lines: [{ componentId: oc_1, itemId: item_stl4, qty: 612, batch: B-2609-11 }, { componentId: oc_2, itemId: item_electrode, qty: 300 }, { componentId: oc_3, itemId: item_paint, qty: 20, batch: PNT-2608 }] } }
