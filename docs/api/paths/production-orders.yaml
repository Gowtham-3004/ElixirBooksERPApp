# Production — part 2 (tag: Production). actions.ts (orders + operations), issueActions.ts, receiptActions.ts, qualityActions.ts (inspections), subcontractActions.ts, core.ts (WIP, genealogy).

# ── production orders ─────────────────────────────────────────────────────

/production/orders:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Production]
    summary: Production orders
    description: "Tabs → Open (Released/In Progress/Partially Completed) · Planned · Awaiting approval · Completed · Closed · Cancelled · Late (`late=true`) · All. Query examples — `?itemId=item_frame` · `?priority=High` · `?sourceType=Sales Order`."
    operationId: listProductionOrders
    x-permission: production.order.view
    x-frd: [FR-MFG-007]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/ItemId'
      - { name: priority, in: query, schema: { type: string, enum: [Normal, High, Low] } }
      - { name: late, in: query, schema: { type: boolean } }
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
    responses:
      '200':
        description: Orders
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/production.yaml#/ProductionOrder' } }
            examples:
              firstPage: { summary: Orders, value: { data: [{ $ref: '#/components/examples/ProductionOrderInProgress/value' }], meta: { nextCursor: null, limit: 25, total: 1, counts: { Open: 3, Planned: 2, 'Awaiting approval': 1, Completed: 1, Closed: 33, Cancelled: 1, Late: 1, All: 41 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Production]
    summary: Create a production order (explodes the BOM, copies the routing, schedules)
    operationId: createProductionOrder
    x-permission: production.order.create
    x-events: [DocumentCreated]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/production.yaml#/ProductionOrderCreate' }
          examples:
            mts: { summary: "Make-to-stock, defaults", value: { itemId: item_frame, qty: 50, plannedStart: '2026-09-15' } }
            mto: { summary: Make-to-order from a sales order line, value: { itemId: item_frame, qty: 20, plannedStart: '2026-09-16', priority: High, sourceDemand: { type: Sales Order, id: so_00090, number: SO/2026-27/00090, lineId: ln_1, customerName: Arlene Traders }, serialPrefix: SN-FRM, dimensions: { Project: dim_prj_erp } } }
            explicitBom: { summary: Specific BOM / routing and warehouses, value: { itemId: item_frame, bomId: bom_frame_1, routingId: rt_frame_sc, qty: 100, plannedStart: '2026-09-20', plannedEnd: '2026-09-30', warehouseId: wh_main, rmWarehouseId: wh_rm, status: Planned, notes: Old BOM for export spec } }
    responses:
      '201':
        description: Order
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/ProductionOrder' }
            examples:
              draft: { $ref: '../components/examples/production.yaml#/ProductionOrderDraft' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Business rule
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              noBom: { summary: No active BOM, value: { code: NO_BOM, message: Steel Frame A1 has no active BOM as of 2026-09-15, field: bomId, correlationId: corr_9f1c2e7a } }
              superseded: { summary: BOM superseded, value: { code: BOM_SUPERSEDED, message: 'BOM-FRAME-A1 v1 is superseded by v2 (effective 2026-10-01)', field: bomId, correlationId: corr_9f1c2e7a } }

/production/orders/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Production]
    summary: Get an order (components, operations, costs)
    operationId: getProductionOrder
    x-permission: production.order.view
    responses:
      '200':
        description: Order
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/ProductionOrder' }
            examples:
              draft: { $ref: '../components/examples/production.yaml#/ProductionOrderDraft' }
              inProgress: { $ref: '../components/examples/production.yaml#/ProductionOrderInProgress' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Production]
    summary: Edit a Draft / Planned order (re-explodes when qty or BOM changes)
    operationId: updateProductionOrder
    x-permission: production.order.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/production.yaml#/ProductionOrderPatch' }
          examples:
            qty: { summary: Change quantity, value: { expectedVersion: 1, qty: 60 } }
            dates: { summary: Reschedule, value: { expectedVersion: 1, plannedStart: '2026-09-18', priority: High } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/ProductionOrder' }
            examples:
              updated: { $ref: '../components/examples/production.yaml#/ProductionOrderDraft' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
  delete:
    tags: [Production]
    summary: Delete a Draft order (cancel otherwise)
    operationId: deleteProductionOrder
    x-permission: production.order.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/production/orders/{id}/availability:
  parameters:
