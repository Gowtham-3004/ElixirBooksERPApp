              overIssue: { summary: Over tolerance, value: { code: OVER_CONSUMPTION, message: 'Steel Rod 4mm: 700 KG exceeds planned 612 + 5% tolerance', field: 'lines[0].qty', correlationId: corr_9f1c2e7a } }
              batch: { summary: Batch missing, value: { code: BATCH_REQUIRED, message: Steel Rod 4mm is batch-tracked — pick a batch, field: 'lines[0].batch', correlationId: corr_9f1c2e7a } }
