              issued: { summary: Issue posted, value: { document: { $ref: '#/components/examples/MaterialIssuePosted/value' }, outcome: posted, journal: { id: jnl_mi_112, companyId: co_acme, number: JV/2026-27/00417, date: '2026-09-15', period: '2026-09', fy: '2026-27', branchId: br_ho, currency: INR, rate: 1, status: Posted, type: Auto, sourceType: Material Issue, sourceId: mi_0112, sourceNumber: MI/2026-27/00112, narration: 'Material issue MI/2026-27/00112 → PO-MFG/2026-27/00041', lines: [{ id: j1, accountId: acc_1230, accountCode: '1230', accountName: Work in progress, dr: 100000, cr: 0, drBase: 100000, crBase: 0, dimensions: {} }, { id: j2, accountId: acc_1210, accountCode: '1210', accountName: Inventory — Raw Material, dr: 0, cr: 100000, drBase: 0, crBase: 100000, dimensions: {} }], totalDr: 100000, totalCr: 100000, postedAt: '2026-09-15T08:30:00Z', postedBy: Suresh Patel, correlationId: corr_mo41, createdAt: '2026-09-15T08:30:00Z', updatedAt: '2026-09-15T08:30:00Z', version: 1 }, stockMovements: [{ id: sm_120, companyId: co_acme, date: '2026-09-15', itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, warehouseId: wh_rm, qty: -612, uom: KG, baseQty: -612, batch: B-2609-11, rate: 49.8, value: -30477.6, type: Issue, sourceType: Material Issue, sourceId: mi_0112, sourceNumber: MI/2026-27/00112, journalId: jnl_mi_112, balanceAfter: 2070, createdAt: '2026-09-15T08:30:00Z', updatedAt: '2026-09-15T08:30:00Z', version: 1 }], warnings: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
