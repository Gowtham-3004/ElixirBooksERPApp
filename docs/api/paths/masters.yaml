/price-lists/{id}/entries:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Masters]
    summary: List entries of a price list
    operationId: listPriceListEntries
    x-permission: masters.pricelists.view
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
