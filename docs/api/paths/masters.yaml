/price-lists/resolve:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Masters]
    summary: Resolve the price for an item (tester)
    description: Runs `engine.resolvePrice` — party override → scoped list → default list → item price, honouring qty tiers, validity and priority. Returns the winner and the candidates considered.
    operationId: resolvePrice
    x-permission: masters.pricelists.view
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/masters.yaml#/PriceResolveRequest' }
          examples:
            customerTier: { summary: Customer + qty tier, value: { itemId: item_stl4, qty: 600, customerId: cust_arlene, date: '2026-09-13' } }
            purchase: { summary: Purchase price for a supplier, value: { itemId: item_stl4, qty: 1000, supplierId: sup_bharatsteel, direction: purchase } }
            explicitList: { summary: Force a list, value: { itemId: item_stl4, qty: 10, priceListId: pl_usd } }
    responses:
      '200':
        description: Resolution
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/PriceResolution' }
            examples:
              tier: { summary: Tier ≥ 500 won, value: { rate: 56, currency: INR, taxInclusive: false, source: 'Price list Wholesale INR · tier ≥ 500', priceListId: pl_wholesale, priceListName: Wholesale INR, entryId: ple_2, candidates: [{ priceListName: Wholesale INR, rate: 56, reason: default list · tier ≥ 500 }, { priceListName: Item master, rate: 62, reason: fallback }] } }
              fallback: { summary: No entry — item master price, value: { rate: 62, currency: INR, taxInclusive: false, source: Item master sales price (no price-list entry), candidates: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

