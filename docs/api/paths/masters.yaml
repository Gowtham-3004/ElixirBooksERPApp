      '200':
        description: Entries
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/masters.yaml#/PriceListEntry' } }
            examples:
              firstPage: { summary: Tiered entries, value: { data: [{ id: ple_1, companyId: co_acme, priceListId: pl_wholesale, itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, uom: KG, minQty: 100, rate: 58, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }, { id: ple_2, companyId: co_acme, priceListId: pl_wholesale, itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, uom: KG, minQty: 500, rate: 56, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }], meta: { nextCursor: null, limit: 25, total: 42 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
