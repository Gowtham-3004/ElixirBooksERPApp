    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/PriceList' }
            examples:
              updated: { $ref: '../components/examples/masters.yaml#/PriceListWholesale' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
