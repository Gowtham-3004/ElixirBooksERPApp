            purchaseSupplier: { summary: Supplier-specific purchase list, value: { code: PL-BHARAT, name: Bharat Steel contract 2026-27, type: Purchase, currency: INR, scope: Supplier, priority: 1, validFrom: '2026-04-01', validTo: '2027-03-31' } }
