# Masters part 1 (tag: Masters): customers, suppliers, employees, items, warehouses, price lists.
# Every master register: list (tabs/search/filters), create (code generated, duplicate rules), get, patch (expectedVersion),
# delete (blocked when referenced → 409 REFERENCED), status change, bulk status, change history.

# ── customers ─────────────────────────────────────────────────────────────

/customers:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Masters]
    summary: List customers
    description: |
      Tabs → `status`: Active · Inactive · Blocked · All (`includeInactive=true`). Search keys: name, code, GSTIN, e-mail, display name.
      Query examples — `?q=arlene` · `?status=Blocked` · `?group=Distributors&taxTreatment=Registered` · `?state=Maharashtra` · `?creditPolicy=Block` · `?updatedSince=2026-09-01T00:00:00Z` (sync).
    operationId: listCustomers
    x-permission: masters.customers.view
    x-frd: [FR-MST-001, FR-MST-002]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/IncludeInactive'
      - { name: group, in: query, schema: { type: string } }
      - { name: taxTreatment, in: query, schema: { $ref: '../components/schemas/masters.yaml#/TaxTreatment' } }
      - { name: state, in: query, schema: { type: string } }
      - { name: creditPolicy, in: query, schema: { type: string, enum: [Warn, Block, Override, Inherit] } }
      - { name: salespersonId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/UpdatedSince'
    responses:
      '200':
        description: Customers
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/masters.yaml#/Customer' } }
            examples:
              firstPage:
                summary: Active customers
                value:
                  data:
                    - { id: cust_arlene, companyId: co_acme, code: C-0101, name: Arlene Traders, gstin: 27AAPFU0939F1ZV, taxTreatment: Registered, addresses: [], contacts: [], currency: INR, paymentTerms: Net 30, creditLimit: 500000, creditPolicy: Inherit, status: Active, outstanding: 168000, overdue: 50000, exposure: 245000, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-12T11:00:00Z', version: 4 }
                    - { id: cust_ustech, companyId: co_acme, code: C-0150, name: US Tech Imports LLC, taxTreatment: Overseas, addresses: [], contacts: [], currency: USD, paymentTerms: Net 45, creditLimit: 25000, creditPolicy: Warn, status: Active, outstanding: 12000, overdue: 0, exposure: 12000, createdAt: '2026-05-01T09:00:00Z', updatedAt: '2026-05-01T09:00:00Z', version: 1 }
                  meta: { nextCursor: eyJuIjoiVVMgVGVjaCIsImlkIjoiY3VzdF91c3RlY2gifQ, limit: 25, total: 12, sort: 'name:asc', counts: { Active: 10, Inactive: 1, Blocked: 1, All: 12 } }
                  scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' }
              lastPage:
                summary: Last page
                value:
                  data:
                    - { id: cust_walkin, companyId: co_acme, code: C-0199, name: Walk-in customer, taxTreatment: Unregistered, addresses: [], contacts: [], currency: INR, paymentTerms: Immediate, creditLimit: 0, creditPolicy: Block, status: Active, outstanding: 0, overdue: 0, exposure: 0, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }
                  meta: { nextCursor: null, limit: 25, total: 12, sort: 'name:asc' }
                  scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Masters]
    summary: Create a customer
    description: Duplicate rule — same GSTIN (or same normalised name + state when no GSTIN) → `409 DUPLICATE`. GSTIN / PAN / e-mail / PIN validated. Code generated when omitted.
    operationId: createCustomer
    x-permission: masters.customers.create
    x-frd: [FR-MST-001, FR-MST-003]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/masters.yaml#/CustomerInput'
              - { required: [name, taxTreatment] }
          examples:
            minimalB2c: { summary: Minimal B2C (unregistered), value: { name: Ravi Kumar, taxTreatment: Unregistered, phone: '+91 98111 22334' } }
            fullB2b: { summary: "Full B2B with addresses, contacts, credit", value: { code: C-0160, name: Delta Fabricators Pvt Ltd, displayName: Delta, group: OEM, gstin: 27AAHCD4321E1ZK, pan: AAHCD4321E, taxTreatment: Registered, addresses: [{ purpose: Billing, isDefault: true, address: { line1: 7 Industrial Estate, city: Thane, state: Maharashtra, stateCode: '27', pin: '400604', country: IN } }, { purpose: Shipping, isDefault: false, label: Plant 2, address: { line1: Plot 19 MIDC, city: Pune, state: Maharashtra, stateCode: '27', pin: '411019', country: IN } }], contacts: [{ name: Sanjay Deshpande, email: accounts@delta.example, phone: '+91 98900 11223', designation: Finance Head, isDefault: true, purpose: Billing }], currency: INR, paymentTerms: Net 45, creditLimit: 1000000, creditPolicy: Warn, priceListId: pl_wholesale, salespersonId: sp_priya, tdsSectionId: tds_194c, email: accounts@delta.example } }
            overseasUsd: { summary: Overseas customer in USD, value: { name: Nordic Imports AB, taxTreatment: Overseas, currency: USD, paymentTerms: Net 60, creditLimit: 40000, creditPolicy: Block, priceListId: pl_usd, addresses: [{ purpose: Both, isDefault: true, address: { line1: Kungsgatan 12, city: Stockholm, state: Stockholm, pin: '111 35', country: SE } }] } }
            sez: { summary: SEZ unit (zero-rated), value: { name: Infotech SEZ Unit, gstin: 24AABCI9876F1Z3, taxTreatment: SEZ, currency: INR, paymentTerms: Net 30, creditLimit: 250000, creditPolicy: Inherit } }
    responses:
      '201':
        description: Customer
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Customer' }
            examples:
              b2b: { $ref: '../components/examples/masters.yaml#/CustomerArlene' }
              overseas: { $ref: '../components/examples/masters.yaml#/CustomerUsTech' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/customers/bulk:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Masters]
    summary: Bulk activate / deactivate / block customers
    operationId: bulkCustomers
    x-permission: masters.customers.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/BulkRequest' }
          examples:
            deactivate: { summary: Deactivate, value: { ids: [cust_vimal, cust_kiran], action: deactivate } }
            activate: { summary: Activate, value: { ids: [cust_vimal], action: activate } }
            block: { summary: Block with reason, value: { ids: [cust_kiran], action: block, reason: Repeated payment defaults } }
    responses:
      '200':
        description: Per-id results
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/BulkResult' }
            examples:
              allSucceeded: { $ref: '../components/examples/common.yaml#/BulkAllSucceeded' }
              partialFailure: { summary: One already blocked, value: { requested: 2, succeeded: 1, failed: 1, results: [{ id: cust_vimal, ok: true, status: Inactive }, { id: cust_kiran, ok: false, code: INVALID_STATE, message: Customer is Blocked — unblock before deactivating }] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/customers/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Masters]
    summary: Get a customer
    operationId: getCustomer
    x-permission: masters.customers.view
    responses:
      '200':
        description: Customer
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Customer' }
            examples:
              b2b: { $ref: '../components/examples/masters.yaml#/CustomerArlene' }
              walkin: { $ref: '../components/examples/masters.yaml#/CustomerWalkin' }
              blocked: { $ref: '../components/examples/masters.yaml#/CustomerBlocked' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Masters]
    summary: Update a customer (audited with before/after)
    operationId: updateCustomer
    x-permission: masters.customers.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/masters.yaml#/CustomerPatch' }
          examples:
            creditTerms: { summary: Raise credit limit + terms, value: { expectedVersion: 4, creditLimit: 750000, paymentTerms: Net 45 } }
            addContact: { summary: Replace contacts, value: { expectedVersion: 4, contacts: [{ id: ct_1, name: Arlene D'Souza, email: accounts@arlenetraders.in, isDefault: true, purpose: Billing }, { name: Joseph D'Souza, email: joseph@arlenetraders.in, phone: '+91 98200 55555', isDefault: false, purpose: Delivery }] } }
            gstin: { summary: Correct GSTIN (validated), value: { expectedVersion: 4, gstin: 27AAPFU0939F1ZV, taxTreatment: Registered } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Customer' }
            examples:
              updated: { $ref: '../components/examples/masters.yaml#/CustomerArlene' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
  delete:
    tags: [Masters]
    summary: Delete a customer (only when unreferenced)
    operationId: deleteCustomer
    x-permission: masters.customers.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/customers/{id}/status:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Masters]
    summary: Activate / deactivate / block a customer
    description: Blocked customers cannot be used on new documents (open documents continue). Reason required for Blocked.
    operationId: setCustomerStatus
    x-permission: masters.customers.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/masters.yaml#/MasterStatusChange' }
          examples:
            block: { summary: Block for new business, value: { status: Blocked, reason: Repeated payment defaults — 3 invoices > 90 days } }
            deactivate: { summary: Deactivate, value: { status: Inactive } }
            reactivate: { summary: Reactivate, value: { status: Active } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Customer' }
            examples:
              blocked: { $ref: '../components/examples/masters.yaml#/CustomerBlocked' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/customers/{id}/ledger:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Masters]
    summary: Customer ledger (running balance)
    operationId: getCustomerLedger
    x-permission: masters.customers.view
    parameters:
      - $ref: '../components/parameters.yaml#/ReportFrom'
      - $ref: '../components/parameters.yaml#/ReportTo'
    responses:
      '200':
        description: Ledger
        content:
          application/json:
            schema:
              type: object
              required: [partyId, opening, closing, rows]
              properties:
                partyId: { type: string }
                currency: { type: string }
                opening: { type: number }
                closing: { type: number }
                rows: { type: array, items: { $ref: '../components/schemas/masters.yaml#/CustomerLedgerRow' } }
                scope: { $ref: '../components/schemas/common.yaml#/Scope' }
            examples:
              ledger: { summary: Sep 2026, value: { partyId: cust_arlene, currency: INR, opening: 50000, closing: 168000, rows: [{ date: '2026-09-02', docType: Receipt, docId: rcp_00201, docNumber: RCP/2026-27/00201, narration: NEFT UTR N2465…, debit: 0, credit: 50000, balance: 0 }, { date: '2026-09-05', docType: Sales Invoice, docId: inv_00031, docNumber: INV/2026-27/00031, debit: 50000, credit: 0, balance: 50000 }, { date: '2026-09-13', docType: Sales Invoice, docId: inv_01j8k3, docNumber: INV/2026-27/00042, debit: 118000, credit: 0, balance: 168000 }], scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { summary: No movements, value: { partyId: cust_walkin, currency: INR, opening: 0, closing: 0, rows: [], scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/customers/{id}/outstanding:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Masters]
    summary: Outstanding, exposure, ageing buckets and open items
    operationId: getCustomerOutstanding
    x-permission: masters.customers.view
    parameters:
      - $ref: '../components/parameters.yaml#/AsAt'
    responses:
      '200':
        description: Outstanding
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/PartyOutstanding' }
            examples:
              withOverdue: { summary: One overdue invoice, value: { partyId: cust_arlene, currency: INR, outstanding: 168000, overdue: 50000, creditLimit: 500000, exposure: 245000, buckets: { Current: 118000, '0-30': 50000, '31-60': 0, '61-90': 0, '90+': 0 }, items: [{ id: oi_1, companyId: co_acme, partyType: Customer, partyId: cust_arlene, partyName: Arlene Traders, docType: Sales Invoice, docId: inv_00031, docNumber: INV/2026-27/00031, date: '2026-08-05', dueDate: '2026-09-04', currency: INR, originalAmount: 50000, baseAmount: 50000, rate: 1, outstanding: 50000, baseOutstanding: 50000, direction: Debit, status: Open, settlements: [], branchId: br_ho, createdAt: '2026-08-05T10:00:00Z', updatedAt: '2026-08-05T10:00:00Z', version: 1 }, { id: oi_2, companyId: co_acme, partyType: Customer, partyId: cust_arlene, partyName: Arlene Traders, docType: Sales Invoice, docId: inv_01j8k3, docNumber: INV/2026-27/00042, date: '2026-09-13', dueDate: '2026-10-13', currency: INR, originalAmount: 118000, baseAmount: 118000, rate: 1, outstanding: 118000, baseOutstanding: 118000, direction: Debit, status: Open, settlements: [], branchId: br_ho, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }] } }
              nothingDue: { summary: Nothing outstanding, value: { partyId: cust_walkin, currency: INR, outstanding: 0, overdue: 0, creditLimit: 0, exposure: 0, buckets: {}, items: [] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/customers/{id}/history:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Masters]
    summary: Change history (audited field diffs)
    operationId: getCustomerHistory
    x-permission: masters.customers.view
    responses:
      '200':
        description: History
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/masters.yaml#/ChangeHistoryEntry' } } } }
            examples:
              history: { summary: Two edits, value: { data: [{ at: '2026-09-12T11:00:00Z', by: Priya Sharma, action: customer.updated, changes: [{ field: creditLimit, from: 300000, to: 500000 }, { field: paymentTerms, from: Net 30, to: Net 45 }] }, { at: '2026-04-01T09:00:00Z', by: Rahul Mehta, action: customer.created, changes: [] }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

# ── suppliers ─────────────────────────────────────────────────────────────

/suppliers:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Masters]
    summary: List suppliers
    description: Tabs → Active · Inactive · MSME (`msme=true`) · Bank pending (`bankPending=true`) · All. Query examples — `?q=steel` · `?group=Raw material` · `?taxTreatment=Registered&state=Gujarat`.
    operationId: listSuppliers
    x-permission: masters.suppliers.view
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/IncludeInactive'
      - { name: group, in: query, schema: { type: string } }
      - { name: taxTreatment, in: query, schema: { $ref: '../components/schemas/masters.yaml#/TaxTreatment' } }
      - { name: state, in: query, schema: { type: string } }
      - { name: msme, in: query, schema: { type: boolean } }
      - { name: bankPending, in: query, schema: { type: boolean } }
      - $ref: '../components/parameters.yaml#/UpdatedSince'
    responses:
      '200':
        description: Suppliers
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/masters.yaml#/Supplier' } }
            examples:
              firstPage: { summary: Suppliers, value: { data: [{ id: sup_bharatsteel, companyId: co_acme, code: S-0201, name: Bharat Steel Industries, group: Raw material, gstin: 27AABCB1234C1Z2, taxTreatment: Registered, addresses: [], contacts: [], currency: INR, purchaseTerms: Net 45, bankDetails: [], tdsSectionId: tds_194c, msmeNumber: UDYAM-MH-18-0012345, status: Active, payable: 412000, overdue: 0, isMsme: true, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-08-20T09:00:00Z', version: 5 }, { id: sup_transport, companyId: co_acme, code: S-0210, name: Speedy Transport Co, group: Logistics, taxTreatment: Registered, gstin: 27AAACS9876G1Z1, addresses: [], contacts: [], currency: INR, purchaseTerms: Net 15, bankDetails: [], tdsSectionId: tds_194c, status: Active, payable: 38000, overdue: 12000, isMsme: false, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }], meta: { nextCursor: null, limit: 25, total: 10, counts: { Active: 9, Inactive: 1, MSME: 3, 'Bank pending': 1, All: 10 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Masters]
    summary: Create a supplier
    description: Bank details are **not** accepted here — add them via `/suppliers/{id}/bank-details` (approval workflow). Duplicate rule on GSTIN.
    operationId: createSupplier
    x-permission: masters.suppliers.create
    x-frd: [FR-MST-004]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/masters.yaml#/SupplierInput'
              - { required: [name, taxTreatment] }
          examples:
            minimal: { summary: Minimal, value: { name: Local Stationers, taxTreatment: Unregistered, purchaseTerms: Immediate } }
            fullWithTds: { summary: Registered with TDS section and MSME, value: { code: S-0220, name: Shree Packaging Pvt Ltd, group: Packaging, gstin: 24AABCS5555H1Z9, pan: AABCS5555H, taxTreatment: Registered, addresses: [{ purpose: Both, isDefault: true, address: { line1: GIDC Phase 3, city: Vapi, state: Gujarat, stateCode: '24', pin: '396195', country: IN } }], contacts: [{ name: Hemant Shah, email: hemant@shreepack.example, isDefault: true }], currency: INR, purchaseTerms: Net 30, tdsSectionId: tds_194c, msmeNumber: UDYAM-GJ-05-0009876, email: accounts@shreepack.example } }
            overseas: { summary: Overseas supplier in USD (import), value: { name: Shenzhen Electro Ltd, taxTreatment: Overseas, currency: USD, purchaseTerms: Advance, addresses: [{ purpose: Both, isDefault: true, address: { line1: Bldg 4 Nanshan Tech Park, city: Shenzhen, state: Guangdong, country: CN } }] } }
            consultant194j: { summary: Professional services (194J), value: { name: Mehta & Associates, taxTreatment: Registered, gstin: 27AAEFM1234K1ZP, pan: AAEFM1234K, currency: INR, purchaseTerms: Net 15, tdsSectionId: tds_194j } }
    responses:
      '201':
        description: Supplier
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/masters.yaml#/Supplier' }
            examples:
              created: { $ref: '../components/examples/masters.yaml#/SupplierBharatSteel' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/suppliers/bulk:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Masters]
    summary: Bulk activate / deactivate suppliers
    operationId: bulkSuppliers
    x-permission: masters.suppliers.edit
    requestBody:
      required: true
      content:
        application/json:
