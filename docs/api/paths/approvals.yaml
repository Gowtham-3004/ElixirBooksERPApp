/approvals/{id}/act:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Approvals]
    summary: Approve / reject / return / delegate / recall
    description: |
      - **Approve** → next step becomes Pending, or the request completes and the document goes `Approved`
        (admin doc types apply their post-approval effect: Period Reopen, Profile Change, Exchange Rate, Supplier Bank Detail).
      - **Reject** → document `Rejected` (comment required).
      - **Return** → document `Returned` to the requester for edits (comment required).
      - **Delegate** → step reassigned to `delegateToUserId` (step must allow delegation).
      - **Recall** → requester withdraws; document back to `Draft`.

      The caller must be an approver of the current step (`403 DENIED`); requesters cannot approve their own
      request unless the rule allows self-approval (`403 SELF_APPROVAL`).
    operationId: actOnApproval
    x-permission: approvals.act.approve
    x-idempotent: true
    x-events: [DocumentApproved, DocumentRejected]
    x-frd: [FR-WFL-002, FR-WFL-004]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/approvals.yaml#/ApprovalAction' }
          examples:
            approve: { summary: Approve with a comment, value: { action: Approve, comment: Checked against PO and GRN — ok to proceed } }
            reject: { summary: Reject, value: { action: Reject, comment: Rate on line 2 is 8% below the approved price list without an override reason } }
            return: { summary: Return for edits, value: { action: Return, comment: Please attach the customer PO before resubmitting } }
            delegate: { summary: Delegate to a colleague, value: { action: Delegate, delegateToUserId: usr_anita, comment: On leave until 20 Sep } }
            recall: { summary: Requester recalls, value: { action: Recall, comment: Found an error in the lines — will resubmit } }
    responses:
      '200':
        description: Updated request + the affected document
        content:
          application/json:
            schema:
              type: object
              required: [approval, document]
              properties:
                approval: { $ref: '../components/schemas/approvals.yaml#/ApprovalRequest' }
                document:
                  type: object
                  additionalProperties: true
                  description: The target document after the action (status updated).
                nextStep: { $ref: '../components/schemas/approvals.yaml#/ApprovalStepState' }
                completed: { type: boolean }
            examples:
              approvedFinal:
                summary: Approve — last step, document Approved
                value:
                  approval: { id: apr_6c1d, companyId: co_acme, docType: Sales Invoice, collection: salesInvoices, docId: inv_01j8k3, docNumber: DRAFT-8821, amount: 118000, currency: INR, branchId: br_ho, requesterId: usr_priya, requesterName: Priya Sharma, ruleId: wf_si_100k, ruleName: Sales invoices above ₹1 lakh, ruleVersion: 2, steps: [{ order: 1, name: Finance review, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, status: Approved, actedBy: Rahul Mehta, actedById: usr_rahul, actedAt: '2026-09-13T09:11:00Z', comment: Checked against PO and GRN — ok to proceed, commentRequired: false }], currentStep: 1, status: Approved, submittedAt: '2026-09-12T15:10:00Z', completedAt: '2026-09-13T09:11:00Z', history: [{ at: '2026-09-12T15:10:00Z', by: Priya Sharma, action: Submitted }, { at: '2026-09-13T09:11:00Z', by: Rahul Mehta, action: Approved, step: 1 }], createdAt: '2026-09-12T15:10:00Z', updatedAt: '2026-09-13T09:11:00Z', version: 2 }
                  document: { id: inv_01j8k3, number: DRAFT-8821, docType: Sales Invoice, status: Approved, partyName: Arlene Traders, totals: { total: 118000 }, version: 5 }
                  completed: true
              approvedNextStep:
                summary: Approve — moves to step 2
                value:
                  approval: { id: apr_9d3e, companyId: co_acme, docType: Purchase Order, collection: purchaseOrders, docId: po_00118, docNumber: PO/SRT/0118/26-27, amount: 640000, currency: INR, branchId: br_surat, requesterId: usr_suresh, requesterName: Suresh Patel, ruleId: wf_po_2step, ruleName: POs above ₹5 lakh (2 steps), ruleVersion: 1, steps: [{ order: 1, name: Purchase manager, approverType: Role, approverRef: role_purchmgr, approverLabel: Purchase Manager, status: Approved, actedBy: Meena Joshi, actedAt: '2026-09-13T09:11:00Z', commentRequired: false }, { order: 2, name: CFO sign-off, approverType: User, approverRef: usr_rahul, approverLabel: Rahul Mehta, status: Pending, commentRequired: true, dueAt: '2026-09-14T09:11:00Z' }], currentStep: 1, status: Pending, submittedAt: '2026-09-10T09:00:00Z', history: [], createdAt: '2026-09-10T09:00:00Z', updatedAt: '2026-09-13T09:11:00Z', version: 2 }
                  document: { id: po_00118, number: PO/SRT/0118/26-27, docType: Purchase Order, status: Submitted, version: 3 }
                  nextStep: { order: 2, name: CFO sign-off, approverType: User, approverRef: usr_rahul, approverLabel: Rahul Mehta, status: Pending, commentRequired: true, dueAt: '2026-09-14T09:11:00Z' }
                  completed: false
              rejected:
                summary: Reject — document Rejected
                value:
                  approval: { id: apr_6c1d, companyId: co_acme, docType: Sales Invoice, collection: salesInvoices, docId: inv_01j8k3, docNumber: DRAFT-8821, amount: 118000, currency: INR, branchId: br_ho, requesterId: usr_priya, requesterName: Priya Sharma, steps: [{ order: 1, name: Finance review, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, status: Rejected, actedBy: Rahul Mehta, actedAt: '2026-09-13T09:11:00Z', comment: Rate on line 2 is 8% below the approved price list without an override reason, commentRequired: false }], currentStep: 0, status: Rejected, submittedAt: '2026-09-12T15:10:00Z', completedAt: '2026-09-13T09:11:00Z', history: [], createdAt: '2026-09-12T15:10:00Z', updatedAt: '2026-09-13T09:11:00Z', version: 2 }
                  document: { id: inv_01j8k3, number: DRAFT-8821, docType: Sales Invoice, status: Rejected, version: 5 }
                  completed: true
              delegated:
                summary: Delegate — still Pending, new approver
                value:
                  approval: { id: apr_6c1d, companyId: co_acme, docType: Sales Invoice, collection: salesInvoices, docId: inv_01j8k3, docNumber: DRAFT-8821, amount: 118000, currency: INR, branchId: br_ho, requesterId: usr_priya, requesterName: Priya Sharma, steps: [{ order: 1, name: Finance review, approverType: User, approverRef: usr_anita, approverLabel: Anita Rao (delegated), status: Delegated, delegatedTo: Anita Rao, commentRequired: false }], currentStep: 0, status: Pending, submittedAt: '2026-09-12T15:10:00Z', history: [{ at: '2026-09-13T09:11:00Z', by: Rahul Mehta, action: Delegated to Anita Rao, comment: On leave until 20 Sep, step: 1 }], createdAt: '2026-09-12T15:10:00Z', updatedAt: '2026-09-13T09:11:00Z', version: 2 }
                  document: { id: inv_01j8k3, number: DRAFT-8821, docType: Sales Invoice, status: Submitted, version: 4 }
                  completed: false
              recalled:
                summary: Recall — document back to Draft
                value:
                  approval: { id: apr_6c1d, companyId: co_acme, docType: Sales Invoice, collection: salesInvoices, docId: inv_01j8k3, docNumber: DRAFT-8821, amount: 118000, currency: INR, branchId: br_ho, requesterId: usr_priya, requesterName: Priya Sharma, steps: [{ order: 1, name: Finance review, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, status: Skipped, commentRequired: false }], currentStep: 0, status: Recalled, submittedAt: '2026-09-12T15:10:00Z', completedAt: '2026-09-13T09:11:00Z', history: [{ at: '2026-09-13T09:11:00Z', by: Priya Sharma, action: Recalled, comment: Found an error in the lines — will resubmit }], createdAt: '2026-09-12T15:10:00Z', updatedAt: '2026-09-13T09:11:00Z', version: 2 }
                  document: { id: inv_01j8k3, number: DRAFT-8821, docType: Sales Invoice, status: Draft, version: 5 }
                  completed: true
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403':
        description: Not an approver of the current step, or self-approval
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              notApprover: { summary: Not your step, value: { code: DENIED, message: Only Finance Admin can act on step 1 (Finance review), details: { step: 1, approverLabel: Finance Admin }, correlationId: corr_9f1c2e7a } }
              selfApproval: { summary: Own request, value: { code: SELF_APPROVAL, message: You submitted this request — self-approval is not allowed by rule WF-SI-100K, correlationId: corr_9f1c2e7a } }
              cannotDelegate: { summary: Step does not allow delegation, value: { code: DENIED, message: Step Treasury approval cannot be delegated, correlationId: corr_9f1c2e7a } }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/approvals/bulk-act:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Approvals]
    summary: Approve or reject several requests
    description: Each id is processed independently — partial success is reported per id.
    operationId: bulkActOnApprovals
    x-permission: approvals.act.approve
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/approvals.yaml#/BulkApprovalAction' }
          examples:
            approveSelected: { summary: Approve three, value: { ids: [apr_6c1d, apr_7e2f, apr_8a0b], action: Approve, comment: Batch approved after review } }
            rejectSelected: { summary: Reject two, value: { ids: [apr_1, apr_2], action: Reject, comment: Missing supporting documents } }
    responses:
      '200':
        description: Per-id results
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/BulkResult' }
            examples:
              allSucceeded: { summary: All approved, value: { requested: 2, succeeded: 2, failed: 0, results: [{ id: apr_6c1d, ok: true, status: Approved }, { id: apr_7e2f, ok: true, status: Approved }] } }
              partialFailure: { summary: One self-approval refused, value: { requested: 3, succeeded: 2, failed: 1, results: [{ id: apr_6c1d, ok: true, status: Approved }, { id: apr_7e2f, ok: true, status: Approved }, { id: apr_8a0b, ok: false, code: SELF_APPROVAL, message: You submitted this request — self-approval is not allowed }] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

