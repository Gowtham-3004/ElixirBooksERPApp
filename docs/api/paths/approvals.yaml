# Approvals inbox + activity feed (tag: Approvals). engine.ts:818-944, modules/approvals/*

/approvals:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Approvals]
    summary: Approval inbox
    description: |
      Generic inbox over every workflow document type. `tab` mirrors the UI: `awaiting-me` (steps I can act on),
      `my-requests` (submitted by me), `all-pending`, `completed`. Each row includes `canAct` / `cannotActReason`
      for the caller, ageing and SLA breach.

      Query examples — `?tab=awaiting-me` · `?tab=all-pending&docType=Vendor Invoice` · `?tab=completed&dateFrom=2026-09-01` · `?slaBreached=true`.
    operationId: listApprovals
    x-permission: approvals.act.view
    x-frd: [FR-WFL-002, FR-WFL-003]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - { name: tab, in: query, schema: { type: string, enum: [awaiting-me, my-requests, all-pending, completed], default: awaiting-me } }
      - { name: docType, in: query, schema: { $ref: '../components/schemas/approvals.yaml#/WorkflowDocType' } }
      - { name: status, in: query, schema: { type: string }, style: form, explode: false, example: 'Pending' }
      - { name: requesterId, in: query, schema: { type: string } }
      - { name: slaBreached, in: query, schema: { type: boolean } }
      - $ref: '../components/parameters.yaml#/BranchFilter'
      - $ref: '../components/parameters.yaml#/AmountMin'
      - $ref: '../components/parameters.yaml#/AmountMax'
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
    responses:
      '200':
        description: Requests
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/approvals.yaml#/ApprovalRequest' } }
            examples:
              awaitingMe:
                summary: tab = awaiting-me
                value:
                  data:
                    - { id: apr_6c1d, companyId: co_acme, docType: Sales Invoice, collection: salesInvoices, docId: inv_01j8k3, docNumber: DRAFT-8821, amount: 118000, currency: INR, branchId: br_ho, requesterId: usr_priya, requesterName: Priya Sharma, ruleId: wf_si_100k, ruleName: Sales invoices above ₹1 lakh, ruleVersion: 2, steps: [{ order: 1, name: Finance review, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, status: Pending, commentRequired: false, dueAt: '2026-09-13T15:10:00Z' }], currentStep: 0, status: Pending, submittedAt: '2026-09-12T15:10:00Z', history: [{ at: '2026-09-12T15:10:00Z', by: Priya Sharma, action: Submitted }], summary: 'Arlene Traders · 3 lines · ₹1,18,000', canAct: true, ageingHours: 18, slaBreached: false, createdAt: '2026-09-12T15:10:00Z', updatedAt: '2026-09-12T15:10:00Z', version: 1 }
                    - { id: apr_7e2f, companyId: co_acme, docType: Payment Batch, collection: paymentBatches, docId: pb_00012, docNumber: PB/2026-27/00012, amount: 1264000, currency: INR, branchId: br_ho, requesterId: usr_anita, requesterName: Anita Rao, ruleId: wf_pay_batch, ruleName: Payment batches (maker-checker), ruleVersion: 1, steps: [{ order: 1, name: Treasury approval, approverType: Role, approverRef: role_treasury, approverLabel: Treasury, status: Pending, commentRequired: true, dueAt: '2026-09-13T17:00:00Z' }], currentStep: 0, status: Pending, submittedAt: '2026-09-13T09:00:00Z', history: [{ at: '2026-09-13T09:00:00Z', by: Anita Rao, action: Submitted }], summary: '6 suppliers · ₹12,64,000', canAct: true, ageingHours: 0.2, slaBreached: false, createdAt: '2026-09-13T09:00:00Z', updatedAt: '2026-09-13T09:00:00Z', version: 1 }
                  meta: { nextCursor: null, limit: 25, total: 2, counts: { 'Awaiting me': 2, 'My requests': 1, 'All pending': 5, Completed: 212 } }
                  scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' }
              myRequests:
                summary: tab = my-requests (cannot self-approve)
                value:
                  data:
                    - { id: apr_8a0b, companyId: co_acme, docType: Expense Claim, collection: expenseClaims, docId: exp_00071, docNumber: EXP/2026-27/00071, amount: 8400, currency: INR, branchId: br_ho, requesterId: usr_rahul, requesterName: Rahul Mehta, ruleId: wf_exp_5k, ruleName: Expense claims above ₹5,000, ruleVersion: 1, steps: [{ order: 1, name: Line manager, approverType: Manager, approverRef: usr_owner, approverLabel: Reporting manager, status: Pending, commentRequired: false }], currentStep: 0, status: Pending, submittedAt: '2026-09-11T12:00:00Z', history: [], summary: Client dinner · 2 receipts, canAct: false, cannotActReason: You submitted this request (self-approval is not allowed), ageingHours: 45, slaBreached: false, createdAt: '2026-09-11T12:00:00Z', updatedAt: '2026-09-11T12:00:00Z', version: 1 }
                  meta: { nextCursor: null, limit: 25, total: 1 }
                  scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/approvals/{id}:
