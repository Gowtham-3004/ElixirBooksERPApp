    responses:
      '200':
        description: Request
        content:
          application/json:
            schema: { $ref: '../components/schemas/approvals.yaml#/ApprovalRequest' }
            examples:
              pending: { summary: Pending at step 1, value: { id: apr_6c1d, companyId: co_acme, docType: Sales Invoice, collection: salesInvoices, docId: inv_01j8k3, docNumber: DRAFT-8821, amount: 118000, currency: INR, branchId: br_ho, requesterId: usr_priya, requesterName: Priya Sharma, ruleId: wf_si_100k, ruleName: Sales invoices above ₹1 lakh, ruleVersion: 2, steps: [{ order: 1, name: Finance review, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, status: Pending, commentRequired: false, dueAt: '2026-09-13T15:10:00Z' }], currentStep: 0, status: Pending, submittedAt: '2026-09-12T15:10:00Z', history: [{ at: '2026-09-12T15:10:00Z', by: Priya Sharma, action: Submitted }], summary: 'Arlene Traders · 3 lines · ₹1,18,000', canAct: true, ageingHours: 18, slaBreached: false, createdAt: '2026-09-12T15:10:00Z', updatedAt: '2026-09-12T15:10:00Z', version: 1 } }
              approved: { summary: Approved (completed), value: { id: apr_6c1d, companyId: co_acme, docType: Sales Invoice, collection: salesInvoices, docId: inv_01j8k3, docNumber: INV/2026-27/00042, amount: 118000, currency: INR, branchId: br_ho, requesterId: usr_priya, requesterName: Priya Sharma, ruleId: wf_si_100k, ruleName: Sales invoices above ₹1 lakh, ruleVersion: 2, steps: [{ order: 1, name: Finance review, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, status: Approved, actedBy: Rahul Mehta, actedById: usr_rahul, actedAt: '2026-09-13T09:11:00Z', comment: ok, commentRequired: false }], currentStep: 1, status: Approved, submittedAt: '2026-09-12T15:10:00Z', completedAt: '2026-09-13T09:11:00Z', history: [{ at: '2026-09-12T15:10:00Z', by: Priya Sharma, action: Submitted }, { at: '2026-09-13T09:11:00Z', by: Rahul Mehta, action: Approved, comment: ok, step: 1 }], canAct: false, cannotActReason: Request is complete, ageingHours: 18, slaBreached: false, createdAt: '2026-09-12T15:10:00Z', updatedAt: '2026-09-13T09:11:00Z', version: 2 } }
              escalated: { summary: SLA breached and escalated, value: { id: apr_9d3e, companyId: co_acme, docType: Purchase Order, collection: purchaseOrders, docId: po_00118, docNumber: PO/SRT/0118/26-27, amount: 640000, currency: INR, branchId: br_surat, requesterId: usr_suresh, requesterName: Suresh Patel, ruleId: wf_po_50k, ruleName: Purchase orders above ₹50k, ruleVersion: 1, steps: [{ order: 1, name: Purchase manager, approverType: Role, approverRef: role_purchmgr, approverLabel: Purchase Manager, status: Escalated, commentRequired: false, dueAt: '2026-09-11T09:00:00Z' }], currentStep: 0, status: Pending, submittedAt: '2026-09-10T09:00:00Z', history: [{ at: '2026-09-10T09:00:00Z', by: Suresh Patel, action: Submitted }, { at: '2026-09-12T09:00:00Z', by: system, action: Escalated to Tenant Owner, step: 1 }], canAct: true, ageingHours: 72, slaBreached: true, createdAt: '2026-09-10T09:00:00Z', updatedAt: '2026-09-12T09:00:00Z', version: 2 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
