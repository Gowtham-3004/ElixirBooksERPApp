      '201':
        description: Workspace created
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/auth.yaml#/RegisterResult' }
            examples:
              created:
                summary: Trial tenant + company + owner
                value:
                  next: onboarding
                  tokens: { accessToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c3JfemVuIn0.sig, refreshToken: rt_9c2d, expiresIn: 900, tokenType: Bearer }
                  tenant: { id: tnt_zen, name: Zen Foods Pvt Ltd, planId: plan_std, planCode: GROWTH, subscriptionState: Trial, trialEndsAt: '2026-09-27', ownerUserId: usr_zen_owner, usage: { users: 1, companies: 1, invoicesPerMonth: 0, storageMb: 0 }, country: IN, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 2 }
                  company: { id: co_zen, tenantId: tnt_zen, code: ZENFOO, legalName: Zen Foods Pvt Ltd, tradeName: Zen Foods Pvt Ltd, country: IN, baseCurrency: INR, permittedCurrencies: [INR, USD], timeZone: Asia/Kolkata, locale: en-IN, language: en, fiscalYearStartMonth: 4, booksFrom: '2026-09-13', openingBalanceDate: '2026-09-13', nature: Trading, profiles: [Trading], profileHistory: [], businessType: Private Limited, address: { line1: '', city: '', state: '', country: IN }, email: meera@zenfoods.example, logoText: Z, brandColor: '#325CFF', localizationPack: IN, localizationVersion: '1.4', registrations: [], defaults: { allowNegativeStock: false, valuationMethod: AVCO, matchingMode: 3-way, matchTolerancePct: 2, matchToleranceAmt: 500, creditPolicy: Warn, directInvoiceStock: true, paymentTerms: Net 30 }, status: Active, onboarding: { nature: Done, legal: Pending, address: Pending, currency: Pending, periods: Done, users: Pending, masters: Pending, opening: Pending, bank: Pending, numbering: Done, einvoice: Pending }, baseCurrencyLocked: false, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 2 }
                  branch: { id: br_zen_ho, companyId: co_zen, code: BR-001, name: Head Office, type: Office, address: { line1: '', city: '', state: '', country: IN }, status: Active, isDefault: true, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }
                  user: { id: usr_zen_owner, tenantId: tnt_zen, name: Meera Iyer, email: meera@zenfoods.example, roleIds: [role_owner], companyIds: [co_zen], branchIds: [], status: Active, mfaEnabled: false, passwordSet: true, isTenantOwner: true, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }
                  periodsCreated: 12
                  numberSeriesCreated: 18
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '409':
        description: E-mail already registered, or idempotency conflict
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              emailExists: { summary: E-mail already in use, value: { code: DUPLICATE, message: An account already exists for meera@zenfoods.example — sign in or reset your password, field: email, correlationId: corr_9f1c2e7a } }
              idempotency: { summary: Key reused with a different payload, value: { code: IDEMPOTENCY_CONFLICT, message: Idempotency-Key was already used with a different payload, correlationId: corr_9f1c2e7a } }
      '429': { $ref: '../components/responses.yaml#/TooManyRequests' }

# ── current user ──────────────────────────────────────────────────────────

/me:
  get:
    tags: [Auth]
    summary: Current user, roles, permissions, companies, tenant and context
    operationId: getMe
    responses:
      '200':
        description: Me
        content:
          application/json:
            schema: { $ref: '../components/schemas/auth.yaml#/Me' }
            examples:
              salesManager: { $ref: '../components/examples/auth.yaml#/MeFull' }
              ownerOnTrial: { $ref: '../components/examples/auth.yaml#/MeOwnerTrial' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  patch:
    tags: [Auth]
    summary: Update my profile
    operationId: updateMe
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/MeUpdate' }
          examples:
            phone: { summary: Change phone, value: { phone: '+91 98200 99887' } }
            locale: { summary: Change locale + time zone, value: { locale: en-US, timeZone: Asia/Dubai } }
    responses:
      '200':
        description: Updated user
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/User' }
            examples:
              updated: { $ref: '../components/examples/admin.yaml#/UserPriya' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/me/context:
  get:
    tags: [Auth]
    summary: Current scope (company / branch / FY / period)
    operationId: getContext
    responses:
      '200':
        description: Context
        content:
          application/json:
            schema: { $ref: '../components/schemas/auth.yaml#/Context' }
            examples:
              acme: { summary: Acme · HO · Sep 2026, value: { companyId: co_acme, branchId: br_ho, fy: '2026-27', periodCode: '2026-09' } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  put:
    tags: [Auth]
    summary: Switch company / branch / period
    description: Switching company re-derives the default branch, FY and open period and refreshes permissions, defaults, currency and entitled modules — the response is the full `Me`.
    operationId: setContext
    x-frd: [FR-ORG-003]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/Context' }
          examples:
            switchCompany: { summary: Switch to the UAE entity (branch/period re-derived), value: { companyId: co_gulf } }
            switchBranch: { summary: Change branch only, value: { companyId: co_acme, branchId: br_andheri } }
            switchPeriod: { summary: Work in a prior open period, value: { companyId: co_acme, branchId: br_ho, fy: '2026-27', periodCode: '2026-08' } }
    responses:
      '200':
        description: Refreshed me
        content:
          application/json:
            schema: { $ref: '../components/schemas/auth.yaml#/Me' }
            examples:
              switched: { $ref: '../components/examples/auth.yaml#/MeFull' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/me/mfa/enable:
  post:
    tags: [Auth]
    summary: Enable MFA (TOTP) for my account
    description: Returns the TOTP secret / otpauth URL and one-time recovery codes. MFA becomes effective on the next sign-in.
    operationId: enableMfa
    x-frd: [FR-IAM-002]
    responses:
      '200':
        description: TOTP setup
        content:
          application/json:
            schema: { $ref: '../components/schemas/auth.yaml#/MfaEnableResult' }
            examples:
              setup: { summary: Secret + recovery codes, value: { secret: JBSWY3DPEHPK3PXP, otpauthUrl: 'otpauth://totp/ElixirBooks:priya@acme.example?secret=JBSWY3DPEHPK3PXP&issuer=ElixirBooks', recoveryCodes: [9f3k-2m1p, 7a8c-4e2q, 1b2d-8k9l, 5m6n-3p4q, 0r1s-7t8u] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/me/mfa/disable:
  post:
    tags: [Auth]
    summary: Disable MFA for my account
    description: Requires the current password. Not allowed when the tenant enforces MFA (`403`).
    operationId: disableMfa
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [password], properties: { password: { type: string, format: password, writeOnly: true } } }
          examples:
            confirm: { summary: Confirm with password, value: { password: 'S3cure!pass' } }
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/me/sessions:
  get:
    tags: [Auth]
    summary: My active sessions
    operationId: listMySessions
    responses:
      '200':
        description: Sessions
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/auth.yaml#/UserSession' } } } }
            examples:
              two: { summary: Two devices, value: { data: [{ id: s_1a2b, device: Chrome on Windows, at: '2026-09-13T08:58:00Z', ip: 103.21.58.10, current: true }, { id: s_9z8y, device: Safari on iPhone, at: '2026-09-11T19:20:00Z', ip: 49.36.12.7 }] } }
              one: { summary: Only this device, value: { data: [{ id: s_1a2b, device: Chrome on Windows, at: '2026-09-13T08:58:00Z', current: true }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/me/sessions/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/Id'
  delete:
    tags: [Auth]
    summary: Sign out one of my sessions
    operationId: revokeMySession
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

# ── onboarding wizard ─────────────────────────────────────────────────────

/onboarding:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Auth]
    summary: Onboarding state for the company
    operationId: getOnboarding
    x-permission: admin.company.view
    x-frd: [FR-ORG-008]
    responses:
      '200':
        description: State + readiness rows
        content:
          application/json:
            schema: { $ref: '../components/schemas/auth.yaml#/OnboardingState' }
            examples:
              fresh: { $ref: '../components/examples/auth.yaml#/OnboardingFresh' }
              complete: { $ref: '../components/examples/auth.yaml#/OnboardingComplete' }
              blocked: { $ref: '../components/examples/auth.yaml#/OnboardingBlockedOpening' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/onboarding/readiness:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Auth]
    summary: Readiness checklist (home dashboard card)
    operationId: getOnboardingReadiness
    x-permission: admin.company.view
    responses:
      '200':
        description: Rows
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/auth.yaml#/ReadinessRow' } } } }
            examples:
              rows: { summary: Mixed, value: { data: [{ key: legal, label: Legal identity & registrations, status: Pending, detail: PAN missing, link: admin/company }, { key: periods, label: Financial year & periods, status: Done, detail: 12 periods, link: admin/periods }, { key: opening, label: Opening balances, status: Blocked, detail: Opening-balance date falls in a locked period, link: accounting/opening-balances }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/onboarding/steps/{step}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - { name: step, in: path, required: true, schema: { type: string, enum: [nature, legal, address, currency, periods, users, masters, opening, bank, einvoice] }, example: legal }
  put:
    tags: [Auth]
    summary: Save a wizard step
    description: Body shape depends on `step` (see `OnboardingStepInput`). Each step writes a slice of the Company record and flips its readiness flag; `users` sends invitations; `bank` creates bank accounts; `periods` regenerates the FY periods when the FY start changes (blocked once postings exist).
    operationId: saveOnboardingStep
    x-permission: admin.company.edit
    x-frd: [FR-ORG-001, FR-ORG-002, FR-BIZ-002]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/auth.yaml#/OnboardingStepInput' }
          examples:
            nature: { summary: step = nature, value: { nature: Hybrid, characteristics: [Multi-branch, Export] } }
            legal: { summary: step = legal, value: { legalName: Zen Foods Pvt Ltd, pan: AABCZ1234F, businessType: Private Limited, registrations: [{ type: GSTIN, number: 27AABCZ1234F1Z9, state: Maharashtra, stateCode: '27' }] } }
            address: { summary: step = address (+ extra branch), value: { address: { line1: 12 MIDC Road, city: Pune, state: Maharashtra, stateCode: '27', pin: '411019', country: IN }, phone: '+91 20 4000 9876', branches: [{ code: BR-002, name: Pune Warehouse, type: Warehouse, address: { line1: Plot 7 MIDC, city: Pune, state: Maharashtra, stateCode: '27', pin: '411019', country: IN } }] } }
            currency: { summary: step = currency, value: { baseCurrency: INR, reportingCurrency: USD, permittedCurrencies: [INR, USD], timeZone: Asia/Kolkata, locale: en-IN } }
            periods: { summary: step = periods, value: { fiscalYearStartMonth: 4, booksFrom: '2026-04-01', openingBalanceDate: '2026-03-31' } }
            users: { summary: step = users (invitations), value: { invites: [{ email: cfo@zenfoods.example, roleId: role_finadmin }, { email: sales@zenfoods.example, roleId: role_salesuser }] } }
            masters: { summary: step = masters, value: { mode: import } }
            opening: { summary: step = opening, value: { mode: manual } }
            bank: { summary: step = bank, value: { bankAccounts: [{ name: HDFC Bank — Current A/c, bankName: HDFC Bank, accountNumber: '50200012344412', ifsc: HDFC0000240, branch: Nariman Point, currency: INR, openingBalance: 250000 }] } }
            einvoice: { summary: step = einvoice (skip for now), value: { skip: true } }
    responses:
      '200':
        description: Updated onboarding state
        content:
          application/json:
            schema: { $ref: '../components/schemas/auth.yaml#/OnboardingState' }
            examples:
              afterLegal: { $ref: '../components/examples/auth.yaml#/OnboardingFresh' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/onboarding/complete:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Auth]
    summary: Finish the wizard
    description: Recomputes readiness, stores the flags and audits `onboarding.completed`. Allowed with pending items (they stay on the home checklist); blocked items are reported back.
    operationId: completeOnboarding
    x-permission: admin.company.edit
    responses:
      '200':
        description: Final state
        content:
          application/json:
            schema: { $ref: '../components/schemas/auth.yaml#/OnboardingState' }
            examples:
              complete: { $ref: '../components/examples/auth.yaml#/OnboardingComplete' }
              withBlocked: { $ref: '../components/examples/auth.yaml#/OnboardingBlockedOpening' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
