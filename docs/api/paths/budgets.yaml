# ── settings ──────────────────────────────────────────────────────────────

/budgets/settings:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Budgets]
    summary: Expense settings (receipt threshold, per-diems, control accounts)
    operationId: getExpenseSettings
    x-permission: budgets.expenses.view
    responses:
      '200':
        description: Settings
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/ExpenseSettings' }
            examples:
              current: { summary: Current, value: { receiptRequiredAbove: 500, perDiemDomestic: 750, perDiemInternational: 3500, corporateCardAccountId: acc_2350, employeePayableAccountId: acc_2340 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  put:
    tags: [Budgets]
    summary: Update expense settings
    operationId: updateExpenseSettings
    x-permission: budgets.settings.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/admin.yaml#/ExpenseSettings' }
          examples:
            thresholds: { summary: Thresholds, value: { receiptRequiredAbove: 1000, perDiemDomestic: 900 } }
    responses:
      '200':
        description: Saved
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/ExpenseSettings' }
            examples:
              saved: { summary: Saved, value: { receiptRequiredAbove: 1000, perDiemDomestic: 900, perDiemInternational: 3500, corporateCardAccountId: acc_2350, employeePayableAccountId: acc_2340 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
