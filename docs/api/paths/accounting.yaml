# Accounting (tag: Accounting). engine.postJournal / postDraftJournal / reverseJournal / submitForApproval; src/modules/accounting/*.

# ── journals ──────────────────────────────────────────────────────────────

/accounting/journals:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Accounting]
    summary: Journal register
    description: "Tabs → All · Draft · Awaiting approval (`status=Submitted`) · Approved · Posted · Reversed. Query examples — `?type=Manual` · `?sourceType=Sales Invoice` · `?accountId=acc_1100` · `?period=2026-09` · `?q=JV/2026-27/00311` · `?amountMin=100000`."
    operationId: listJournals
    x-permission: accounting.journal.view
    x-frd: [FR-ACC-001, FR-ACC-003]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: type, in: query, schema: { type: string, enum: [Auto, Manual, Recurring, Opening, Reversal, Revaluation, Closing, Consolidation] } }
      - { name: sourceType, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/AccountId'
      - $ref: '../components/parameters.yaml#/PeriodCode'
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
      - $ref: '../components/parameters.yaml#/AmountMin'
      - $ref: '../components/parameters.yaml#/AmountMax'
    responses:
      '200':
        description: Journals
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/document.yaml#/Journal' } }
            examples:
              firstPage: { summary: Manual + auto, value: { data: [{ $ref: '#/components/examples/JournalPosted/value' }, { $ref: '#/components/examples/JournalDraft/value' }], meta: { nextCursor: 'eyJkIjoiMjAyNi0wOS0xMiIsImlkIjoiam5sXzMxMCJ9', limit: 25, total: 412, counts: { All: 412, Draft: 3, 'Awaiting approval': 1, Approved: 0, Posted: 404, Reversed: 4 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Accounting]
    summary: Create a manual journal (Draft)
    description: "Validation mirrors `validateDraft`: ≥2 lines, balanced, active posting accounts, party on AR/AP/Employee control accounts, required/prohibited dimensions, currency behaviour. Issues come back as `422 VALIDATION` with `details.issues[]`."
    operationId: createJournal
    x-permission: accounting.journal.create
    x-frd: [FR-ACC-001, FR-ACC-002]
    x-events: [DocumentCreated]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/accounting.yaml#/JournalCreate' }
          examples:
            simple: { summary: Two-line expense accrual, value: { date: '2026-09-13', narration: Office rent for September 2026, reference: RENT-SEP-26, lines: [{ accountId: acc_5100, dr: 25000, narration: Sept office rent }, { accountId: acc_2100, cr: 25000, partyType: Supplier, partyId: sup_landlord }] } }
            multiWithParty: { summary: Multi-line with party on a control account, value: { date: '2026-09-13', narration: Write-off small AR balances, lines: [{ accountId: acc_5800, dr: 1250 }, { accountId: acc_1100, cr: 750, partyType: Customer, partyId: cust_arlene }, { accountId: acc_1100, cr: 500, partyType: Customer, partyId: cust_walkin }] } }
            withDimensions: { summary: Dimensions on each line, value: { date: '2026-09-13', branchId: br_andheri, narration: Marketing spend re-class, lines: [{ accountId: acc_5400, dr: 40000, dimensions: { Department: dim_mkt, CostCentre: cc_digital } }, { accountId: acc_5410, cr: 40000, dimensions: { Department: dim_mkt } }] } }
            foreignCurrency: { summary: USD journal with rate, value: { date: '2026-09-13', currency: USD, rate: 84, narration: Consultancy fee accrual (USD), lines: [{ accountId: acc_5200, dr: 1000 }, { accountId: acc_2100, cr: 1000, partyType: Supplier, partyId: sup_ustech }] } }
            fromTemplate: { summary: From template (override amount), value: { date: '2026-09-30', templateId: jt_rent, narration: Office rent for September 2026, lines: [{ accountId: acc_5100, dr: 26000 }, { accountId: acc_2100, cr: 26000, partyType: Supplier, partyId: sup_landlord }] } }
    responses:
      '201':
        description: Draft journal
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/document.yaml#/Journal' }
            examples:
              draft: { $ref: '../components/examples/accounting.yaml#/JournalDraft' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Draft validation
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              unbalanced: { summary: Not balanced, value: { code: UNBALANCED, message: 'Journal is not balanced: Dr 25000.00 ≠ Cr 24000.00 (difference 1000.00)', field: balance, details: { issues: [{ field: balance, message: 'Journal is not balanced: Dr 25000.00 ≠ Cr 24000.00 (difference 1000.00)' }] }, correlationId: corr_9f1c2e7a } }
              controlAccount: { summary: Party missing on control account, value: { code: CONTROL_ACCOUNT, message: 'Line 2: control account 2100 needs a supplier (FR-ACC-002)', field: 'lines[1].partyId', details: { issues: [{ lineIndex: 1, field: partyId, message: 'Line 2: control account 2100 needs a supplier (FR-ACC-002)' }] }, correlationId: corr_9f1c2e7a } }
              dimensionRequired: { summary: Required dimension missing, value: { code: DIMENSION_REQUIRED, message: 'Line 1: 5400 requires dimension "Department"', field: 'lines[0].dimensions.Department', correlationId: corr_9f1c2e7a } }
              postingNotAllowed: { summary: Header account, value: { code: POSTING_NOT_ALLOWED, message: 'Line 1: 5000 · Expenses is a header account — posting not allowed', field: 'lines[0].accountId', correlationId: corr_9f1c2e7a } }
              baseOnly: { summary: Base-currency-only account on a USD journal, value: { code: INVALID_ACCOUNT, message: 'Line 2: 2100 accepts base currency only', field: 'lines[1].accountId', correlationId: corr_9f1c2e7a } }
              duplicateWarn: { summary: Duplicate rule (Block mode), value: { code: DUPLICATE, message: "A journal with the same date, amount and narration exists (JV/2026-27/00340)", details: { existingId: jnl_340, rule: Journal }, correlationId: corr_9f1c2e7a } }

/accounting/journals/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Accounting]
    summary: Get a journal
    operationId: getJournal
    x-permission: accounting.journal.view
    responses:
      '200':
        description: Journal
        content:
          application/json:
            schema: { $ref: '../components/schemas/document.yaml#/Journal' }
            examples:
              draft: { $ref: '../components/examples/accounting.yaml#/JournalDraft' }
              posted: { $ref: '../components/examples/accounting.yaml#/JournalPosted' }
              reversed: { $ref: '../components/examples/accounting.yaml#/JournalReversed' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Accounting]
    summary: Edit a Draft / Rejected / Returned journal
    operationId: updateJournal
    x-permission: accounting.journal.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/accounting.yaml#/JournalPatch' }
          examples:
            fieldsOnly: { summary: Narration and date, value: { expectedVersion: 1, date: '2026-09-14', narration: Office rent for September 2026 (revised) } }
            replaceLines: { summary: Replace lines, value: { expectedVersion: 1, lines: [{ accountId: acc_5100, dr: 26000 }, { accountId: acc_2100, cr: 26000, partyType: Supplier, partyId: sup_landlord }] } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/document.yaml#/Journal' }
            examples:
              updated: { $ref: '../components/examples/accounting.yaml#/JournalDraft' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
  delete:
    tags: [Accounting]
    summary: Delete a Draft journal (audited with reason)
    operationId: deleteJournal
    x-permission: accounting.journal.delete
    parameters:
      - { name: reason, in: query, required: true, schema: { type: string, minLength: 3 }, example: Duplicate of JV/2026-27/00340 }
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/accounting/journals/{id}/submit:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Accounting]
    summary: Submit (route to 'Journal' workflow, or post directly when no rule applies)
    operationId: submitJournal
    x-permission: accounting.journal.submit
    x-idempotent: true
    x-workflow-doc-type: Journal
    x-events: [DocumentSubmitted, DocumentPosted, JournalPosted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Outcome
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/document.yaml#/Journal' }
                    outcome: { $ref: '../components/schemas/accounting.yaml#/JournalSubmitOutcome' }
            examples:
              routed: { summary: outcome = routed-for-approval, value: { document: { id: jnl_411, companyId: co_acme, number: JV/2026-27/00411, date: '2026-09-13', period: '2026-09', fy: '2026-27', branchId: br_ho, currency: INR, rate: 1, status: Submitted, type: Manual, sourceType: Manual Journal, sourceNumber: RENT-SEP-26, narration: Office rent for September 2026, lines: [], totalDr: 25000, totalCr: 25000, approvalId: apr_jnl_411, correlationId: corr_jnl411, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:20:00Z', version: 2 }, outcome: routed-for-approval, approval: { id: apr_jnl_411, companyId: co_acme, docType: Journal, collection: journals, docId: jnl_411, docNumber: JV/2026-27/00411, amount: 25000, currency: INR, branchId: br_ho, requesterId: usr_priya, requesterName: Priya Sharma, steps: [{ order: 1, name: Finance manager, approverType: Role, approverRef: role_finmgr, approverLabel: Finance Manager, status: Pending, commentRequired: false }], currentStep: 0, status: Pending, submittedAt: '2026-09-13T09:20:00Z', history: [], createdAt: '2026-09-13T09:20:00Z', updatedAt: '2026-09-13T09:20:00Z', version: 1 }, warnings: [] } }
              postedDirectly: { summary: "outcome = posted (no rule, period open)", value: { document: { $ref: '#/components/examples/JournalPosted/value' }, outcome: posted, warnings: [] } }
              approvedOnly: { summary: "outcome = approved (no rule, period closed)", value: { document: { id: jnl_411, companyId: co_acme, number: JV/2026-27/00411, date: '2026-08-31', period: '2026-08', fy: '2026-27', branchId: br_ho, currency: INR, rate: 1, status: Approved, type: Manual, sourceType: Manual Journal, narration: August accrual, lines: [], totalDr: 25000, totalCr: 25000, correlationId: corr_jnl411, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:20:00Z', version: 2 }, outcome: approved, warnings: ['Saved as approved — period 2026-08 is Soft Closed; post once reopened or with accounting.period.postclosed'] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/accounting/journals/{id}/post:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Accounting]
    summary: Post an Approved (or Draft, when no workflow applies) journal
    description: "`postDraftJournal` — allocates the number, stamps period/FY, re-validates against the engine rules and locks the record. Posting into a Soft Closed period needs `accounting.period.postclosed` (`skipPeriodCheck`)."
    operationId: postJournal
    x-permission: accounting.journal.post
    x-frd: [FR-ACC-003, FR-ACC-005]
    x-idempotent: true
    x-events: [DocumentPosted, JournalPosted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema: { type: object, properties: { skipPeriodCheck: { type: boolean, default: false, description: Post into a Soft Closed period (needs accounting.period.postclosed). } } }
          examples:
            default: { summary: Normal, value: {} }
            softClosed: { summary: Into a soft-closed period, value: { skipPeriodCheck: true } }
    responses:
      '200':
        description: Posted
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/document.yaml#/Journal' }
            examples:
              posted: { summary: Posted, value: { document: { $ref: '#/components/examples/JournalPosted/value' }, outcome: posted, journal: { $ref: '#/components/examples/JournalPosted/value' }, warnings: [] } }
              withPartyWarning: { summary: Party lines on control accounts, value: { document: { $ref: '#/components/examples/JournalPosted/value' }, outcome: posted, warnings: ['Party balances on 2100 changed; no open item is created by a manual journal'] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

/accounting/journals/{id}/reverse:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Accounting]
    summary: Reverse a posted journal (creates a mirror journal of type Reversal)
    operationId: reverseJournal
    x-permission: accounting.journal.reverse
    x-frd: [FR-ACC-004]
    x-idempotent: true
    x-events: [DocumentReversed, JournalReversed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            sameDate: { $ref: '../components/examples/common.yaml#/ReasonReverse' }
            datedInOpenPeriod: { $ref: '../components/examples/common.yaml#/ReasonReverseDated' }
    responses:
      '200':
        description: Reversed
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/document.yaml#/Journal' }
                    journal: { $ref: '../components/schemas/document.yaml#/Journal' }
            examples:
              reversed: { summary: Original → Reversed; reversal journal returned in `journal`, value: { document: { $ref: '#/components/examples/JournalReversed/value' }, outcome: reversed, journal: { id: jnl_412, companyId: co_acme, number: JV/2026-27/00412, date: '2026-09-13', period: '2026-09', fy: '2026-27', branchId: br_ho, currency: INR, rate: 1, status: Posted, type: Reversal, sourceType: Manual Journal, sourceNumber: RENT-SEP-26, narration: 'Reversal of JV/2026-27/00411: Posted twice', lines: [{ id: jl_1, accountId: acc_5100, accountCode: '5100', accountName: Rent, dr: 0, cr: 25000, drBase: 0, crBase: 25000, dimensions: { Branch: br_ho } }, { id: jl_2, accountId: acc_2100, accountCode: '2100', accountName: Accounts Payable, dr: 25000, cr: 0, drBase: 25000, crBase: 0, partyType: Supplier, partyId: sup_landlord, partyName: Skyline Estates, dimensions: { Branch: br_ho } }], totalDr: 25000, totalCr: 25000, reversalOfId: jnl_411, postedAt: '2026-09-13T15:00:00Z', postedBy: Priya Sharma, correlationId: corr_jnl412, createdAt: '2026-09-13T15:00:00Z', updatedAt: '2026-09-13T15:00:00Z', version: 1 }, warnings: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

/accounting/journals/{id}/duplicate:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Accounting]
    summary: Copy a journal as a new Draft
    operationId: duplicateJournal
    x-permission: accounting.journal.create
    requestBody:
      required: false
      content:
        application/json:
          schema: { type: object, properties: { date: { type: string, format: date }, narration: { type: string } } }
          examples:
            nextMonth: { summary: "Same lines, next month", value: { date: '2026-10-31', narration: Office rent for October 2026 } }
    responses:
      '201':
        description: New draft
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/document.yaml#/Journal' }
            examples:
              draft: { $ref: '../components/examples/accounting.yaml#/JournalDraft' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/accounting/journal-templates:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Accounting]
    summary: Journal templates (pre-filled line sets)
    operationId: listJournalTemplates
    x-permission: accounting.journal.view
    responses:
      '200':
        description: Templates
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/accounting.yaml#/JournalTemplate' } } } }
            examples:
              list: { summary: Templates, value: { data: [{ id: jt_rent, name: Monthly office rent, description: Rent expense vs landlord payable, narration: 'Office rent for {period}', lines: [{ accountId: acc_5100, dr: 25000 }, { accountId: acc_2100, cr: 25000, partyType: Supplier, partyId: sup_landlord }] }, { id: jt_prepaid, name: Prepaid insurance release, narration: 'Insurance for {period}', lines: [{ accountId: acc_5500, dr: 4000 }, { accountId: acc_1400, cr: 4000 }] }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

# ── recurring journals ────────────────────────────────────────────────────

/accounting/recurring-journals:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Accounting]
    summary: List recurring journal definitions
    description: "Tabs → Active · Due now (`due=true`) · Paused / ended · All."
    operationId: listRecurringJournals
    x-permission: accounting.journal.view
    x-frd: [FR-ACC-017]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: due, in: query, schema: { type: boolean }, description: Only definitions with `nextRun` ≤ today. }
    responses:
      '200':
        description: Definitions
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/accounting.yaml#/RecurringJournal' } }
            examples:
              firstPage: { summary: Definitions, value: { data: [{ $ref: '#/components/examples/RecurringRent/value' }], meta: { nextCursor: null, limit: 25, total: 1, counts: { Active: 3, 'Due now': 1, 'Paused / ended': 1, All: 4 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Accounting]
    summary: Create a recurring journal
    operationId: createRecurringJournal
    x-permission: accounting.journal.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/accounting.yaml#/RecurringJournalInput'
              - { required: [code, name, frequency, startDate, mode, narration, lines] }
          examples:
            monthlyDraft: { summary: "Monthly, creates drafts", value: { code: RJ-004, name: Office rent accrual, frequency: Monthly, startDate: '2026-10-01', nextRun: '2026-10-31', mode: Draft, narration: 'Office rent accrual {period}', lines: [{ accountId: acc_5100, dr: 25000, cr: 0 }, { accountId: acc_2100, dr: 0, cr: 25000, partyType: Supplier, partyId: sup_landlord }] } }
            quarterlyPost: { summary: "Quarterly, posts directly, ends next FY", value: { code: RJ-005, name: Quarterly insurance release, frequency: Quarterly, startDate: '2026-10-01', endDate: '2027-09-30', mode: Post, narration: 'Insurance amortisation {period}', lines: [{ accountId: acc_5500, dr: 12000, cr: 0 }, { accountId: acc_1400, dr: 0, cr: 12000 }] } }
    responses:
      '201':
        description: Created
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/accounting.yaml#/RecurringJournal' }
            examples:
              created: { $ref: '../components/examples/accounting.yaml#/RecurringRent' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/accounting/recurring-journals/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Accounting]
    summary: Get a recurring definition
