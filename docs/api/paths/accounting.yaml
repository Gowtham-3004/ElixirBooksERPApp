            date: { summary: Specific date, value: { date: '2026-09-30' } }
    responses:
      '201':
        description: Journal generated
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/accounting.yaml#/RecurringJournal' }
                    journal: { $ref: '../components/schemas/document.yaml#/Journal' }
