              posted: { summary: outcome = posted, value: { document: { $ref: '#/components/examples/RecurringRent/value' }, outcome: posted, journal: { $ref: '#/components/examples/JournalPosted/value' }, warnings: [] } }
              fallback: { summary: Post mode but period closed → draft, value: { document: { $ref: '#/components/examples/RecurringRent/value' }, outcome: draft-created, journal: { $ref: '#/components/examples/JournalDraft/value' }, warnings: ['Period 2026-08 is Locked — created as Draft'] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

