    responses:
      '201':
        description: Created
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/accounting.yaml#/IntercompanyDoc' }
            examples:
              bothSides: { summary: Matched immediately, value: { document: { $ref: '#/components/examples/IntercompanyInvoice/value' }, outcome: posted, journals: [{ id: jnl_ic_17a, companyId: co_acme, number: JV/2026-27/00400, date: '2026-09-13', period: '2026-09', fy: '2026-27', branchId: br_ho, currency: USD, rate: 83.2, status: Posted, type: Auto, sourceType: Intercompany, sourceId: ic_0017, sourceNumber: IC/2026-27/00017, narration: IC invoice IC-INV-0017 to Acme Gulf FZE, lines: [{ id: jl_1, accountId: acc_1180, accountCode: '1180', accountName: Due from group companies, dr: 5000, cr: 0, drBase: 416000, crBase: 0, dimensions: {} }, { id: jl_2, accountId: acc_4300, accountCode: '4300', accountName: Shared-services income, dr: 0, cr: 5000, drBase: 0, crBase: 416000, dimensions: {} }], totalDr: 416000, totalCr: 416000, postedAt: '2026-09-13T09:12:04Z', postedBy: Priya Sharma, correlationId: corr_ic17, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }], warnings: [] } }
              oneSide: { summary: Unmatched until counterparty records it, value: { document: { id: ic_0018, companyId: co_acme, type: Payment, number: IC/2026-27/00018, fromCompanyId: co_acme, toCompanyId: co_gulf, date: '2026-09-13', currency: USD, amount: 5000, baseCurrencyFrom: INR, baseCurrencyTo: AED, rateFrom: 84, rateTo: 3.67, baseAmountFrom: 420000, baseAmountTo: 18350, counterpartyRef: IC-PAY-0009, matchStatus: Unmatched, dueFromAccount: acc_1180, dueToAccount: acc_2180, sourceJournalIds: { from: jnl_ic_18a }, sourceJournalNumbers: { from: JV/2026-27/00401 }, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }, outcome: posted, warnings: ['Counterparty Acme Gulf FZE has not recorded IC-PAY-0009 — appears as Unmatched in eliminations'] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
