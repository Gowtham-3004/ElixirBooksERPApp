    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/accounting.yaml#/IntercompanyDocInput'
              - { required: [type, toCompanyId, date, currency, amount, counterpartyRef] }
          examples:
            invoiceBothSides: { summary: "Service invoice, both sides posted", value: { type: Invoice, toCompanyId: co_gulf, date: '2026-09-13', currency: USD, amount: 5000, counterpartyRef: IC-INV-0017, narration: Shared-services fee Q2, dueFromAccount: acc_1180, dueToAccount: acc_2180, postBothSides: true } }
