            exact: { summary: Exact match, value: { counterpartyDocId: ic_gulf_0031 } }
            acceptDifference: { summary: Accept FX difference, value: { counterpartyDocId: ic_gulf_0029, acceptDifference: true, note: Rate-date difference, immaterial } }
    responses:
      '200':
        description: Matched
        content:
          application/json:
            schema: { $ref: '../components/schemas/accounting.yaml#/IntercompanyDoc' }
            examples:
              matched: { $ref: '../components/examples/accounting.yaml#/IntercompanyInvoice' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Business rule
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              amountDiffers: { summary: Amounts differ, value: { code: AMOUNT_MISMATCH, message: 'USD 5,000 here vs USD 4,500 on IC-GULF-0031 — pass acceptDifference or fix the counterparty document', details: { here: 5000, counterparty: 4500 }, correlationId: corr_9f1c2e7a } }

# ── period close ──────────────────────────────────────────────────────────

/accounting/period-close/{code}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Code'
  get:
    tags: [Accounting]
    summary: Period-close checklist (live)
    description: "Finance view of the close: unposted journals, draft SI/VI, unmatched bank lines, pending approvals, failed integrations, control tie-out, stock vs GL. Blockers stop `soft-close`/`lock` under `/periods/{code}`."
    operationId: getAccountingPeriodClose
    x-permission: accounting.period.view
    x-frd: [FR-ACC-012, FR-ACC-013]
    responses:
      '200':
        description: Checklist
        content:
          application/json:
            schema: { $ref: '../components/schemas/accounting.yaml#/PeriodClose' }
            examples:
              blocked: { summary: Two blockers, value: { period: '2026-09', status: Open, from: '2026-09-01', to: '2026-09-30', items: [{ id: drafts, label: Unposted draft journals, status: Blocked, count: 2, detail: 'JV/2026-27/00410, JV/2026-27/00411 — post or delete', link: accounting/journals }, { id: si, label: Draft / submitted sales invoices, status: Done, count: 0, detail: No unposted sales invoices, link: sales/invoices }, { id: vi, label: Draft / submitted vendor invoices & match exceptions, status: Blocked, count: 1, detail: Resolve exceptions and post, link: purchase/vendor-invoices }, { id: bank, label: Unmatched bank statement lines, status: Warning, count: 4, detail: Reconcile in Banking, link: banking/reconciliation }, { id: appr, label: Pending approvals, status: Done, count: 0, detail: Approval inbox is clear for this period, link: approvals }, { id: integ, label: Failed statutory / provider calls, status: Done, count: 0, detail: No failed integration logs, link: admin/integrations/logs }, { id: tieout, label: Control accounts tie out, status: Done, count: 0, detail: AR/AP/Employee tie to sub-ledgers, link: accounting/control-tieout }, { id: stockgl, label: Stock valuation vs inventory GL, status: Done, count: 0, detail: 'Ledger ₹18,42,000 = GL ₹18,42,000', link: inventory/valuation }], blocked: 2, warnings: 1, canSoftClose: false, canLock: false, inventoryGl: { ledgerValue: 1842000, glBalance: 1842000, difference: 0 } } }
              clean: { summary: Ready to close, value: { period: '2026-08', status: Soft Closed, from: '2026-08-01', to: '2026-08-31', items: [{ id: drafts, label: Unposted draft journals, status: Done, count: 0, detail: All journals dated in the period are posted, link: accounting/journals }], blocked: 0, warnings: 0, canSoftClose: true, canLock: true, inventoryGl: { ledgerValue: 1790000, glBalance: 1790000, difference: 0 } } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

# ── settings ──────────────────────────────────────────────────────────────

/accounting/settings:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Accounting]
    summary: Accounting settings (default accounts, dimensions, duplicate rules)
    operationId: getAccountingSettings
    x-permission: accounting.journal.view
    responses:
      '200':
        description: Settings
        content:
          application/json:
            schema: { $ref: '../components/schemas/accounting.yaml#/AccountingSettings' }
            examples:
              current: { summary: Current, value: { roundOffAccountId: acc_5990, fxGainAccountId: acc_4910, fxLossAccountId: acc_5600, unrealisedFxGainAccountId: acc_4920, unrealisedFxLossAccountId: acc_5610, retainedEarningsAccountId: acc_3100, openingBalanceEquityAccountId: acc_3900, defaultDimensions: { Branch: br_ho }, duplicateRules: { Journal: { fields: [date, totalDr, narration], mode: Warn }, 'Vendor Invoice': { fields: [partyId, supplierInvoiceNo], mode: Block } } } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  put:
    tags: [Accounting]
    summary: Update accounting settings
    operationId: updateAccountingSettings
    x-permission: accounting.settings.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/accounting.yaml#/AccountingSettings' }
          examples:
            fxAccounts: { summary: Map FX accounts, value: { fxGainAccountId: acc_4910, fxLossAccountId: acc_5600, unrealisedFxGainAccountId: acc_4920, unrealisedFxLossAccountId: acc_5610 } }
            duplicateRule: { summary: Block duplicate journals, value: { duplicateRules: { Journal: { fields: [date, totalDr, narration], mode: Block } } } }
    responses:
      '200':
        description: Saved
        content:
          application/json:
            schema: { $ref: '../components/schemas/accounting.yaml#/AccountingSettings' }
            examples:
              saved: { summary: Saved, value: { roundOffAccountId: acc_5990, fxGainAccountId: acc_4910, fxLossAccountId: acc_5600, unrealisedFxGainAccountId: acc_4920, unrealisedFxLossAccountId: acc_5610, retainedEarningsAccountId: acc_3100, openingBalanceEquityAccountId: acc_3900, defaultDimensions: { Branch: br_ho }, duplicateRules: { Journal: { fields: [date, totalDr, narration], mode: Block } } } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
