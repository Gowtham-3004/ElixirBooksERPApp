          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/admin.yaml#/NotificationSetting' } } } }
            examples:
              list: { summary: Excerpt, value: { data: [{ id: nset_approval, companyId: co_acme, event: approval.requested, label: Approval requested, category: approval, template: 'Approval needed — {{doc.number}} ({{doc.party}} · {{doc.amount}})', channels: { inApp: true, email: true, sms: false }, enabled: true, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }, { id: nset_due, companyId: co_acme, event: invoice.overdue, label: Invoice overdue, category: due, template: '{{doc.number}} is {{doc.daysOverdue}} days overdue', channels: { inApp: true, email: false, sms: false }, enabled: true, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/notification-settings/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  put:
    tags: [Admin]
    summary: Update a notification setting
    operationId: updateNotificationSetting
    x-permission: admin.company.edit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/admin.yaml#/NotificationSettingInput'
              - $ref: '../components/schemas/common.yaml#/ExpectedVersion'
          examples:
            enableSms: { summary: Add SMS channel, value: { expectedVersion: 1, channels: { inApp: true, email: true, sms: true } } }
            disable: { summary: Disable the event, value: { expectedVersion: 1, enabled: false } }
            template: { summary: Change template, value: { expectedVersion: 1, template: '[Action needed] {{doc.number}} from {{doc.party}} awaits your approval' } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/NotificationSetting' }
            examples:
              updated: { summary: SMS enabled, value: { id: nset_approval, companyId: co_acme, event: approval.requested, label: Approval requested, category: approval, template: 'Approval needed — {{doc.number}} ({{doc.party}} · {{doc.amount}})', channels: { inApp: true, email: true, sms: true }, enabled: true, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/notification-settings/deliveries:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Admin]
    summary: Notification delivery log
    operationId: listNotificationDeliveries
    x-permission: admin.company.view
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - { name: status, in: query, schema: { type: string, enum: [queued, sent, delivered, failed] } }
      - { name: channel, in: query, schema: { type: string, enum: [in-app, email, sms] } }
    responses:
      '200':
        description: Deliveries
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/admin.yaml#/NotificationDelivery' } }
            examples:
              firstPage: { summary: One failed e-mail, value: { data: [{ id: ndl_4a1, event: approval.requested, channel: email, to: rahul@acme.example, status: failed, at: '2026-09-13T09:12:10Z', error: SMTP 550 mailbox full }, { id: ndl_4a0, event: approval.requested, channel: in-app, to: usr_rahul, status: delivered, at: '2026-09-13T09:12:04Z' }], meta: { nextCursor: null, limit: 25, total: 2 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/notification-settings/deliveries/{id}/retry:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Admin]
    summary: Retry a failed delivery
    operationId: retryNotificationDelivery
    x-permission: admin.company.edit
    responses:
      '200':
        description: New attempt
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/NotificationDelivery' }
            examples:
              sent: { summary: Sent, value: { id: ndl_4a1, event: approval.requested, channel: email, to: rahul@acme.example, status: sent, at: '2026-09-13T09:20:00Z' } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

