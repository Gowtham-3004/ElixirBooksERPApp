                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/system.yaml#/ExportJob' } }
            examples:
              firstPage: { summary: Ready + scheduled, value: { data: [{ id: exp_4421, companyId: co_acme, name: Sales invoices — Posted — Sep 2026, entity: salesInvoices, format: csv, filters: { status: [Posted], dateFrom: '2026-09-01', dateTo: '2026-09-30' }, scope: 'Acme Trading · Head Office · Sep 2026 · INR', status: Ready, rows: 1240, requestedBy: Priya Sharma, readyAt: '2026-09-13T09:12:40Z', expiresAt: '2026-09-14T09:12:40Z', masked: false, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:40Z', version: 3 }, { id: exp_sched_pl, companyId: co_acme, name: P&L (monthly), entity: 'report:pl', format: pdf, filters: { preset: MTD }, scope: Acme Trading · All branches, status: Queued, rows: 0, requestedBy: Rahul Mehta, masked: false, schedule: { frequency: Monthly, nextRunAt: '2026-10-01T02:00:00Z', recipients: [cfo@acme.example] }, createdAt: '2026-08-01T09:00:00Z', updatedAt: '2026-09-01T02:00:00Z', version: 2 }], meta: { nextCursor: null, limit: 25, total: 2 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/export-jobs/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Admin]
    summary: Get an export job
    operationId: getExportJob
    x-permission: admin.jobs.view
    responses:
      '200':
        description: Export job
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/ExportJob' }
            examples:
              ready: { summary: Ready to download, value: { id: exp_4421, companyId: co_acme, name: Sales invoices — Posted — Sep 2026, entity: salesInvoices, format: csv, filters: { status: [Posted] }, scope: 'Acme Trading · Head Office · Sep 2026 · INR', status: Ready, rows: 1240, requestedBy: Priya Sharma, readyAt: '2026-09-13T09:12:40Z', expiresAt: '2026-09-14T09:12:40Z', masked: false, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:40Z', version: 3 } }
              expired: { summary: Link expired — request again, value: { id: exp_4300, companyId: co_acme, name: AR ageing — Aug 2026, entity: 'report:ar-ageing', format: xlsx, filters: {}, scope: Acme Trading, status: Expired, rows: 88, requestedBy: Priya Sharma, readyAt: '2026-09-01T10:00:00Z', expiresAt: '2026-09-02T10:00:00Z', masked: false, createdAt: '2026-09-01T09:59:00Z', updatedAt: '2026-09-02T10:00:00Z', version: 4 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/export-jobs/{id}/download:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Admin]
    summary: Download an export file
    operationId: downloadExport
    x-permission: admin.jobs.view
    responses:
      '200':
        description: File (CSV / XLSX / PDF / JSON)
        headers:
          Content-Disposition: { $ref: '../components/headers.yaml#/ContentDisposition' }
        content:
          text/csv:
            schema: { type: string }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
          application/pdf:
            schema: { type: string, format: binary }
          application/json:
            schema: { type: object, additionalProperties: true }
            examples:
              json: { summary: JSON export, value: { rows: [{ number: INV/2026-27/00042, partyName: Arlene Traders, total: 118000 }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '410': { $ref: '../components/responses.yaml#/Gone' }

/export-jobs/{id}/rerun:
