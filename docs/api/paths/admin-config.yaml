  get:
    tags: [Admin]
    summary: List webhooks
    operationId: listWebhooks
    x-permission: admin.integrations.view
    x-frd: [FR-INT-004]
    responses:
      '200':
        description: Webhooks
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/admin.yaml#/Webhook' } } } }
            examples:
              list: { summary: "One active, one paused", value: { data: [{ id: wh_wms, companyId: co_acme, url: 'https://wms.example.com/hooks/elixir', description: Push stock movements and PO status to WMS, events: [StockMoved, PurchaseReceived, DocumentPosted], secretMasked: 'whsec_••••••3f9a', status: Active, lastDeliveryAt: '2026-09-13T09:00:12Z', lastStatus: Success, failures: 0, createdAt: '2026-06-01T09:00:00Z', updatedAt: '2026-09-13T09:00:12Z', version: 5 }, { id: wh_crm, companyId: co_acme, url: 'https://crm.example.com/elixir', events: [InvoicePosted, ReceiptAllocated], secretMasked: 'whsec_••••••a1b2', status: Paused, lastDeliveryAt: '2026-09-12T18:00:00Z', lastStatus: Failed, failures: 10, createdAt: '2026-07-01T09:00:00Z', updatedAt: '2026-09-12T18:00:00Z', version: 14 }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Admin]
    summary: Register a webhook
    description: Events are the domain events listed under **Webhooks**. Deliveries are signed with `X-Elixir-Signature` (HMAC-SHA256 of the body with the secret) and retried with exponential back-off; 10 consecutive failures pause the webhook.
    operationId: createWebhook
    x-permission: admin.integrations.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/admin.yaml#/WebhookInput'
              - { required: [url, events] }
          examples:
            wms: { summary: Stock + purchase events, value: { url: 'https://wms.example.com/hooks/elixir', description: Push stock movements and PO status to WMS, events: [StockMoved, PurchaseReceived, DocumentPosted] } }
            finance: { summary: All finance events with own secret, value: { url: 'https://bi.example.com/elixir', events: [JournalPosted, JournalReversed, PaymentCompleted, PaymentFailed, PeriodLocked, PeriodReopened], secret: my-shared-secret-please-rotate } }
