    responses:
      '200':
        description: Job
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/BackgroundJob' }
            examples:
              completed: { summary: Completed export, value: { id: job_export_4421, companyId: co_acme, type: export, name: 'Sales invoices export (CSV)', status: Completed, attempts: 1, maxAttempts: 3, correlationId: corr_9f1c2e7a, startedAt: '2026-09-13T09:12:05Z', finishedAt: '2026-09-13T09:12:40Z', resultUrl: /v1/export-jobs/exp_4421/download, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:40Z', version: 3 } }
              failed: { summary: Failed with error, value: { id: job_irn_sync, companyId: co_acme, type: statutory-sync, name: Sync from IRP, status: Dead-letter, attempts: 3, maxAttempts: 3, lastError: IRP returned 503 three times, correlationId: corr_s9, createdAt: '2026-09-13T06:00:00Z', updatedAt: '2026-09-13T06:04:00Z', version: 4 } }
