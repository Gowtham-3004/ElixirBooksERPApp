    tags: [Admin]
    summary: Get a webhook
    operationId: getWebhook
    x-permission: admin.integrations.view
    responses:
      '200':
        description: Webhook
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Webhook' }
            examples:
              wms: { $ref: '../components/examples/admin.yaml#/WebhookWms' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Admin]
    summary: Edit URL / events / secret; resume a paused webhook
    operationId: updateWebhook
    x-permission: admin.integrations.edit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/admin.yaml#/WebhookPatch'
              - { properties: { status: { type: string, enum: [Active, Paused] } } }
          examples:
            addEvents: { summary: Subscribe to more events, value: { expectedVersion: 5, events: [StockMoved, StockReserved, StockReleased, PurchaseReceived, DocumentPosted] } }
            resume: { summary: Resume after fixing the endpoint, value: { expectedVersion: 14, status: Active } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Webhook' }
            examples:
              updated: { $ref: '../components/examples/admin.yaml#/WebhookWms' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
  delete:
    tags: [Admin]
    summary: Disable (soft-delete) a webhook
    operationId: disableWebhook
    x-permission: admin.integrations.edit
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

