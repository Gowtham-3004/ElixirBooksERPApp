              failed: { summary: Endpoint returned 500, value: { id: whd_test2, event: WebhookTest, eventId: evt_test, attempt: 1, status: Failed, responseStatus: 500, durationMs: 812, at: '2026-09-13T09:12:04Z', error: 'HTTP 500: upstream timeout' } }
