# Company administration part 2 (tag: Admin): number series, workflow rules, document templates, localization,
# plan & usage, integrations (provider credentials, API keys, webhooks, integration log), audit, jobs, notification settings, data.

# ── number series ─────────────────────────────────────────────────────────

/number-series:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Admin]
    summary: List number series
    description: Query examples — `?docType=Sales Invoice` · `?fy=2026-27` · `?branchId=br_ho` · `?status=Active`.
    operationId: listNumberSeries
    x-permission: admin.numbering.view
    x-frd: [FR-DOC-001]
    parameters:
      - { name: docType, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/FiscalYear'
      - $ref: '../components/parameters.yaml#/BranchFilter'
      - { name: status, in: query, schema: { type: string, enum: [Active, Inactive] } }
    responses:
      '200':
        description: Series
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/admin.yaml#/NumberSeries' } } } }
            examples:
              list:
                summary: Two series
                value:
                  data:
                    - { id: ns_inv_2627, companyId: co_acme, docType: Sales Invoice, fy: '2026-27', prefix: INV/2026-27/, suffix: '', padding: 5, next: 43, resetRule: FY, allocation: On post, status: Active, voids: [], preview: INV/2026-27/00043, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 44 }
                    - { id: ns_po_2627_surat, companyId: co_acme, docType: Purchase Order, branchId: br_surat, fy: '2026-27', prefix: PO/SRT/, suffix: /26-27, padding: 4, next: 118, resetRule: FY, allocation: On save, status: Active, voids: [], preview: PO/SRT/0118/26-27, createdAt: '2026-05-01T09:00:00Z', updatedAt: '2026-09-12T14:00:00Z', version: 118 }
              none: { summary: No series for filter, value: { data: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Admin]
    summary: Create a number series
    description: One Active series per (docType, branch, FY). Branch-specific series override the company-wide one.
    operationId: createNumberSeries
    x-permission: admin.numbering.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/admin.yaml#/NumberSeriesInput'
              - { required: [docType, fy, prefix, padding, next, resetRule, allocation] }
          examples:
            companyWide: { summary: Company-wide FY series, value: { docType: Credit Note, fy: '2026-27', prefix: CN/2026-27/, suffix: '', padding: 5, next: 1, resetRule: FY, allocation: On post } }
            branchMonthly: { summary: Branch series with monthly reset, value: { docType: POS Bill, branchId: br_andheri, fy: '2026-27', prefix: AND/, suffix: '', padding: 4, next: 1, resetRule: Monthly, allocation: On save } }
    responses:
      '201':
        description: Series
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/NumberSeries' }
            examples:
              created: { $ref: '../components/examples/admin.yaml#/NumberSeriesInvoice' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/number-series/preview:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Admin]
    summary: Preview the next number for a document type
    description: Resolves the series the way posting will (`engine.previewNumber`) — branch-specific first, then company-wide, by FY of `date`.
    operationId: previewNumber
    x-permission: admin.numbering.view
    parameters:
      - { name: docType, in: query, required: true, schema: { type: string }, example: Sales Invoice }
      - { name: branchId, in: query, schema: { type: string }, example: br_ho }
      - { name: date, in: query, schema: { type: string, format: date }, example: '2026-09-13' }
    responses:
      '200':
        description: Preview
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/NumberPreview' }
            examples:
              invoice: { summary: Next invoice number, value: { docType: Sales Invoice, series: INV/2026-27/, next: INV/2026-27/00043, allocation: On post, fy: '2026-27', branchId: br_ho } }
              branchSeries: { summary: Branch series wins, value: { docType: Purchase Order, series: PO/SRT/, next: PO/SRT/0118/26-27, allocation: On save, fy: '2026-27', branchId: br_surat } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/number-series/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Admin]
    summary: Get a series (with void log)
    operationId: getNumberSeries
    x-permission: admin.numbering.view
    responses:
      '200':
        description: Series
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/NumberSeries' }
            examples:
              invoice: { $ref: '../components/examples/admin.yaml#/NumberSeriesInvoice' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Admin]
    summary: Update a series
    description: '`next` may only move forward (`422 VALIDATION`); prefix changes on a series with allocations are audited.'
    operationId: updateNumberSeries
    x-permission: admin.numbering.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/admin.yaml#/NumberSeriesPatch' }
          examples:
            bumpNext: { summary: Skip ahead, value: { expectedVersion: 44, next: 100 } }
            deactivate: { summary: Deactivate, value: { expectedVersion: 44, status: Inactive } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/NumberSeries' }
            examples:
              updated: { $ref: '../components/examples/admin.yaml#/NumberSeriesInvoice' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
  delete:
    tags: [Admin]
    summary: Delete a series that never allocated a number
    operationId: deleteNumberSeries
    x-permission: admin.numbering.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/number-series/{id}/void:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Admin]
    summary: Void a number (gap with reason)
    description: Records a gap in the sequence with a reason (statutory audit requirement). The number must belong to this series and not be in use by a posted document.
    operationId: voidNumber
    x-permission: admin.numbering.edit
    x-frd: [FR-DOC-002]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/admin.yaml#/VoidNumberRequest' }
          examples:
            void: { summary: Void a consumed number, value: { number: INV/2026-27/00040, reason: Number was consumed by a cancelled draft during migration } }
    responses:
      '200':
        description: Series with the new void entry
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/NumberSeries' }
            examples:
              voided: { $ref: '../components/examples/admin.yaml#/NumberSeriesInvoice' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── workflow rules ────────────────────────────────────────────────────────

/workflow-rules:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Admin]
    summary: List workflow rules
    description: Query examples — `?docType=Sales Invoice` · `?status=Active`.
    operationId: listWorkflowRules
    x-permission: admin.workflows.view
    x-frd: [FR-WFL-001]
    parameters:
      - { name: docType, in: query, schema: { $ref: '../components/schemas/approvals.yaml#/WorkflowDocType' } }
      - { name: status, in: query, schema: { type: string, enum: [Draft, Active, Retired] } }
    responses:
      '200':
        description: Rules
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/approvals.yaml#/WorkflowRule' } } } }
            examples:
              rules:
                summary: Active rules
                value:
                  data:
                    - { id: wf_si_100k, companyId: co_acme, code: WF-SI-100K, name: Sales invoices above ₹1 lakh, docType: Sales Invoice, conditions: [{ field: amount, op: '>=', value: 100000 }], steps: [{ order: 1, name: Finance review, mode: Sequential, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, commentRequired: false, slaHours: 24, canDelegate: true }], ruleVersion: 2, status: Active, materialChangeFields: [lines, totals.total, partyId], allowSelfApproval: false, priority: 10, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-07-01T09:00:00Z', version: 3 }
                    - { id: wf_pay_batch, companyId: co_acme, code: WF-PAYBATCH, name: Payment batches (maker-checker), docType: Payment Batch, conditions: [], steps: [{ order: 1, name: Treasury approval, mode: Sequential, approverType: Role, approverRef: role_treasury, approverLabel: Treasury, commentRequired: true, slaHours: 8, canDelegate: false }], ruleVersion: 1, status: Active, materialChangeFields: [lines], allowSelfApproval: false, priority: 5, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }
              none: { summary: No rules, value: { data: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Admin]
    summary: Create a workflow rule (Draft)
    operationId: createWorkflowRule
    x-permission: admin.workflows.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/approvals.yaml#/WorkflowRuleInput'
              - { required: [code, name, docType, steps] }
          examples:
            amountThreshold: { summary: Single step above an amount, value: { code: WF-PO-50K, name: Purchase orders above ₹50k, docType: Purchase Order, conditions: [{ field: amount, op: '>=', value: 50000 }], steps: [{ order: 1, name: Purchase manager, mode: Sequential, approverType: Role, approverRef: role_purchmgr, approverLabel: Purchase Manager, commentRequired: false, slaHours: 24, canDelegate: true }], materialChangeFields: [lines, totals.total], allowSelfApproval: false, priority: 10 } }
            twoStepEscalation: { summary: Manager then Finance with escalation, value: { code: WF-EXP-5K, name: Expense claims above ₹5,000, docType: Expense Claim, conditions: [{ field: amount, op: '>', value: 5000 }], steps: [{ order: 1, name: Line manager, mode: Sequential, approverType: Manager, approverRef: '', approverLabel: Reporting manager, commentRequired: false, slaHours: 48, canDelegate: true }, { order: 2, name: Finance review, mode: Sequential, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, commentRequired: true, slaHours: 24, canDelegate: false }], escalation: { afterHours: 72, toRole: role_owner, notify: true }, reminders: { afterHours: 24 }, materialChangeFields: [lines], allowSelfApproval: false, priority: 20 } }
            branchScoped: { summary: Branch + exception condition, value: { code: WF-VINV-EXC, name: Vendor invoices with matching exceptions (Surat), docType: Vendor Invoice, conditions: [{ field: exception, op: '=', value: 'true' }, { field: branchId, op: in, value: [br_surat] }], steps: [{ order: 1, name: Exception review, mode: Parallel, approverType: Group, approverRef: grp_ap_review, approverLabel: AP review group, commentRequired: true, slaHours: 24, canDelegate: false }], materialChangeFields: [lines, totals.total], allowSelfApproval: false, priority: 1 } }
    responses:
      '201':
        description: Draft rule
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/approvals.yaml#/WorkflowRule' }
            examples:
              draft: { summary: Created as Draft v1, value: { id: wf_po_50k, companyId: co_acme, code: WF-PO-50K, name: Purchase orders above ₹50k, docType: Purchase Order, conditions: [{ field: amount, op: '>=', value: 50000 }], steps: [{ order: 1, name: Purchase manager, mode: Sequential, approverType: Role, approverRef: role_purchmgr, approverLabel: Purchase Manager, commentRequired: false, slaHours: 24, canDelegate: true }], ruleVersion: 1, status: Draft, materialChangeFields: [lines, totals.total], allowSelfApproval: false, priority: 10, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/workflow-rules/test:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Admin]
    summary: Test which rule a document would hit
    description: Dry-run of `engine.resolveWorkflow` — returns the matching Active rule (highest priority) and the resolved approvers per step.
    operationId: testWorkflowRules
    x-permission: admin.workflows.view
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/approvals.yaml#/WorkflowTestRequest' }
          examples:
            bigInvoice: { summary: ₹2.5 lakh invoice, value: { docType: Sales Invoice, amount: 250000, branchId: br_ho } }
            smallInvoice: { summary: ₹40k invoice — no rule, value: { docType: Sales Invoice, amount: 40000 } }
    responses:
      '200':
        description: Result
        content:
          application/json:
            schema: { $ref: '../components/schemas/approvals.yaml#/WorkflowTestResult' }
            examples:
              matched: { summary: Rule matched, value: { matched: true, rule: { id: wf_si_100k, companyId: co_acme, code: WF-SI-100K, name: Sales invoices above ₹1 lakh, docType: Sales Invoice, conditions: [{ field: amount, op: '>=', value: 100000 }], steps: [{ order: 1, name: Finance review, mode: Sequential, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, commentRequired: false, slaHours: 24, canDelegate: true }], ruleVersion: 2, status: Active, materialChangeFields: [], allowSelfApproval: false, priority: 10, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-07-01T09:00:00Z', version: 3 }, resolvedSteps: [{ order: 1, name: Finance review, approvers: [Rahul Mehta, Anita Rao] }] } }
              noMatch: { summary: No rule — would post directly, value: { matched: false, reason: No Active rule for Sales Invoice with amount 40000 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/workflow-rules/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Admin]
    summary: Get a rule (with version history)
    operationId: getWorkflowRule
    x-permission: admin.workflows.view
    responses:
      '200':
        description: Rule
        content:
          application/json:
            schema: { $ref: '../components/schemas/approvals.yaml#/WorkflowRule' }
            examples:
              active: { $ref: '../components/examples/admin.yaml#/WorkflowRuleSI' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Admin]
    summary: Edit a rule
    description: Editing an **Active** rule snapshots the prior conditions/steps into `versions` and bumps `ruleVersion`; in-flight approvals keep the version they started with.
    operationId: updateWorkflowRule
    x-permission: admin.workflows.edit
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/approvals.yaml#/WorkflowRuleInput'
              - $ref: '../components/schemas/common.yaml#/ExpectedVersion'
              - { properties: { note: { type: string, description: Version note. } } }
          examples:
            raiseThreshold: { summary: Raise the threshold (new version), value: { expectedVersion: 3, conditions: [{ field: amount, op: '>=', value: 150000 }], note: Threshold raised per CFO memo } }
            addStep: { summary: Add a second step, value: { expectedVersion: 3, steps: [{ order: 1, name: Finance review, mode: Sequential, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, commentRequired: false, slaHours: 24, canDelegate: true }, { order: 2, name: CFO sign-off, mode: Sequential, approverType: User, approverRef: usr_rahul, approverLabel: Rahul Mehta, commentRequired: true, slaHours: 24, canDelegate: false }] } }
    responses:
      '200':
        description: Updated rule
        content:
          application/json:
            schema: { $ref: '../components/schemas/approvals.yaml#/WorkflowRule' }
            examples:
              updated: { $ref: '../components/examples/admin.yaml#/WorkflowRuleSI' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
  delete:
    tags: [Admin]
    summary: Delete a Draft rule
    operationId: deleteWorkflowRule
    x-permission: admin.workflows.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/workflow-rules/{id}/activate:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Admin]
    summary: Activate a Draft rule
    operationId: activateWorkflowRule
    x-permission: admin.workflows.edit
    responses:
      '200':
        description: Active
        content:
          application/json:
            schema: { $ref: '../components/schemas/approvals.yaml#/WorkflowRule' }
            examples:
              active: { $ref: '../components/examples/admin.yaml#/WorkflowRuleSI' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/workflow-rules/{id}/retire:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Admin]
    summary: Retire an Active rule
    description: New submissions stop matching; pending approvals continue on the retired version.
    operationId: retireWorkflowRule
    x-permission: admin.workflows.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            replaced: { summary: Replaced by another rule, value: { reason: Superseded by WF-SI-150K from 1 Oct } }
    responses:
      '200':
        description: Retired
        content:
          application/json:
            schema: { $ref: '../components/schemas/approvals.yaml#/WorkflowRule' }
            examples:
              retired: { summary: Retired, value: { id: wf_si_100k, companyId: co_acme, code: WF-SI-100K, name: Sales invoices above ₹1 lakh, docType: Sales Invoice, conditions: [{ field: amount, op: '>=', value: 100000 }], steps: [{ order: 1, name: Finance review, mode: Sequential, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, commentRequired: false, slaHours: 24, canDelegate: true }], ruleVersion: 2, status: Retired, materialChangeFields: [], allowSelfApproval: false, priority: 10, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 4 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/workflow-rules/{id}/duplicate:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Admin]
    summary: Duplicate a rule as a new Draft
    operationId: duplicateWorkflowRule
    x-permission: admin.workflows.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string }, docType: { $ref: '../components/schemas/approvals.yaml#/WorkflowDocType' } } }
          examples:
            forCreditNotes: { summary: Same steps for credit notes, value: { code: WF-CN-100K, name: Credit notes above ₹1 lakh, docType: Credit Note } }
    responses:
      '201':
        description: Draft copy
        content:
          application/json:
            schema: { $ref: '../components/schemas/approvals.yaml#/WorkflowRule' }
            examples:
              copy: { summary: Copied, value: { id: wf_cn_100k, companyId: co_acme, code: WF-CN-100K, name: Credit notes above ₹1 lakh, docType: Credit Note, conditions: [{ field: amount, op: '>=', value: 100000 }], steps: [{ order: 1, name: Finance review, mode: Sequential, approverType: Role, approverRef: role_finadmin, approverLabel: Finance Admin, commentRequired: false, slaHours: 24, canDelegate: true }], ruleVersion: 1, status: Draft, materialChangeFields: [lines, totals.total, partyId], allowSelfApproval: false, priority: 10, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── document templates ────────────────────────────────────────────────────

/document-templates:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Admin]
    summary: List document templates
    operationId: listDocumentTemplates
    x-permission: admin.templates.view
    x-frd: [FR-DOC-005]
    parameters:
      - { name: docType, in: query, schema: { type: string } }
      - { name: status, in: query, schema: { type: string, enum: [Active, Inactive] } }
    responses:
