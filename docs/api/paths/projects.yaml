/projects/contracts/{id}/progress:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Projects]
    summary: Record % complete for a period (Fixed price / Percent complete revenue)
