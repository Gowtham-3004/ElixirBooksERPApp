                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/projects.yaml#/Project' } }
            examples:
              firstPage: { summary: Projects, value: { data: [{ $ref: '#/components/examples/ProjectErp/value' }], meta: { nextCursor: null, limit: 25, total: 6, counts: { Active: 4, Planned: 1, 'On hold': 0, Completed: 1, All: 6 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
