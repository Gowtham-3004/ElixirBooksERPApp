# Projects & contracts — part 1 (tag: Projects). src/modules/projects/actions.ts: services, contracts, projects, resources, rate cards.

# ── services ──────────────────────────────────────────────────────────────

/projects/services:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Projects]
    summary: Service catalog
    operationId: listServices
    x-permission: projects.project.view
    x-frd: [FR-SRV-001]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/IncludeInactive'
    responses:
      '200':
        description: Services
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/projects.yaml#/Service' } }
            examples:
              firstPage: { summary: Services, value: { data: [{ id: svc_cons, companyId: co_acme, itemId: item_consult, code: SVC-CONS, name: Consulting, sac: '998311', unit: Hr, defaultRate: 4500, taxRateId: tr_gst18, revenueAccountId: acc_4010, billableDefault: true, status: Active, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }, { id: svc_supp, companyId: co_acme, itemId: item_support, code: SVC-SUPP, name: Managed support, sac: '998313', unit: Month, defaultRate: 150000, taxRateId: tr_gst18, revenueAccountId: acc_4010, billableDefault: true, status: Active, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }], meta: { nextCursor: null, limit: 25, total: 2 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Projects]
    summary: Create a service (mirrors an Item of type Service)
    operationId: createService
    x-permission: projects.catalog.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/projects.yaml#/ServiceCreate' }
          examples:
            hourly: { summary: Hourly, value: { code: SVC-ARCH, name: Solution architecture, sac: '998311', unit: Hr, defaultRate: 8000, taxRateId: tr_gst18 } }
            fixed: { summary: Fixed deliverable, value: { name: Go-live support package, unit: Fixed, defaultRate: 250000, taxRateId: tr_gst18, billableDefault: true } }
    responses:
      '201':
        description: Created
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Service' }
            examples:
              created: { summary: Created, value: { id: svc_arch, companyId: co_acme, itemId: item_arch, code: SVC-ARCH, name: Solution architecture, sac: '998311', unit: Hr, defaultRate: 8000, taxRateId: tr_gst18, revenueAccountId: acc_4010, billableDefault: true, status: Active, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/projects/services/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Projects]
    summary: Get a service
    operationId: getService
    x-permission: projects.project.view
    responses:
      '200':
        description: Service
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Service' }
            examples:
              consulting: { summary: Consulting, value: { id: svc_cons, companyId: co_acme, itemId: item_consult, code: SVC-CONS, name: Consulting, sac: '998311', unit: Hr, defaultRate: 4500, taxRateId: tr_gst18, revenueAccountId: acc_4010, billableDefault: true, status: Active, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Projects]
    summary: Update a service
    operationId: updateService
    x-permission: projects.catalog.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/projects.yaml#/ServicePatch' }
          examples:
            rate: { summary: New default rate, value: { expectedVersion: 1, defaultRate: 5000 } }
            deactivate: { summary: Deactivate, value: { expectedVersion: 1, status: Inactive } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Service' }
            examples:
              updated: { summary: Updated, value: { id: svc_cons, companyId: co_acme, itemId: item_consult, code: SVC-CONS, name: Consulting, sac: '998311', unit: Hr, defaultRate: 5000, taxRateId: tr_gst18, revenueAccountId: acc_4010, billableDefault: true, status: Active, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
  delete:
    tags: [Projects]
    summary: Delete an unused service
    operationId: deleteService
    x-permission: projects.catalog.edit
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── contracts ─────────────────────────────────────────────────────────────

/projects/contracts:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Projects]
    summary: Contracts / SOWs
    description: "Tabs → All · Draft · Awaiting approval · Active · Completed · Cancelled. Query examples — `?billingMethod=Time & material` · `?customerId=cust_arlene` · `?projectId=prj_erp`."
    operationId: listContracts
    x-permission: projects.project.view
    x-frd: [FR-SRV-002]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: billingMethod, in: query, schema: { $ref: '../components/schemas/projects.yaml#/BillingMethod' } }
      - $ref: '../components/parameters.yaml#/CustomerId'
      - $ref: '../components/parameters.yaml#/ProjectId'
    responses:
      '200':
        description: Contracts
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/projects.yaml#/Contract' } }
            examples:
              firstPage: { summary: Contracts, value: { data: [{ $ref: '#/components/examples/ContractTmActive/value' }], meta: { nextCursor: null, limit: 25, total: 9, counts: { All: 9, Draft: 1, 'Awaiting approval': 1, Active: 6, Completed: 1, Cancelled: 0 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Projects]
    summary: Create a contract (Draft) — six billing methods
    operationId: createContract
    x-permission: projects.contract.edit
    x-events: [DocumentCreated]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/projects.yaml#/ContractCreate' }
          examples:
            fixedPrice: { summary: Fixed price with instalments, value: { customerId: cust_arlene, projectId: prj_erp, title: ERP implementation — phase 1, billingMethod: Fixed price, amount: 2400000, currency: INR, start: '2026-09-15', end: '2027-03-31', taxRateId: tr_gst18, serviceItemId: item_consult, revenueMethod: Percent complete, milestones: [{ kind: Instalment, order: 1, name: Advance 30%, amount: 720000, due: '2026-09-20' }, { kind: Instalment, order: 2, name: On UAT 40%, amount: 960000, due: '2027-01-15' }, { kind: Instalment, order: 3, name: On go-live 30%, amount: 720000, due: '2027-03-31' }] } }
            timeAndMaterial: { summary: T&M with rate card and cap, value: { customerId: cust_metro, title: Data migration support, billingMethod: Time & material, amount: 900000, currency: INR, rateCardId: rc_std, rates: [{ role: Senior consultant, rate: 6500 }], capHours: 150, capAmount: 900000, start: '2026-10-01', taxRateId: tr_gst18, revenueMethod: Hours } }
            milestone: { summary: Milestone-based, value: { customerId: cust_arlene, projectId: prj_erp, title: Reporting pack, billingMethod: Milestone, amount: 1200000, currency: INR, start: '2026-10-01', end: '2026-12-31', taxRateId: tr_gst18, revenueMethod: Milestone, milestones: [{ name: Design sign-off, amount: 400000, due: '2026-10-15', deliverable: Approved design }, { name: Build complete, amount: 500000, due: '2026-11-30' }, { name: UAT sign-off, amount: 300000, due: '2026-12-20' }] } }
            recurring: { summary: Recurring monthly retainer, value: { customerId: cust_ustech, title: Managed support — Gold, billingMethod: Recurring, amount: 1800000, currency: USD, recurrence: { amount: 2000, frequency: Monthly, nextBillDate: '2026-10-01', endDate: '2027-09-30' }, start: '2026-10-01', end: '2027-09-30', serviceItemId: item_support, revenueMethod: Straight-line } }
            usage: { summary: Usage with tiers, value: { customerId: cust_metro, title: API platform usage, billingMethod: Usage, amount: 0, currency: INR, usage: { metric: API calls, unit: '1k calls', unitRate: 1.5, tiers: [{ upTo: 10000, rate: 1.5 }, { upTo: 50000, rate: 1.2 }, { upTo: 999999999, rate: 1 }] }, start: '2026-09-01', taxRateId: tr_gst18, revenueMethod: Usage } }
            costPlus: { summary: Cost plus 15%, value: { customerId: cust_arlene, projectId: prj_erp, title: Infrastructure procurement, billingMethod: Cost plus, amount: 0, currency: INR, markupPct: 15, start: '2026-09-15', taxRateId: tr_gst18, revenueMethod: Auto } }
    responses:
      '201':
        description: Draft contract
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Contract' }
            examples:
              draft: { $ref: '../components/examples/projects.yaml#/ContractFixedDraft' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Validation (validateContract)
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              milestonesTotal: { summary: Milestones ≠ amount, value: { code: VALIDATION, message: 'Milestones total 1,100,000 does not equal contract amount 1,200,000', field: milestones, correlationId: corr_9f1c2e7a } }
              recurrence: { summary: Recurring without schedule, value: { code: VALIDATION, message: "Recurring contracts need an amount, frequency and next bill date", field: recurrence, correlationId: corr_9f1c2e7a } }
              dates: { summary: End before start, value: { code: VALIDATION, message: End date must be after the start, field: end, correlationId: corr_9f1c2e7a } }

/projects/contracts/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Projects]
    summary: Get a contract
    operationId: getContract
    x-permission: projects.project.view
    responses:
      '200':
        description: Contract
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Contract' }
            examples:
              draft: { $ref: '../components/examples/projects.yaml#/ContractFixedDraft' }
              active: { $ref: '../components/examples/projects.yaml#/ContractTmActive' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Projects]
    summary: Edit (Draft / Returned / Rejected; limited fields when Approved / Active)
    operationId: updateContract
    x-permission: projects.contract.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/projects.yaml#/ContractPatch' }
          examples:
            milestones: { summary: Re-plan milestones, value: { expectedVersion: 1, milestones: [{ id: ms_1, name: Design sign-off, amount: 400000, due: '2026-10-22' }, { id: ms_2, name: Build complete, amount: 500000, due: '2026-12-05' }, { id: ms_3, name: UAT sign-off, amount: 300000, due: '2026-12-24' }] } }
            cap: { summary: Raise the T&M cap, value: { expectedVersion: 3, capHours: 200, capAmount: 1200000, amount: 1200000 } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Contract' }
            examples:
              updated: { $ref: '../components/examples/projects.yaml#/ContractFixedDraft' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: State / version conflict
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              locked: { summary: Not editable, value: { code: INVALID_STATE, message: Contract is Completed and cannot be edited, correlationId: corr_9f1c2e7a } }
              stale: { summary: Stale version, value: { code: CONFLICT, message: Record changed by Priya Sharma at 10:02 — reload and retry, details: { expectedVersion: 1, currentVersion: 2 }, correlationId: corr_9f1c2e7a } }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
  delete:
    tags: [Projects]
    summary: Delete a Draft contract
    operationId: deleteContract
    x-permission: projects.contract.edit
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/projects/contracts/{id}/submit:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Projects]
    summary: Submit for approval ('Contract' workflow; auto-approves when `prjContractApproval` is off or no rule matches)
    operationId: submitContract
    x-permission: projects.contract.edit
    x-idempotent: true
    x-workflow-doc-type: Contract
    x-events: [DocumentSubmitted, DocumentApproved]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Outcome
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/projects.yaml#/Contract' }
                    outcome: { type: string, enum: [routed-for-approval, approved] }
            examples:
              routed: { summary: outcome = routed-for-approval, value: { document: { id: ctr_0012, companyId: co_acme, number: CTR/2026-27/00012, docType: Contract, date: '2026-09-13', branchId: br_ho, status: Submitted, currency: INR, rate: 1, partyType: Customer, partyId: cust_arlene, partyName: Arlene Traders, customerId: cust_arlene, projectId: prj_erp, title: ERP implementation — phase 1, billingMethod: Fixed price, amount: 2400000, start: '2026-09-15', end: '2027-03-31', taxRateId: tr_gst18, serviceItemId: item_consult, revenueMethod: Percent complete, lines: [], totals: { subtotal: 2400000, discount: 0, taxable: 2400000, tax: 432000, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 2832000, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 2832000 }, approvalId: apr_ctr_12, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:30:00Z', version: 2 }, outcome: routed-for-approval, approval: { id: apr_ctr_12, companyId: co_acme, docType: Contract, collection: contracts, docId: ctr_0012, docNumber: CTR/2026-27/00012, amount: 2400000, currency: INR, branchId: br_ho, requesterId: usr_priya, requesterName: Priya Sharma, steps: [{ order: 1, name: Delivery head, approverType: Role, approverRef: role_delivery, approverLabel: Delivery Head, status: Pending, commentRequired: false }], currentStep: 0, status: Pending, submittedAt: '2026-09-13T09:30:00Z', history: [], createdAt: '2026-09-13T09:30:00Z', updatedAt: '2026-09-13T09:30:00Z', version: 1 }, warnings: [] } }
              approved: { summary: outcome = approved (no rule), value: { document: { $ref: '#/components/examples/ContractFixedDraft/value' }, outcome: approved, warnings: ['No workflow applies — contract approved; activate to start billing'] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/projects/contracts/{id}/activate:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Projects]
    summary: Activate an Approved contract (enables billing, timesheets, revenue)
    operationId: activateContract
    x-permission: projects.contract.approve
    x-events: [DocumentApproved]
    responses:
      '200':
        description: Active
        content:
          application/json:
            schema: { $ref: '../components/schemas/projects.yaml#/Contract' }
            examples:
              active: { $ref: '../components/examples/projects.yaml#/ContractTmActive' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Not approved
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              notApproved: { summary: Not approved, value: { code: INVALID_STATE, message: Contract must be Approved before activation (currently Submitted), correlationId: corr_9f1c2e7a } }

/projects/contracts/{id}/complete:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
