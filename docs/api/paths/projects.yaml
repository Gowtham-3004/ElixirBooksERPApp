    tags: [Projects]
    summary: Create a project (creates its Project dimension)
    operationId: createProject
    x-permission: projects.project.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/projects.yaml#/ProjectCreate' }
          examples:
            full: { summary: Full, value: { code: PRJ-ERP, name: Arlene ERP implementation, customerId: cust_arlene, contractId: ctr_0012, managerEmployeeId: emp_priya, start: '2026-09-15', end: '2027-03-31', budgetHours: 800, budgetAmount: 2400000, teamEmployeeIds: [emp_neha, emp_anil] } }
