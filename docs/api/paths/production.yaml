# ── MRP ───────────────────────────────────────────────────────────────────

/production/mrp-runs:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Production]
    summary: MRP runs
    operationId: listMrpRuns
    x-permission: production.order.view
    x-frd: [FR-MFG-005]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Status'
    responses:
      '200':
        description: Runs (suggestions / details omitted in lists)
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/production.yaml#/MrpRun' } }
            examples:
              firstPage: { summary: Runs, value: { data: [{ id: mrp_0009, companyId: co_acme, number: MRP/2026-27/00009, date: '2026-09-13', branchId: br_ho, params: { horizonDays: 30, includeSafetyStock: true, lotSizing: Lot-for-lot, includeDrafts: false }, suggestions: [], details: [], status: Completed, runBy: Suresh Patel, summary: { itemsPlanned: 42, shortfalls: 6, purchase: 4, production: 2, transfer: 0, value: 384000 }, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }], meta: { nextCursor: null, limit: 25, total: 9 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Production]
    summary: Run MRP (net requirements → purchase / production / transfer suggestions)
    description: "`dryRun=true` returns the result without saving a run."
    operationId: runMrp
    x-permission: production.order.create
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/production.yaml#/MrpParams'
              - { type: object, properties: { dryRun: { type: boolean, default: false } } }
          examples:
            default: { summary: 30-day horizon, value: { horizonDays: 30, includeSafetyStock: true, lotSizing: Lot-for-lot } }
            mto: { summary: "Include draft sales orders, one warehouse", value: { horizonDays: 45, includeSafetyStock: false, lotSizing: Min order, warehouseId: wh_main, includeDrafts: true } }
            preview: { summary: Dry run, value: { horizonDays: 30, dryRun: true } }
    responses:
      '201':
        description: Run saved
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/MrpRun' }
            examples:
              run: { $ref: '../components/examples/production.yaml#/MrpRunSep' }
      '200':
        description: Dry-run result
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/MrpRun' }
            examples:
              preview: { $ref: '../components/examples/production.yaml#/MrpRunSep' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/production/mrp-runs/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Production]
    summary: Get a run (suggestions + item details)
    operationId: getMrpRun
    x-permission: production.order.view
    responses:
      '200':
        description: Run
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/MrpRun' }
            examples:
              run: { $ref: '../components/examples/production.yaml#/MrpRunSep' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/production/mrp-runs/{id}/suggestions:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  patch:
    tags: [Production]
    summary: Accept / reject suggestions
    operationId: setMrpSuggestionStatus
    x-permission: production.order.approve
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [ids, status], properties: { ids: { type: array, minItems: 1, items: { type: string } }, status: { type: string, enum: [Accepted, Rejected, Suggested] } } }
          examples:
            accept: { summary: Accept two, value: { ids: [sg_1, sg_2], status: Accepted } }
            reject: { summary: Reject one, value: { ids: [sg_3], status: Rejected } }
    responses:
      '200':
        description: Updated run
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/MrpRun' }
            examples:
              updated: { $ref: '../components/examples/production.yaml#/MrpRunSep' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/production/mrp-runs/{id}/convert:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Production]
    summary: Convert Accepted suggestions into draft POs / production orders
    description: Production suggestions below `autoReleaseThreshold` are released automatically. Purchase suggestions without a preferred supplier are skipped.
    operationId: convertMrpSuggestions
    x-permission: production.order.create
    x-idempotent: true
    x-events: [DocumentCreated]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Result
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/MrpConvertResult' }
            examples:
              converted: { summary: "1 PO + 1 production order, 1 skipped", value: { purchaseOrders: [{ id: po_00127, number: DRAFT-PO-127, supplierName: Bharat Steel Ltd, total: 141600 }], productionOrders: [{ id: mo_0044, number: PO-MFG/2026-27/00044, itemName: Steel Frame A1, qty: 120, status: Planned }], skipped: ['Tea Crate: no preferred supplier'] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Nothing accepted
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              empty: { summary: No accepted suggestions, value: { code: EMPTY, message: No Accepted suggestions to convert, correlationId: corr_9f1c2e7a } }

