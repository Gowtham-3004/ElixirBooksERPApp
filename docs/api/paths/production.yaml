            times: { summary: Faster welding, value: { expectedVersion: 1, operations: [{ id: rop_10, seq: 10, name: Cutting, workCentreId: wc_cut, setupMin: 15, runMinPerUnit: 4 }, { id: rop_20, seq: 20, name: Welding, workCentreId: wc_weld, setupMin: 20, runMinPerUnit: 8 }, { id: rop_30, seq: 30, name: Finishing, workCentreId: wc_fin, setupMin: 10, runMinPerUnit: 3 }] } }
