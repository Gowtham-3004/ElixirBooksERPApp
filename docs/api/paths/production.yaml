# Production — part 1 (tag: Production). masterActions.ts (BOMs, routings, work centres), qualityActions.ts (inspection plans), planning.ts (MRP, capacity), core.ts (settings).

# ── BOMs ──────────────────────────────────────────────────────────────────

/production/boms:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Production]
    summary: Bills of material
    description: Tabs → Active · Draft · Superseded · All. Query examples — `?itemId=item_frame` · `?q=frame`.
    operationId: listBoms
    x-permission: production.bom.view
    x-frd: [FR-MFG-002]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/ItemId'
    responses:
      '200':
        description: BOMs
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/production.yaml#/Bom' } }
            examples:
              firstPage: { summary: BOMs, value: { data: [{ $ref: '#/components/examples/BomFrameActive/value' }], meta: { nextCursor: null, limit: 25, total: 7, counts: { Active: 5, Draft: 1, Superseded: 1, All: 7 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Production]
    summary: "Create a BOM (Draft, or Active with `status: Active`)"
    operationId: createBom
    x-permission: production.bom.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/production.yaml#/BomCreate' }
          examples:
            discrete: { summary: Discrete with by-product, value: { itemId: item_frame, effectiveFrom: '2026-10-01', mode: discrete, outputQty: 1, components: [{ itemId: item_stl4, qty: 12, uom: KG, scrapPct: 2 }, { itemId: item_electrode, qty: 6, uom: NOS }, { itemId: item_paint, qty: 0.4, uom: L, substitutes: [item_paint_alt] }], byProducts: [{ itemId: item_offcut, qty: 0.5, uom: KG, costSharePct: 2 }], routingId: rt_frame } }
            process: { summary: Process (batch) BOM, value: { itemId: item_chai, effectiveFrom: '2026-10-01', mode: process, outputQty: 100, components: [{ itemId: item_tea_leaf, qty: 22, uom: KG }, { itemId: item_spice_mix, qty: 3, uom: KG }, { itemId: item_pouch, qty: 100, uom: NOS, scrapPct: 1 }], byProducts: [], status: Active } }
            phantom: { summary: Phantom sub-assembly, value: { itemId: item_cabinet, effectiveFrom: '2026-10-01', mode: discrete, outputQty: 1, components: [{ itemId: item_frame, qty: 1, uom: NOS, isPhantom: true }, { itemId: item_panel, qty: 4, uom: NOS }], byProducts: [] } }
    responses:
      '201':
        description: Created
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/Bom' }
            examples:
              draft: { $ref: '../components/examples/production.yaml#/BomFrameDraft' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Validation (validateBom)
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              selfRef: { summary: Contains its own output, value: { code: VALIDATION, message: A BOM cannot contain its own output item, field: components, correlationId: corr_9f1c2e7a } }
              scrap: { summary: Scrap out of range, value: { code: VALIDATION, message: 'Steel Rod 4mm: scrap % must be 0–100', field: components, correlationId: corr_9f1c2e7a } }

/production/boms/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Production]
    summary: Get a BOM
    operationId: getBom
    x-permission: production.bom.view
    responses:
      '200':
        description: BOM
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/Bom' }
            examples:
              active: { $ref: '../components/examples/production.yaml#/BomFrameActive' }
              draft: { $ref: '../components/examples/production.yaml#/BomFrameDraft' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Production]
    summary: Edit a Draft BOM (Active BOMs — create a new version instead)
    operationId: updateBom
    x-permission: production.bom.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/production.yaml#/BomPatch' }
          examples:
            components: { summary: Replace components, value: { expectedVersion: 1, components: [{ itemId: item_stl4, qty: 11.5, uom: KG, scrapPct: 2 }, { itemId: item_electrode, qty: 6, uom: NOS }] } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/Bom' }
            examples:
              updated: { $ref: '../components/examples/production.yaml#/BomFrameDraft' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
  delete:
    tags: [Production]
    summary: Delete a Draft BOM
    operationId: deleteBom
    x-permission: production.bom.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Conflict
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              notDraft: { summary: Not a draft, value: { code: INVALID_STATE, message: Only Draft BOMs can be deleted, correlationId: corr_9f1c2e7a } }
              inUse: { summary: Referenced, value: { code: IN_USE, message: BOM is referenced by production orders, details: { orders: [PO-MFG/2026-27/00041] }, correlationId: corr_9f1c2e7a } }

/production/boms/{id}/activate:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Production]
    summary: Activate (supersedes the previous active BOM for the item from effectiveFrom)
    operationId: activateBom
    x-permission: production.bom.approve
    responses:
      '200':
        description: Active
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/production.yaml#/Bom' }
                    superseded: { $ref: '../components/schemas/production.yaml#/Bom' }
            examples:
              activated: { summary: Activated; v1 superseded, value: { document: { $ref: '#/components/examples/BomFrameActive/value' }, outcome: approved, superseded: { id: bom_frame_1, companyId: co_acme, code: BOM-FRAME-A1, itemId: item_frame, itemCode: FRM-A1, itemName: Steel Frame A1, bomVersion: 1, effectiveFrom: '2026-04-01', effectiveTo: '2026-09-30', status: Superseded, mode: discrete, outputQty: 1, uom: NOS, components: [], byProducts: [], supersededById: bom_frame_2, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 3 }, warnings: ['Open production orders keep BOM v1; new orders use v2'] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/production/boms/{id}/cost-rollup:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Production]
    summary: Standard-cost roll-up (materials at AVCO/standard + routing conversion)
    operationId: getBomCostRollup
    x-permission: production.bom.view
    x-frd: [FR-MFG-012]
    responses:
      '200':
        description: Roll-up
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/CostRollup' }
            examples:
              frame: { summary: Frame A1, value: { material: 1960, labour: 240, machine: 150, overhead: 80, subcontract: 0, byProductCredit: 50, total: 2380, perUnit: 2380, lines: [{ itemId: item_stl4, itemName: Steel Rod 4mm, qty: 12.24, unitCost: 49.8, scrapPct: 2, extended: 609.55, source: AVCO }, { itemId: item_electrode, itemName: Welding electrode, qty: 6, unitCost: 35.87, scrapPct: 0, extended: 215.22, source: AVCO }, { itemId: item_paint, itemName: Powder paint grey, qty: 0.4, unitCost: 2838.08, scrapPct: 0, extended: 1135.23, source: Standard }], ops: [{ name: Cutting, minutes: 19, labour: 95, machine: 60, overhead: 30, subcontract: 0 }, { name: Welding, minutes: 29, labour: 145, machine: 90, overhead: 50, subcontract: 0 }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/production/boms/{id}/update-standard-cost:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Production]
    summary: Write the roll-up to the item's standard cost (audited)
    operationId: updateItemStandardCostFromBom
    x-permission: production.bom.approve
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { type: object, required: [itemId, itemName, to], properties: { itemId: { type: string }, itemName: { type: string }, from: { type: number }, to: { type: number }, rolledUpAt: { type: string, format: date-time } } }
            examples:
              updated: { summary: Standard cost updated, value: { itemId: item_frame, itemName: Steel Frame A1, from: 2300, to: 2380, rolledUpAt: '2026-09-13T09:12:04Z' } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/production/boms/compare:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Production]
    summary: Compare two BOM versions
    operationId: compareBoms
    x-permission: production.bom.view
    parameters:
      - { name: a, in: query, required: true, schema: { type: string }, example: bom_frame_1 }
      - { name: b, in: query, required: true, schema: { type: string }, example: bom_frame_2 }
    responses:
      '200':
        description: Diff
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/BomCompare' }
            examples:
              diff: { summary: v1 vs v2, value: { a: { id: bom_frame_1, code: BOM-FRAME-A1, bomVersion: 1 }, b: { id: bom_frame_2, code: BOM-FRAME-A1, bomVersion: 2 }, added: [{ id: bc_3, itemId: item_paint, itemCode: PNT-GRY, itemName: Powder paint grey, qty: 0.4, uom: L, scrapPct: 0, substitutes: [item_paint_alt], isPhantom: false }], removed: [], changed: [{ itemId: item_stl4, itemName: Steel Rod 4mm, from: { qty: 12.5, scrapPct: 3 }, to: { qty: 12, scrapPct: 2 } }], stdCostA: 2300, stdCostB: 2380 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/production/boms/where-used:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Production]
    summary: BOMs that use a component
    operationId: getBomWhereUsed
    x-permission: production.bom.view
    parameters:
      - { name: itemId, in: query, required: true, schema: { type: string }, example: item_stl4 }
    responses:
      '200':
        description: BOMs
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/production.yaml#/Bom' } } } }
            examples:
              list: { summary: Used in two BOMs, value: { data: [{ $ref: '#/components/examples/BomFrameActive/value' }] } }
              none: { summary: Not used, value: { data: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

# ── routings ──────────────────────────────────────────────────────────────

/production/routings:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Production]
    summary: Routings
    operationId: listRoutings
    x-permission: production.bom.view
    x-frd: [FR-MFG-003]
    parameters:
      - $ref: '../components/parameters.yaml#/IncludeInactive'
      - $ref: '../components/parameters.yaml#/ItemId'
    responses:
      '200':
        description: Routings
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/production.yaml#/Routing' } } } }
            examples:
              list: { summary: Routings, value: { data: [{ $ref: '#/components/examples/RoutingFrame/value' }] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Production]
    summary: Create a routing
    operationId: createRouting
    x-permission: production.bom.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/production.yaml#/RoutingCreate' }
          examples:
            inHouse: { summary: Three in-house operations, value: { code: RT-FRAME, name: Frame A1 standard route, itemId: item_frame, operations: [{ seq: 10, name: Cutting, workCentreId: wc_cut, setupMin: 15, runMinPerUnit: 4 }, { seq: 20, name: Welding, workCentreId: wc_weld, setupMin: 20, runMinPerUnit: 9 }, { seq: 30, name: Finishing, workCentreId: wc_fin, setupMin: 10, runMinPerUnit: 3, yieldPct: 98 }] } }
            withSubcontract: { summary: Subcontracted coating step, value: { code: RT-FRAME-SC, name: Frame A1 with outsourced coating, itemId: item_frame, operations: [{ seq: 10, name: Cutting, workCentreId: wc_cut, setupMin: 15, runMinPerUnit: 4 }, { seq: 20, name: Welding, workCentreId: wc_weld, setupMin: 20, runMinPerUnit: 9 }, { seq: 30, name: Powder coating, workCentreId: wc_ext, setupMin: 0, runMinPerUnit: 0, subcontract: true, supplierId: sup_powdercoat, serviceItemId: item_svc_coat, subcontractRate: 180 }] } }
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema: { $ref: '../components/schemas/production.yaml#/Routing' }
            examples:
              created: { $ref: '../components/examples/production.yaml#/RoutingFrame' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Validation
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              seq: { summary: Duplicate sequence, value: { code: VALIDATION, message: Operation sequence numbers must be unique, field: operations, correlationId: corr_9f1c2e7a } }

/production/routings/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Production]
    summary: Get a routing
    operationId: getRouting
    x-permission: production.bom.view
