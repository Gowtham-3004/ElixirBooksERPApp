# Company administration part 1 (tag: Admin): company, companies, branches, periods, defaults, business profile, users, roles.

/company:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Admin]
    summary: Company profile
    operationId: getCompany
    x-permission: admin.company.view
    x-frd: [FR-ORG-001]
    responses:
      '200':
        description: Company
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Company' }
            examples:
              acme: { $ref: '../components/examples/admin.yaml#/CompanyAcme' }
              gulf: { $ref: '../components/examples/admin.yaml#/CompanyGulf' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  patch:
    tags: [Admin]
    summary: Update company profile (optimistic concurrency)
    description: Identity, address, branding, financial settings and GST registrations. `baseCurrency` is locked once any journal is posted (`409 INVALID_STATE`). PAN / GSTIN formats are validated. Changes are audited with before/after.
    operationId: updateCompany
    x-permission: admin.company.edit
    x-frd: [FR-ORG-001, FR-ORG-004]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/admin.yaml#/CompanyPatch' }
          examples:
            identity: { summary: Legal identity, value: { expectedVersion: 9, legalName: Acme Trading Private Limited, pan: AAPCA1234F, cin: U51909MH2015PTC262001, businessType: Private Limited } }
            addRegistration: { summary: Add a GSTIN for a new state, value: { expectedVersion: 9, registrations: [{ id: reg_gst_mh, type: GSTIN, number: 27AAPCA1234F1Z5, state: Maharashtra, stateCode: '27', branchId: br_ho, status: Active }, { id: reg_gst_gj, type: GSTIN, number: 24AAPCA1234F1Z1, state: Gujarat, stateCode: '24', branchId: br_surat, status: Active }, { type: GSTIN, number: 29AAPCA1234F1Z8, state: Karnataka, stateCode: '29', status: Active }] } }
            currencies: { summary: Permit another transaction currency, value: { expectedVersion: 9, permittedCurrencies: [INR, USD, AED, EUR], reportingCurrency: USD } }
            branding: { summary: Branding, value: { expectedVersion: 9, logoText: AT, brandColor: '#0f766e' } }
    responses:
      '200':
        description: Updated company
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Company' }
            examples:
              updated: { $ref: '../components/examples/admin.yaml#/CompanyAcme' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/companies:
  get:
    tags: [Admin]
    summary: List the tenant's companies
    description: Tenant owner sees all legal entities; others see only the companies they belong to.
    operationId: listCompanies
    x-permission: admin.company.view
    responses:
      '200':
        description: Companies
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/admin.yaml#/Company' } }, planLimit: { type: integer }, used: { type: integer } } }
            examples:
              two:
                summary: Two entities of three allowed
                value:
                  data:
                    - { id: co_acme, tenantId: tnt_acme, code: ACME, legalName: Acme Trading Pvt Ltd, tradeName: Acme Trading, country: IN, baseCurrency: INR, permittedCurrencies: [INR, USD, AED], timeZone: Asia/Kolkata, locale: en-IN, language: en, fiscalYearStartMonth: 4, booksFrom: '2026-04-01', openingBalanceDate: '2026-03-31', nature: Trading, profiles: [Trading], profileHistory: [], businessType: Private Limited, address: { line1: 14 Marine Drive, city: Mumbai, state: Maharashtra, country: IN }, localizationPack: IN, localizationVersion: '1.4', registrations: [], defaults: { allowNegativeStock: false, valuationMethod: AVCO, matchingMode: 3-way, matchTolerancePct: 2, matchToleranceAmt: 500, creditPolicy: Warn, directInvoiceStock: true }, status: Active, onboarding: {}, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-01T10:00:00Z', version: 9 }
                    - { id: co_gulf, tenantId: tnt_acme, code: GULF, legalName: Acme Gulf Trading LLC, tradeName: Acme Gulf, country: AE, baseCurrency: AED, permittedCurrencies: [AED, USD, INR], timeZone: Asia/Dubai, locale: en-US, language: en, fiscalYearStartMonth: 1, booksFrom: '2026-01-01', openingBalanceDate: '2025-12-31', nature: Trading, profiles: [Trading], profileHistory: [], businessType: LLC, address: { line1: Office 1204 Latifa Tower, city: Dubai, state: Dubai, country: AE }, localizationPack: AE, localizationVersion: '1.0', registrations: [], defaults: { allowNegativeStock: false, valuationMethod: AVCO, matchingMode: 3-way, matchTolerancePct: 2, matchToleranceAmt: 100, creditPolicy: Warn, directInvoiceStock: true }, status: Active, onboarding: {}, createdAt: '2026-06-01T09:00:00Z', updatedAt: '2026-06-01T09:00:00Z', version: 2 }
                  planLimit: 3
                  used: 2
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Admin]
    summary: Add a legal entity (tenant owner)
    description: Creates the company with its localization pack, Head Office branch, FY periods and default number series. Blocked when the plan's `companies` limit is reached (`409 PLAN_LIMIT`).
    operationId: createCompany
    x-permission: admin.company.create
    x-frd: [FR-ORG-002, FR-PLT-003]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/admin.yaml#/CompanyCreate' }
          examples:
            india: { summary: Indian entity, value: { legalName: Acme Logistics Pvt Ltd, country: IN, fiscalYearStartMonth: 4, nature: Services } }
            uae: { summary: UAE entity (calendar FY), value: { legalName: Acme Gulf Trading LLC, country: AE, fiscalYearStartMonth: 1, nature: Trading, baseCurrency: AED } }
    responses:
      '201':
        description: Company created
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Company' }
            examples:
              created: { $ref: '../components/examples/admin.yaml#/CompanyGulf' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── branches ──────────────────────────────────────────────────────────────

/branches:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Admin]
    summary: List branches
    description: Query examples — `?status=Active` · `?type=Store`.
    operationId: listBranches
    x-permission: admin.branches.view
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - { name: status, in: query, schema: { type: string, enum: [Active, Inactive] } }
      - { name: type, in: query, schema: { type: string, enum: [Office, Warehouse, Store, Factory] } }
    responses:
      '200':
        description: Branches
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/admin.yaml#/Branch' } }
            examples:
              firstPage:
                summary: Active branches
                value:
                  data:
                    - { id: br_ho, companyId: co_acme, code: BR-001, name: Head Office, type: Office, address: { line1: 14 Marine Drive, city: Mumbai, state: Maharashtra, stateCode: '27', pin: '400021', country: IN }, registrationId: reg_gst_mh, gstin: 27AAPCA1234F1Z5, defaultWarehouseId: wh_main, status: Active, isDefault: true, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }
                    - { id: br_andheri, companyId: co_acme, code: BR-002, name: Andheri Store, type: Store, address: { line1: Shop 4 Link Road, city: Mumbai, state: Maharashtra, stateCode: '27', pin: '400053', country: IN }, registrationId: reg_gst_mh, defaultWarehouseId: wh_andheri, status: Active, isDefault: false, createdAt: '2026-04-10T09:00:00Z', updatedAt: '2026-04-10T09:00:00Z', version: 1 }
                    - { id: br_surat, companyId: co_acme, code: BR-003, name: Surat Warehouse, type: Warehouse, address: { line1: Plot 12 GIDC, city: Surat, state: Gujarat, stateCode: '24', pin: '394210', country: IN }, registrationId: reg_gst_gj, gstin: 24AAPCA1234F1Z1, status: Active, isDefault: false, createdAt: '2026-05-01T09:00:00Z', updatedAt: '2026-05-01T09:00:00Z', version: 1 }
                  meta: { nextCursor: null, limit: 25, total: 3, counts: { Active: 3, Inactive: 1, All: 4 } }
                  scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Admin]
    summary: Create a branch
    operationId: createBranch
    x-permission: admin.branches.create
    x-frd: [FR-ORG-005]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/admin.yaml#/BranchInput'
              - { required: [code, name, type, address] }
          examples:
            store: { summary: Retail store, value: { code: BR-004, name: Pune Store, type: Store, address: { line1: 5 FC Road, city: Pune, state: Maharashtra, stateCode: '27', pin: '411004', country: IN }, registrationId: reg_gst_mh, defaultWarehouseId: wh_pune } }
            factoryDefault: { summary: Factory set as default branch, value: { code: BR-005, name: Ambernath Plant, type: Factory, address: { line1: MIDC Phase II, city: Ambernath, state: Maharashtra, stateCode: '27', pin: '421506', country: IN }, isDefault: true } }
    responses:
      '201':
        description: Branch
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Branch' }
            examples:
              created: { $ref: '../components/examples/admin.yaml#/BranchAndheri' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/branches/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Admin]
    summary: Get a branch
    operationId: getBranch
    x-permission: admin.branches.view
    responses:
      '200':
        description: Branch
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Branch' }
            examples:
              ho: { $ref: '../components/examples/admin.yaml#/BranchHO' }
              store: { $ref: '../components/examples/admin.yaml#/BranchAndheri' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Admin]
    summary: Update a branch
    operationId: updateBranch
    x-permission: admin.branches.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/admin.yaml#/BranchPatch' }
          examples:
            rename: { summary: Rename + default warehouse, value: { expectedVersion: 1, name: Andheri West Store, defaultWarehouseId: wh_andheri } }
            address: { summary: Move address, value: { expectedVersion: 1, address: { line1: Shop 9 New Link Road, city: Mumbai, state: Maharashtra, stateCode: '27', pin: '400053', country: IN } } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Branch' }
            examples:
              updated: { $ref: '../components/examples/admin.yaml#/BranchAndheri' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
  delete:
    tags: [Admin]
    summary: Delete a branch (only if unused)
    description: Branches referenced by documents, users or warehouses cannot be deleted — deactivate instead (`409 REFERENCED`). The default branch cannot be deleted.
    operationId: deleteBranch
    x-permission: admin.branches.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/branches/{id}/set-default:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Admin]
    summary: Make this the default branch for new documents
    operationId: setDefaultBranch
    x-permission: admin.branches.edit
    responses:
      '200':
        description: Branch (now default)
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Branch' }
            examples:
              nowDefault: { $ref: '../components/examples/admin.yaml#/BranchHO' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/branches/{id}/status:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Admin]
    summary: Activate / deactivate a branch
    operationId: setBranchStatus
    x-permission: admin.branches.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [status], properties: { status: { type: string, enum: [Active, Inactive] }, reason: { type: string } } }
          examples:
            deactivate: { summary: Deactivate a closed store, value: { status: Inactive, reason: Store closed on 31 Aug 2026 } }
            activate: { summary: Re-activate, value: { status: Active } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Branch' }
            examples:
              inactive: { summary: Deactivated, value: { id: br_pune, companyId: co_acme, code: BR-004, name: Pune Store, type: Store, address: { line1: 5 FC Road, city: Pune, state: Maharashtra, country: IN }, status: Inactive, isDefault: false, createdAt: '2026-05-01T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 3 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── periods ───────────────────────────────────────────────────────────────

/periods:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Admin]
    summary: List financial periods
    description: Query examples — current FY `?fy=2026-27` · open only `?status=Open,Reopened`.
    operationId: listPeriods
    x-permission: admin.periods.view
    x-frd: [FR-ORG-006]
    parameters:
      - $ref: '../components/parameters.yaml#/FiscalYear'
      - { name: status, in: query, schema: { type: string }, style: form, explode: false, example: 'Open,Reopened' }
    responses:
      '200':
        description: Periods (12 per FY)
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/admin.yaml#/Period' } }
                    fiscalYears: { type: array, items: { type: string } }
            examples:
              fy2627:
                summary: FY 2026-27 (excerpt)
                value:
                  data:
                    - { id: per_acme_2026-08, companyId: co_acme, fy: '2026-27', code: '2026-08', label: Aug 2026, start: '2026-08-01', end: '2026-08-31', status: Locked, lockedAt: '2026-09-05T11:30:00Z', lockedBy: Rahul Mehta, history: [], createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-05T11:30:00Z', version: 4 }
                    - { id: per_acme_2026-09, companyId: co_acme, fy: '2026-27', code: '2026-09', label: Sep 2026, start: '2026-09-01', end: '2026-09-30', status: Open, history: [], createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-01T00:00:00Z', version: 2 }
                    - { id: per_acme_2026-10, companyId: co_acme, fy: '2026-27', code: '2026-10', label: Oct 2026, start: '2026-10-01', end: '2026-10-31', status: Future, history: [], createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-04-01T09:00:00Z', version: 1 }
                  fiscalYears: ['2025-26', '2026-27']
                  meta: { nextCursor: null, limit: 25, total: 12 }
                  scope: { companyId: co_acme, fy: '2026-27', currency: INR, asOf: '2026-09-13T09:12:04Z' }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/periods/{code}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Code'
  get:
    tags: [Admin]
    summary: Get a period with history
    operationId: getPeriod
    x-permission: admin.periods.view
    responses:
      '200':
        description: Period
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Period' }
            examples:
              open: { $ref: '../components/examples/admin.yaml#/PeriodSepOpen' }
              locked: { $ref: '../components/examples/admin.yaml#/PeriodAugLocked' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/periods/{code}/close-checklist:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Code'
  get:
    tags: [Admin]
    summary: Close checklist (blockers and warnings)
    operationId: getPeriodCloseChecklist
    x-permission: admin.periods.view
    x-frd: [FR-ACC-010]
    responses:
      '200':
        description: Checklist
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/CloseChecklist' }
            examples:
              blocked:
                summary: Three blockers
                value:
                  period: '2026-09'
                  canSoftClose: true
                  canLock: false
                  blockers: 3
                  warnings: 1
                  items:
                    - { key: draftJournals, label: Draft journals dated in period, status: Blocker, count: 4, link: 'accounting/journals?status=Draft&period=2026-09' }
                    - { key: bankRecon, label: Bank reconciliations not confirmed, status: Blocker, count: 1, link: banking/reconciliation }
                    - { key: gstr3b, label: GSTR-3B not generated, status: Blocker, count: 1, link: taxation/gstr3b }
                    - { key: pendingApprovals, label: Documents awaiting approval, status: Warning, count: 2, link: approvals }
                    - { key: unpostedInvoices, label: Draft sales invoices dated in period, status: Ok, count: 0, link: sales/invoices }
              clean:
                summary: Ready to lock
                value: { period: '2026-08', canSoftClose: true, canLock: true, blockers: 0, warnings: 0, items: [{ key: draftJournals, label: Draft journals dated in period, status: Ok, count: 0, link: accounting/journals }, { key: bankRecon, label: Bank reconciliations not confirmed, status: Ok, count: 0, link: banking/reconciliation }] }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/periods/{code}/soft-close:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Code'
  post:
    tags: [Admin]
    summary: Soft-close a period
    description: Operational users can no longer post; Finance Admin (`accounting.period.post`) still can. Requires status Open / Reopened.
    operationId: softClosePeriod
    x-permission: admin.periods.edit
    requestBody:
      required: false
      content:
        application/json:
          schema: { type: object, properties: { reason: { type: string } } }
          examples:
            plain: { summary: No reason, value: {} }
            withReason: { summary: With reason, value: { reason: Month-end review started } }
    responses:
      '200':
        description: Period
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Period' }
            examples:
              softClosed: { summary: Soft Closed, value: { id: per_acme_2026-09, companyId: co_acme, fy: '2026-27', code: '2026-09', label: Sep 2026, start: '2026-09-01', end: '2026-09-30', status: Soft Closed, history: [{ at: '2026-09-01T00:00:00Z', by: system, action: Opened }, { at: '2026-10-02T10:00:00Z', by: Rahul Mehta, action: Soft closed, reason: Month-end review started }], createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-10-02T10:00:00Z', version: 3 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/periods/{code}/lock:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Code'
  post:
    tags: [Admin]
    summary: Lock a period
    description: Requires a clean checklist (`422 CHECKLIST_BLOCKED` otherwise) and a reason. Publishes `PeriodLocked`.
    operationId: lockPeriod
    x-permission: admin.periods.edit
    x-frd: [FR-ACC-010]
    x-events: [PeriodLocked]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            monthEnd: { summary: Month-end close, value: { reason: Month-end close complete — TB reconciled } }
    responses:
      '200':
        description: Locked
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Period' }
            examples:
              locked: { $ref: '../components/examples/admin.yaml#/PeriodAugLocked' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
