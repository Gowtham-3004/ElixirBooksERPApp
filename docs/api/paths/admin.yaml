    tags: [Admin]
    summary: Suspend / reactivate / deactivate a user
    description: Suspend and deactivate require a reason and revoke all sessions. The tenant owner cannot be suspended or deactivated (`409 INVALID_STATE`). Deactivation is permanent.
    operationId: setUserStatus
    x-permission: admin.users.edit
    x-frd: [FR-IAM-005]
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [status], properties: { status: { type: string, enum: [Active, Suspended, Deactivated] }, reason: { type: string, minLength: 10 } } }
          examples:
            suspend: { summary: Suspend, value: { status: Suspended, reason: Extended leave — access paused until 1 Nov } }
            reactivate: { summary: Reactivate, value: { status: Active } }
            deactivate: { summary: Deactivate (left the company), value: { status: Deactivated, reason: Left the organisation on 31 Aug 2026 } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/User' }
            examples:
              suspended: { $ref: '../components/examples/admin.yaml#/UserSuspended' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/users/{id}/reset-password:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Admin]
    summary: Send a password-reset link to a user
    operationId: adminResetPassword
    x-permission: admin.users.edit
    responses:
      '202':
        description: Reset link queued
        content:
          application/json:
            schema: { type: object, required: [emailQueued, expiresAt], properties: { emailQueued: { type: boolean }, expiresAt: { type: string, format: date-time } } }
            examples:
              queued: { summary: Sent, value: { emailQueued: true, expiresAt: '2026-09-14T09:12:04Z' } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/users/{id}/sessions:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  delete:
    tags: [Admin]
    summary: Sign the user out of all sessions
    operationId: revokeUserSessions
    x-permission: admin.users.edit
    responses:
      '200':
        description: Sessions revoked
        content:
          application/json:
            schema: { type: object, required: [revoked], properties: { revoked: { type: integer } } }
            examples:
              revoked: { summary: Two sessions, value: { revoked: 2 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

# ── roles ─────────────────────────────────────────────────────────────────

/roles:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Admin]
    summary: List roles (system + custom)
    operationId: listRoles
    x-permission: admin.roles.view
    x-frd: [FR-IAM-003]
    parameters:
      - { name: isSystem, in: query, schema: { type: boolean } }
    responses:
      '200':
        description: Roles
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/admin.yaml#/Role' } } } }
            examples:
              roles:
                summary: Excerpt
                value:
                  data:
                    - { id: role_owner, code: OWNER, name: Tenant Owner, description: Everything, permissions: ['*'], dataScope: company, isSystem: true, userCount: 1, createdAt: '2026-01-01T00:00:00Z', updatedAt: '2026-01-01T00:00:00Z', version: 1 }
                    - { id: role_finadmin, code: FIN_ADMIN, name: Finance Admin, description: Post/reverse, periods, banking, tax, permissions: ['accounting.*', 'banking.*', 'taxation.*', 'sales.*', 'purchase.*', 'reports.*', 'masters.*', admin.periods.view, admin.periods.edit, admin.periods.approve], dataScope: company, isSystem: true, userCount: 1, createdAt: '2026-01-01T00:00:00Z', updatedAt: '2026-01-01T00:00:00Z', version: 1 }
                    - { id: role_arclerk, companyId: co_acme, code: ROLE_AR_CLERK, name: AR Clerk, description: Creates invoices and receipts; cannot post, permissions: [sales.invoice.view, sales.invoice.create, sales.invoice.edit, sales.receipt.view, sales.receipt.create, masters.customers.view], dataScope: branch, isSystem: false, userCount: 0, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Admin]
    summary: Create a custom role
    operationId: createRole
    x-permission: admin.roles.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/admin.yaml#/RoleInput'
              - { required: [code, name, permissions] }
          examples:
            arClerk: { summary: "Granular permissions, branch scope", value: { code: ROLE_AR_CLERK, name: AR Clerk, description: Creates invoices and receipts; cannot post, permissions: [sales.invoice.view, sales.invoice.create, sales.invoice.edit, sales.receipt.view, sales.receipt.create, masters.customers.view], dataScope: branch, color: '#f59e0b' } }
            viewer: { summary: Read-only everything, value: { code: ROLE_VIEWER, name: Viewer, description: Read-only access to all modules, permissions: ['*.*.view'], dataScope: company } }
    responses:
      '201':
        description: Role
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Role' }
            examples:
              created: { $ref: '../components/examples/admin.yaml#/RoleArClerk' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/roles/permission-matrix:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Admin]
    summary: Permission matrix metadata (module × resource × action)
    operationId: getPermissionMatrix
    x-permission: admin.roles.view
    responses:
      '200':
        description: Matrix
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/PermissionMatrix' }
            examples:
              matrix: { summary: Excerpt, value: { actions: [view, create, edit, submit, approve, post, reverse, export, delete], modules: [{ module: sales, label: Sales, resources: [{ id: quotation, label: Quotations }, { id: order, label: Sales orders }, { id: delivery, label: Deliveries }, { id: invoice, label: Invoices }, { id: creditnote, label: Credit notes }, { id: receipt, label: Receipts }] }, { module: accounting, label: Accounting, resources: [{ id: journal, label: Journals }, { id: ledger, label: Ledgers }, { id: period, label: Periods (post-closed) }, { id: reports, label: Financial reports }] }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/roles/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Admin]
    summary: Get a role
    operationId: getRole
    x-permission: admin.roles.view
    responses:
      '200':
        description: Role
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Role' }
            examples:
              system: { $ref: '../components/examples/admin.yaml#/RoleSalesMgr' }
              custom: { $ref: '../components/examples/admin.yaml#/RoleArClerk' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Admin]
    summary: Update a custom role
    description: System roles are read-only (`409 INVALID_STATE`). Permission changes take effect on the users' next request.
    operationId: updateRole
    x-permission: admin.roles.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/admin.yaml#/RolePatch' }
          examples:
            addPermission: { summary: Allow submitting invoices, value: { expectedVersion: 1, permissions: [sales.invoice.view, sales.invoice.create, sales.invoice.edit, sales.invoice.submit, sales.receipt.view, sales.receipt.create, masters.customers.view] } }
            scope: { summary: Widen data scope, value: { expectedVersion: 1, dataScope: company } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Role' }
            examples:
              updated: { $ref: '../components/examples/admin.yaml#/RoleArClerk' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
  delete:
    tags: [Admin]
    summary: Delete a custom role (no users assigned)
    operationId: deleteRole
    x-permission: admin.roles.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/roles/{id}/duplicate:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Admin]
    summary: Duplicate a role (system roles too) as a custom role
    operationId: duplicateRole
    x-permission: admin.roles.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string } } }
          examples:
            copy: { summary: Copy of Sales Manager, value: { code: SALES_MGR_SOUTH, name: Sales Manager (South) } }
    responses:
      '201':
        description: New role
        content:
          application/json:
            schema: { $ref: '../components/schemas/admin.yaml#/Role' }
            examples:
              copy: { summary: Copied, value: { id: role_salesmgr_south, companyId: co_acme, code: SALES_MGR_SOUTH, name: Sales Manager (South), description: Full sales cycle incl. posting and credit override, permissions: ['sales.*', 'crm.*', masters.customers.view, masters.customers.create, masters.customers.edit, masters.items.view, reports.sales.view], dataScope: company, isSystem: false, userCount: 0, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
