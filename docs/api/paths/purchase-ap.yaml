/purchase/exceptions:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Purchase]
    summary: Matching exceptions workbench
    description: "Tabs → Open · Unassigned (`assigned=false`) · Assigned to me (`assignedToId=me`) · Resolved · Approved · All. Query examples — `?type=Price variance` · `?invoiceId=vinv_00020`."
    operationId: listMatchExceptions
    x-permission: purchase.invoice.view
    x-frd: [FR-PUR-033]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - { name: status, in: query, schema: { type: string }, style: form, explode: false, example: 'Open,Assigned' }
      - { name: type, in: query, schema: { $ref: '../components/schemas/purchase.yaml#/ExceptionType' } }
      - { name: assigned, in: query, schema: { type: boolean } }
      - { name: assignedToId, in: query, schema: { type: string }, description: Use `me` for the caller. }
      - { name: invoiceId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/SupplierId'
    responses:
      '200':
        description: Exceptions
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/purchase.yaml#/MatchException' } }
            examples:
              firstPage: { summary: Open exceptions, value: { data: [{ $ref: '#/components/examples/MatchExceptionOpen/value' }], meta: { nextCursor: null, limit: 25, total: 1, counts: { Open: 1, Unassigned: 1, 'Assigned to me': 0, Resolved: 0, Approved: 12, All: 13 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

