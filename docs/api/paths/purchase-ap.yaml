# Purchase part 2 (tag: Purchase): vendor invoices & matching exceptions, debit notes / returns, payments,
# payment batches (maker-checker), AP ageing / due schedule / statements, settings.
# src/modules/purchase/invoiceActions.ts, paymentActions.ts

# ── vendor invoices ───────────────────────────────────────────────────────

/purchase/vendor-invoices:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Purchase]
    summary: List vendor invoices
    description: "Tabs → All · Draft · Exception (`matchStatus=Exception`) · Ready to post (`status=Approved`) · Posted · Unpaid (`unpaid=true`) · Reversed/cancelled. Query examples — `?partyId=sup_bharatsteel&status=Posted` · `?matchStatus=Exception` · `?dueTo=2026-09-20&unpaid=true`."
    operationId: listVendorInvoices
    x-permission: purchase.invoice.view
    x-frd: [FR-PUR-030]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: matchStatus, in: query, schema: { $ref: '../components/schemas/purchase.yaml#/MatchStatus' } }
      - { name: unpaid, in: query, schema: { type: boolean } }
      - { name: dueTo, in: query, schema: { type: string, format: date } }
      - { name: poId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/PartyId'
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
      - $ref: '../components/parameters.yaml#/AmountMin'
      - $ref: '../components/parameters.yaml#/AmountMax'
    responses:
      '200':
        description: Vendor invoices
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/purchase.yaml#/VendorInvoice' } }
            examples:
              firstPage: { summary: Posted + exception, value: { data: [{ $ref: '#/components/examples/VendorInvoicePosted/value' }, { $ref: '#/components/examples/VendorInvoiceException/value' }], meta: { nextCursor: null, limit: 25, total: 2, counts: { All: 88, Draft: 2, Exception: 1, 'Ready to post': 3, Posted: 78, Unpaid: 14, 'Reversed/cancelled': 4 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Purchase]
    summary: Book a vendor invoice (Draft)
    description: |
      Sources: **from PO** (`poId` + lines with `poLineId`), **from GRN** (`grnIds` + lines with `grnLineId` — 3-way match),
      or **direct / expense** (no PO; matching Not Required; account per line). Duplicate detection on supplier + supplier
      invoice number within `duplicateInvoiceScope` → `409 DUPLICATE`. Input tax, reverse charge and TDS computed server-side.
    operationId: createVendorInvoice
    x-permission: purchase.invoice.create
    x-events: [DocumentCreated]
    x-frd: [FR-PUR-030, FR-PUR-031]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/purchase.yaml#/VendorInvoiceCreate' }
          examples:
            fromGrn: { summary: Against PO + GRN (3-way), value: { partyId: sup_bharatsteel, date: '2026-09-13', supplierInvoiceNumber: BS-7781, supplierInvoiceDate: '2026-09-12', poId: po_00118, grnIds: [grn_00077], lines: [{ poLineId: ln_po_1, grnId: grn_00077, grnLineId: ln_g1, itemId: item_stl4, qty: 2950, rate: 48, taxRateId: tax_gst18 }] } }
            fromPo: { summary: "Against PO only (2-way, services)", value: { partyId: sup_consult, date: '2026-09-13', supplierInvoiceNumber: MA-2026-118, supplierInvoiceDate: '2026-09-10', poId: po_00124, lines: [{ poLineId: ln_po_30, itemId: item_consult, qty: 40, rate: 2000, taxRateId: tax_gst18, accountId: acc_5530 }], tdsSectionId: tds_194j } }
            directExpense: { summary: Direct expense invoice (no PO), value: { partyId: sup_transport, date: '2026-09-13', supplierInvoiceNumber: ST-0912-77, supplierInvoiceDate: '2026-09-12', lines: [{ itemName: Freight — Surat to Mumbai, qty: 1, uom: TRIP, rate: 18000, taxRateId: tax_gst5, accountId: acc_5030, dimensions: { CostCentre: dim_cc_logistics } }], tdsSectionId: tds_194c } }
            reverseCharge: { summary: Reverse-charge supply (unregistered legal services), value: { partyId: sup_vinod, date: '2026-09-13', supplierInvoiceNumber: VA-44, supplierInvoiceDate: '2026-09-11', reverseCharge: true, lines: [{ itemName: Legal opinion — lease agreement, qty: 1, uom: JOB, rate: 25000, taxRateId: tax_rcm18, accountId: acc_5530 }], tdsSectionId: tds_194j } }
            withChargesLandedCost: { summary: Import with freight as landed cost, value: { partyId: sup_shenzhen, date: '2026-09-13', currency: USD, supplierInvoiceNumber: SZ-INV-2026-0912, supplierInvoiceDate: '2026-09-10', poId: po_00125, grnIds: [grn_00080], freightAsLandedCost: true, lines: [{ poLineId: ln_po_40, grnId: grn_00080, grnLineId: ln_g40, itemId: item_electrode, qty: 10000, rate: 0.35, taxRateId: tax_gst0 }], charges: [{ name: Sea freight, amount: 800, accountId: acc_5030 }] } }
    responses:
      '201':
        description: Draft vendor invoice
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/VendorInvoice' }
            examples:
              draft: { summary: Draft, value: { id: vinv_00019, companyId: co_acme, number: DRAFT-VINV-19, docType: Vendor Invoice, date: '2026-09-13', dueDate: '2026-10-28', branchId: br_surat, status: Draft, matchStatus: Pending, currency: INR, rate: 1, partyType: Supplier, partyId: sup_bharatsteel, partyName: Bharat Steel Industries, supplierInvoiceNumber: BS-7781, supplierInvoiceDate: '2026-09-12', poId: po_00118, poNumber: PO/SRT/0118/26-27, grnIds: [grn_00077], grnNumbers: [GRN/2026-27/00077], lines: [{ id: ln_v1, poLineId: ln_po_1, grnId: grn_00077, grnLineId: ln_g1, itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, hsn: '7214', qty: 2950, uom: KG, rate: 48, discountPct: 0, discountAmt: 0, taxable: 141600, taxRateId: tax_gst18, taxRate: 18, taxAmt: 25488, taxComponents: { IGST: 25488 }, amount: 167088, poRate: 48, poQty: 5000, grnQty: 2950 }], totals: { subtotal: 141600, discount: 0, taxable: 141600, tax: 25488, components: { IGST: 25488 }, breakup: [], charges: 0, tds: 2832, tdsSection: 194C, roundOff: 0, total: 167088, paid: 0, credited: 0, writtenOff: 0, due: 164256, baseTotal: 167088 }, tdsSectionId: tds_194c, reverseCharge: false, openExceptions: 0, createdAt: '2026-09-13T09:00:00Z', updatedAt: '2026-09-13T09:00:00Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Duplicate supplier invoice
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              duplicate: { summary: Same supplier invoice number in scope, value: { code: DUPLICATE, message: Supplier invoice number BS-7781 already booked for Bharat Steel in FY 2026-27 (VINV/2026-27/00019), field: supplierInvoiceNumber, details: { existingId: vinv_00019, scope: Supplier+FY }, correlationId: corr_9f1c2e7a } }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/purchase/vendor-invoices/check-duplicate:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Purchase]
    summary: Duplicate check before booking
    operationId: checkDuplicateVendorInvoice
    x-permission: purchase.invoice.view
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/purchase.yaml#/DuplicateCheckRequest' }
          examples:
            check: { summary: Check, value: { partyId: sup_bharatsteel, supplierInvoiceNumber: BS-7781, supplierInvoiceDate: '2026-09-12', amount: 167088 } }
    responses:
      '200':
        description: Result
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/DuplicateCheckResult' }
            examples:
              duplicate: { summary: Duplicate found, value: { duplicate: true, scope: Supplier+FY, existing: { $ref: '#/components/examples/VendorInvoicePosted/value' }, similar: [] } }
              clean: { summary: No duplicate, value: { duplicate: false, scope: Supplier+FY, similar: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/purchase/vendor-invoices/bulk:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Purchase]
    summary: Bulk — create a payment proposal / print selected
    operationId: bulkVendorInvoices
    x-permission: purchase.payment.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/BulkRequest' }
          examples:
            proposal: { summary: Create payment proposal from selected posted invoices, value: { ids: [vinv_00019, vinv_00022, vinv_00023], action: create-payment-proposal } }
            print: { summary: Print booking copies, value: { ids: [vinv_00019], action: print } }
    responses:
      '200':
        description: Per-id results (+ proposal id when created)
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/BulkResult'
                - type: object
                  properties:
                    batch: { $ref: '../components/schemas/purchase.yaml#/PaymentBatch' }
            examples:
              proposal: { summary: Proposal created, value: { requested: 3, succeeded: 3, failed: 0, results: [{ id: vinv_00019, ok: true }, { id: vinv_00022, ok: true }, { id: vinv_00023, ok: true }], batch: { $ref: '#/components/examples/PaymentBatchApproved/value' } } }
              partialFailure: { $ref: '../components/examples/common.yaml#/BulkPartialFailure' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/purchase/vendor-invoices/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Purchase]
    summary: Get a vendor invoice
    operationId: getVendorInvoice
    x-permission: purchase.invoice.view
    parameters:
      - $ref: '../components/parameters.yaml#/Expand'
    responses:
      '200':
        description: Vendor invoice
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/VendorInvoice' }
            examples:
              posted: { $ref: '../components/examples/purchase.yaml#/VendorInvoicePosted' }
              exception: { $ref: '../components/examples/purchase.yaml#/VendorInvoiceException' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Purchase]
    summary: Edit a Draft vendor invoice
    operationId: updateVendorInvoice
    x-permission: purchase.invoice.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/purchase.yaml#/VendorInvoicePatch' }
          examples:
            header: { summary: Supplier invoice details, value: { expectedVersion: 1, supplierInvoiceNumber: BS-7781A, supplierInvoiceDate: '2026-09-12', dueDate: '2026-10-27' } }
            lines: { summary: Correct a rate, value: { expectedVersion: 1, lines: [{ id: ln_v1, poLineId: ln_po_1, grnId: grn_00077, grnLineId: ln_g1, itemId: item_stl4, qty: 2950, rate: 48.5, taxRateId: tax_gst18 }] } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/VendorInvoice' }
            examples:
              updated: { $ref: '../components/examples/purchase.yaml#/VendorInvoicePosted' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
  delete:
    tags: [Purchase]
    summary: Delete a Draft vendor invoice
    operationId: deleteVendorInvoice
    x-permission: purchase.invoice.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/purchase/vendor-invoices/{id}/submit:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Purchase]
    summary: Submit — runs 2/3/4-way matching
    description: |
      Runs matching per `matchingMode` and tolerances (price, qty, tax, charges, missing GRN):
      - all within tolerance / not required → `matchStatus: Matched|Not Required`, invoice `Approved` (`outcome: approved`);
      - variances → `matchStatus: Exception`, invoice `Submitted`, one `MatchException` per variance (`outcome: exception`),
        optionally an approval request when a `Vendor Invoice` rule matches (`outcome: routed-for-approval`).
    operationId: submitVendorInvoice
    x-permission: purchase.invoice.submit
    x-idempotent: true
    x-workflow-doc-type: Vendor Invoice
    x-events: [DocumentSubmitted, PurchaseMatched, DocumentApproved]
    x-frd: [FR-PUR-032, FR-PUR-033]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Outcome
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/VendorInvoiceSubmitResult' }
            examples:
              matched: { summary: outcome = approved (3-way matched), value: { outcome: approved, invoice: { id: vinv_00019, companyId: co_acme, number: VINV/2026-27/00019, docType: Vendor Invoice, date: '2026-09-13', dueDate: '2026-10-28', branchId: br_surat, status: Approved, matchStatus: Matched, matchMode: 3-way, currency: INR, rate: 1, partyType: Supplier, partyId: sup_bharatsteel, partyName: Bharat Steel Industries, supplierInvoiceNumber: BS-7781, supplierInvoiceDate: '2026-09-12', poId: po_00118, poNumber: PO/SRT/0118/26-27, grnIds: [grn_00077], grnNumbers: [GRN/2026-27/00077], lines: [], totals: { subtotal: 141600, discount: 0, taxable: 141600, tax: 25488, components: {}, breakup: [], charges: 0, tds: 2832, roundOff: 0, total: 167088, paid: 0, credited: 0, writtenOff: 0, due: 164256, baseTotal: 167088 }, reverseCharge: false, openExceptions: 0, submittedAt: '2026-09-13T09:12:04Z', createdAt: '2026-09-13T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 2 }, match: { status: Matched, mode: 3-way, tolerance: '2% / ₹500', exceptions: [], checks: [{ lineId: ln_v1, itemName: Steel Rod 4mm, check: Price, expected: 48, actual: 48, variance: 0, withinTolerance: true }, { lineId: ln_v1, itemName: Steel Rod 4mm, check: Qty, expected: 2950, actual: 2950, variance: 0, withinTolerance: true }, { lineId: ln_v1, itemName: Steel Rod 4mm, check: Tax, expected: 25488, actual: 25488, variance: 0, withinTolerance: true }] }, warnings: [] } }
              exception: { summary: outcome = exception (price variance 6%), value: { outcome: exception, invoice: { $ref: '#/components/examples/VendorInvoiceException/value' }, match: { status: Exception, mode: 3-way, tolerance: '2% / ₹500', exceptions: [{ $ref: '#/components/examples/MatchExceptionOpen/value' }], checks: [{ lineId: ln_v2, itemName: Carton box L, check: Price, expected: 25, actual: 26.5, variance: 1.5, withinTolerance: false }, { lineId: ln_v2, itemName: Carton box L, check: Qty, expected: 1000, actual: 1000, variance: 0, withinTolerance: true }] }, warnings: ['1 matching exception raised — resolve and approve before posting'] } }
              notRequired: { summary: outcome = approved (direct expense — matching not required), value: { outcome: approved, invoice: { id: vinv_00024, companyId: co_acme, number: VINV/2026-27/00024, docType: Vendor Invoice, date: '2026-09-13', dueDate: '2026-09-28', branchId: br_ho, status: Approved, matchStatus: Not Required, currency: INR, rate: 1, partyType: Supplier, partyId: sup_transport, partyName: Speedy Transport Co, supplierInvoiceNumber: ST-0912-77, supplierInvoiceDate: '2026-09-12', grnIds: [], grnNumbers: [], lines: [], totals: { subtotal: 18000, discount: 0, taxable: 18000, tax: 900, components: {}, breakup: [], charges: 0, tds: 360, roundOff: 0, total: 18900, paid: 0, credited: 0, writtenOff: 0, due: 18540, baseTotal: 18900 }, tdsSectionId: tds_194c, reverseCharge: false, openExceptions: 0, createdAt: '2026-09-13T09:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 2 }, match: { status: Not Required, mode: 3-way, exceptions: [], checks: [] }, warnings: [] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/purchase/vendor-invoices/{id}/matching:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Purchase]
    summary: Matching detail (PO vs GRN vs invoice, exceptions)
    operationId: getVendorInvoiceMatching
    x-permission: purchase.invoice.view
    responses:
      '200':
        description: Match result
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/MatchResult' }
            examples:
              exception: { summary: One open exception, value: { status: Exception, mode: 3-way, tolerance: '2% / ₹500', exceptions: [{ $ref: '#/components/examples/MatchExceptionOpen/value' }], checks: [{ lineId: ln_v2, itemName: Carton box L, check: Price, expected: 25, actual: 26.5, variance: 1.5, withinTolerance: false }] } }
              matched: { summary: Matched, value: { status: Matched, mode: 3-way, tolerance: '2% / ₹500', exceptions: [], checks: [{ lineId: ln_v1, itemName: Steel Rod 4mm, check: Price, expected: 48, actual: 48, variance: 0, withinTolerance: true }] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/purchase/vendor-invoices/{id}/post:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Purchase]
    summary: Post an Approved vendor invoice (AP, input tax, GRNI clearing, TDS)
    description: Blocked while exceptions are open (`422 MATCH_EXCEPTION`). Journal Dr expense/inventory-or-GRNI + input tax (or RCM output+input) / Cr AP (+ Cr TDS payable). Creates the AP open item. Idempotent.
    operationId: postVendorInvoice
    x-permission: purchase.invoice.post
    x-idempotent: true
    x-events: [DocumentPosted, PurchaseInvoiced, JournalPosted]
    x-frd: [FR-PUR-034]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Posted
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/purchase.yaml#/VendorInvoice' }
            examples:
