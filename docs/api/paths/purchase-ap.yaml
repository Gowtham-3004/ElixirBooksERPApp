              firstPage: { summary: Batches, value: { data: [{ $ref: '#/components/examples/PaymentBatchApproved/value' }], meta: { nextCursor: null, limit: 25, total: 1, counts: { All: 12, 'In progress': 1, 'Awaiting approval': 0, Completed: 10, 'Failed/reversed': 1 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
