    summary: Live return preview for a period (sections, HSN summary, set-off, ledger reconciliation)
    operationId: getReturnPreview
    x-permission: taxation.returns.view
    x-frd: [FR-CMP-007]
    parameters:
      - { name: period, in: query, required: true, schema: { type: string }, example: '2026-09' }
      - { name: registrationId, in: query, schema: { type: string } }
    responses:
      '200':
        description: Preview
        content:
          application/json:
            schema: { $ref: '../components/schemas/taxation.yaml#/ReturnPreview' }
            examples:
              gstr1: { summary: GSTR-1, value: { type: GSTR-1, period: '2026-09', registrationId: reg_mh, gstin: 27AAACA1234A1Z5, sections: [{ code: 4A, desc: B2B supplies to registered persons, count: 38, taxable: 4120000, cgst: 370800, sgst: 370800, igst: 0, cess: 0, tax: 741600 }, { code: 5A, desc: 'B2C Large (inter-state, invoice > ₹2.5 L)', count: 1, taxable: 300000, cgst: 0, sgst: 0, igst: 54000, cess: 0, tax: 54000 }, { code: 6A, desc: Exports / SEZ supplies (zero-rated), count: 1, taxable: 840000, cgst: 0, sgst: 0, igst: 0, cess: 0, tax: 0 }, { code: '7', desc: B2C Small (unregistered), count: 412, taxable: 1546000, cgst: 41200, sgst: 41200, igst: 44000, cess: 0, tax: 126400 }, { code: '8', desc: 'Nil-rated, exempt and non-GST supplies', count: 0, taxable: 0, cgst: 0, sgst: 0, igst: 0, cess: 0, tax: 0 }, { code: 9B, desc: Credit / debit notes — registered, count: 2, taxable: -60000, cgst: -5400, sgst: -5400, igst: 0, cess: 0, tax: -10800 }, { code: '12', desc: HSN-wise summary of outward supplies, count: 9, taxable: 6746000, cgst: 0, sgst: 0, igst: 0, cess: 0, tax: 911200 }, { code: '13', desc: Documents issued, count: 454, taxable: 0, cgst: 0, sgst: 0, igst: 0, cess: 0, tax: 0 }], hsn: [{ hsn: '7214', description: Bars and rods of iron or non-alloy steel, qty: 82000, taxable: 4080000, tax: 734400, rate: 18 }], docsIssued: 454, totals: { taxable: 6746000, cgst: 406600, sgst: 406600, igst: 98000, cess: 0, tax: 911200 }, reconciliation: { registerTax: 911200, ledgerTax: 911200, difference: 0 }, dueDate: '2026-10-11', latestVersion: { $ref: '#/components/examples/Gstr1Filed/value' } } }
              gstr3b: { summary: GSTR-3B with set-off, value: { type: GSTR-3B, period: '2026-09', registrationId: reg_mh, gstin: 27AAACA1234A1Z5, sections: [{ code: 3.1(a), desc: 'Outward taxable supplies (other than zero-rated, nil-rated, exempted)', count: 453, taxable: 5906000, cgst: 412000, sgst: 412000, igst: 98000, cess: 0, tax: 922000 }, { code: 3.1(b), desc: Outward taxable supplies (zero rated), count: 1, taxable: 840000, cgst: 0, sgst: 0, igst: 0, cess: 0, tax: 0 }, { code: 3.1(d), desc: Inward supplies liable to reverse charge, count: 1, taxable: 40000, cgst: 3600, sgst: 3600, igst: 0, cess: 0, tax: 7200 }, { code: 4(A)(5), desc: ITC available — all other ITC, count: 61, taxable: 3690000, cgst: 310000, sgst: 310000, igst: 45000, cess: 0, tax: 665000 }, { code: 4(D)(1), desc: 'Ineligible ITC (blocked u/s 17(5), unregistered)', count: 1, taxable: 850000, cgst: 119000, sgst: 119000, igst: 0, cess: 0, tax: 238000 }], totals: { taxable: 5906000, cgst: 415600, sgst: 415600, igst: 98000, cess: 0, tax: 929200, itc: 665000, netPayable: 264200 }, setOff: { steps: [{ label: IGST credit → IGST liability, amount: 45000 }, { label: CGST credit → CGST liability, amount: 310000 }, { label: SGST credit → SGST liability, amount: 310000 }], payable: { igst: 53000, cgst: 105600, sgst: 105600, cess: 0, total: 264200 }, carried: { igst: 0, cgst: 0, sgst: 0, cess: 0 } }, reconciliation: { registerTax: 929200, ledgerTax: 929200, difference: 0 }, dueDate: '2026-10-20' } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
