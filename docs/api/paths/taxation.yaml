# Taxation (tag: Taxation). src/modules/taxation/derive.ts + pages; engine.ts submitEInvoice / cancelEInvoice / generateEwayBill / cancelEwayBill.

/taxation/overview:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Taxation]
    summary: Tax overview (liability, ITC, TDS, e-invoice / EWB health, filing calendar)
    operationId: getTaxOverview
    x-permission: taxation.returns.view
    x-frd: [FR-CMP-001]
    parameters:
      - $ref: '../components/parameters.yaml#/PeriodCode'
      - { name: registrationId, in: query, schema: { type: string } }
    responses:
      '200':
        description: Overview
        content:
          application/json:
            schema: { $ref: '../components/schemas/taxation.yaml#/TaxOverview' }
            examples:
              september: { summary: September, value: { period: '2026-09', output: { cgst: 412000, sgst: 412000, igst: 98000, cess: 0, total: 922000 }, itc: { cgst: 310000, sgst: 310000, igst: 45000, cess: 0, total: 665000 }, netPayable: 257000, ledgerReconciliation: { registerOutput: 922000, ledgerOutput: 922000, difference: 0 }, tdsPayable: 84500, eInvoice: { pending: 2, accepted: 38, rejected: 1 }, ewb: { pending: 1, generated: 12, expiringToday: 0 }, calendar: [{ id: 'gstr1:2026-08', label: GSTR-1 August 2026, type: GSTR-1, period: '2026-08', due: '2026-09-11', status: Filed, filedAt: '2026-09-09T14:00:00Z', arn: AA270826123456K }, { id: 'gstr3b:2026-08', label: GSTR-3B August 2026, type: GSTR-3B, period: '2026-08', due: '2026-09-20', status: Pending }, { id: 'tds:2026-27:Q2', label: TDS 26Q Q2 2026-27, type: 26Q, period: '2026-27 Q2', due: '2026-10-31', status: Pending }] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/taxation/registers/{register}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - { name: register, in: path, required: true, schema: { type: string, enum: [b2b, b2c, purchase, cdn] }, description: b2b — registered outward; b2c — unregistered outward; purchase — inward / ITC; cdn — credit & debit notes. }
  get:
    tags: [Taxation]
    summary: GST register (live from posted documents)
    description: Query examples — `?period=2026-09` · `?dateFrom=2026-04-01&dateTo=2026-06-30` · `?registrationId=reg_mh` · `?branchId=br_andheri` · `?hsnMissing=true` · `?eInvoiceStatus=Pending`.
    operationId: getGstRegister
    x-permission: taxation.returns.view
    x-frd: [FR-CMP-006]
    parameters:
      - $ref: '../components/parameters.yaml#/PeriodCode'
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
      - { name: registrationId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/BranchFilter'
      - { name: hsnMissing, in: query, schema: { type: boolean } }
      - { name: eInvoiceStatus, in: query, schema: { type: string } }
      - { name: itcEligible, in: query, schema: { type: boolean }, description: purchase register only }
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: Rows
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/taxation.yaml#/GstRegisterRow' } }
                    totals: { $ref: '../components/schemas/taxation.yaml#/GstRegisterTotals' }
            examples:
              b2b: { summary: B2B rows, value: { data: [{ id: 'salesInvoices:inv_01j8k3', collection: salesInvoices, docId: inv_01j8k3, docType: Sales Invoice, number: INV/2026-27/00042, date: '2026-09-13', period: '2026-09', party: Arlene Traders, gstin: 27AABCA1234F1Z5, treatment: Registered, pos: Maharashtra, posCode: '27', taxable: 100000, cgst: 9000, sgst: 9000, igst: 0, cess: 0, tax: 18000, total: 118000, reverseCharge: false, eInvoiceStatus: Accepted, ewbStatus: Generated, ewbNo: '271000123456', ewbValidUpto: '2026-09-14T23:59:59Z', hsnMissing: false, sign: 1, link: sales/invoices/inv_01j8k3, registrationId: reg_mh, branchId: br_ho, hsnRows: [{ hsn: '7214', taxable: 100000, tax: 18000, qty: 2000, rate: 18 }] }], totals: { count: 1, taxable: 100000, cgst: 9000, sgst: 9000, igst: 0, cess: 0, tax: 18000, total: 118000 }, meta: { nextCursor: null, limit: 25, total: 1 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              purchaseIneligible: { summary: Purchase register with blocked ITC, value: { data: [{ id: 'vendorInvoices:vi_00210', collection: vendorInvoices, docId: vi_00210, docType: Vendor Invoice, number: VI/2026-27/00210, date: '2026-09-08', period: '2026-09', party: Metro Motors, gstin: 27AABCM4321F1Z2, treatment: Registered, pos: Maharashtra, posCode: '27', taxable: 850000, cgst: 119000, sgst: 119000, igst: 0, cess: 0, tax: 238000, total: 1088000, reverseCharge: false, eInvoiceStatus: Not Applicable, hsnMissing: false, itcEligible: false, itcIneligibleReason: 'Blocked u/s 17(5) — motor vehicle', sign: 1, link: purchase/vendor-invoices/vi_00210, hsnRows: [] }], totals: { count: 1, taxable: 850000, cgst: 119000, sgst: 119000, igst: 0, cess: 0, tax: 238000, total: 1088000 }, meta: { nextCursor: null, limit: 25, total: 1 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/taxation/registers/{register}/export:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - { name: register, in: path, required: true, schema: { type: string, enum: [b2b, b2c, purchase, cdn] } }
  post:
    tags: [Taxation]
    summary: Export a register (CSV / XLSX / GST offline-tool JSON)
    operationId: exportGstRegister
    x-permission: taxation.returns.export
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/system.yaml#/ExportRequest'
              - { type: object, properties: { period: { type: string }, registrationId: { type: string } } }
          examples:
            xlsx: { summary: XLSX for the month, value: { format: xlsx, period: '2026-09' } }
            json: { summary: Offline tool JSON, value: { format: json, period: '2026-09', registrationId: reg_mh } }
    responses:
      '202':
        description: Export job queued
        content:
          application/json:
            schema: { $ref: '../components/schemas/system.yaml#/ExportJob' }
            examples:
              queued: { summary: Queued, value: { id: exp_401, companyId: co_acme, kind: gst-register-b2b, format: xlsx, status: Queued, requestedBy: Priya Sharma, params: { period: '2026-09' }, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

# ── e-invoices ────────────────────────────────────────────────────────────

/taxation/e-invoices:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Taxation]
    summary: e-Invoice queue (applicable documents with readiness + IRP status)
    description: "Tabs → Pending · Not ready (`ready=false`) · Accepted · Rejected · Cancelled · All."
    operationId: listEInvoices
    x-permission: taxation.einvoice.view
    x-frd: [FR-CMP-002, FR-CMP-003]
    parameters:
      - $ref: '../components/parameters.yaml#/PeriodCode'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: ready, in: query, schema: { type: boolean } }
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: Rows
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/taxation.yaml#/EInvoiceRow' } }
            examples:
              queue: { summary: "Pending, not ready, accepted", value: { data: [{ id: 'salesInvoices:inv_01j8k3', collection: salesInvoices, docId: inv_01j8k3, docType: Sales Invoice, number: INV/2026-27/00042, date: '2026-09-13', party: Arlene Traders, gstin: 27AABCA1234F1Z5, total: 118000, status: Pending, applicable: true, ready: true, issues: [], link: sales/invoices/inv_01j8k3 }, { id: 'salesInvoices:inv_01j8k9', collection: salesInvoices, docId: inv_01j8k9, docType: Sales Invoice, number: INV/2026-27/00047, date: '2026-09-13', party: Metro Retail, gstin: 27AABCM9876F1Z1, total: 59000, status: Pending, applicable: true, ready: false, issues: ['HSN missing on line 2', 'Buyer pincode missing'], link: sales/invoices/inv_01j8k9 }, { id: 'salesInvoices:inv_01j8k1', collection: salesInvoices, docId: inv_01j8k1, docType: Sales Invoice, number: INV/2026-27/00040, date: '2026-09-11', party: Arlene Traders, gstin: 27AABCA1234F1Z5, total: 236000, status: Accepted, applicable: true, ready: true, issues: [], statutory: { irn: 35054cc24d97033afc24f49ec4444dbab81f542c999a4f3f4e7a6f6a4a5b1c2d, ackNo: '112010036563789', ackDate: '2026-09-11T10:20:00Z', eInvoiceStatus: Accepted, eInvoiceSubmittedAt: '2026-09-11T10:20:00Z' }, link: sales/invoices/inv_01j8k1 }], meta: { nextCursor: null, limit: 25, total: 3, counts: { Pending: 2, 'Not ready': 1, Accepted: 38, Rejected: 1, Cancelled: 0, All: 41 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/taxation/e-invoices/{collection}/{docId}/submit:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Collection'
    - { name: docId, in: path, required: true, schema: { type: string }, example: inv_01j8k3 }
  post:
    tags: [Taxation]
    summary: Submit to the IRP (generate IRN)
    description: "Idempotent per document (`einv:{docId}`). A rejected submission stores the IRP error on the document and can be retried after fixing the data. Same behaviour as `POST /sales/invoices/{id}/e-invoice`."
    operationId: submitEInvoiceByDoc
    x-permission: taxation.einvoice.submit
    x-idempotent: true
    x-events: [StatutorySubmissionAccepted, StatutorySubmissionRejected]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: IRP result
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/StatutoryResult' }
            examples:
              accepted: { summary: Accepted (IRN), value: { document: { id: inv_01j8k3, number: INV/2026-27/00042, status: Posted }, statutory: { irn: 35054cc24d97033afc24f49ec4444dbab81f542c999a4f3f4e7a6f6a4a5b1c2d, ackNo: '112010036563789', ackDate: '2026-09-13T09:12:04Z', signedQr: 'QR:35054cc24d97033afc24f49ec', eInvoiceStatus: Accepted, eInvoiceSubmittedAt: '2026-09-13T09:12:04Z' }, integrationLog: { id: il_901, companyId: co_acme, provider: IRP, action: GenerateIRN, objectType: Sales Invoice, objectId: inv_01j8k3, objectNumber: INV/2026-27/00042, status: Accepted, providerRef: '112010036563789', request: { DocNo: INV/2026-27/00042, DocDt: '2026-09-13', SellerGstin: 27AAACA1234A1Z5, BuyerGstin: 27AABCA1234F1Z5, TotInvVal: 118000 }, response: { Irn: 35054cc24d97033afc24f49ec4444dbab81f542c999a4f3f4e7a6f6a4a5b1c2d, AckNo: '112010036563789', Status: ACT }, at: '2026-09-13T09:12:04Z', correlationId: corr_einv42, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } } }
              rejected: { summary: Rejected by IRP (2172), value: { document: { id: inv_01j8k9, number: INV/2026-27/00047, status: Posted }, statutory: { eInvoiceStatus: Rejected, eInvoiceError: '2172: Buyer GSTIN is inactive on the GST portal', eInvoiceSubmittedAt: '2026-09-13T09:12:04Z' }, integrationLog: { id: il_902, companyId: co_acme, provider: IRP, action: GenerateIRN, objectType: Sales Invoice, objectId: inv_01j8k9, objectNumber: INV/2026-27/00047, status: Rejected, errorCode: '2172', errorMessage: Buyer GSTIN is inactive on the GST portal, request: { DocNo: INV/2026-27/00047 }, response: { ErrorCode: '2172', ErrorMessage: Buyer GSTIN is inactive on the GST portal }, at: '2026-09-13T09:12:04Z', correlationId: corr_einv47, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Not ready
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              notReady: { summary: Readiness issues, value: { code: EINV_NOT_READY, message: 'Not ready for e-invoice: HSN missing on line 2; Buyer pincode missing', details: { issues: ['HSN missing on line 2', 'Buyer pincode missing'] }, correlationId: corr_9f1c2e7a } }
              notApplicable: { summary: Below threshold / B2C, value: { code: EINV_NOT_READY, message: e-Invoice not applicable to unregistered buyer, correlationId: corr_9f1c2e7a } }
      '502': { $ref: '../components/responses.yaml#/ProviderError' }

/taxation/e-invoices/{collection}/{docId}/cancel:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Collection'
    - { name: docId, in: path, required: true, schema: { type: string }, example: inv_01j8k3 }
  post:
    tags: [Taxation]
    summary: Cancel the IRN (within 24 h)
    operationId: cancelEInvoiceByDoc
    x-permission: taxation.einvoice.reverse
    x-idempotent: true
    x-events: [StatutorySubmissionCancelled]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            reason: { summary: Reason (≥5 chars), value: { reason: Wrong buyer GSTIN — re-issuing } }
    responses:
      '200':
        description: Cancelled
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/StatutoryResult' }
            examples:
              cancelled: { summary: Cancelled, value: { document: { id: inv_01j8k3, number: INV/2026-27/00042, status: Posted }, statutory: { irn: 35054cc24d97033afc24f49ec4444dbab81f542c999a4f3f4e7a6f6a4a5b1c2d, ackNo: '112010036563789', eInvoiceStatus: Cancelled, eInvoiceCancelledAt: '2026-09-13T15:00:00Z' }, integrationLog: { id: il_903, companyId: co_acme, provider: IRP, action: CancelIRN, objectType: Sales Invoice, objectId: inv_01j8k3, objectNumber: INV/2026-27/00042, status: Cancelled, request: { Irn: 35054cc24d97033afc24f49ec4444dbab81f542c999a4f3f4e7a6f6a4a5b1c2d, CnlRsn: '1', CnlRem: Wrong buyer GSTIN — re-issuing }, response: { CancelDate: '2026-09-13T15:00:00Z' }, at: '2026-09-13T15:00:00Z', correlationId: corr_einv42, createdAt: '2026-09-13T15:00:00Z', updatedAt: '2026-09-13T15:00:00Z', version: 1 } } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: No IRN
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              noIrn: { summary: Nothing to cancel, value: { code: INVALID_STATE, message: No IRN to cancel, correlationId: corr_9f1c2e7a } }
      '422':
        description: Window elapsed
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              window: { summary: After 24 h, value: { code: EINV_WINDOW, message: IRN cannot be cancelled after 24 hours — issue a credit note instead, details: { ackDate: '2026-09-11T10:20:00Z', hoursElapsed: 52 }, correlationId: corr_9f1c2e7a } }
      '502': { $ref: '../components/responses.yaml#/ProviderError' }

/taxation/e-invoices/bulk-submit:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Taxation]
    summary: Submit all ready + pending documents (or a selection)
    operationId: bulkSubmitEInvoices
    x-permission: taxation.einvoice.submit
    x-idempotent: true
    x-events: [StatutorySubmissionAccepted, StatutorySubmissionRejected]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/taxation.yaml#/EInvoiceBulkRequest' }
          examples:
            period: { summary: Everything ready in the month, value: { period: '2026-09' } }
            selected: { summary: Selected rows, value: { ids: ['salesInvoices:inv_01j8k3', 'creditNotes:cn_00012'] } }
    responses:
      '200':
        description: Per-document results
        content:
          application/json:
            schema: { $ref: '../components/schemas/taxation.yaml#/EInvoiceBulkResult' }
            examples:
              mixed: { summary: "2 accepted, 1 rejected, 1 skipped", value: { submitted: 3, accepted: 2, rejected: 1, skipped: 1, results: [{ id: 'salesInvoices:inv_01j8k3', number: INV/2026-27/00042, status: Accepted, irn: 35054cc24d97033afc24f49ec4444dbab81f542c999a4f3f4e7a6f6a4a5b1c2d }, { id: 'creditNotes:cn_00012', number: CN/2026-27/00012, status: Accepted, irn: 9c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d }, { id: 'salesInvoices:inv_01j8k8', number: INV/2026-27/00046, status: Rejected, error: '2172: Buyer GSTIN is inactive on the GST portal' }, { id: 'salesInvoices:inv_01j8k9', number: INV/2026-27/00047, status: Skipped, error: Not ready — HSN missing on line 2 }] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '502': { $ref: '../components/responses.yaml#/ProviderError' }

/taxation/e-invoices/sync:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Taxation]
    summary: Re-query the IRP for Submitted / Queued documents
    operationId: syncEInvoices
    x-permission: taxation.einvoice.submit
    responses:
      '200':
        description: Sync summary
        content:
          application/json:
            schema: { type: object, required: [checked, updated, syncedAt], properties: { checked: { type: integer }, updated: { type: integer }, syncedAt: { type: string, format: date-time } } }
            examples:
              synced: { summary: Synced, value: { checked: 3, updated: 1, syncedAt: '2026-09-13T09:12:04Z' } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '502': { $ref: '../components/responses.yaml#/ProviderError' }

# ── e-way bills ───────────────────────────────────────────────────────────

/taxation/eway-bills:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Taxation]
    summary: e-Way bill queue (consignments ≥ threshold)
    description: Tabs → Pending · Generated · Expiring today · Cancelled · All.
    operationId: listEwayBills
    x-permission: taxation.einvoice.view
    x-frd: [FR-CMP-004]
    parameters:
      - $ref: '../components/parameters.yaml#/PeriodCode'
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: Rows
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/taxation.yaml#/EwayBillRow' } }
            examples:
              queue: { summary: Pending + generated, value: { data: [{ id: 'deliveries:dc_00031', collection: deliveries, docId: dc_00031, docType: Delivery, number: DC/2026-27/00031, date: '2026-09-13', party: Arlene Traders, total: 118000, status: Pending, link: sales/deliveries/dc_00031 }, { id: 'salesInvoices:inv_01j8k1', collection: salesInvoices, docId: inv_01j8k1, docType: Sales Invoice, number: INV/2026-27/00040, date: '2026-09-11', party: Arlene Traders, total: 236000, status: Generated, ewbNo: '271000123456', ewbValidUpto: '2026-09-14T23:59:59Z', vehicleNo: MH02AB1234, link: sales/invoices/inv_01j8k1 }], meta: { nextCursor: null, limit: 25, total: 2, counts: { Pending: 1, Generated: 12, 'Expiring today': 0, Cancelled: 1, All: 14 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/taxation/eway-bills/{collection}/{docId}/generate:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Collection'
    - { name: docId, in: path, required: true, schema: { type: string }, example: dc_00031 }
  post:
    tags: [Taxation]
    summary: Generate an e-way bill (Part A + B)
