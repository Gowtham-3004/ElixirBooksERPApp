      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/taxation/returns/{type}/generate:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - { name: type, in: path, required: true, schema: { type: string, enum: [gstr1, gstr3b] } }
  post:
    tags: [Taxation]
    summary: Generate a versioned return snapshot (+ portal JSON)
    description: Earlier non-filed versions for the same period become Superseded. A Filed version locks the period's tax data (`409` on regenerate).
    operationId: generateReturn
    x-permission: taxation.returns.create
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/taxation.yaml#/ReturnGenerateRequest' }
          examples:
            month: { summary: September, value: { period: '2026-09', registrationId: reg_mh } }
    responses:
      '201':
        description: Generated
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/taxation.yaml#/StatutoryReturn' }
            examples:
              generated: { summary: v2 generated, value: { id: ret_g1_0909_2, companyId: co_acme, type: GSTR-1, period: '2026-09', fy: '2026-27', registrationId: reg_mh, gstin: 27AAACA1234A1Z5, status: Generated, sections: [{ code: 4A, desc: B2B supplies to registered persons, count: 38, taxable: 4120000, cgst: 370800, sgst: 370800, igst: 0, cess: 0, tax: 741600 }], totals: { taxable: 6746000, cgst: 406600, sgst: 406600, igst: 98000, cess: 0, tax: 911200 }, reconciliation: { registerTax: 911200, ledgerTax: 911200, difference: 0 }, generatedAt: '2026-10-05T10:00:00Z', generatedBy: Priya Sharma, dueDate: '2026-10-11', hasJson: true, createdAt: '2026-10-05T10:00:00Z', updatedAt: '2026-10-05T10:00:00Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Period already filed
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              filed: { summary: Filed version exists, value: { code: INVALID_STATE, message: GSTR-1 2026-09 is already filed (ARN AA270926123456K) — amendments go into the next period, details: { returnId: ret_g1_0909_1 }, correlationId: corr_9f1c2e7a } }
      '422':
        description: Data issues
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              hsnMissing: { summary: HSN missing on documents, value: { code: INCOMPLETE, message: 3 documents have lines without HSN — fix before generating, details: { documents: [INV/2026-27/00047, INV/2026-27/00051, CN/2026-27/00014] }, correlationId: corr_9f1c2e7a } }
              unreconciled: { summary: Register ≠ ledger, value: { code: UNBALANCED, message: Output tax per register 911200 differs from ledger 909400 by 1800, details: { registerTax: 911200, ledgerTax: 909400 }, correlationId: corr_9f1c2e7a } }

/taxation/returns/{type}/challan:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - { name: type, in: path, required: true, schema: { type: string, enum: [gstr3b] } }
  post:
    tags: [Taxation]
