/taxation/tds/challans:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Taxation]
    summary: Deposit challans
    operationId: listTdsChallans
    x-permission: taxation.tds.view
    parameters:
      - $ref: '../components/parameters.yaml#/FiscalYear'
      - { name: quarter, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: Challans
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/taxation.yaml#/TdsEntry' } }
            examples:
              list: { summary: Challans, value: { data: [{ $ref: '#/components/examples/TdsChallan/value' }], meta: { nextCursor: null, limit: 25, total: 1 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Taxation]
    summary: Record a deposit challan (Draft journal + mark deductions Deposited)
    operationId: createTdsChallan
    x-permission: taxation.tds.manage
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/taxation.yaml#/TdsChallanCreate' }
          examples:
            withCin: { summary: With CIN, value: { date: '2026-10-05', section: 194C, amount: 5900, challanNo: '0510123456789012', bsrCode: '0510123', bankAccountId: acc_1310, deductionIds: ['pay_00131:tds'] } }
            cinPending: { summary: CIN to follow, value: { date: '2026-10-05', section: 194J, amount: 5000, bankAccountId: acc_1310, deductionIds: ['vi_00198:tds'], note: Paid via net banking; CIN pending } }
    responses:
      '201':
        description: Challan recorded
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/taxation.yaml#/TdsEntry' }
            examples:
              recorded: { summary: Recorded with draft journal, value: { document: { $ref: '#/components/examples/TdsChallan/value' }, outcome: created, journal: { id: jnl_tds_q2, companyId: co_acme, number: DRAFT-JV-421, date: '2026-10-05', period: '2026-10', fy: '2026-27', branchId: br_ho, currency: INR, rate: 1, status: Draft, type: Manual, sourceType: TDS Challan, sourceNumber: '0510123456789012', narration: 'TDS deposit 194C · Q2 2026-27', lines: [{ id: jl_1, accountId: acc_2400, accountCode: '2400', accountName: TDS payable, dr: 5900, cr: 0, drBase: 5900, crBase: 0, dimensions: {} }, { id: jl_2, accountId: acc_1310, accountCode: '1310', accountName: HDFC Bank — CA 0042, dr: 0, cr: 5900, drBase: 0, crBase: 5900, dimensions: {} }], totalDr: 5900, totalCr: 5900, correlationId: corr_tds1, createdAt: '2026-10-05T10:00:00Z', updatedAt: '2026-10-05T10:00:00Z', version: 1 }, warnings: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Business rule
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              amountMismatch: { summary: Amount ≠ selected deductions, value: { code: AMOUNT_MISMATCH, message: Challan 5000 does not equal selected deductions 5900, details: { challan: 5000, deductions: 5900 }, correlationId: corr_9f1c2e7a } }
              alreadyDeposited: { summary: Deduction already deposited, value: { code: INVALID_STATE, message: 'vi_00198:tds is already Deposited (challan 0510123456789012)', correlationId: corr_9f1c2e7a } }

