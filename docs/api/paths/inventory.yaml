# Inventory (tag: Inventory). src/modules/inventory/actions.ts, engine.ts stock functions.

# ── stock views ───────────────────────────────────────────────────────────

/inventory/stock:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Inventory]
    summary: Stock on hand (item × warehouse or aggregated)
    description: "Tabs → All · Below reorder (`belowReorder=true`) · With reservations (`reserved=true`). Query examples — `?warehouseId=wh_main` · `?group=Steel` · `?asOf=2026-08-31` · `?aggregate=true` (one row per item)."
    operationId: listStockPositions
    x-permission: inventory.stock.view
    x-frd: [FR-INV-001]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/WarehouseId'
      - { name: group, in: query, schema: { type: string } }
      - { name: belowReorder, in: query, schema: { type: boolean } }
      - { name: reserved, in: query, schema: { type: boolean } }
      - { name: aggregate, in: query, schema: { type: boolean, default: false } }
      - $ref: '../components/parameters.yaml#/AsOf'
    responses:
      '200':
        description: Positions
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/inventory.yaml#/StockPosition' } }
                    totals: { type: object, properties: { value: { type: number } } }
            examples:
              firstPage: { summary: Two SKUs, value: { data: [{ itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, group: Steel, warehouses: 2, uom: KG, onHand: 1240, reserved: 80, available: 1160, onOrder: 2000, inTransit: 0, committed: 120, projected: 3120, reorderLevel: 200, safetyStock: 100, belowReorder: false, avgRate: 49.8, value: 61752 }, { itemId: item_crate, itemCode: CRT-TEA, itemName: Tea Crate, group: Packaging, warehouses: 1, uom: NOS, onHand: 40, reserved: 0, available: 40, onOrder: 0, inTransit: 0, committed: 0, projected: 40, reorderLevel: 100, safetyStock: 50, belowReorder: true, avgRate: 318, value: 12720 }], totals: { value: 1842000 }, meta: { nextCursor: null, limit: 25, total: 14, counts: { All: 14, 'Below reorder': 2, 'With reservations': 3 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/inventory/items/{id}/position:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Inventory]
    summary: Stock position of one item (engine.stockPosition)
    operationId: getItemStockPosition
    x-permission: inventory.stock.view
    parameters:
      - $ref: '../components/parameters.yaml#/WarehouseId'
      - $ref: '../components/parameters.yaml#/AsOf'
      - { name: batch, in: query, schema: { type: string } }
    responses:
      '200':
        description: Position
        content:
          application/json:
            schema: { $ref: '../components/schemas/inventory.yaml#/StockPosition' }
            examples:
              warehouse: { summary: One warehouse, value: { itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, warehouseId: wh_main, warehouseName: Main Warehouse, uom: KG, onHand: 1000, reserved: 80, available: 920, onOrder: 2000, inTransit: 0, committed: 120, projected: 2880, reorderLevel: 200, safetyStock: 100, belowReorder: false, avgRate: 49.8, value: 49800 } }
              allWarehouses: { summary: Aggregated, value: { itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, warehouses: 2, uom: KG, onHand: 1240, reserved: 80, available: 1160, onOrder: 2000, inTransit: 0, committed: 120, projected: 3120, reorderLevel: 200, safetyStock: 100, belowReorder: false, avgRate: 49.8, value: 61752 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/inventory/ledger:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Inventory]
    summary: Stock ledger (movements with running balance)
    description: Query examples — `?itemId=item_stl4&warehouseId=wh_main` · `?type=GRN,Delivery` · `?dateFrom=2026-09-01&dateTo=2026-09-30` · `?sourceId=inv_01j8k3`.
    operationId: listStockLedger
    x-permission: inventory.stock.view
    x-frd: [FR-INV-002]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/ItemId'
      - $ref: '../components/parameters.yaml#/WarehouseId'
      - { name: type, in: query, schema: { type: string }, style: form, explode: false, example: 'GRN,Delivery' }
      - { name: batch, in: query, schema: { type: string } }
      - { name: sourceId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
    responses:
      '200':
        description: Ledger rows
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/inventory.yaml#/StockLedgerRow' } }
            examples:
              firstPage: { summary: In and out, value: { data: [{ id: sm_50, companyId: co_acme, date: '2026-09-12', itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, warehouseId: wh_main, warehouseName: Main Warehouse, bin: A-01, qty: 2950, uom: KG, baseQty: 2950, batch: B-2609-11, rate: 48, value: 141600, type: GRN, sourceType: GRN, sourceId: grn_00077, sourceNumber: GRN/2026-27/00077, balanceAfter: 4190, source: '#/purchase/grn/grn_00077', createdAt: '2026-09-12T11:00:00Z', updatedAt: '2026-09-12T11:00:00Z', version: 1 }, { id: sm_21, companyId: co_acme, date: '2026-09-13', itemId: item_stl4, itemCode: STL-4, itemName: Steel Rod 4mm, warehouseId: wh_main, warehouseName: Main Warehouse, qty: -1000, uom: KG, baseQty: -1000, batch: B-2409-07, rate: 49.8, value: -49800, type: Delivery, sourceType: Sales Invoice, sourceId: inv_01j8k3, sourceNumber: INV/2026-27/00042, journalId: jnl_01j8k5, balanceAfter: 3190, source: '#/sales/invoices/inv_01j8k3', createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }], meta: { nextCursor: null, limit: 25, total: 2 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/inventory/batches:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Inventory]
    summary: Batch & serial balances
    description: "Tabs → All · Batches (`type=Batch`) · Serials (`type=Serial`) · Expiring/expired (`expiringWithinDays=30`)."
    operationId: listBatchBalances
    x-permission: inventory.stock.view
    x-frd: [FR-INV-003]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/ItemId'
      - $ref: '../components/parameters.yaml#/WarehouseId'
      - { name: type, in: query, schema: { type: string, enum: [Batch, Serial] } }
      - { name: code, in: query, schema: { type: string }, description: Batch number / serial. }
      - { name: expiringWithinDays, in: query, schema: { type: integer } }
    responses:
      '200':
        description: Balances
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/inventory.yaml#/BatchBalance' } }
            examples:
              firstPage: { summary: Batches and serials, value: { data: [{ itemId: item_stl4, itemName: Steel Rod 4mm, type: Batch, code: B-2609-11, warehouseId: wh_main, warehouseName: Main Warehouse, bin: A-01, qty: 2950, value: 141600, lastMovementAt: '2026-09-12T11:00:00Z' }, { itemId: item_frame, itemName: Steel Frame A1, type: Serial, code: SN-00201, warehouseId: wh_main, warehouseName: Main Warehouse, qty: 1, value: 2900, lastMovementAt: '2026-09-13T09:00:00Z' }, { itemId: item_chai, itemName: Masala Chai 250g, type: Batch, code: CH-2603, warehouseId: wh_andheri, warehouseName: Andheri Store, qty: 40, value: 3600, expiryDate: '2026-09-30', expiresInDays: 17, lastMovementAt: '2026-08-20T10:00:00Z' }], meta: { nextCursor: null, limit: 25, total: 3, counts: { All: 38, Batches: 26, Serials: 12, 'Expiring/expired': 1 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

# ── reservations ──────────────────────────────────────────────────────────

/inventory/reservations:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Inventory]
    summary: Reservations register
    description: "Tabs → Active (`status=Reserved,Partially Fulfilled`) · Expiring ≤ 7 d (`expiringWithinDays=7`) · Fulfilled · Released/expired · All."
    operationId: listReservations
    x-permission: inventory.stock.view
    x-frd: [FR-INV-004]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/ItemId'
      - $ref: '../components/parameters.yaml#/WarehouseId'
      - { name: sourceId, in: query, schema: { type: string } }
      - { name: expiringWithinDays, in: query, schema: { type: integer } }
    responses:
      '200':
        description: Reservations
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/document.yaml#/Reservation' } }
            examples:
              firstPage: { summary: Active reservations, value: { data: [{ id: rsv_1, companyId: co_acme, itemId: item_stl4, warehouseId: wh_main, qty: 500, fulfilledQty: 0, sourceType: Sales Order, sourceId: so_00090, sourceNumber: SO/2026-27/00090, lineId: ln_1, status: Reserved, expiresAt: '2026-09-27T00:00:00Z', createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 }, { id: rsv_0, companyId: co_acme, itemId: item_crate, warehouseId: wh_main, qty: 120, fulfilledQty: 100, sourceType: Sales Order, sourceId: so_00087, sourceNumber: SO/2026-27/00087, lineId: ln_so_2, status: Partially Fulfilled, expiresAt: '2026-09-22T00:00:00Z', createdAt: '2026-09-08T12:00:00Z', updatedAt: '2026-09-10T15:00:00Z', version: 2 }], meta: { nextCursor: null, limit: 25, total: 2, counts: { Active: 5, 'Expiring ≤7d': 1, Fulfilled: 40, 'Released/expired': 6, All: 51 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/inventory/reservations/{id}/release:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Inventory]
    summary: Release / expire / cancel a reservation
    operationId: releaseReservation
    x-permission: inventory.stock.edit
    x-events: [StockReleased]
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [action], properties: { action: { type: string, enum: [Release, Expire, Cancel] }, reason: { type: string } } }
          examples:
            release: { summary: Release, value: { action: Release, reason: Customer postponed delivery } }
            expire: { summary: Expire (past expiry date), value: { action: Expire } }
            cancel: { summary: Cancel, value: { action: Cancel, reason: Order cancelled } }
    responses:
      '200':
        description: Updated reservation
        content:
          application/json:
            schema: { $ref: '../components/schemas/document.yaml#/Reservation' }
            examples:
              released: { summary: Released, value: { id: rsv_1, companyId: co_acme, itemId: item_stl4, warehouseId: wh_main, qty: 500, fulfilledQty: 0, sourceType: Sales Order, sourceId: so_00090, sourceNumber: SO/2026-27/00090, lineId: ln_1, status: Released, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T10:00:00Z', version: 2 } }
              expired: { summary: Expired, value: { id: rsv_9, companyId: co_acme, itemId: item_crate, warehouseId: wh_main, qty: 50, fulfilledQty: 0, sourceType: Sales Order, sourceId: so_00080, sourceNumber: SO/2026-27/00080, lineId: ln_x, status: Expired, expiresAt: '2026-09-10T00:00:00Z', createdAt: '2026-08-27T09:00:00Z', updatedAt: '2026-09-13T10:00:00Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── adjustments ───────────────────────────────────────────────────────────

/inventory/adjustments:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Inventory]
    summary: List stock adjustments
    description: Tabs → All · Draft · Pending approval · Approved · Posted · Reversed.
    operationId: listStockAdjustments
    x-permission: inventory.adjustment.view
    x-frd: [FR-INV-005]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: adjustmentType, in: query, schema: { $ref: '../components/schemas/inventory.yaml#/AdjustmentType' } }
      - $ref: '../components/parameters.yaml#/WarehouseId'
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
    responses:
      '200':
        description: Adjustments
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/inventory.yaml#/StockAdjustment' } }
            examples:
              firstPage: { summary: Adjustments, value: { data: [{ id: adj_0021, companyId: co_acme, number: ADJ/2026-27/00021, docType: Stock Adjustment, date: '2026-09-13', branchId: br_ho, status: Posted, currency: INR, rate: 1, partyType: None, warehouseId: wh_main, warehouseName: Main Warehouse, adjustmentType: Damage, reasonCode: ADJ-DMG, reason: 5 tins leaked during storage — written off, lines: [], totals: { subtotal: 0, discount: 0, taxable: 0, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: -1200, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: -1200 }, totalValue: -1200, journalId: jnl_adj_21, journalNumber: JV/2026-27/00343, postedAt: '2026-09-13T11:00:00Z', postedBy: Suresh Patel, createdAt: '2026-09-13T10:00:00Z', updatedAt: '2026-09-13T11:00:00Z', version: 3 }], meta: { nextCursor: null, limit: 25, total: 1, counts: { All: 21, Draft: 1, 'Pending approval': 0, Approved: 0, Posted: 19, Reversed: 1 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Inventory]
    summary: Create a stock adjustment (Draft)
    operationId: createStockAdjustment
    x-permission: inventory.adjustment.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/inventory.yaml#/StockAdjustmentCreate' }
          examples:
            writeOff: { summary: Damage write-off (negative), value: { date: '2026-09-13', warehouseId: wh_main, adjustmentType: Damage, reasonCode: ADJ-DMG, reason: 5 tins leaked during storage — written off, lines: [{ itemId: item_grease, qty: -5, batch: GR-2607 }] } }
            found: { summary: "Found stock (positive, with rate)", value: { date: '2026-09-13', warehouseId: wh_pune, adjustmentType: Found, reasonCode: ADJ-FOUND, reason: 12 crates found in mezzanine during audit, lines: [{ itemId: item_crate, qty: 12, rate: 318 }] } }
            mixed: { summary: Rework with serials, value: { date: '2026-09-13', warehouseId: wh_main, adjustmentType: Rework, reasonCode: ADJ-RWK, reason: Frames sent to rework — out of saleable stock, lines: [{ itemId: item_frame, qty: -2, serials: [SN-00121, SN-00122] }] } }
