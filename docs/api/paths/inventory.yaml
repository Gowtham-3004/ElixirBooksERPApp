# ── replenishment ─────────────────────────────────────────────────────────

/inventory/replenishment:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Inventory]
    summary: Reorder suggestions (live)
    description: "Tabs → All · Out of stock · Below safety stock · Below reorder level · No preferred supplier (`noSupplier=true`)."
    operationId: listReplenishment
    x-permission: inventory.stock.view
    x-frd: [FR-INV-009]
    parameters:
      - { name: trigger, in: query, schema: { type: string, enum: [Out of stock, Below safety stock, Below reorder level] } }
      - { name: noSupplier, in: query, schema: { type: boolean } }
      - $ref: '../components/parameters.yaml#/WarehouseId'
    responses:
      '200':
        description: Suggestions
        content:
          application/json:
            schema: { type: object, required: [data, totalEstValue], properties: { data: { type: array, items: { $ref: '../components/schemas/inventory.yaml#/ReplenishmentRow' } }, totalEstValue: { type: number } } }
            examples:
              rows: { summary: Two items, value: { data: [{ itemId: item_crate, itemCode: CRT-TEA, itemName: Tea Crate, trigger: Below reorder level, onHand: 40, reserved: 0, onOrder: 0, projected: 40, reorderLevel: 100, safetyStock: 50, shortfall: 60, orderQty: 200, estValue: 64000, preferredSupplierId: sup_globalpack, preferredSupplierName: Global Packaging Co, leadTimeDays: 5, needBy: '2026-09-18' }, { itemId: item_grease, itemCode: GRS-1L, itemName: Machine grease 1 L, trigger: Below safety stock, onHand: 8, reserved: 0, onOrder: 0, projected: 8, reorderLevel: 20, safetyStock: 10, shortfall: 12, orderQty: 50, estValue: 12000, leadTimeDays: 3, needBy: '2026-09-16' }], totalEstValue: 76000 } }
              none: { summary: Nothing to reorder, value: { data: [], totalEstValue: 0 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/inventory/replenishment/create-requisition:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Inventory]
    summary: Create one requisition from selected suggestions
    operationId: createRequisitionFromReplenishment
    x-permission: purchase.requisition.create
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { type: object, required: [itemIds], properties: { itemIds: { type: array, minItems: 1, items: { type: string } }, needByDate: { type: string, format: date }, quantities: { type: object, additionalProperties: { type: number } } } }
          examples:
            selected: { summary: Two items, value: { itemIds: [item_crate, item_grease], needByDate: '2026-09-20' } }
    responses:
      '201':
        description: Draft requisition
        content:
          application/json:
            schema: { $ref: '../components/schemas/purchase.yaml#/Requisition' }
            examples:
              created: { $ref: '../components/examples/purchase.yaml#/RequisitionApproved' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

/inventory/replenishment/create-purchase-orders:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Inventory]
    summary: Create Draft POs grouped by preferred supplier
    operationId: createPosFromReplenishment
    x-permission: purchase.order.create
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
