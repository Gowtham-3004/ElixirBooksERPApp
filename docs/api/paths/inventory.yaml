/inventory/settings:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Inventory]
    summary: Inventory settings
    operationId: getInventorySettings
    x-permission: inventory.stock.view
    responses:
      '200':
        description: Settings
        content:
          application/json:
            schema: { $ref: '../components/schemas/inventory.yaml#/InventorySettings' }
            examples:
              current: { summary: Current, value: { negativeStockPolicy: Block, valuationMethod: AVCO, transitWarehouseId: wh_transit, scrapWarehouseId: wh_scrap, countTolerancePct: 1 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  put:
    tags: [Inventory]
    summary: Update inventory settings
    description: Valuation method is locked once movements exist (`409 INVALID_STATE`).
    operationId: updateInventorySettings
    x-permission: inventory.settings.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/inventory.yaml#/InventorySettings' }
          examples:
            warn: { summary: Warn on negative stock, value: { negativeStockPolicy: Warn, countTolerancePct: 2 } }
            warehouses: { summary: Transit / scrap warehouses, value: { transitWarehouseId: wh_transit, scrapWarehouseId: wh_scrap } }
    responses:
      '200':
        description: Saved
        content:
          application/json:
            schema: { $ref: '../components/schemas/inventory.yaml#/InventorySettings' }
            examples:
              saved: { summary: Saved, value: { negativeStockPolicy: Warn, valuationMethod: AVCO, transitWarehouseId: wh_transit, scrapWarehouseId: wh_scrap, countTolerancePct: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
