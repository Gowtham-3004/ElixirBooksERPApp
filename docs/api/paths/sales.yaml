# Sales part 1 (tag: Sales): quotations → sales orders → deliveries. src/modules/sales/fulfilment.ts
# Attachments / PDF / e-mail / journal / activity: see /documents/{collection}/{id}/… (System).

# ── quotations ────────────────────────────────────────────────────────────

/sales/quotations:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Sales]
    summary: List quotations
    description: "Tabs → All + one per status. Query examples — `?status=Sent` · expiring `?validUntilTo=2026-09-20&status=Sent` · `?partyId=cust_sunrise` · `?salespersonId=sp_priya` · `?q=QT/2026-27/00031`."
    operationId: listQuotations
    x-permission: sales.quotation.view
    x-frd: [FR-SAL-001]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Sort'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - $ref: '../components/parameters.yaml#/PartyId'
      - { name: salespersonId, in: query, schema: { type: string } }
      - { name: validUntilTo, in: query, schema: { type: string, format: date } }
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
      - $ref: '../components/parameters.yaml#/AmountMin'
      - $ref: '../components/parameters.yaml#/AmountMax'
      - $ref: '../components/parameters.yaml#/BranchFilter'
    responses:
      '200':
        description: Quotations
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/sales.yaml#/Quotation' } }
            examples:
              firstPage: { summary: Sent + converted, value: { data: [{ id: qt_00031, companyId: co_acme, number: QT/2026-27/00031, docType: Quotation, date: '2026-09-01', validUntil: '2026-09-15', branchId: br_ho, status: Sent, currency: INR, rate: 1, partyType: Customer, partyId: cust_sunrise, partyName: Sunrise Hotels, lines: [], totals: { subtotal: 190000, discount: 9500, taxable: 180500, tax: 9025, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 189525, paid: 0, credited: 0, writtenOff: 0, due: 189525, baseTotal: 189525 }, salespersonId: sp_priya, sentAt: '2026-09-01T11:00:00Z', revision: 1, createdAt: '2026-09-01T10:00:00Z', updatedAt: '2026-09-01T11:00:00Z', version: 3 }, { id: qt_00030, companyId: co_acme, number: QT/2026-27/00030, docType: Quotation, date: '2026-08-25', validUntil: '2026-09-08', branchId: br_ho, status: Converted, currency: INR, rate: 1, partyType: Customer, partyId: cust_arlene, partyName: Arlene Traders, lines: [], totals: { subtotal: 108400, discount: 0, taxable: 108400, tax: 16488, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 124888, paid: 0, credited: 0, writtenOff: 0, due: 124888, baseTotal: 124888 }, convertedToId: so_00087, convertedToNumber: SO/2026-27/00087, revision: 2, createdAt: '2026-08-25T10:00:00Z', updatedAt: '2026-09-08T10:00:00Z', version: 5 }], meta: { nextCursor: null, limit: 25, total: 2, counts: { All: 31, Draft: 3, Sent: 6, Accepted: 2, Declined: 4, Converted: 12, Expired: 3, Cancelled: 1 } }, scope: { companyId: co_acme, branchId: br_ho, period: '2026-09', currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Sales]
    summary: Create a quotation (Draft)
    description: Prices resolve from the customer price list (`listRate`); a `rate` below list beyond `salesDiscountThresholdPct` needs `overrideReason`. Totals are recomputed server-side.
    operationId: createQuotation
    x-permission: sales.quotation.create
    x-events: [DocumentCreated]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/sales.yaml#/QuotationCreate' }
          examples:
            minimal: { summary: "Minimal — one line, defaults resolved", value: { partyId: cust_sunrise, date: '2026-09-13', lines: [{ itemId: item_assam, qty: 500 }] } }
            full: { summary: "Full with discount, validity, salesperson, notes", value: { partyId: cust_sunrise, date: '2026-09-13', validUntil: '2026-09-30', reference: RFQ-SUN-77, salespersonId: sp_priya, lines: [{ itemId: item_assam, qty: 500, rate: 380, discountPct: 5, taxRateId: tax_gst5 }, { itemId: item_darj, qty: 100, rate: 1200, taxRateId: tax_gst5 }], charges: [{ name: Freight, amount: 2500, taxRateId: tax_gst18 }], notes: Delivery within 7 days of order, terms: 50% advance } }
            fromLead: { summary: From a CRM lead with free-text service line, value: { partyId: cust_metro, leadId: lead_metro, date: '2026-09-13', lines: [{ itemName: Site survey and installation, qty: 1, uom: JOB, rate: 45000, taxRateId: tax_gst18, accountId: acc_4010 }] } }
            usd: { summary: Export quotation in USD, value: { partyId: cust_ustech, date: '2026-09-13', currency: USD, priceListId: pl_usd, lines: [{ itemId: item_stl4, qty: 5000, rate: 0.72, taxRateId: tax_export }] } }
    responses:
      '201':
        description: Draft quotation
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/Quotation' }
            examples:
              draft: { summary: Draft, value: { id: qt_00032, companyId: co_acme, number: DRAFT-QT-32, docType: Quotation, date: '2026-09-13', validUntil: '2026-09-27', branchId: br_ho, status: Draft, currency: INR, rate: 1, partyType: Customer, partyId: cust_sunrise, partyName: Sunrise Hotels, lines: [{ id: ln_q1, itemId: item_assam, itemCode: TEA-ASSAM, itemName: Assam CTC 1kg, hsn: '0902', qty: 500, uom: NOS, rate: 380, listRate: 380, priceListName: Wholesale INR, discountPct: 0, discountAmt: 0, taxable: 190000, taxRateId: tax_gst5, taxRate: 5, taxAmt: 9500, taxComponents: { CGST: 4750, SGST: 4750 }, amount: 199500 }], totals: { subtotal: 190000, discount: 0, taxable: 190000, tax: 9500, components: { CGST: 4750, SGST: 4750 }, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 199500, paid: 0, credited: 0, writtenOff: 0, due: 199500, baseTotal: 199500 }, revision: 1, fy: '2026-27', period: '2026-09', correlationId: corr_q32, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }

/sales/quotations/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Sales]
    summary: Get a quotation
    operationId: getQuotation
    x-permission: sales.quotation.view
    responses:
      '200':
        description: Quotation
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/Quotation' }
            examples:
              sent: { $ref: '../components/examples/sales.yaml#/QuotationSent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Sales]
    summary: Edit a Draft / Sent quotation (autosave)
    description: Sent quotations can still be edited (material changes are audited); Accepted / Converted / Expired ones cannot — use `revise`.
    operationId: updateQuotation
    x-permission: sales.quotation.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/sales.yaml#/QuotationPatch' }
          examples:
            fieldsOnly: { summary: Validity + notes, value: { expectedVersion: 3, validUntil: '2026-09-30', notes: Prices firm till 30 Sep } }
            replaceLines: { summary: Replace lines, value: { expectedVersion: 3, lines: [{ id: ln_q1, itemId: item_assam, qty: 600, rate: 375, discountPct: 0, taxRateId: tax_gst5 }, { itemId: item_green, qty: 50, rate: 900, taxRateId: tax_gst5 }] } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/Quotation' }
            examples:
              updated: { $ref: '../components/examples/sales.yaml#/QuotationSent' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
  delete:
    tags: [Sales]
    summary: Delete a Draft quotation
    operationId: deleteQuotation
    x-permission: sales.quotation.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/sales/quotations/{id}/send:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Sales]
    summary: Send (e-mail) and mark Sent
    description: Allocates the number, e-mails the PDF and moves Draft → Sent. Sending again re-sends without changing status.
    operationId: sendQuotation
    x-permission: sales.quotation.submit
    x-idempotent: true
    x-events: [DocumentSubmitted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/EmailRequest' }
          examples:
            default: { summary: To the default contact, value: { to: [purchase@sunrisehotels.example], subject: Quotation QT/2026-27/00031 from Acme Trading, message: Please find our quotation attached. Valid until 15 Sep. } }
            withCc: { $ref: '../components/examples/common.yaml#/EmailWithCc' }
    responses:
      '200':
        description: Sent
        content:
          application/json:
            schema:
              type: object
              required: [document, email]
              properties:
                document: { $ref: '../components/schemas/sales.yaml#/Quotation' }
                email: { $ref: '../components/schemas/common.yaml#/EmailResult' }
            examples:
              sent: { summary: Now Sent, value: { document: { id: qt_00031, companyId: co_acme, number: QT/2026-27/00031, docType: Quotation, date: '2026-09-01', validUntil: '2026-09-15', branchId: br_ho, status: Sent, currency: INR, rate: 1, partyType: Customer, partyId: cust_sunrise, partyName: Sunrise Hotels, lines: [], totals: { subtotal: 190000, discount: 9500, taxable: 180500, tax: 9025, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 189525, paid: 0, credited: 0, writtenOff: 0, due: 189525, baseTotal: 189525 }, sentAt: '2026-09-13T09:12:04Z', sentTo: purchase@sunrisehotels.example, revision: 1, createdAt: '2026-09-01T10:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 3 }, email: { integrationLogId: ilog_email_88a1, status: Queued, to: [purchase@sunrisehotels.example], sentAt: '2026-09-13T09:12:04Z' } } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '502': { $ref: '../components/responses.yaml#/ProviderError' }

/sales/quotations/{id}/accept:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Sales]
    summary: Record customer acceptance (Sent → Accepted)
    operationId: acceptQuotation
    x-permission: sales.quotation.edit
    requestBody:
      required: false
      content:
        application/json:
          schema: { type: object, properties: { reference: { type: string, description: Customer PO / acceptance reference. }, acceptedAt: { type: string, format: date-time } } }
          examples:
            withPo: { summary: With customer PO reference, value: { reference: PO-SUN-2026-118 } }
            plain: { summary: Plain, value: {} }
    responses:
      '200':
        description: Accepted
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/Quotation' }
            examples:
              accepted: { summary: Accepted, value: { id: qt_00031, companyId: co_acme, number: QT/2026-27/00031, docType: Quotation, date: '2026-09-01', validUntil: '2026-09-15', branchId: br_ho, status: Accepted, currency: INR, rate: 1, partyType: Customer, partyId: cust_sunrise, partyName: Sunrise Hotels, reference: PO-SUN-2026-118, lines: [], totals: { subtotal: 190000, discount: 9500, taxable: 180500, tax: 9025, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 189525, paid: 0, credited: 0, writtenOff: 0, due: 189525, baseTotal: 189525 }, acceptedAt: '2026-09-13T09:12:04Z', revision: 1, createdAt: '2026-09-01T10:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 4 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/sales/quotations/{id}/decline:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Sales]
    summary: Record a decline (Sent → Declined)
    operationId: declineQuotation
    x-permission: sales.quotation.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            price: { summary: Lost on price, value: { reason: Customer chose a competitor quoting 8% lower } }
    responses:
      '200':
        description: Declined
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/Quotation' }
            examples:
              declined: { summary: Declined, value: { id: qt_00031, companyId: co_acme, number: QT/2026-27/00031, docType: Quotation, date: '2026-09-01', validUntil: '2026-09-15', branchId: br_ho, status: Declined, currency: INR, rate: 1, partyType: Customer, partyId: cust_sunrise, partyName: Sunrise Hotels, lines: [], totals: { subtotal: 190000, discount: 9500, taxable: 180500, tax: 9025, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 189525, paid: 0, credited: 0, writtenOff: 0, due: 189525, baseTotal: 189525 }, declinedReason: Customer chose a competitor quoting 8% lower, revision: 1, createdAt: '2026-09-01T10:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 4 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/sales/quotations/{id}/revise:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Sales]
    summary: Create a new revision (supersedes this one)
    description: Copies the quotation into a new Draft with `revision + 1` and `revisionOfId`; the original gets `supersededById`. Blocked when Converted.
    operationId: reviseQuotation
    x-permission: sales.quotation.create
    responses:
      '201':
        description: New revision
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/Quotation' }
            examples:
              rev2: { summary: Revision 2 draft, value: { id: qt_00031r2, companyId: co_acme, number: DRAFT-QT-31R2, docType: Quotation, date: '2026-09-13', validUntil: '2026-09-27', branchId: br_ho, status: Draft, currency: INR, rate: 1, partyType: Customer, partyId: cust_sunrise, partyName: Sunrise Hotels, lines: [], totals: { subtotal: 190000, discount: 9500, taxable: 180500, tax: 9025, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 189525, paid: 0, credited: 0, writtenOff: 0, due: 189525, baseTotal: 189525 }, revisionOfId: qt_00031, revision: 2, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/sales/quotations/{id}/convert-to-order:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Sales]
    summary: Convert (Sent / Accepted) to a sales order
    description: "Creates a Draft sales order with the quotation lines (`sourceType: Quotation`), marks the quotation Converted. Expired quotations cannot be converted."
    operationId: convertQuotationToOrder
    x-permission: sales.order.create
    x-idempotent: true
    x-events: [DocumentCreated]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: false
      content:
        application/json:
          schema: { type: object, properties: { expectedDate: { type: string, format: date }, warehouseId: { type: string }, reference: { type: string } } }
          examples:
            plain: { summary: Defaults, value: {} }
            withDelivery: { summary: Expected date + warehouse, value: { expectedDate: '2026-09-25', warehouseId: wh_main, reference: PO-SUN-2026-118 } }
    responses:
      '201':
        description: Sales order created
        content:
          application/json:
            schema:
              type: object
              required: [quotation, order]
              properties:
                quotation: { $ref: '../components/schemas/sales.yaml#/Quotation' }
                order: { $ref: '../components/schemas/sales.yaml#/SalesOrder' }
            examples:
              converted: { summary: Converted, value: { quotation: { id: qt_00031, companyId: co_acme, number: QT/2026-27/00031, docType: Quotation, date: '2026-09-01', validUntil: '2026-09-15', branchId: br_ho, status: Converted, currency: INR, rate: 1, partyType: Customer, partyId: cust_sunrise, partyName: Sunrise Hotels, lines: [], totals: { subtotal: 190000, discount: 9500, taxable: 180500, tax: 9025, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 189525, paid: 0, credited: 0, writtenOff: 0, due: 189525, baseTotal: 189525 }, convertedToId: so_00091, convertedToNumber: DRAFT-SO-91, revision: 1, createdAt: '2026-09-01T10:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 5 }, order: { id: so_00091, companyId: co_acme, number: DRAFT-SO-91, docType: Sales Order, date: '2026-09-13', branchId: br_ho, status: Draft, currency: INR, rate: 1, partyType: Customer, partyId: cust_sunrise, partyName: Sunrise Hotels, sourceType: Quotation, sourceId: qt_00031, sourceNumber: QT/2026-27/00031, expectedDate: '2026-09-25', warehouseId: wh_main, lines: [], totals: { subtotal: 190000, discount: 9500, taxable: 180500, tax: 9025, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 189525, paid: 0, credited: 0, writtenOff: 0, due: 189525, baseTotal: 189525 }, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/sales/quotations/expire:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Sales]
    summary: Expire all Sent quotations past validity (housekeeping)
    operationId: expireQuotations
    x-permission: sales.quotation.edit
    responses:
      '200':
        description: Count expired
        content:
          application/json:
            schema: { type: object, required: [expired], properties: { expired: { type: integer }, ids: { type: array, items: { type: string } } } }
            examples:
              some: { summary: Two expired, value: { expired: 2, ids: [qt_00021, qt_00024] } }
              none: { summary: Nothing to do, value: { expired: 0, ids: [] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }

/sales/quotations/{id}/cancel:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Sales]
    summary: Cancel a quotation (not Converted)
    operationId: cancelQuotation
    x-permission: sales.quotation.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            cancel: { summary: Cancel, value: { reason: Duplicate of QT/2026-27/00030 } }
    responses:
      '200':
        description: Cancelled
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/Quotation' }
            examples:
              cancelled: { summary: Cancelled, value: { id: qt_00033, companyId: co_acme, number: QT/2026-27/00033, docType: Quotation, date: '2026-09-12', branchId: br_ho, status: Cancelled, currency: INR, rate: 1, partyType: Customer, partyId: cust_arlene, partyName: Arlene Traders, lines: [], totals: { subtotal: 0, discount: 0, taxable: 0, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 0, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 0 }, cancelReason: Duplicate of QT/2026-27/00030, revision: 1, createdAt: '2026-09-12T10:00:00Z', updatedAt: '2026-09-13T09:12:04Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

# ── sales orders ──────────────────────────────────────────────────────────

/sales/orders:
