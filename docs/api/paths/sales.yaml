/sales/deliveries/{id}/eway-bill:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Sales]
    summary: Generate an e-Way bill for the delivery
    operationId: generateDeliveryEwayBill
    x-permission: taxation.einvoice.create
    x-idempotent: true
    x-events: [StatutorySubmissionAccepted, StatutorySubmissionRejected]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/sales.yaml#/EwayBillRequest' }
          examples:
            vehicle: { summary: Own vehicle (Part-B), value: { vehicleNo: MH02AB1234, distanceKm: 120, mode: Road } }
            transporter: { summary: Transporter (Part-A only), value: { transporterId: 27AABCT1332L1ZU, distanceKm: 120 } }
    responses:
      '200':
        description: Generated
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/StatutoryResult' }
            examples:
              generated: { summary: EWB generated, value: { document: { id: dlv_00340, number: DC/2026-27/00340, status: Posted }, statutory: { ewbNo: '271000123456', ewbStatus: Generated, ewbValidUpto: '2026-09-12T23:59:00Z', vehicleNo: MH02AB1234, distanceKm: 120 }, integrationLog: { id: ilog_ewb_1, companyId: co_acme, provider: EWB, action: GenerateEWB, objectType: Delivery, objectId: dlv_00340, objectNumber: DC/2026-27/00340, requestFingerprint: 'sha256:aa91', idempotencyKey: 'dlv_00340:ewb:1', request: { docNo: DC/2026-27/00340, distance: 120, vehicleNo: MH02AB1234 }, response: { ewayBillNo: '271000123456', validUpto: '2026-09-12 23:59:00' }, status: Accepted, providerRef: '271000123456', at: '2026-09-10T15:01:00Z', correlationId: corr_d340, createdAt: '2026-09-10T15:01:00Z', updatedAt: '2026-09-10T15:01:00Z', version: 1 } } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '502': { $ref: '../components/responses.yaml#/ProviderError' }
  delete:
    tags: [Sales]
    summary: Cancel the delivery's e-Way bill
    operationId: cancelDeliveryEwayBill
    x-permission: taxation.einvoice.edit
    x-events: [StatutorySubmissionCancelled]
    parameters:
      - { name: reason, in: query, required: true, schema: { type: string }, example: Vehicle broke down — goods not moved }
    responses:
      '200':
        description: Cancelled
        content:
          application/json:
            schema: { $ref: '../components/schemas/sales.yaml#/StatutoryResult' }
            examples:
              cancelled: { summary: EWB cancelled, value: { document: { id: dlv_00340, number: DC/2026-27/00340, status: Posted }, statutory: { ewbNo: '271000123456', ewbStatus: Cancelled }, integrationLog: { id: ilog_ewb_2, companyId: co_acme, provider: EWB, action: CancelEWB, objectType: Delivery, objectId: dlv_00340, requestFingerprint: 'sha256:bb02', idempotencyKey: 'dlv_00340:ewb-cancel:1', request: { ewbNo: '271000123456', reason: Vehicle broke down }, response: { status: cancelled }, status: Accepted, at: '2026-09-13T09:12:04Z', correlationId: corr_9f1c2e7a, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
