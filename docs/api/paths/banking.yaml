      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
  delete:
    tags: [Banking]
    summary: Delete a Draft voucher
    operationId: deleteBankVoucher
    x-permission: banking.voucher.delete
    responses:
      '204': { $ref: '../components/responses.yaml#/NoContent' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/banking/vouchers/{id}/post:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Banking]
    summary: Post a voucher (allocates number, posts the journal)
    operationId: postBankVoucher
    x-permission: banking.voucher.post
    x-idempotent: true
    x-events: [DocumentPosted, JournalPosted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    responses:
      '200':
        description: Posted
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/banking.yaml#/BankVoucher' }
            examples:
              payment: { summary: Payment posted, value: { document: { $ref: '#/components/examples/BankVoucherPosted/value' }, outcome: posted, journal: { id: jnl_bv_38, companyId: co_acme, number: JV/2026-27/00403, date: '2026-09-13', period: '2026-09', fy: '2026-27', branchId: br_ho, currency: INR, rate: 1, status: Posted, type: Auto, sourceType: Bank Voucher, sourceId: bv_0038, sourceNumber: BV/2026-27/00038, narration: Payment · Bank charges September, lines: [{ id: jl_1, accountId: acc_5300, accountCode: '5300', accountName: Bank charges, dr: 1180, cr: 0, drBase: 1180, crBase: 0, dimensions: { Branch: br_ho } }, { id: jl_2, accountId: acc_1310, accountCode: '1310', accountName: HDFC Bank — CA 0042, dr: 0, cr: 1180, drBase: 0, crBase: 1180, dimensions: { Branch: br_ho } }], totalDr: 1180, totalCr: 1180, idempotencyKey: 'bv_0038:post', postedAt: '2026-09-13T10:00:00Z', postedBy: Priya Sharma, correlationId: corr_bv38, createdAt: '2026-09-13T10:00:00Z', updatedAt: '2026-09-13T10:00:00Z', version: 1 }, warnings: [] } }
              contra: { summary: Contra posted (bank ↔ bank), value: { document: { id: bv_0039, companyId: co_acme, number: BV/2026-27/00039, docType: Bank Voucher, date: '2026-09-13', branchId: br_ho, status: Posted, currency: INR, rate: 1, partyType: None, voucherType: Contra, bankAccountId: acc_1310, bankAccountName: HDFC Bank — CA 0042, counterAccountId: acc_1311, counterAccountName: ICICI Bank — OD 7781, amount: 500000, method: RTGS, instrumentRef: RTGS26091300221, narration: Sweep to ICICI OD, lines: [], totals: { subtotal: 0, discount: 0, taxable: 0, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 500000, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 500000 }, journalId: jnl_bv_39, journalNumber: JV/2026-27/00404, postedAt: '2026-09-13T10:05:00Z', postedBy: Priya Sharma, createdAt: '2026-09-13T09:50:00Z', updatedAt: '2026-09-13T10:05:00Z', version: 2 }, outcome: posted, warnings: [] } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

/banking/vouchers/{id}/reverse:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  post:
    tags: [Banking]
    summary: Reverse a posted voucher (blocked while matched on a statement)
    operationId: reverseBankVoucher
    x-permission: banking.voucher.reverse
    x-idempotent: true
    x-events: [DocumentReversed, JournalReversed]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            reason: { summary: Reason, value: { reason: Charges reversed by the bank } }
    responses:
      '200':
        description: Reversed
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/banking.yaml#/BankVoucher' }
            examples:
              reversed: { summary: Reversed, value: { document: { id: bv_0038, companyId: co_acme, number: BV/2026-27/00038, docType: Bank Voucher, date: '2026-09-13', branchId: br_ho, status: Reversed, currency: INR, rate: 1, partyType: None, voucherType: Payment, bankAccountId: acc_1310, bankAccountName: HDFC Bank — CA 0042, counterAccountId: acc_5300, counterAccountName: Bank charges, amount: 1180, method: Internal, narration: Bank charges September, reversalReason: Charges reversed by the bank, lines: [], totals: { subtotal: 0, discount: 0, taxable: 0, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 1180, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 1180 }, journalId: jnl_bv_38, journalNumber: JV/2026-27/00403, postedAt: '2026-09-13T10:00:00Z', postedBy: Priya Sharma, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-14T09:00:00Z', version: 4 }, outcome: reversed, warnings: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: State conflict
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              notPosted: { summary: Not posted, value: { code: INVALID_STATE, message: Only posted vouchers can be reversed, correlationId: corr_9f1c2e7a } }
              matched: { summary: Matched on a statement, value: { code: INVALID_STATE, message: Voucher is matched on a bank statement — unmatch it first, details: { statementLineId: sl_9 }, correlationId: corr_9f1c2e7a } }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

/banking/vouchers/{id}/pdf:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Banking]
    summary: Voucher PDF
    operationId: getBankVoucherPdf
    x-permission: banking.voucher.view
    responses:
      '200':
        description: PDF
        headers:
          Content-Disposition: { $ref: '../components/headers.yaml#/ContentDisposition' }
        content:
          application/pdf:
            schema: { type: string, format: binary }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
