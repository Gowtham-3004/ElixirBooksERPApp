            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              mismatch: { summary: Statement ≠ book, value: { code: AMOUNT_MISMATCH, message: 'Amounts differ: statement 118000 vs book 116820 — create an adjustment for the difference of 1180', details: { statement: 118000, book: 116820, difference: 1180 }, correlationId: corr_9f1c2e7a } }

