              balanced: { summary: Ready to confirm, value: { bankAccountId: acc_1310, bankAccountName: HDFC Bank — CA 0042, from: '2026-09-01', to: '2026-09-30', statementId: stm_0006, statementBalance: 2317270, bookBalance: 2317270, difference: 0, openingBook: 2200450, adjustedBook: 2317270, unexplained: 0, unmatchedStatement: [], unmatchedBook: [], cleared: [], clearedAmount: 116820, suggestions: [], canConfirm: true } }
