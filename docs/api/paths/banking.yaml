# Banking (tag: Banking). src/modules/banking/actions.ts.

# ── bank & cash accounts ──────────────────────────────────────────────────

/banking/accounts:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Banking]
    summary: Bank & cash accounts with book / cleared balances
    operationId: listBankAccounts
    x-permission: banking.account.view
    x-frd: [FR-BNK-001]
    parameters:
      - { name: kind, in: query, schema: { type: string, enum: [Bank, Cash] } }
      - $ref: '../components/parameters.yaml#/IncludeInactive'
    responses:
      '200':
        description: Accounts
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '../components/schemas/banking.yaml#/BankAccount' } } } }
            examples:
              list: { summary: Bank + cash, value: { data: [{ $ref: '#/components/examples/BankAccountHdfc/value' }, { id: acc_1300, companyId: co_acme, code: '1300', name: Cash in hand, kind: Cash, currency: INR, status: Active, openingBalance: 50000, bookBalance: 68100, clearedBalance: 68100, unclearedCount: 0, createdAt: '2026-04-01T09:00:00Z', updatedAt: '2026-09-13T09:00:00Z', version: 2 }] } }
              empty: { summary: None, value: { data: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Banking]
    summary: Add a bank or cash account (creates the GL account)
    operationId: createBankAccount
    x-permission: banking.account.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/banking.yaml#/BankAccountCreate' }
          examples:
            bank: { summary: INR current account, value: { code: '1310', name: HDFC Bank — CA 0042, kind: Bank, bankName: HDFC Bank, accountNumber: '50200012340042', ifsc: HDFC0000123, branch: Andheri East, currency: INR, openingBalance: 1250000 } }
            foreignBank: { summary: USD EEFC account (fixed currency), value: { code: '1320', name: HDFC EEFC USD, kind: Bank, bankName: HDFC Bank, accountNumber: '50200012340099', ifsc: HDFC0000123, currency: USD, openingBalance: 0 } }
            cash: { summary: Petty cash, value: { code: '1301', name: Petty cash — Andheri, kind: Cash, currency: INR, openingBalance: 5000 } }
    responses:
      '201':
        description: Created
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/banking.yaml#/BankAccount' }
            examples:
              created: { $ref: '../components/examples/banking.yaml#/BankAccountHdfc' }
      '400':
        description: Validation
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              ifsc: { summary: Bad IFSC, value: { code: VALIDATION, message: "IFSC must be 4 letters, 0, 6 alphanumerics", field: ifsc, correlationId: corr_9f1c2e7a } }
              accountNumber: { summary: Short account number, value: { code: VALIDATION, message: Account number is required (6+ digits), field: accountNumber, correlationId: corr_9f1c2e7a } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/banking/accounts/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Banking]
    summary: Get a bank / cash account
    operationId: getBankAccount
    x-permission: banking.account.view
    responses:
      '200':
        description: Account
        content:
          application/json:
            schema: { $ref: '../components/schemas/banking.yaml#/BankAccount' }
            examples:
              bank: { $ref: '../components/examples/banking.yaml#/BankAccountHdfc' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
  patch:
    tags: [Banking]
    summary: Update bank details / opening balance (until posted)
    operationId: updateBankAccount
    x-permission: banking.account.edit
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/banking.yaml#/BankAccountPatch' }
          examples:
            branch: { summary: Branch rename, value: { expectedVersion: 2, branch: Andheri East (Chakala) } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/banking.yaml#/BankAccount' }
            examples:
              updated: { $ref: '../components/examples/banking.yaml#/BankAccountHdfc' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/banking/accounts/{id}/ledger:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Banking]
    summary: Bank book (journal lines on the account with cleared state)
    operationId: getBankAccountLedger
    x-permission: banking.account.view
    parameters:
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
      - { name: cleared, in: query, schema: { type: boolean }, description: Filter cleared / uncleared entries. }
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
    responses:
      '200':
        description: Entries
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/banking.yaml#/BankBookEntry' } }
                    opening: { type: number }
                    closing: { type: number }
            examples:
              rows: { summary: "Two entries, one uncleared", value: { data: [{ journalId: jnl_298, number: JV/2026-27/00298, date: '2026-09-02', narration: Receipt RCP/2026-27/00215 — Arlene Traders, sourceType: Receipt, sourceId: rcp_00215, sourceNumber: RCP/2026-27/00215, docNumber: RCP/2026-27/00215, dr: 118000, cr: 0, amount: 118000, partyName: Arlene Traders, cleared: true, clearedBy: sl_1 }, { journalId: jnl_405, number: JV/2026-27/00405, date: '2026-09-12', narration: Payment PAY/2026-27/00131 — Bharat Steel, sourceType: Payment, sourceId: pay_00131, sourceNumber: PAY/2026-27/00131, docNumber: PAY/2026-27/00131, dr: 0, cr: 295000, amount: -295000, partyName: Bharat Steel Ltd, cleared: false }], opening: 2200450, closing: 2318450, meta: { nextCursor: null, limit: 25, total: 2 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }

# ── vouchers ──────────────────────────────────────────────────────────────

/banking/vouchers:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/BranchId'
  get:
    tags: [Banking]
    summary: List bank vouchers
    description: "Tabs → All · Draft · Posted · Reversed. Query examples — `?voucherType=Contra` · `?bankAccountId=acc_1310` · `?method=Cheque` · `?uncleared=true`."
    operationId: listBankVouchers
    x-permission: banking.voucher.view
    x-frd: [FR-BNK-002]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - $ref: '../components/parameters.yaml#/Q'
      - $ref: '../components/parameters.yaml#/Status'
      - { name: voucherType, in: query, schema: { $ref: '../components/schemas/banking.yaml#/VoucherType' } }
      - { name: bankAccountId, in: query, schema: { type: string } }
      - { name: method, in: query, schema: { type: string } }
      - { name: uncleared, in: query, schema: { type: boolean } }
      - $ref: '../components/parameters.yaml#/DateFrom'
      - $ref: '../components/parameters.yaml#/DateTo'
    responses:
      '200':
        description: Vouchers
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/banking.yaml#/BankVoucher' } }
            examples:
              firstPage: { summary: Vouchers, value: { data: [{ $ref: '#/components/examples/BankVoucherPosted/value' }], meta: { nextCursor: null, limit: 25, total: 1, counts: { All: 38, Draft: 1, Posted: 36, Reversed: 1 } }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Banking]
    summary: Create a bank voucher (Draft)
    operationId: createBankVoucher
    x-permission: banking.voucher.create
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/banking.yaml#/BankVoucherCreate' }
          examples:
            payment: { summary: Payment — bank charges, value: { date: '2026-09-13', voucherType: Payment, bankAccountId: acc_1310, counterAccountId: acc_5300, amount: 1180, method: Internal, narration: Bank charges September } }
            receipt: { summary: Receipt — interest credited, value: { date: '2026-09-13', voucherType: Receipt, bankAccountId: acc_1310, counterAccountId: acc_4800, amount: 2350, method: Internal, narration: Savings interest Q2 } }
            deposit: { summary: Deposit — cash to bank, value: { date: '2026-09-13', voucherType: Deposit, bankAccountId: acc_1310, counterAccountId: acc_1300, amount: 50000, method: Cash, narration: Cash deposit from Andheri store } }
            contra: { summary: Contra — bank to bank, value: { date: '2026-09-13', voucherType: Contra, bankAccountId: acc_1310, counterAccountId: acc_1311, amount: 500000, method: RTGS, instrumentRef: RTGS26091300221, narration: Sweep to ICICI OD } }
            cheque: { summary: Withdrawal by cheque, value: { date: '2026-09-13', voucherType: Withdrawal, bankAccountId: acc_1310, counterAccountId: acc_1300, amount: 20000, method: Cheque, instrumentRef: '004521', narration: Petty cash top-up } }
            partyPayment: { summary: Payment to a supplier (control account → party), value: { date: '2026-09-13', voucherType: Payment, bankAccountId: acc_1310, counterAccountId: acc_2100, partyType: Supplier, partyId: sup_landlord, amount: 25000, method: NEFT, instrumentRef: N26091300987, narration: Rent September } }
    responses:
      '201':
        description: Draft voucher
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/banking.yaml#/BankVoucher' }
            examples:
              draft: { summary: Draft, value: { id: bv_0038, companyId: co_acme, number: BV/DRAFT, docType: Bank Voucher, date: '2026-09-13', branchId: br_ho, status: Draft, currency: INR, rate: 1, partyType: None, voucherType: Payment, bankAccountId: acc_1310, bankAccountName: HDFC Bank — CA 0042, counterAccountId: acc_5300, counterAccountName: Bank charges, amount: 1180, method: Internal, narration: Bank charges September, lines: [], totals: { subtotal: 0, discount: 0, taxable: 0, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 1180, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 1180 }, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:12:04Z', version: 1 } }
      '400':
        description: Validation
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              sameAccount: { summary: Both sides equal, value: { code: VALIDATION, message: Both sides cannot be the same account, field: counterAccountId, correlationId: corr_9f1c2e7a } }
              chequeNo: { summary: Cheque without number, value: { code: VALIDATION, message: Cheque number is required, field: instrumentRef, correlationId: corr_9f1c2e7a } }
              party: { summary: Control account without party, value: { code: CONTROL_ACCOUNT, message: Accounts Payable is a control account — choose the party, field: partyId, correlationId: corr_9f1c2e7a } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }

/banking/vouchers/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
    - $ref: '../components/parameters.yaml#/Id'
  get:
    tags: [Banking]
    summary: Get a voucher
    operationId: getBankVoucher
    x-permission: banking.voucher.view
    responses:
      '200':
        description: Voucher
        content:
          application/json:
            schema: { $ref: '../components/schemas/banking.yaml#/BankVoucher' }
            examples:
              posted: { $ref: '../components/examples/banking.yaml#/BankVoucherPosted' }
              reversed: { summary: Reversed, value: { id: bv_0037, companyId: co_acme, number: BV/2026-27/00037, docType: Bank Voucher, date: '2026-09-13', branchId: br_ho, status: Reversed, currency: INR, rate: 1, partyType: None, voucherType: Payment, bankAccountId: acc_1310, bankAccountName: HDFC Bank — CA 0042, counterAccountId: acc_5300, counterAccountName: Bank charges, amount: 1180, method: Internal, narration: Bank charges September, reversalReason: Charges reversed by the bank, lines: [], totals: { subtotal: 0, discount: 0, taxable: 0, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 1180, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 1180 }, journalId: jnl_bv_37, journalNumber: JV/2026-27/00402, postedAt: '2026-09-13T10:00:00Z', postedBy: Priya Sharma, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-14T09:00:00Z', version: 4 } }
