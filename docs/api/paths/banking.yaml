          schema: { $ref: '../components/schemas/common.yaml#/Reason' }
          examples:
            reason: { summary: Reason, value: { reason: Bank error — reversed on the next line } }
    responses:
      '200':
        description: Excluded
        content:
          application/json:
            schema: { $ref: '../components/schemas/banking.yaml#/StatementLine' }
            examples:
              excluded: { summary: Excluded, value: { id: sl_3, companyId: co_acme, statementId: stm_0006, bankAccountId: acc_1310, date: '2026-09-08', description: REV CHRG SMS ALERT, reference: '', debit: 0, credit: 1180, balance: 2318450, fingerprint: fp_rev1, status: Excluded, excludeReason: Bank error — reversed on the next line, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T11:00:00Z', version: 2 } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
