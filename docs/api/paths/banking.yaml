    x-frd: [FR-REC-001]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - { name: bankAccountId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/Status'
    responses:
      '200':
        description: Statements
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/banking.yaml#/BankStatement' } }
            examples:
              firstPage: { summary: Statements, value: { data: [{ $ref: '#/components/examples/BankStatementSep/value' }], meta: { nextCursor: null, limit: 25, total: 6 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Banking]
    summary: Upload a statement file (dry run → preview)
    description: "Multipart upload parsed with the chosen format (or auto-detected). Returns a `StatementImportPreview` with per-row errors / duplicates (fingerprint) and balance-continuity checks; nothing is stored until `POST /banking/statements/commit`."
    operationId: previewBankStatement
    x-permission: banking.statement.import
    x-frd: [FR-REC-001, FR-REC-002]
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file, bankAccountId]
            properties:
              file: { type: string, format: binary, description: CSV / XLSX ≤ 10 MB. }
              bankAccountId: { type: string, example: acc_1310 }
              formatId: { type: string, description: Saved format id; omit to auto-detect by header row., example: sf_hdfc }
              format: { type: string, description: Inline JSON `StatementFormat` for a one-off mapping. }
              openingBalance: { type: number, example: 2200450 }
              closingBalance: { type: number, example: 2318450 }
          encoding:
            file: { contentType: 'text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }
          examples:
            hdfc: { summary: HDFC CSV, value: { bankAccountId: acc_1310, formatId: sf_hdfc, openingBalance: 2200450, closingBalance: 2318450 } }
            autoDetect: { summary: Auto-detect header, value: { bankAccountId: acc_1310 } }
    responses:
      '200':
        description: Preview
        content:
          application/json:
            schema: { $ref: '../components/schemas/banking.yaml#/StatementImportPreview' }
            examples:
              clean: { summary: All rows importable, value: { previewId: prv_7c1d, bankAccountId: acc_1310, fileName: hdfc_sep.csv, fingerprint: fp_file_44aa, format: { name: HDFC NetBanking CSV, dateCol: Date, descCol: Narration, refCol: Chq./Ref.No., debitCol: Withdrawal Amt., creditCol: Deposit Amt., balanceCol: Closing Balance, dateFormat: DD/MM/YYYY }, detectedColumns: [Date, Narration, Chq./Ref.No., Value Dt, Withdrawal Amt., Deposit Amt., Closing Balance], lines: [{ row: 1, date: '2026-09-02', description: NEFT CR ARLENE TRADERS INV 00042, reference: N260902001122, debit: 0, credit: 118000, balance: 2318450, fingerprint: fp_9a1b2c3d }, { row: 2, date: '2026-09-05', description: CHRG SMS ALERT, reference: '', debit: 1180, credit: 0, balance: 2317270, fingerprint: fp_11aa22bb }], importable: 2, skipped: 0, periodFrom: '2026-09-02', periodTo: '2026-09-05', openingBalance: 2200450, closingBalance: 2317270, computedClosing: 2317270, errors: [], warnings: [] } }
              withIssues: { summary: "Duplicates, bad date, continuity error", value: { previewId: prv_7c1e, bankAccountId: acc_1310, fileName: hdfc_sep_v2.csv, fingerprint: fp_file_44ab, format: { name: HDFC NetBanking CSV, dateCol: Date, descCol: Narration, refCol: Chq./Ref.No., debitCol: Withdrawal Amt., creditCol: Deposit Amt., dateFormat: DD/MM/YYYY }, lines: [{ row: 1, date: '2026-09-02', description: NEFT CR ARLENE TRADERS INV 00042, reference: N260902001122, debit: 0, credit: 118000, fingerprint: fp_9a1b2c3d, duplicate: 'Row 1: already imported in hdfc_sep.csv' }, { row: 2, date: '', description: CHRG, reference: '', debit: 1180, credit: 0, fingerprint: fp_zz, error: 'Row 2: unreadable date "31/02/2026"' }], importable: 0, skipped: 2, periodFrom: '', periodTo: '', openingBalance: 2200450, closingBalance: 2318450, computedClosing: 2200450, errors: [No importable rows, 'Balance continuity: opening 2200450 + net 0 = 2200450, but closing entered is 2318450'], warnings: ['Overlaps the previous statement (2026-09-01 → 2026-09-10); duplicate lines are skipped by fingerprint'] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Duplicate file
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              fingerprint: { summary: Same file already imported, value: { code: DUPLICATE, message: This exact file was already imported (duplicate fingerprint), details: { statementId: stm_0006, fileName: hdfc_sep.csv }, correlationId: corr_9f1c2e7a } }
      '413': { $ref: '../components/responses.yaml#/PayloadTooLarge' }
      '422':
        description: Unparseable
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              columns: { summary: Columns not found, value: { code: VALIDATION, message: 'Column "Withdrawal Amt." not found in the file header', field: format.debitCol, details: { detectedColumns: [Date, Particulars, Debit, Credit] }, correlationId: corr_9f1c2e7a } }
              currency: { summary: Currency mismatch, value: { code: VALIDATION, message: Statement currency USD does not match the account (INR), field: bankAccountId, correlationId: corr_9f1c2e7a } }

/banking/statements/commit:
