    x-permission: banking.reconciliation.match
    x-frd: [FR-REC-004]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/banking.yaml#/BankMatchRequest' }
          examples:
            oneToOne: { summary: 1:1, value: { statementLineIds: [sl_1], journalIds: [jnl_298] } }
            oneToMany: { summary: 1:n — one bank credit clears two receipts, value: { statementLineIds: [sl_7], journalIds: [jnl_310, jnl_311], note: Customer paid two invoices in one NEFT } }
            manyToOne: { summary: n:1 — two bank debits for one payment batch, value: { statementLineIds: [sl_12, sl_13], journalIds: [jnl_405] } }
    responses:
      '200':
        description: Matched
        content:
          application/json:
            schema: { $ref: '../components/schemas/banking.yaml#/BankMatchResult' }
            examples:
              matched: { summary: Matched, value: { matchGroupId: mg_31, lines: [{ $ref: '#/components/examples/StatementLineMatched/value' }], clearedJournalIds: [jnl_298] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Already matched / cleared
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              lineMatched: { summary: Line already matched, value: { code: INVALID_STATE, message: A selected statement line is already matched, details: { statementLineId: sl_1 }, correlationId: corr_9f1c2e7a } }
              entryCleared: { summary: Book entry already cleared, value: { code: INVALID_STATE, message: A selected book entry is already cleared, details: { journalId: jnl_298 }, correlationId: corr_9f1c2e7a } }
      '422':
