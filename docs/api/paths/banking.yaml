      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/banking.yaml#/BankVoucherPatch' }
          examples:
            amount: { summary: Amount and reference, value: { expectedVersion: 1, amount: 1298, instrumentRef: CHG-SEP } }
    responses:
      '200':
        description: Updated
        content:
          application/json:
            schema: { $ref: '../components/schemas/banking.yaml#/BankVoucher' }
            examples:
              updated: { summary: Updated, value: { id: bv_0038, companyId: co_acme, number: BV/DRAFT, docType: Bank Voucher, date: '2026-09-13', branchId: br_ho, status: Draft, currency: INR, rate: 1, partyType: None, voucherType: Payment, bankAccountId: acc_1310, bankAccountName: HDFC Bank — CA 0042, counterAccountId: acc_5300, counterAccountName: Bank charges, amount: 1298, method: Internal, instrumentRef: CHG-SEP, narration: Bank charges September, lines: [], totals: { subtotal: 0, discount: 0, taxable: 0, tax: 0, components: {}, breakup: [], charges: 0, tds: 0, roundOff: 0, total: 1298, paid: 0, credited: 0, writtenOff: 0, due: 0, baseTotal: 1298 }, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T09:30:00Z', version: 2 } }
