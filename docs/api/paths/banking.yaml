/banking/reconciliation/adjustments:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  post:
    tags: [Banking]
    summary: Create + post an adjustment voucher for a statement line and match it
    operationId: createReconciliationAdjustment
    x-permission: banking.voucher.post
    x-frd: [FR-REC-005]
    x-idempotent: true
    x-events: [DocumentPosted, JournalPosted]
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/banking.yaml#/ReconAdjustmentRequest' }
          examples:
            charges: { summary: Bank charges, value: { statementLineId: sl_2, counterAccountId: acc_5300, narration: Bank charges September } }
            interest: { summary: Interest credited, value: { statementLineId: sl_9, voucherType: Receipt, counterAccountId: acc_4800, narration: Savings interest Q2 } }
            unknownReceipt: { summary: Unidentified receipt parked on suspense, value: { statementLineId: sl_10, voucherType: Receipt, counterAccountId: acc_2900, narration: Unidentified NEFT — to be allocated } }
    responses:
      '201':
        description: Voucher posted and line matched
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/document.yaml#/ActionResult'
                - type: object
                  properties:
                    document: { $ref: '../components/schemas/banking.yaml#/BankVoucher' }
                    line: { $ref: '../components/schemas/banking.yaml#/StatementLine' }
            examples:
              charges: { summary: Charges voucher, value: { document: { $ref: '#/components/examples/BankVoucherPosted/value' }, outcome: posted, line: { id: sl_2, companyId: co_acme, statementId: stm_0006, bankAccountId: acc_1310, date: '2026-09-05', description: CHRG SMS ALERT, reference: '', debit: 1180, credit: 0, balance: 2317270, fingerprint: fp_11aa22bb, status: Matched, matchedJournalIds: [jnl_bv_38], matchedDocNumber: BV/2026-27/00038, matchGroupId: mg_32, matchedAt: '2026-09-13T11:10:00Z', matchedBy: Priya Sharma, matchReason: Adjustment voucher, createdAt: '2026-09-13T09:12:04Z', updatedAt: '2026-09-13T11:10:00Z', version: 2 }, warnings: [] } }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422': { $ref: '../components/responses.yaml#/Unprocessable' }
      '423': { $ref: '../components/responses.yaml#/PeriodLocked' }

/banking/reconciliations:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
  get:
    tags: [Banking]
    summary: Confirmed / draft reconciliation statements (BRS)
    operationId: listReconciliations
    x-permission: banking.reconciliation.view
    x-frd: [FR-REC-006]
    parameters:
      - $ref: '../components/parameters.yaml#/Cursor'
      - $ref: '../components/parameters.yaml#/Limit'
      - { name: bankAccountId, in: query, schema: { type: string } }
      - $ref: '../components/parameters.yaml#/Status'
    responses:
      '200':
        description: Reconciliations
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ListEnvelope'
                - type: object
                  properties:
                    data: { type: array, items: { $ref: '../components/schemas/banking.yaml#/Reconciliation' } }
            examples:
              firstPage: { summary: BRS list, value: { data: [{ $ref: '#/components/examples/ReconciliationConfirmed/value' }], meta: { nextCursor: null, limit: 25, total: 5 }, scope: { companyId: co_acme, currency: INR, asOf: '2026-09-13T09:12:04Z' } } }
              empty: { $ref: '../components/examples/common.yaml#/EmptyList' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
  post:
    tags: [Banking]
    summary: Confirm the reconciliation for a window (snapshot BRS)
    description: "Fails `422 UNBALANCED` unless statement balance = book balance adjusted for timing items. Needs `banking.reconciliation.confirm`."
    operationId: confirmReconciliation
    x-permission: banking.reconciliation.confirm
    x-idempotent: true
    parameters:
      - $ref: '../components/parameters.yaml#/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas/banking.yaml#/ReconciliationInput' }
          examples:
            september: { summary: September, value: { bankAccountId: acc_1310, periodFrom: '2026-09-01', periodTo: '2026-09-30', notes: Two payments in transit } }
    responses:
      '201':
        description: Confirmed
        headers:
          Location: { $ref: '../components/headers.yaml#/Location' }
        content:
          application/json:
            schema: { $ref: '../components/schemas/banking.yaml#/Reconciliation' }
            examples:
              confirmed: { $ref: '../components/examples/banking.yaml#/ReconciliationConfirmed' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409': { $ref: '../components/responses.yaml#/Conflict' }
      '422':
        description: Does not balance
        content:
          application/json:
            schema: { $ref: '../components/schemas/common.yaml#/Error' }
            examples:
              unbalanced: { summary: Unexplained difference, value: { code: UNBALANCED, message: 'Reconciliation does not balance: statement 2317270 vs book 2318450 adjusted for timing 2318450 — unexplained -1180. Match or create adjustments first.', details: { statementBalance: 2317270, bookBalance: 2318450, adjustedBook: 2318450, unexplained: -1180 }, correlationId: corr_9f1c2e7a } }

/banking/reconciliations/{id}:
  parameters:
    - $ref: '../components/parameters.yaml#/CompanyId'
